// rule — к какому именованному правилу относится строка (см. SCAN_RULES ниже):
// категория может выключить всю группу разом.
const SCAN_ERRORS = [
  { rule: 'links',     re: /https?:\/\//i,      label: 'Внешняя ссылка (http/https)' },
  { rule: 'links',     re: /www\.\S+/i,         label: 'Внешняя ссылка (www)' },
  { rule: 'links',     re: /t\.me\//i,          label: 'Ссылка на Telegram (t.me)' },
  { rule: 'links',     re: /qr.?код|qr.?code/i, label: 'QR-код' },
  { rule: 'links',     re: /\+7[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/, label: 'Номер телефона (+7...)' },
  { rule: 'links',     re: /8[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/, label: 'Номер телефона (8-...)' },
  { rule: 'messenger', re: /(пишите|напишите|пиши|пишу|писать|со\s+мной|свяжитесь|связь).{0,40}(телеграм|telegram|\btg\b|вацап|(?<![а-яёa-z0-9])вк(?![а-яёa-z0-9])|whatsapp|viber|вайбер)/i, label: 'Контакт через мессенджер (запрещено Авито)' },
  { rule: 'messenger', re: /(телеграм|telegram|\btg\b|вацап|(?<![а-яёa-z0-9])вк(?![а-яёa-z0-9])|whatsapp|viber|вайбер).{0,40}(пишите|напишите|пиши|пишу|писать|со\s+мной|свяжитесь|связь)/i, label: 'Контакт через мессенджер (запрещено Авито)' },
  // Косвенные падежи ловятся наравне с именительным: «продам вместе с аккаунтом»
  // опаснее для объявления, чем голое «аккаунт», а прежний lookahead их пропускал.
  { rule: 'account',   re: /(?<![а-яёa-z0-9])аккаунт[а-яё]*(?![а-яёa-z0-9])/i,   label: '⛔ Слово «аккаунт» — Авито банит за продажу аккаунтов' },
  { rule: 'account',   re: /уч[её]тн(?:ая|ой|ую|ые|ых|ым|ыми)\s+запис(?:ь|и|ью|ей|ям|ями|ях)(?![а-яёa-z0-9])/i, label: '⛔ «Учётная запись» — риск блокировки как продажа аккаунта' },
  // У «профиля» окончания перечислены поимённо: «профил[а-яё]*» поймал бы
  // «профилактику» и «профильную трубу».
  { rule: 'account',   re: /(?<![а-яёa-z0-9])профил(?:ь|я|ю|ем|е|и|ей|ям|ями|ях)(?![а-яёa-z0-9])/i, label: '⛔ Слово «профиль» — риск блокировки как продажа аккаунта' },
];

const SCAN_WARNINGS = [
  { rule: 'messenger', re: /telegram|телеграм/i, label: 'Упоминание Telegram — Авито может расценить как контакт' },
  { rule: 'messenger', re: /whatsapp|вацап|ватсап/i, label: 'Упоминание WhatsApp — Авито может расценить как контакт' },
  { rule: 'messenger', re: /viber|вайбер/i,      label: 'Упоминание Viber — Авито может расценить как контакт' },
  // F19: синхронизация сканера с запретами SYS-промпта. Раньше вставленный руками или
  // «уплывший» текст AI проходил «🎉 Всё чисто», хотя нарушал правила объявления.
  { rule: 'gift',    re: /(?<![а-яёa-z0-9])подар(ок|к[а-яё]+|очн[а-яё]+)(?![а-яёa-z0-9])/i, label: '«Подарок» — запрещено правилами объявления (риск как передача аккаунта)' },
  { rule: 'payment', re: /(?<![а-яёa-z0-9])(плат(ишь|ить|ежи?|ежом|ежа)|оплат[а-яё]*|оплачива[а-яё]*|купишь|покупаешь|покупк[а-яё]+)(?![а-яёa-z0-9])|(?<![а-яёa-z0-9])стоит\s+\d/i, label: 'Слова оплаты («платишь/оплата/купишь») — по правилам только «оформляешь»' },
];

const PLATFORM_RE = /ps4|ps5|пс4|пс5|xbox|иксбокс|playstation|nintendo|switch/i;
const DIGITAL_RE  = /оформляется в цифре/i;

// ══════════════════════════════════════════
// ПРАВИЛА ПРОВЕРКИ ПО КАТЕГОРИЯМ (этап 3)
// Заводские проверки стали именованными: категория может выключить любую.
// Те же имена управляют и запретами в SYS-промпте — иначе Сканер и модель
// разъезжаются (ровно тот рассинхрон, который чинили в F19). Пример: для
// физического товара «купить» — обычное русское слово, а не юридический риск.
// def(catId) — включено ли правило по умолчанию в этой категории.
// ══════════════════════════════════════════
const SCAN_RULES = [
  { id: 'links',      label: 'Ссылки, QR и телефоны',        def: () => true },
  { id: 'messenger',  label: 'Контакт через мессенджер',     def: () => true },
  { id: 'account',    label: '«Аккаунт», «профиль»',         def: () => true },
  { id: 'gift',       label: '«Подарок»',                    def: () => true },
  { id: 'payment',    label: 'Слова оплаты («платишь», «купишь»)', def: () => true },
  { id: 'price_label',label: '«Цена: N» как ярлык-ценник',   def: () => true },
  { id: 'rub_word',   label: '«рублей»/«руб» в названии',    def: () => true },
  { id: 'platform',   label: 'Платформа упомянута',          def: id => id === 'gaming_sub' || id === 'game' },
  { id: 'digital_phrase', label: '«Оформляется в цифре»',    def: id => id === 'game' },
  { id: 'game_price', label: 'Цена в названии и описании запрещена', def: id => id === 'game' },
];

// Заводское значение правила: сначала то, что прописано в самом дескрипторе
// встроенной категории (у физтовара свой набор), иначе общий def.
function scanRuleFactory(catId, ruleId) {
  const base = BUILTIN_CATS.find(c => c.id === catId);
  if (base?.scanRules && Object.prototype.hasOwnProperty.call(base.scanRules, ruleId)) return !!base.scanRules[ruleId];
  return !!SCAN_RULES.find(r => r.id === ruleId)?.def(catId);
}

// Включено ли правило для категории: сначала галочка из редактора, иначе заводское.
function scanRuleOn(catId, ruleId) {
  const rules = catDef(catId).scanRules;
  if (rules && Object.prototype.hasOwnProperty.call(rules, ruleId)) return !!rules[ruleId];
  return scanRuleFactory(catId, ruleId);
}

function checkAds(title, desc, category) {
  const full = title + '\n' + desc;
  const errors = [], warnings = [], ok = [];

  const len = [...title].length;
  if (len > 50) {
    errors.push(`Название слишком длинное: ${len}/50 символов`);
  } else if (len > 0) {
    ok.push(`Длина названия: ${len}/50 символов`);
  }

  const on = id => scanRuleOn(category, id);

  let forbiddenHit = false;
  for (const p of SCAN_ERRORS) {
    if (!on(p.rule)) continue;
    if (p.re.test(full)) { errors.push(p.label); forbiddenHit = true; }
  }
  if (!forbiddenHit && full.trim() && (on('links') || on('messenger') || on('account'))) {
    ok.push('Запрещённые ссылки и контакты не найдены');
  }

  const warnHits = [];
  for (const p of SCAN_WARNINGS) {
    if (!on(p.rule)) continue;
    if (p.re.test(full)) warnHits.push(p);
  }
  // Не дублировать с ошибками о контактах
  for (const p of warnHits) {
    const alreadyError = SCAN_ERRORS.some(e => on(e.rule) && e.re.test(full) && e.label.includes('Контакт'));
    if (!alreadyError || (!p.label.includes('Telegram') && !p.label.includes('WhatsApp') && !p.label.includes('Viber'))) {
      warnings.push(p.label);
    }
  }

  if (on('platform')) {
    if (!PLATFORM_RE.test(full)) {
      warnings.push('Платформа не упомянута — укажи PS4/PS5/Xbox и т.д.');
    } else {
      ok.push('Платформа упомянута');
    }
  }

  if (on('digital_phrase')) {
    if (!DIGITAL_RE.test(full)) {
      warnings.push('Нет фразы «оформляется в цифре» — обязательно для игр');
    } else {
      ok.push('«Оформляется в цифре» присутствует');
    }
  }
  // Формулировка зависит от категории: для игр она историческая и точная,
  // для остальных — нейтральная (правило теперь общее, а не только игровое).
  const priceWhere = category === 'game' ? 'для игр' : 'в этой категории';
  if (on('game_price')) {
    if (/\d[\d\s]*₽|₽|\d+\s*руб|\d+\s*р\.|(?<![а-яёa-z0-9])руб(?![а-яёa-z0-9])/i.test(title)) {
      errors.push(`Цена в названии — ${priceWhere} ЗАПРЕЩЕНА`);
    }
  }

  if (on('rub_word') && /(?<![а-яёa-z0-9])рублей(?![а-яёa-z0-9])|(?<![а-яёa-z0-9])руб(?![а-яёa-z0-9])/i.test(title)) {
    warnings.push('Слово «рублей»/«руб» в названии — используй символ ₽');
  }

  if (on('game_price') && /\d[\d\s]*₽|\d+\s*руб|\d+\s*рублей|\d+\s*р(?![а-яёa-z0-9])/i.test(desc)) {
    errors.push(category === 'game'
      ? 'Цена в описании игры — ЗАПРЕЩЕНА (клиент видит цену в поле Авито)'
      : 'Цена в описании — ЗАПРЕЩЕНА в этой категории (клиент видит цену в поле Авито)');
  }

  // F19: «цена: N» как ярлык-ценник. Для игр цена-с-валютой уже ошибка выше,
  // но голая «Цена: 3000» без ₽/руб её не триггерит — этот warning закрывает и такой пробел.
  if (on('price_label') && /(?<![а-яёa-z0-9])цена\s*[:—\-]?\s*\d/i.test(full)) {
    warnings.push('«Цена: N» как ярлык — по правилам сумму указывают без слова «цена» («… ₽», «оформляешь за …»)');
  }

  // Свои фразы категории (задаются в редакторе категорий)
  const c = catDef(category);
  for (const phrase of (c.scanForbid || [])) {
    if (phrase && full.toLowerCase().includes(String(phrase).toLowerCase())) {
      errors.push(`Запрещённое слово категории: «${phrase}»`);
    }
  }
  for (const phrase of (c.scanRequire || [])) {
    if (!phrase) continue;
    if (full.toLowerCase().includes(String(phrase).toLowerCase())) ok.push(`Обязательная фраза «${phrase}» на месте`);
    else warnings.push(`Нет обязательной фразы категории: «${phrase}»`);
  }

  return { errors, warnings, ok };
}

// Автопроверка вариантов: светофор-бейдж на карточке/строке пакета сразу после генерации,
// без ручного перехода в Сканер. Использует тот же checkAds(), что и вкладка «Сканер».
function scanBadgeHTML(v) {
  if (!v || !v._scan) return '';
  const { errors, warnings } = v._scan;
  const level = errors.length ? 'error' : warnings.length ? 'warn' : 'ok';
  const icon  = level === 'error' ? '🔴' : level === 'warn' ? '🟡' : '🟢';
  const color = level === 'error' ? 'var(--err)' : level === 'warn' ? 'var(--warn)' : 'var(--ok)';
  const tip   = [...errors, ...warnings].join(' · ') || 'Проверка пройдена без замечаний';
  return `<span class="scan-badge" style="color:${color}" title="${esc(tip)}">${icon}</span>`;
}

function scannerTabHTML() {
  // UX-7: приходит с карточки объявления через goToScanner() — пред-заполняет поля
  const pre = state._scanPrefill;
  return `<div style="max-width:720px;margin:0 auto;padding:20px 16px">
    <div class="card">
      <div class="card-title">🔍 Сканер запрещёнки</div>
      <div class="form-body">
        <div class="field" style="max-width:280px">
          <label>Категория товара</label>
          <select id="scan-cat">
            ${CATS.map(c => {
              // Что именно проверяется в этой категории, видно прямо в списке —
              // набор правил у категорий теперь разный (см. SCAN_RULES)
              const marks = [
                scanRuleOn(c.id, 'digital_phrase') ? '«оформляется в цифре»' : '',
                scanRuleOn(c.id, 'game_price') ? 'без цены' : '',
                scanRuleOn(c.id, 'payment') ? '' : 'слова оплаты разрешены',
              ].filter(Boolean).join(', ');
              return `<option value="${c.id}"${pre?.category === c.id ? ' selected' : ''}>${esc(c.label)}${marks ? ` (+ ${esc(marks)})` : ''}</option>`;
            }).join('')}
          </select>
        </div>
        <div class="field">
          <label>Название объявления &nbsp;<span id="scan-len" style="font-size:12px;color:var(--muted)">0/50</span></label>
          <input type="text" id="scan-title" placeholder="Введите или вставьте название..." maxlength="100" style="font-family:var(--fm);font-size:14px" value="${esc(pre?.title||'')}">
        </div>
        <div class="field">
          <label>Описание объявления</label>
          <textarea id="scan-desc" rows="11" placeholder="Вставьте полный текст описания...">${esc(pre?.desc||'')}</textarea>
        </div>
        <div id="scan-results"></div>
      </div>
    </div>
  </div>`;
}

function goToScanner(title, desc, category) {
  state._scanPrefill = { title: title || '', desc: desc || '', category: category || 'gaming_sub' };
  state.tab = 'scanner';
  render();
}

function bindScannerTab() {
  const titleEl   = document.getElementById('scan-title');
  const descEl    = document.getElementById('scan-desc');
  const catEl     = document.getElementById('scan-cat');
  const lenEl     = document.getElementById('scan-len');
  const resultsEl = document.getElementById('scan-results');

  function runCheck() {
    const title = titleEl.value;
    const desc  = descEl.value;
    const cat   = catEl.value;
    const len   = [...title].length;

    lenEl.textContent = `${len}/50`;
    // F7: порог выровнен с lenClass() (карточка/конвейер/пакет) — жёлтый с 45, не с 41
    lenEl.style.color = len > 50 ? 'var(--err)' : len > 44 ? 'var(--warn)' : 'var(--muted)';

    if (!title && !desc) { resultsEl.innerHTML = ''; return; }

    const { errors, warnings, ok } = checkAds(title, desc, cat);

    const errBlock = errors.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--err);margin-bottom:6px">🚫 Ошибки · ${errors.length} — объявление могут снять</div>
        ${errors.map(e => `<div style="background:rgba(239,68,68,.12);border:1px solid var(--err);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#fca5a5">✗ ${esc(e)}</div>`).join('')}
      </div>` : '';

    const warnBlock = warnings.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--warn);margin-bottom:6px">⚠ Предупреждения · ${warnings.length}</div>
        ${warnings.map(w => `<div style="background:rgba(245,158,11,.1);border:1px solid var(--warn);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#fcd34d">⚠ ${esc(w)}</div>`).join('')}
      </div>` : '';

    const okBlock = ok.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--ok);margin-bottom:6px">✓ Пройдено · ${ok.length}</div>
        ${ok.map(o => `<div style="background:rgba(16,185,129,.1);border:1px solid var(--ok);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#86efac">✓ ${esc(o)}</div>`).join('')}
      </div>` : '';

    const allGood = !errors.length && !warnings.length;
    const allGoodBlock = allGood && (title || desc) ? `
      <div style="padding:16px;background:rgba(16,185,129,.12);border:1px solid var(--ok);border-radius:10px;text-align:center;color:var(--ok);font-weight:600;font-size:15px">
        🎉 Всё чисто — объявление готово к публикации
      </div>` : '';

    resultsEl.innerHTML = `<div style="margin-top:14px">${errBlock}${warnBlock}${okBlock}${allGoodBlock}</div>`;
  }

  titleEl?.addEventListener('input', runCheck);
  descEl?.addEventListener('input', runCheck);
  catEl?.addEventListener('change', runCheck);

  // UX-7: пришли с карточки объявления — поля уже заполнены шаблоном, сразу прогнать проверку
  if (state._scanPrefill) { state._scanPrefill = null; runCheck(); }
}

// UX-14: настройки AI теперь рендерятся и в шапке (ai-panel, все вкладки кроме генератора),
// и всегда-открытыми внутри формы генератора (ai-inline-panel) — перерисовываем ту копию, что реально в DOM
function aiSettingsContainer() {
  return document.getElementById('sp')?.closest('#ai-panel, #ai-inline-panel')
      || document.getElementById('token-change')?.closest('#ai-panel, #ai-inline-panel');
}
function bindAISettings() {
  document.getElementById('sp')?.addEventListener('change', e => {
    state.settings.provider = e.target.value; save();
    const c = aiSettingsContainer(); if (c) c.innerHTML = settingsHTML();
    bindAISettings();
  });
  document.getElementById('sm')?.addEventListener('change', e => {
    state.settings.model = e.target.value; save();
  });
  document.getElementById('som')?.addEventListener('change', e => {
    state.settings.orModel = e.target.value; save();
  });
  document.getElementById('token-change')?.addEventListener('click', () => {
    const cur = localStorage.getItem('avito_admin_token') || '';
    const input = prompt('Админ-токен (оставьте пустым и нажмите OK, чтобы удалить):', cur);
    if (input === null) return; // отмена — ничего не трогаем
    const val = input.trim();
    if (val) { localStorage.setItem('avito_admin_token', val); toast('Токен сохранён'); }
    else { localStorage.removeItem('avito_admin_token'); toast('Токен удалён — при следующем запросе спросит заново'); }
    const c = aiSettingsContainer(); if (c) c.innerHTML = settingsHTML();
    bindAISettings();
  });
}

// ══════════════════════════════════════════
// FORM RE-RENDER (без полного ре-рендера)
// ══════════════════════════════════════════

function reForm() {
  const el = document.getElementById('form-box');
  if (el) { el.innerHTML = formHTML(); bindAISettings(); }
}

function reDurs() {
  const el = document.getElementById('dur-rows');
  if (!el) return;
  el.innerHTML = state.form.durations.map((d, i) => `
    <div class="dur-row" data-i="${i}">
      <select data-act="dur-period" data-i="${i}">
        ${DURATIONS.map(o => `<option ${d.period===o?'selected':''}>${o}</option>`).join('')}
      </select>
      <input type="number" min="0" placeholder="Цена ₽"
        value="${esc(d.price)}" data-act="dur-price" data-i="${i}">
      <button class="btn-icon" data-act="dur-del" data-i="${i}" title="Удалить">×</button>
    </div>`).join('');
}

// ══════════════════════════════════════════
// EVENT DELEGATION
// ══════════════════════════════════════════

document.addEventListener('click', e => {
  // Covers module — data-cv-* attributes
  const cvEl = e.target.closest('[data-cv-mode],[data-cv-layout],[data-cv-ratio],[data-cv-bg],[data-cv-bg-style],[data-cv-toggle],[data-cv-grade],[data-cv-plat-sel],[data-cv-plat-pos],[data-cv-del],[data-cv-ms-shape],[data-cv-ms-pos],[data-cv-ms-bg],[data-cv-ms-tc],[data-cv-tz],[data-cv-to-color],[data-cv-to-bg],[data-cv-src],[data-cv-ig-align],[data-cv-ig-bg],[data-cv-ig-tc]');
  if (cvEl) {
    if (cvEl.dataset.cvSrc) {
      cv.coverSource = cvEl.dataset.cvSrc;
      document.querySelectorAll('[data-cv-src]').forEach(b => b.classList.toggle('active', b.dataset.cvSrc === cv.coverSource));
      return;
    }
    if (cvEl.dataset.cvMode) {
      if (cvEl.dataset.cvMode === cv.mode) return;
      if (cv.images.length && !confirm('Сменить режим? Загруженные картинки и их настройки кадра будут очищены.')) return;
      cv.mode = cvEl.dataset.cvMode; cv.images = []; cv._selCell = null; render(); return;
    }
    if (cvEl.dataset.cvLayout) {
      if (cvEl.classList.contains('dimmed')) return;
      jCvBump('layouts');
      cv.layout = cvEl.dataset.cvLayout; cv._selCell = null;
      const lb = document.getElementById('cv-layouts-box');
      if (lb) lb.innerHTML = cvLayoutButtonsHTML(cv.layout, cv.images.length);
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvRatio) {
      cv.ratio = cvEl.dataset.cvRatio; cv._selCell = null;
      document.querySelectorAll('[data-cv-ratio]').forEach(b => b.classList.toggle('active', b.dataset.cvRatio === cv.ratio));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvBg) {
      cv.bg = cvEl.dataset.cvBg;
      document.querySelectorAll('[data-cv-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvBg === cv.bg));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvBgStyle) {
      cv.bgStyle = cvEl.dataset.cvBgStyle;
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvToggle) {
      const key = cvEl.dataset.cvToggle;
      jCvBump('toggles');
      cv[key] = !cv[key];
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvGrade) {
      cv.grade = cvEl.dataset.cvGrade;
      document.querySelectorAll('[data-cv-grade]').forEach(b => b.classList.toggle('active', b.dataset.cvGrade === cv.grade));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvPlatSel) {
      const id = cvEl.dataset.cvPlatSel;
      cv.platSel = (cv.platSel||[]).includes(id) ? cv.platSel.filter(x=>x!==id) : [...(cv.platSel||[]), id];
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvPlatPos) {
      cv.platBadgePos = cvEl.dataset.cvPlatPos;
      document.querySelectorAll('[data-cv-plat-pos]').forEach(b => b.classList.toggle('active', b.dataset.cvPlatPos === cv.platBadgePos));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvMsShape) {
      cv.maskStickerShape = cvEl.dataset.cvMsShape;
      document.querySelectorAll('[data-cv-ms-shape]').forEach(b => b.classList.toggle('active', b.dataset.cvMsShape === cv.maskStickerShape));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsPos) {
      cv.maskStickerPos = cvEl.dataset.cvMsPos;
      cv.maskStickerX = null; cv.maskStickerY = null; // сброс drag-позиции
      document.querySelectorAll('[data-cv-ms-pos]').forEach(b => b.classList.toggle('active', b.dataset.cvMsPos === cv.maskStickerPos));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsBg) {
      cv.maskStickerBg = cvEl.dataset.cvMsBg;
      document.querySelectorAll('[data-cv-ms-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvMsBg === cv.maskStickerBg));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsTc) {
      cv.maskStickerColor = cvEl.dataset.cvMsTc;
      document.querySelectorAll('[data-cv-ms-tc]').forEach(b => b.classList.toggle('active', b.dataset.cvMsTc === cv.maskStickerColor));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvToColor) {
      cv.textOverlayColor = cvEl.dataset.cvToColor;
      document.querySelectorAll('[data-cv-to-color]').forEach(b => b.classList.toggle('active', b.dataset.cvToColor === cv.textOverlayColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvToBg) {
      cv.textOverlayBgColor = cvEl.dataset.cvToBg;
      document.querySelectorAll('[data-cv-to-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvToBg === cv.textOverlayBgColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgAlign) {
      cv.infogAlign = cvEl.dataset.cvIgAlign;
      cv.infogX = null; cv.infogY = null; // сброс drag-позиции, как у стикера
      document.querySelectorAll('[data-cv-ig-align]').forEach(b => b.classList.toggle('active', b.dataset.cvIgAlign === cv.infogAlign));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgBg) {
      cv.infogBg = cvEl.dataset.cvIgBg;
      document.querySelectorAll('[data-cv-ig-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvIgBg === cv.infogBg));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgTc) {
      cv.infogColor = cvEl.dataset.cvIgTc;
      document.querySelectorAll('[data-cv-ig-tc]').forEach(b => b.classList.toggle('active', b.dataset.cvIgTc === cv.infogColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvDel !== undefined) { cvRemoveImage(+cvEl.dataset.cvDel); return; }
    if (cvEl.dataset.cvTz !== undefined) {
      let img;
      if (cv.mode === 'game' && cv.images.length) img = cv.images[0];
      else if (cv._selCell !== null && cv._selCell !== undefined && cv.images[cv._selCell]) img = cv.images[cv._selCell];
      if (!img) return;
      if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
      jCvBump('tz');
      const t = img.transform, PAN = 0.05;
      switch(cvEl.dataset.cvTz) {
        case 'zoom-in':  t.scale = Math.min(4, (t.scale||1)+0.15); break;
        case 'zoom-out': t.scale = Math.max(1, (t.scale||1)-0.15); break;
        case 'left':  t.ox = (t.ox||0) - PAN; break;
        case 'right': t.ox = (t.ox||0) + PAN; break;
        case 'up':    t.oy = (t.oy||0) - PAN; break;
        case 'down':  t.oy = (t.oy||0) + PAN; break;
        case 'reset': t.scale=1; t.ox=0; t.oy=0; break;
      }
      const scaleVal = Math.round((t.scale||1)*100);
      const slider = document.getElementById('cv-tz-scale');
      if (slider) slider.value = scaleVal;
      const valEl = document.getElementById('cv-tz-scale-val');
      if (valEl) valEl.textContent = scaleVal + '%';
      const c = document.getElementById('cv-canvas');
      if (c) { cv.mode === 'game' ? cvDrawGame(c, img, {}) : cvDrawCollage(c); }
      return;
    }
  }

  const el = e.target.closest('[data-act],[data-tab]');
  if (!el) return;

  const act = el.dataset.act;
  const tab = el.dataset.tab;

  // Табы
  if (tab) {
    if (el.classList.contains('dimmed')) return;
    if (tab !== state.tab) jlog('tab_open', null, { tab }); // журнал: перепись использования вкладок
    state.tab = tab; render(); return;
  }

  // Журнал: перепись кликов по крупным функциям — мёртвые видны нулями при разборе.
  // Повторный клик по кнопке генерации, пока генерация уже идёт, — это нетерпение,
  // а не использование функции: обработчик всё равно выйдет сразу, счётчик не портим.
  if (J_UI_ACTS.has(act) && !(state.loading && (act === 'gen' || act === 'gen-titles' || act === 'gen-more'))) {
    jlog('ui', null, { act });
  }

  switch (act) {
    case 'toggle-ai':
      state.aiOpen = !state.aiOpen; render(); break;

    case 'gen': doGenerate(); break;
    case 'gen-titles': doGenTitlesOnly(); break;

    // Vision (направление 2а)
    case 'vision-recognize':   doVisionRecognize(); break;
    case 'vision-price':       doVisionPrice(); break;
    case 'vision-apply-price': visionApplyPrice(el.dataset.val); break;
    case 'vision-covers':      visionToCovers(); break;
    case 'vision-undo':        visionUndoForm(); break;
    case 'vision-clear':       visionClear(); break;

    case 'title-pick': {
      const id = +el.dataset.id;
      if (state.titleStep) {
        state.titleStep.selected[id] = !state.titleStep.selected[id];
        refreshResults();
      }
      break;
    }
    case 'titles-next': doGenDescriptionsForTitles(); break;
    case 'titles-regen': doGenTitlesOnly(); break;
    case 'titles-cancel': state.titleStep = null; refreshResults(); break;

    case 'alt-titles': doGenAltTitles(+el.dataset.vid); break;
    case 'apply-title': {
      const vid = +el.dataset.vid, tidx = +el.dataset.tidx;
      const alts = state.altTitles[vid];
      const v = findResult(vid);
      if (v && alts?.[tidx]) {
        // Журнал: выбор из ↻×5 — какое название победило и что оно заменило (старое — до перезаписи)
        jlog('applied_title', v._chain || null, { before: v.title || '', after: alts[tidx].title, pickedIdx: tidx });
        v.title = alts[tidx].title; delete state.altTitles[vid]; save(); refreshResults();
      }
      break;
    }

    case 'regen': doRegen(+el.dataset.vid); break;

    case 'fav': {
      const vid = +el.dataset.vid;
      const v = findResult(vid);
      if (v) toggleFav(v);
      break;
    }

    case 'gen-more': doGenerateMore(); break;

    case 'unfav': {
      const fid = +el.dataset.fid;
      if (fid) removeFav(fid);
      else {
        // Fallback: найти по заголовку
        const vid = +el.dataset.vid;
        const v = state.favorites.find(f => f.id === vid);
        if (v) toggleFav(v);
      }
      break;
    }

    case 'copy': copyBtn(el.dataset.text, el); if (el.dataset.j) jCopied(el); break;

    case 'copy-both': copyBtn(el.dataset.t + '\n\n' + el.dataset.d, el); if (el.dataset.j) jCopied(el); break;

    case 'preset-save': {
      const name = prompt('Название пресета:', state.form.subType || state.form.aiService || state.form.digitalName || state.form.gameName || 'Новый пресет');
      if (!name || !name.trim()) break;
      state.presets.push({ id: Date.now(), name: name.trim(), form: JSON.parse(JSON.stringify(state.form)), date: new Date().toLocaleDateString('ru') });
      save();
      toast(`Пресет «${name.trim()}» сохранён`);
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      break;
    }

    case 'preset-load': {
      const sel = document.getElementById('preset-sel');
      const id = sel ? +sel.value : 0;
      if (!id) { toast('Выберите пресет из списка'); break; }
      const p = state.presets.find(x => x.id === id);
      if (!p) break;
      state.form = { ...DEF_FORM, ...p.form };
      save();
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      toast(`Загружен: ${p.name}`);
      break;
    }

    case 'toggle-batch': {
      state.batchMode = el.checked;
      if (!state.batchMode) state.batchRegions = [];
      else if (state.titleStep) { state.titleStep = null; refreshResults(); } // шаг «заголовки» не совместим с пакетным режимом
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      break;
    }

    case 'batch-region': {
      const val = el.dataset.val;
      const i = state.batchRegions.indexOf(val);
      if (i !== -1) state.batchRegions.splice(i, 1); else state.batchRegions.push(val);
      el.classList.toggle('on', state.batchRegions.includes(val));
      const btn = document.querySelector('[data-act="gen"]');
      if (btn) {
        btn.disabled = !state.batchRegions.length;
        btn.textContent = state.batchRegions.length
          ? `📦 Сгенерировать пакет (${state.batchRegions.length} регионов)`
          : '⚠ Выберите регионы для пакета';
      }
      const info = document.querySelector('.batch-regions + div');
      if (info) {
        info.textContent = state.batchRegions.length ? `Выбрано: ${state.batchRegions.length} регионов` : '⚠ Выберите хотя бы 1 регион';
        info.style.color = state.batchRegions.length ? 'var(--teal-h)' : 'var(--warn)';
      }
      break;
    }

    case 'batch-expand': {
      const idx = +el.dataset.i;
      state.batchExpanded = state.batchExpanded === idx ? null : idx;
      refreshBatchResults(); break;
    }

    case 'batch-clear':
      // UX-10: пакет = сожжённые токены на N регионов, не стираем молча
      if (state.batchResults.length && !confirm(`Очистить весь пакет (${state.batchResults.length} объявлений)? Восстановить нельзя.`)) break;
      state.batchResults = []; state.batchExpanded = null; save(); refreshResults(); break;

    case 'queue-add': {
      const qf = state.queueForm;
      if (!qf.region.trim()) { toast('Укажите регион'); break; }
      if (qf.source === 'auto') {
        const miss = validateForm();
        if (miss.length) { toast('Форма генератора не заполнена для «авто»: ' + miss.join(', ')); break; }
      }
      const product = qf.product.trim() || (qf.source === 'auto' ? currentProductName(state.form) : '');
      if (!product) { toast('Укажите товар'); break; }
      state.postQueue.push({
        id: Date.now(), product, region: qf.region.trim(),
        source: qf.source,
        favId: qf.source === 'fav' ? (qf.favId ?? state.favorites[0]?._fid ?? null) : null,
        // «авто» снимает снимок текущей формы — каждая позиция генерируется из своего товара (UX-1)
        form: qf.source === 'auto' ? JSON.parse(JSON.stringify(state.form)) : null,
      });
      save(); render();
      jlog('queue_add', null, { source: qf.source, product, region: qf.region.trim() });
      break;
    }

    case 'queue-add-batch':
      state.batchResults.forEach(item => {
        state.postQueue.push({ id: Date.now() + Math.random(), product: currentProductName(state.form), region: item.region, source: 'batch', favId: null, variant: item.variant });
      });
      save(); render();
      jlog('queue_add', state.batchResults[0]?.variant?._chain || null, { source: 'batch', count: state.batchResults.length });
      break;

    case 'queue-del':
      state.postQueue.splice(+el.dataset.i, 1);
      save(); render(); break;

    case 'queue-clear':
      // UX-10: вся очередь постинга — не стираем молча
      if (state.postQueue.length && !confirm(`Очистить всю очередь (${state.postQueue.length} позиций)?`)) break;
      state.postQueue = []; save(); render(); break;

    case 'queue-start':
      doStartSession(); break;

    case 'session-done': {
      const si = state.postSession;
      const item = si.items[si.idx];
      if (item) {
        state.db.push({
          id: Date.now(), product: item.product, region: item.region,
          title: item.variant?.title || '', description: item.variant?.description || '',
          status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
          _chain: item.variant?._chain || null,
        });
        save();
        // Журнал: в сессии постинга диалог финала не показываем (не рвём конвейерный темп) —
        // финал доносится кнопкой «📥 финал» в Истории
        jlog('posted', item.variant?._chain || null, {
          product: item.product, region: item.region, title: item.variant?.title || '',
          scan: jScanLevel(item.variant), session: true,
        });
      }
      si.idx++;
      renderSession();
      break;
    }

    case 'session-skip':
      state.postSession.idx++;
      renderSession(); break;

    case 'session-close':
      state.postSession.active = false;
      document.getElementById('session-overlay')?.remove();
      break;

    case 'toggle-conveyor':
      state.conveyorMode = !state.conveyorMode;
      if (state.conveyorMode) state.conveyorIdx = 0;
      refreshResults(); break;

    case 'conv-prev':
      if (state.conveyorIdx > 0) { state.conveyorIdx--; refreshResults(); } break;

    case 'conv-next':
      if (state.conveyorIdx < state.results.length - 1) { state.conveyorIdx++; refreshResults(); } break;

    case 'conv-copy-title':
      copyBtn(el.dataset.text, el);
      if (el.dataset.j) jCopied(el);
      el.textContent = '✓ Скопировано';
      el.classList.add('copied');
      setTimeout(() => { el.textContent = '📋 Копировать название'; el.classList.remove('copied'); }, 1800);
      break;

    case 'conv-copy-desc':
      copyBtn(el.dataset.text, el);
      if (el.dataset.j) jCopied(el);
      el.innerHTML = '✓ Скопировано';
      el.classList.add('copied');
      setTimeout(() => { el.innerHTML = '📋 Копировать описание'; el.classList.remove('copied'); }, 1800);
      break;

    case 'conv-photo': {
      // UX-8: раньше только переключало вкладку, теперь переносит название игры и ищет обложку
      const f = state.form;
      if (f.category === 'game' && (f.gameName || '').trim()) {
        goToCoverSearch(f.gameName.trim());
      } else {
        state.tab = 'covers'; render();
      }
      break;
    }

    case 'style':
      state.form.style = el.dataset.val; save(); reForm();
      break;

    case 'count':
      state.form.count = +el.dataset.val; save();
      document.querySelectorAll('[data-act="count"]').forEach(b =>
        b.classList.toggle('on', +b.dataset.val === state.form.count));
      break;

    // Чипы-мультивыбор любой категории (движок категорий): ключ приезжает в data-k.
    // Перерисовываем не форму, а сам чип — иначе на каждом клике терялся бы фокус.
    case 'fchip': {
      const k = el.dataset.k, val = el.dataset.val;
      if (!Array.isArray(state.form[k])) state.form[k] = [];
      const arr = state.form[k];
      const i = arr.indexOf(val);
      if (i !== -1) arr.splice(i, 1); else arr.push(val);
      el.classList.toggle('on', arr.includes(val));
      save(); break;
    }

    // Тумблер любой категории. Здесь перерисовка формы нужна: рядом с тумблером
    // может появляться подсказка (у предзаказа — про веб-поиск бонусов).
    case 'ftoggle': {
      const k = el.dataset.k;
      state.form[k] = !state.form[k];
      save(); reForm(); break;
    }

    case 'dur-del': {
      state.form.durations.splice(+el.dataset.i, 1);
      save(); reDurs(); break;
    }

    case 'dur-add':
      state.form.durations.push({ period: '1 месяц', price: '' });
      save(); reDurs(); break;

    case 'cv-download': {
      if (!cv.images.length) break;
      cv._selCell = null;
      const tmp = document.createElement('canvas');
      // F11: в режиме «Игра» скачиваем основное превью с текущими настройками (рамка/скругление/
      // обводка/тень/стикер/текст), а не через «4 варианта», которые перетирают их пресетами.
      if (cv.mode === 'game') { cvDrawGame(tmp, cv.images[0], {}); cvDownload(tmp, 'game.jpg'); }
      else { cvDrawCollage(tmp); cvDownload(tmp, 'collage.jpg'); }
      break;
    }
    case 'cv-mask-toggle':
      cv.maskSticker = !cv.maskSticker; render(); break;

    case 'cv-to-toggle':
      cv.textOverlay = !cv.textOverlay; render(); break;
    case 'cv-to-bold':
      cv.textOverlayBold = !cv.textOverlayBold; render(); break;
    case 'cv-to-bg-toggle':
      cv.textOverlayBg = !cv.textOverlayBg; render(); break;

    case 'cv-ig-toggle':
      cv.infog = !cv.infog; render(); break;
    case 'cv-ig-fill':
      cvInfogFillFromForm(); break;

    case 'cv-gen-vars':
      cvGenerateVariations(); break;

    case 'cv-gen-collage-vars':
      cvGenerateCollageVars(); break;

    case 'cv-dl-all-collage': {
      const grid = document.getElementById('cv-collage-vars-grid');
      const vars = grid?._vars;
      if (!vars) break;
      // Счётчики сессии канваса относятся ко всей пачке — отдаём их последнему файлу,
      // остальные помечаем keepCounters, иначе первый забирал бы всё, а трём доставались нули
      vars.forEach((v,i) => setTimeout(() => {
        const tmp = document.createElement('canvas');
        cvDrawCollage(tmp, { bg: v.bg, padding: v.padding, infog: v.infog });
        cvDownload(tmp, `collage-var-${i+1}.jpg`, { variant: i + 1, spec: v, keepCounters: i < vars.length - 1, batch: true });
      }, i * 350));
      break;
    }

    case 'cv-dl-all-game': {
      const vars = cv._gameVars;
      if (!vars || !cv.images.length) break;
      const img = cv.images[0];
      vars.forEach((v,i) => setTimeout(() => {
        const tmp = document.createElement('canvas');
        cvDrawGame(tmp, img, v);
        cvDownload(tmp, `game-var-${i+1}.jpg`, { variant: i + 1, spec: v, keepCounters: i < vars.length - 1, batch: true });
      }, i * 350));
      break;
    }

    case 'cv-igdb-fetch':
      if (cv.coverSource === 'ps') cvFetchFromPS(); else cvFetchFromIGDB(); break;

    case 'cv-igdb-game-fetch': {
      const inp = document.getElementById('cv-igdb-game');
      const prog = document.getElementById('cv-igdb-game-prog');
      if (!inp) break;
      const name = inp.value.trim();
      if (!name) break;
      el.disabled = true;
      if (cv.coverSource === 'ps') {
        if (prog) prog.textContent = `⏳ PS Store: «${name}»...`;
        fetch('https://api.poigraem.shop/price-lookup/api/price-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gameName: name, source: 'avito_helper' })
        })
          .then(r => r.json())
          .then(data => {
            if (!data.coverUrl) { if (prog) prog.textContent = '❌ Не найдено'; return; }
            const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.coverUrl);
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              cvRevokeGameBlobs();
              cv.images = [{ id: ++_cvId, url: img.src, el: img, transform:{scale:1,ox:0,oy:0} }];
              if (prog) prog.textContent = '✓ Загружено';
              // Ветка известна статически; читать cv.coverSource здесь нельзя —
              // за время загрузки переключатель источника мог уехать
              jlog('cv_images', null, { source: 'ps', mode: 'game', added: 1, names: [name] });
              cvRenderState();
            };
            img.onerror = () => { if (prog) prog.textContent = '❌ Ошибка загрузки'; };
            img.src = url;
          })
          .catch(() => { if (prog) prog.textContent = '❌ Ошибка запроса'; })
          .finally(() => { el.disabled = false; });
      } else {
        if (prog) prog.textContent = `⏳ Ищем «${name}»...`;
        fetch(`https://api.poigraem.shop/igdb/cover?name=${encodeURIComponent(name)}&type=game`)
          .then(r => r.json())
          .then(data => {
            if (!data.cover) { if (prog) prog.textContent = '❌ Не найдено'; return; }
            const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.cover.replace(/\/t_[a-z0-9_]+\//, '/t_1080p/'));
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              cvRevokeGameBlobs();
              cv.images = [{ id: ++_cvId, url: img.src, el: img, transform:{scale:1,ox:0,oy:0} }];
              if (prog) prog.textContent = '✓ Загружено';
              jlog('cv_images', null, { source: 'igdb', mode: 'game', added: 1, names: [name] });
              cvRenderState();
            };
            img.onerror = () => { if (prog) prog.textContent = '❌ Ошибка загрузки'; };
            img.src = url;
          })
          .catch(() => { if (prog) prog.textContent = '❌ Ошибка запроса'; })
          .finally(() => { el.disabled = false; });
      }
      break;
    }

    case 'db-add': {
      const f = state.dbForm;
      if (!f.product.trim() || !f.region.trim()) { toast('Укажите товар и регион'); break; }
      state.db.push({ id: Date.now(), product: f.product.trim(), region: f.region.trim(), status: f.status || 'active', note: f.note.trim() });
      state.dbForm = { product: f.product.trim(), region: f.region.trim(), status: 'active', note: '' };
      save(); renderDb(); break;
    }
    case 'db-edit': {
      const rec = state.db.find(r => r.id === +el.dataset.id);
      if (!rec) break;
      state.dbEditId = rec.id;
      state.dbForm = { product: rec.product, region: rec.region, status: rec.status, note: rec.note || '' };
      renderDb(); break;
    }
    case 'db-save': {
      if (state.dbEditId === null) break;
      const f2 = state.dbForm;
      if (!f2.product.trim() || !f2.region.trim()) { toast('Укажите товар и регион'); break; }
      const idx = state.db.findIndex(r => r.id === state.dbEditId);
      if (idx !== -1) state.db[idx] = { ...state.db[idx], product: f2.product.trim(), region: f2.region.trim(), status: f2.status, note: f2.note.trim() };
      state.dbEditId = null;
      save(); renderDb(); break;
    }
    case 'db-cancel':
      state.dbEditId = null;
      state.dbForm = { product: '', region: 'Москва', status: 'active', note: '' };
      renderDb(); break;
    case 'db-del': {
      if (!confirm('Удалить запись?')) break;
      const delId = +el.dataset.id;
      state.db = state.db.filter(r => r.id !== delId);
      if (state.dbEditId === delId) { state.dbEditId = null; state.dbForm = { product: '', region: 'Москва', status: 'active', note: '' }; }
      save(); renderDb(); break;
    }
    case 'region-del': {
      const val = el.dataset.val;
      if (!state.settings.regions) state.settings.regions = [...REGIONS];
      state.settings.regions = state.settings.regions.filter(r => r !== val);
      save(); render(); break;
    }
    case 'export-pkg':
      exportPackage(); break;

    case 'rephrase': {
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      doRephrase(+el.dataset.vid, fid); break;
    }

    case 'reph-fav': {
      const vid = +el.dataset.vid;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const boxId = fid ? `reph-f${fid}` : `reph-${vid}`;
      const box = document.getElementById(boxId);
      const v = box?._rephResult;
      if (v) {
        state.favorites.push({ ...v, _fid: v._fid || Date.now() });
        save();
        // Минуя toggleFav — значит fav_add надо писать здесь, иначе путь «перефраз → в избранное»
        // при разборе выглядит неиспользуемым
        jlog('fav_add', v._chain || null, { title: v.title || '', category: v._category || null, scan: jScanLevel(v), fromRephrase: true });
        refreshFavs();
        const cnt = document.getElementById('fav-cnt');
        if (cnt) cnt.textContent = state.favorites.length;
        el.textContent = '★ В избранном';
        el.style.color = 'var(--warn)';
        el.disabled = true;
      }
      break;
    }

    case 'dup-check': {
      const vid = +el.dataset.vid;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const hits = dupCheck(vid, fid);
      const boxId = fid ? `dup-f${fid}` : `dup-${vid}`;
      const box = document.getElementById(boxId);
      if (!box) break;
      if (!hits.length) {
        box.innerHTML = `<div style="padding:6px 12px 10px;font-size:12px;color:var(--ok)">✓ Дублей не найдено среди вариантов, избранного и истории размещений</div>`;
      } else {
        box.innerHTML = `<div style="padding:8px 12px 12px">
          <div style="font-size:12px;color:var(--warn);font-weight:600;margin-bottom:6px">⚠ Похожие объявления</div>
          ${hits.map(h => {
            const pct = Math.round(h.score * 100);
            const col = pct >= 60 ? 'var(--err)' : pct >= 40 ? 'var(--warn)' : 'var(--muted)';
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
              <span style="color:${col};font-weight:700;min-width:34px">${pct}%</span>
              <div style="flex:1;height:4px;background:var(--card3);border-radius:2px">
                <div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div>
              </div>
              <span style="color:var(--text2)">${esc(h.label)}</span>
            </div>`;
          }).join('')}
        </div>`;
      }
      break;
    }

    case 'scan-check': {
      // UX-7: карточка → Сканер, без ручного копирования названия/описания/категории
      let v, i = el.dataset.i !== undefined ? +el.dataset.i : null;
      if (i !== null) {
        v = state.batchResults[i]?.variant;
      } else {
        const vid = el.dataset.vid ? +el.dataset.vid : null;
        const fid = el.dataset.fid ? +el.dataset.fid : null;
        v = fid ? state.favorites.find(f => f._fid === fid) : findResult(vid);
      }
      if (!v) break;
      goToScanner(v.title, v.description, v._category || state.form.category);  // F4: категория из варианта
      break;
    }

    case 'mark-posted': {
      // UX-4: обычный поток (список/конвейер) раньше нигде не фиксировал факт постинга
      const vid = el.dataset.vid ? +el.dataset.vid : null;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const v = fid ? state.favorites.find(f => f._fid === fid) : findResult(vid);
      if (!v) break;
      const region = prompt('Регион размещения?', (state.settings.regions || REGIONS)[0] || 'Москва');
      if (!region || !region.trim()) break;
      const recId = Date.now();
      state.db.push({
        id: recId, product: v._product || currentProductName(state.form), region: region.trim(),  // F4: товар из варианта
        title: v.title || '', description: v.description || '',
        status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
        _chain: v._chain || null, // журнал: чтобы «донос финала» лёг в ту же цепочку
      });
      save();
      jlog('posted', v._chain || null, {
        product: v._product || null, category: v._category || null, region: region.trim(),
        title: v.title || '', scan: jScanLevel(v),
      });
      toast('Отмечено как размещено: ' + region.trim());
      showFinalDialog(recId); // необязательная вставка финального текста с Авито (выбор Дениса: вариант А)
      break;
    }

    case 'batch-fav': {
      // F17: сохранить региональный вариант из пакета в избранное (попадает в few-shot-пул).
      const i = +el.dataset.i;
      const v = state.batchResults[i]?.variant;
      if (!v) break;
      const key = (v.title || '') + (v.description || '');
      if (state.favorites.some(f => (f.title || '') + (f.description || '') === key)) { toast('Уже в избранном'); break; }
      state.favorites.push({ ...v, _fid: Date.now() });
      save(); refreshFavs();
      // Тоже мимо toggleFav — без этой строки пакетный путь выглядел бы мёртвым
      jlog('fav_add', v._chain || null, {
        title: v.title || '', category: v._category || null, scan: jScanLevel(v),
        fromBatch: true, region: state.batchResults[i]?.region || null,
      });
      toast('Сохранено в избранное');
      break;
    }

    case 'batch-mark-posted': {
      const i = +el.dataset.i;
      const item = state.batchResults[i];
      if (!item?.variant) break;
      const recId = Date.now();
      state.db.push({
        id: recId, product: item.variant._product || currentProductName(state.form), region: item.region,  // F4: товар из варианта
        title: item.variant.title || '', description: item.variant.description || '',
        status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
        _chain: item.variant._chain || null,
      });
      save();
      jlog('posted', item.variant._chain || null, {
        product: item.variant._product || null, category: item.variant._category || null, region: item.region,
        title: item.variant.title || '', scan: jScanLevel(item.variant),
      });
      toast('Отмечено как размещено: ' + item.region);
      showFinalDialog(recId);
      break;
    }

    case 'db-final':
      showFinalDialog(+el.dataset.id); break;

    case 'ref-add': {
      // Значения берём из state.refForm (DOM может быть уже перерисован), но живое поле
      // приоритетнее — на случай, если событие пришло раньше input-обработчика
      const rf = state.refForm;
      const title = ((document.getElementById('ref-title')?.value ?? rf.title) || '').trim();
      const desc  = ((document.getElementById('ref-desc')?.value  ?? rf.desc)  || '').trim();
      if (!title && !desc) { toast('Вставьте название и/или описание эталона'); break; }
      const source = document.getElementById('ref-source')?.value || rf.source || 'mine';
      const category = document.getElementById('ref-cat')?.value || rf.category || 'other';
      state.refs.push({ id: Date.now(), source, category, title, desc, date: new Date().toLocaleDateString('ru') });
      state.refForm = { source, category, title: '', desc: '' }; // черновик израсходован, источник/категорию помним
      save();
      jlog('reference_added', null, { source, category, title, description: desc });
      toast('Эталон сохранён');
      renderDb();
      break;
    }

    case 'ref-del': {
      const rid = +el.dataset.id;
      const ref = state.refs.find(r => r.id === rid);
      if (!ref) break;
      if (!confirm('Удалить эталон? Текст уже в журнале, но из этого списка пропадёт.')) break;
      state.refs = state.refs.filter(r => r.id !== rid);
      save(); renderDb();
      break;
    }

    case 'db-export': {
      // Эталоны вносятся руками и нигде больше не хранятся — без них «бэкап Истории»
      // терял их при чистке данных сайта или переезде на другое устройство.
      // Формат-объект новый; импорт по-прежнему понимает и старый файл-массив.
      const payload = { v: 2, exported: new Date().toISOString(), db: state.db, refs: state.refs || [] };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (state.settings.pageName || 'page').replace(/[^a-zа-яё0-9]/gi, '_').toLowerCase();
      a.download = `avito-db-${slug}-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target;

  // Vision: выбор фото товара (направление 2а). Сбрасываем value, чтобы повторный
  // выбор того же файла снова дал событие change.
  if (el.id === 'vision-file') {
    const f = el.files && el.files[0];
    el.value = '';
    if (f) visionPick(f);
    return;
  }

  const act = el.dataset.act;
  if (!act) return;

  if (act === 'cat') {
    state.form.category = el.value; save(); reForm(); return;
  }
  if (act === 'field') {
    state.form[el.dataset.k] = el.value;
    if (el.dataset.k === 'subType') {
      const t = el.value;
      if (t.startsWith('PS Plus')) state.form.platforms = ['PS4', 'PS5'];
      else if (t === 'Game Pass Ultimate') state.form.platforms = ['Xbox'];
      else if (t === 'EA Play') state.form.platforms = ['PS4', 'PS5', 'Xbox'];
      save(); reForm(); return;
    }
    save(); return;
  }
  if (act === 'dur-period') {
    state.form.durations[+el.dataset.i].period = el.value; save(); return;
  }
  if (act === 'dur-price') {
    state.form.durations[+el.dataset.i].price = el.value; save(); return;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  const act = el.dataset.act;
  if (act === 'field') {
    state.form[el.dataset.k] = el.value;
    clearTimeout(el._t); el._t = setTimeout(save, 400);
  }
  if (act === 'dur-price') {
    state.form.durations[+el.dataset.i].price = el.value;
    clearTimeout(el._t); el._t = setTimeout(save, 400);
  }
  if (el.id === 'cv-tz-scale') {
    let img;
    if (cv.mode === 'game' && cv.images.length) img = cv.images[0];
    else if (cv._selCell !== null && cv._selCell !== undefined) img = cv.images[cv._selCell];
    if (!img) return;
    if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
    img.transform.scale = Math.max(1, Math.min(4, +el.value / 100));
    const valEl = document.getElementById('cv-tz-scale-val');
    if (valEl) valEl.textContent = el.value + '%';
    const c = document.getElementById('cv-canvas');
    if (c) { cv.mode === 'game' ? cvDrawGame(c, img, {}) : cvDrawCollage(c); }
    return;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════

render();

// Журнал: маркер запуска (по нему при разборе режутся «рабочие заходы») + отправка накопленного буфера
jlog('app_start', null, {
  w: window.innerWidth, results: state.results.length, queue: state.postQueue.length,
  favs: state.favorites.length, db: state.db.length,
});
jFlush();

// GFX-13: шрифты грузятся асинхронно — если канвас с текстом успел отрисоваться
// на системном fallback раньше, чем догрузился self-host шрифт, перерисовать заново
document.fonts?.ready.then(() => {
  const c = document.getElementById('cv-canvas');
  if (c && cv.images.length) cv.mode === 'game' ? cvDrawGame(c, cv.images[0], {}) : cvDrawCollage(c);
});
</script>
</body>
</html>
