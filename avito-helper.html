  <title>Авито-помощник</title>

    :root {
      --bg:       #1a1a2e;
      --card:     #16213e;
      --card2:    #1e293b;
      --card3:    #0f172a;
      --accent:   #B45309;
      --accent-h: #d97706;
      --accent-d: rgba(180,83,9,.15);
      --teal:     #0F766E;
      --teal-h:   #0d9488;
      --teal-d:   rgba(15,118,110,.15);
      --text:     #e2e8f0;
      --text2:    #cbd5e1;
      --muted:    #64748b;
      --border:   #1e293b;
      --border2:  #334155;
      --ok:       #10b981;
      --warn:     #f59e0b;
      --err:      #ef4444;
      --r:  12px;
      --rs: 8px;
      --ft: 'Literata', Georgia, serif;
      --fm: 'JetBrains Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ft);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 1140px; margin: 0 auto;
      display: flex; align-items: center; gap: 16px; height: 54px;
    }
    .logo {
      font-family: var(--fm); font-size: 13px; font-weight: 500;
      color: var(--accent-h); white-space: nowrap; letter-spacing: -.3px;
    }
    .logo span { color: var(--muted); }

    nav { display: flex; gap: 2px; flex: 1; }
    .tab-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: var(--ft); font-size: 14px;
      padding: 6px 14px; border-radius: var(--rs);
      transition: all .15s; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: var(--card2); }
    .tab-btn.active { color: var(--accent-h); background: var(--accent-d); font-weight: 600; }
    .tab-btn.dimmed { opacity: .45; cursor: default; }

    .ai-btn {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; padding: 4px 10px; border-radius: var(--rs);
      font-family: var(--fm); font-size: 12px; transition: all .15s; white-space: nowrap;
    }
    .ai-btn:hover { color: var(--text); border-color: var(--accent); }
    .ai-btn.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }

    main {
      flex: 1; max-width: 1140px; margin: 0 auto;
      width: 100%; padding: 20px;
    }

    /* ── Settings Panel ── */
    .settings-panel {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 16px 20px; margin-bottom: 18px;
      display: none;
    }
    .settings-panel.open { display: block; }
    /* UX-14: та же панель провайдера/модели, но всегда открыта прямо в форме генератора */
    .ai-inline-panel {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px;
    }
    .settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    /* UX-15: «Ещё варианты» — визуально отделённый блок под основным набором */
    .extra-results-sep { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--border2); }
    .s-group { display: flex; flex-direction: column; gap: 5px; }
    .s-note { font-size: 12px; color: var(--muted); max-width: 280px; padding-top: 18px; }

    /* ── Forms ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .3px; }
    input, select, textarea {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text);
      font-family: var(--ft); font-size: 14px;
      padding: 8px 12px; outline: none; transition: border-color .15s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 76px; font-family: var(--fm); font-size: 13px; }

    .check-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 5px; cursor: pointer;
      font-size: 13px; color: var(--text2);
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; padding: 3px 11px;
      transition: all .15s; user-select: none;
    }
    .chip:hover { border-color: var(--teal); }
    .chip input[type="checkbox"] { display: none; }
    .chip.on { border-color: var(--teal); background: var(--teal-d); color: var(--text); }

    .dur-rows { display: flex; flex-direction: column; gap: 7px; }
    .dur-row { display: flex; align-items: center; gap: 7px; }
    .dur-row select { width: 140px; flex-shrink: 0; }
    .dur-row input  { width: 110px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; width: 28px; height: 28px; border-radius: var(--rs);
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .btn-icon:hover { color: var(--err); border-color: var(--err); }
    .btn-add {
      background: none; border: 1px dashed var(--border2); color: var(--muted);
      cursor: pointer; padding: 5px 11px; border-radius: var(--rs);
      font-size: 12px; transition: all .15s; width: fit-content; margin-top: 4px;
    }
    .btn-add:hover { border-color: var(--teal); color: var(--teal); }

    /* Style pills & count */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; color: var(--muted); cursor: pointer;
      font-size: 13px; padding: 3px 12px; transition: all .15s; user-select: none;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .count-btns { display: flex; gap: 4px; }
    .cnt-btn {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-family: var(--fm); font-size: 14px;
      padding: 4px 14px; transition: all .15s;
    }
    .cnt-btn:hover { border-color: var(--accent); color: var(--text); }
    .cnt-btn.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .btn-gen {
      background: var(--accent); border: none; border-radius: var(--rs);
      color: #fff; cursor: pointer; font-family: var(--ft);
      font-size: 15px; font-weight: 600; padding: 11px 24px;
      width: 100%; transition: all .15s; margin-top: 2px;
    }
    .btn-gen:hover { background: var(--accent-h); transform: translateY(-1px); }
    .btn-gen:active { transform: none; }
    .btn-gen:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .btn-gen-secondary {
      background: transparent; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-family: var(--ft);
      font-size: 12.5px; padding: 7px 14px; width: 100%; margin-top: 6px; transition: all .15s;
    }
    .btn-gen-secondary:hover { border-color: var(--accent); color: var(--text); }
    .btn-gen-secondary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Title-first step (шаг 1 из 2) ── */
    .title-step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .title-step-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card3); border: 1px solid var(--border2); border-radius: var(--rs);
      padding: 10px 12px; cursor: pointer; transition: all .15s;
    }
    .title-step-item:hover { border-color: var(--accent); }
    .title-step-item.on { border-color: var(--accent); background: var(--accent-d); }
    .title-step-text { flex: 1; font-size: 14px; }

    /* ── Generator layout ── */
    .gen-wrap {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px; align-items: start;
    }
    @media (max-width: 780px) { .gen-wrap { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 18px;
    }
    .card + .card { margin-top: 16px; }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text2);
      margin-bottom: 14px; letter-spacing: .3px;
    }
    .form-body { display: flex; flex-direction: column; gap: 13px; }

    /* ── Results ── */
    .results-list { display: flex; flex-direction: column; gap: 14px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px;
      color: var(--muted); gap: 8px; font-size: 14px;
    }
    .empty-state .ico { font-size: 36px; opacity: .3; }

    .loading-box {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px; gap: 12px;
      color: var(--muted); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-box {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
      border-radius: var(--rs); color: var(--err); font-size: 13px; padding: 12px 15px;
    }

    /* ── Variant card ── */
    .vcard {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; transition: border-color .15s;
    }
    .vcard:hover { border-color: var(--border2); }
    .vcard.is-fav { border-color: rgba(180,83,9,.4); }

    .vcard-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .vnum {
      font-family: var(--fm); font-size: 10px; color: var(--muted);
      background: var(--card3); padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    }
    .scan-badge { font-size: 12px; cursor: help; flex-shrink: 0; }
    .results-product-badge {
      display: inline-block; margin: 8px 0 2px; padding: 4px 11px; border-radius: 8px;
      background: var(--card3); border: 1px solid var(--border2);
      font-size: 12px; color: var(--text2); font-weight: 600; letter-spacing: .2px;
    }
    .vtags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .vtag {
      font-size: 10px; padding: 1px 6px; border-radius: 3px;
      background: var(--card3); color: var(--muted); border: 1px solid var(--border2);
    }
    .vcard-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .btn-sm {
      background: none; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-size: 11px;
      padding: 3px 8px; transition: all .15s; white-space: nowrap;
    }
    .btn-sm:hover { color: var(--text); }
    .btn-sm.fav-on { border-color: var(--accent); color: var(--accent-h); }
    .btn-sm:disabled { opacity: .5; cursor: not-allowed; }

    /* Title */
    .title-row { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 4px; }
    .title-val {
      font-family: var(--fm); font-size: 14px; font-weight: 500;
      color: var(--text); flex: 1; line-height: 1.4; word-break: break-word;
    }
    .tlen {
      font-family: var(--fm); font-size: 10px; padding: 2px 6px;
      border-radius: 3px; flex-shrink: 0; margin-top: 2px;
    }
    .tlen.ok   { background: rgba(16,185,129,.12); color: var(--ok); }
    .tlen.warn { background: rgba(245,158,11,.12);  color: var(--warn); }
    .tlen.over { background: rgba(239,68,68,.12);   color: var(--err); }

    hr.div { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    .desc-label {
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
    }
    .desc-val {
      font-size: 13px; color: var(--text2);
      white-space: pre-wrap; word-break: break-word; line-height: 1.7;
    }

    .copy-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .btn-copy {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 4px 10px; transition: all .18s;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-copy:hover { border-color: var(--teal); color: var(--teal); }
    .btn-copy.copied {
      border-color: var(--ok); color: var(--ok); background: rgba(16,185,129,.1);
    }

    /* Favorites */
    .sec-title {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .7px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
    }
    .sec-badge {
      background: var(--accent-d); color: var(--accent-h);
      border-radius: 10px; font-size: 10px; padding: 1px 7px;
    }
    .fav-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

    /* Conveyor mode */
    .conv-mode-toggle {
      float: right; background: none; border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 3px 9px; transition: all .15s;
    }
    .conv-mode-toggle:hover { color: var(--text); border-color: var(--accent); }
    .conv-mode-toggle.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }
    .conv-wrap { display: flex; flex-direction: column; gap: 14px; }
    .conv-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .conv-nav-btn {
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text2); cursor: pointer;
      font-size: 20px; line-height: 1; padding: 8px 20px; transition: all .15s; flex-shrink: 0;
    }
    .conv-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-h); }
    .conv-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
    .conv-counter { font-family: var(--fm); font-size: 13px; color: var(--muted); text-align: center; }
    .conv-title {
      font-family: var(--fm); font-size: 17px; font-weight: 600;
      color: var(--text); line-height: 1.4; word-break: break-word;
    }
    .conv-tlen-row { display: flex; justify-content: flex-end; margin-top: 5px; }
    .conv-desc {
      font-size: 13px; color: var(--text2); white-space: pre-wrap;
      word-break: break-word; line-height: 1.7; max-height: 260px; overflow-y: auto;
      background: var(--card3); border-radius: var(--rs); padding: 12px;
    }
    .conv-btn {
      width: 100%; padding: 13px; border-radius: var(--rs); cursor: pointer;
      font-family: var(--ft); font-size: 15px; font-weight: 600; border: none;
      transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .conv-btn-title { background: var(--teal); color: #fff; }
    .conv-btn-title:hover { background: var(--teal-h); }
    .conv-btn-title.copied { background: var(--ok); }
    .conv-btn-desc { background: var(--accent); color: #fff; }
    .conv-btn-desc:hover { background: var(--accent-h); }
    .conv-btn-desc.copied { background: var(--ok); }
    .conv-btn-photo {
      background: var(--card2); border: 1px solid var(--border2); color: var(--text2);
      flex: 0 0 auto; width: auto; padding: 13px 18px;
    }

function ls(key, def) {
  try {
    const v = localStorage.getItem(key);
    if (v) {
      const parsed = JSON.parse(v);
      // Merge arrays carefully: if def is array, use parsed if array, else def
      if (Array.isArray(def)) return Array.isArray(parsed) ? parsed : def;
      return typeof parsed === 'object' ? { ...def, ...parsed } : def;
    }
  } catch(e) {}
  return typeof def === 'object' && !Array.isArray(def) ? { ...def } : def;
}

// ЖУРНАЛ САМООБУЧЕНИЯ (методика bot-selflearn-log)
// Сырьё — в журнал, смысл — постфактум. Каждое событие: что инструмент
// сгенерировал, что Денис выбрал/скопировал/перегенерил/скачал/донёс с Авито.
// События уходят батчами на VPS (/api/journal, тот же админ-токен) — журналы
// телефона и ПК стекаются в один. Пока сети/токена/эндпоинта нет — копятся
// в локальном буфере (localStorage) и уходят при первой возможности.
// ЖЕЛЕЗНОЕ ПРАВИЛО: журнал не имеет права уронить основной поток — всё в try/catch,
// и токен журнал НИКОГДА не запрашивает сам (только пользуется уже сохранённым).
// ══════════════════════════════════════════

const J_BUF_KEY   = 'avito_journal_buf';
const J_OFF_KEY   = 'avito_journal_off';
const J_MAX_BYTES = 1500000; // ~1.5МБ на буфер неотправленного — дальше вытесняем старейшие

let _jBuf = (() => { try { const v = JSON.parse(localStorage.getItem(J_BUF_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } })();
let _jBufBytes = _jBuf.reduce((s, e) => s + JSON.stringify(e).length, 0);
let _jDropped = 0;

// Ид устройства — различает телефон/ПК в общем журнале на сервере
function _jDevice() {
  try {
    let d = localStorage.getItem('avito_journal_device');
    if (!d) { d = Math.random().toString(16).slice(2, 8); localStorage.setItem('avito_journal_device', d); }
    return d;
  } catch(e) { return '?'; }
}

function jEnabled() { try { return localStorage.getItem(J_OFF_KEY) !== '1'; } catch(e) { return false; } }

function _jSaveBuf() {
  try { localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf)); }
  catch(e) {
    // Квота localStorage: жертвуем старой половиной буфера, но не роняем ничего
    try {
      const drop = Math.ceil(_jBuf.length / 2);
      _jDropped += drop;
      _jBuf.splice(0, drop);
      _jBufBytes = _jBuf.reduce((s, ev) => s + JSON.stringify(ev).length, 0);
      localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf));
    } catch(e2) {}
  }
}

function jlog(event, chainId, fields) {
  try {
    if (!jEnabled()) return;
    const e = {
      ts: new Date().toISOString(), event, chainId: chainId || null,
      device: _jDevice(), build: document.lastModified || '',
      ...(fields || {}),
    };
    if (_jDropped) { e._dropped = _jDropped; _jDropped = 0; }
    const sz = JSON.stringify(e).length;
    _jBuf.push(e); _jBufBytes += sz;
    while (_jBufBytes > J_MAX_BYTES && _jBuf.length > 1) {
      _jBufBytes -= JSON.stringify(_jBuf[0]).length;
      _jBuf.shift(); _jDropped++;
    }
    _jSaveBuf();
    _jScheduleFlush();
  } catch(err) { console.error('journal:', err); }
}

let _jFlushT = null, _jFlushing = false;
function _jScheduleFlush() { try { clearTimeout(_jFlushT); _jFlushT = setTimeout(jFlush, 4000); } catch(e) {} }

async function jFlush() {
  try {
    if (_jFlushing || !_jBuf.length || !jEnabled()) return;
    const token = localStorage.getItem('avito_admin_token'); // не спрашиваем — только берём готовый
    if (!token) return;
    _jFlushing = true;
    try {
      const batch = _jBuf.slice(0, 50);
      const r = await fetch(PROXY_JOURNAL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ events: batch }),
      });
      if (r.ok) {
        _jBuf.splice(0, batch.length);
        _jBufBytes = _jBuf.reduce((s, ev) => s + JSON.stringify(ev).length, 0);
        _jSaveBuf();
        if (_jBuf.length) setTimeout(jFlush, 400); // дожимаем остаток батчами
      }
      // 401/404/5xx — молчим и ждём: токен чинит callAI, эндпоинт доедет с деплоем, буфер не теряется
    } catch(e) { /* офлайн — буфер ждёт следующего повода */ }
    finally { _jFlushing = false; }
  } catch(e) { _jFlushing = false; }
}

// Светофор варианта для журнала — тот же уровень, что показывает бейдж
function jScanLevel(v) {
  const s = v && v._scan;
  if (!s) return null;
  return s.errors.length ? 'error' : s.warnings.length ? 'warn' : 'ok';
}

// Доля изменённого текста (0..1): 1 - 2*LCS/(a+b) по словам. Считается при
// «доносе» финального текста с Авито — что Денис стабильно правит руками.
function jEditShare(a, b) {
  try {
    const wa = String(a || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    const wb = String(b || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    if (!wa.length && !wb.length) return 0;
    if (!wa.length || !wb.length) return 1;
    let prev = new Array(wb.length + 1).fill(0);
    for (let i = 1; i <= wa.length; i++) {
      const cur = [0];
      for (let j = 1; j <= wb.length; j++) {
        cur[j] = wa[i-1] === wb[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]);
      }
      prev = cur;
    }
    const lcs = prev[wb.length];
    return Math.round((1 - (2 * lcs) / (wa.length + wb.length)) * 100) / 100;
  } catch(e) { return null; }
}

// Компактные выжимки вариантов для события generated — полные тексты (правило:
// писать то, что нельзя восстановить), плюс светофор
function jVariants(list) {
  return (list || []).map(v => ({ title: v.title || '', description: v.description || '', scan: jScanLevel(v) }));
}

function jCvBump(k) { try { _jCv[k] = (_jCv[k] || 0) + 1; } catch(e) {} }
function jCvTakeCounters() {
  const out = { drags: _jCv.drags, layouts: _jCv.layouts, toggles: _jCv.toggles, tz: _jCv.tz };
  _jCv.drags = 0; _jCv.layouts = 0; _jCv.toggles = 0; _jCv.tz = 0;

// Копирование = «этот текст пошёл в дело» — главный сигнал выбора в текстовом контуре.
// kind/vid/bi читаются из data-j* атрибутов кнопок копирования.
function jCopied(el) {

function getCatalogEntry(sub) {
  const c = (state.catalogs || {})[sub];
  if (!c) return { core: [], masking: [] };
  if (Array.isArray(c)) return { core: [], masking: c }; // старый формат
  return { core: Array.isArray(c.core) ? c.core : [], masking: Array.isArray(c.masking) ? c.masking : [] };
}

// Раньше отдавал один перемешанный список без различия ядро/маскировка —
// модель могла утянуть в крючок названия СЛУЧАЙНУЮ маскирующую игру (аудит Fable 5).
// Теперь ядро и маскировка возвращаются раздельно: ядро идёт в промпт как
// «единственный источник крючка», маскировка — только для тела описания.
function buildGamesLists(subType) {
  const cat = getCatalogEntry(subType);

  // Для каждой ядровой игры — рандомный вариант из списка через |
  const core = cat.core.map(line => {
    const variants = line.split('|').map(s => s.trim()).filter(Boolean);
    return variants[Math.floor(Math.random() * variants.length)] || line.trim();
  });

  // Перемешать порядок ядровых
  for (let i = core.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [core[i], core[j]] = [core[j], core[i]];
  }

  // 2–4 случайных маскирующих
  const maskCount = cat.masking.length
    ? Math.min(cat.masking.length, 2 + Math.floor(Math.random() * 3))
    : 0;
  const masking = [...cat.masking].sort(() => Math.random() - .5).slice(0, maskCount);

  return { core: core.join(', ') || null, masking: masking.join(', ') || null };
}

- AI-подписки: конкретные инструменты и юзкейсы, не абстрактно
- Пиши грамотно и точно, но без официоза
- Звучи как живой человек, не рекламный робот
- Не копируй структуру эталонных примеров — переосмысли своими словами
- Разговорный язык в меру: «зайдёт», «затянет», «годнота» — нормально, но не перебарщивай
- Градус эмоции под товар: крутая игра — живее, рядовая позиция — спокойнее и по делу, без натянутого восторга
- Длина по смыслу: не растягивай ради объёма

ЗАПРЕЩЁННЫЕ СЛОВА И ФРАЗЫ:
- Штампы: «захватывающее приключение», «невероятный мир», «погрузитесь», «откройте для себя», «must-have», «незабываемые эмоции», «легендарное», «эпическое», «та самая», «тот самый», «то самое»
- Рекламный пафос: «уникальный», «революционный», «невероятный», «потрясающий», «лучший в своём роде»
- Англицизмы-жаргон: «контент», «хайп», «тренд», «виб», «кринж», «скилл», «лор» — заменяй русскими аналогами
- Слова оплаты: «платишь», «оплатишь», «оплата», «стоит», «купишь», «покупаешь» — ЗАПРЕЩЕНО. Вместо этого всегда используй «оформляешь», «оформить», «оформляется» (юридический момент)
- Слово «цена» как ценник: «цена — 7500», «цена: 7500 руб» — ЗАПРЕЩЕНО. Допустимо только в контексте фиксации: «цена не изменится», «цена зафиксирована». Для указания суммы пиши «оформляешь за X руб» или просто «X руб»
- «В подарок», «подарок», «в качестве подарка» — ЗАПРЕЩЕНО в любом контексте
- «Аккаунт», «учётная запись», «учетная запись», «профиль» — КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО. Авито банит объявления за продажу аккаунтов — это запрещённая категория товаров. Любое упоминание этих слов может привести к блокировке. Правильная нейтральная формулировка — «оформляется в цифре». НЕ пиши «оформляется в цифре на ваш аккаунт» — только «оформляется в цифре», без уточнений.

ФОРМАТ ОТВЕТА — строго JSON без markdown-обёртки:
{

    {

    }

ВАЖНО: только JSON в ответе. Названия строго ≤50 символов. Описания реально разные по структуре.`;

// Админ-токен для прокси /api/claude и /api/openrouter — бэкенд теперь требует
// Authorization (SEC-1). Спрашивается один раз, хранится в localStorage.
function getProxyToken() {
  let t = localStorage.getItem('avito_admin_token') || '';
  if (!t) {
    t = (prompt('Введите админ-токен (тот же, что в админке магазина Поиграем):') || '').trim();
    if (t) localStorage.setItem('avito_admin_token', t);
  }
  return t;
}

async function callAI(messages, opts = {}) {
  const provider = opts.provider || state.settings.provider;
  const model    = opts.model    || state.settings.model;
  // 0.8 вместо дефолтного 1.0 — для 50-символьного названия высокая температура
  // чаще давала не крючок, а случайный набор слов (аудит Fable 5). 0.8 всё ещё
  // даёт разнообразие, нужное для антидубля между вариантами/регионами.
  const temperature = opts.temperature ?? 0.8;

  if (provider === 'claude') {
    const body = { model, max_tokens: opts.max_tokens || 4000, temperature, system: state.settings.customSys ? SYS + '\n\n' + state.settings.customSys : SYS, messages };
    if (opts.webSearch) body.tools = [{ type: 'web_search_20250305', name: 'web_search' }];
    const r = await fetch(PROXY_CLAUDE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      // F13: неверный токен иначе сохранён навсегда — сбрасываем, чтобы следующий запрос переспросил
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`Claude ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    return d.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
  }

  if (provider === 'openrouter') {
    if (opts.webSearch) toast('⚠️ OpenRouter не поддерживает веб-поиск бонусов предзаказа — переключитесь на Claude для точных данных');
    const orModel = opts.orModel || state.settings.orModel;
    const r = await fetch(PROXY_OPENROUTER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify({
        model: orModel, max_tokens: opts.max_tokens || 4000, temperature,
        messages: [{ role: 'system', content: state.settings.customSys ? SYS + '\n\n' + state.settings.customSys : SYS }, ...messages],
      }),
    });
    if (!r.ok) {
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`OpenRouter ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    return d.choices?.[0]?.message?.content || '';
  }

  throw new Error('Неизвестный провайдер: ' + provider);
}

// Достаёт JSON из ответа модели, даже если он обёрнут пояснительным текстом.
// Веб-поиск бонусов предзаказа часто добавляет прозу до/после JSON — F3.
function extractJSON(text) {
  const raw = (text || '').trim();
  const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) return fence[1].trim();
  const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
  return (first !== -1 && last > first) ? raw.slice(first, last + 1) : raw;
}

function parseVariants(text) {
  const data = JSON.parse(extractJSON(text));
  if (!Array.isArray(data?.variants)) throw new Error('Нет поля variants в ответе');
  return data.variants.map((v, i) => ({ ...v, id: i + 1 }));
}

// Данные о товаре без стиля/количества/few-shot — общий блок,
// переиспользуется и полной генерацией, и шагом «сначала заголовки».
function catInfoBlock(f) {
  if (f.category === 'gaming_sub') {
    const durs = f.durations.filter(d => d.period && d.price)
      .map(d => `  ${d.period}: ${d.price} руб`).join('\n');
    const { core, masking } = buildGamesLists(f.subType);
    const extraGames = f.games?.trim();
    // Ручной ввод продавца считаем ядром — крючок можно брать и оттуда
    const hookPool = [core, extraGames].filter(Boolean).join(', ');
    const gamesBlock = (hookPool || masking)
      ? `Ключевые игры (крючок в названии — ТОЛЬКО отсюда, бери 1-2 из начала списка): ${hookPool || '(не указаны)'}
Доп. игры для разнообразия ОПИСАНИЯ (в названии/крючке НЕ использовать): ${masking || '(нет)'}`
      : `Список игр: (не указан)`;
    return `Категория: Игровая подписка
Тип: ${f.subType}
Платформы: ${f.platforms.join(', ')}
Сроки и цены:\n${durs || '  (не указаны)'}
${gamesBlock}`;
  }

  if (f.category === 'ai_sub') {
    return `Категория: AI-подписка
Сервис: ${f.aiService}
Срок: ${f.aiDuration}
Цена: ${f.aiPrice} руб
Фичи: ${f.aiFeatures || '(не указаны)'}`;
  }

  if (f.category === 'digital') {
    return `Категория: Цифровой товар
Название: ${f.digitalName}
Описание: ${f.digitalDesc}
Цена: ${f.digitalPrice} руб`;
  }

  if (f.category === 'game') {
    const preorderBlock = f.isPreorder ? `
ЭТО ПРЕДЗАКАЗ. Найди через веб-поиск актуальные бонусы предзаказа для "${f.gameName}" и используй их в описании.
Обязательно включи в описание:
- Объяснение предзаказа БЕЗ путаницы: покупатель оформляет игру сейчас и СРАЗУ получает её в цифре — просто играть можно будет начиная с дня релиза. Не «платишь сейчас и ждёшь» — а «игра уже твоя, просто старт в день выхода»
- Конкретные бонусы предзаказа (найди через поиск — скины, миссии, контент и т.п.)
- Акцент: цена зафиксирована — даже если игра подорожает. Писать БЕЗ суммы: просто «Цена зафиксирована» или «стоимость не изменится» — никаких чисел и ₽
В названии слово «предзаказ» — МОЖНО, но не обязательно. Иногда сильнее зайти с другого угла: топ-бонус, дата выхода, название игры без «предзаказа»` : '';
    return `Категория: Игра
Название: ${f.gameName}
Платформы: ${f.gamePlatforms.join(', ')}
Жанр: ${f.gameGenre}${preorderBlock}`;
  }
}

function styleLabel(f) {
  return f.style === 'custom'
    ? (f.customStyle.trim() || 'на своё усмотрение')
    : (STYLES.find(s => s.id === f.style)?.label || f.style);
}

// Few-shot: 1-2 примера собственных сохранённых удачных объявлений той же
// категории — модель ориентируется на характер продавца, а не только на правила.
function fewShotBlock(category) {
  const pool = state.favorites.filter(v => v._category === category && v.title && v.description);
  if (!pool.length) return '';
  const picks = [...pool].sort(() => Math.random() - .5).slice(0, 2);
  const lines = picks.map((v, i) => {
    const d = v.description.length > 220 ? v.description.slice(0, 220).trim() + '…' : v.description;
    return `${i + 1}. «${v.title}» — ${d.replace(/\n+/g, ' ')}`;
  }).join('\n');
  return `\n\nПримеры твоих же удачных объявлений этой категории (ориентируйся на характер и энергию, НЕ копируй дословно):\n${lines}`;
}

function buildMsg(overrideCount, excludeTitles = [], formOverride = null) {
  const f = formOverride || state.form;
  const count = overrideCount ?? f.count;
  const excl = excludeTitles.length ? `\nИсключить названия (уже есть): ${excludeTitles.join('; ')}` : '';
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}
Стиль: ${styleLabel(f)}
Вариантов: ${count}${excl}${notes}${fewShotBlock(f.category)}`;
}

// Проверяет заполненность обязательных полей формы. Возвращает список того, чего не хватает.
function validateForm(f = state.form) {
  const miss = [];
  if (f.category === 'gaming_sub') {
    if (!f.platforms.length) miss.push('платформы');
    const cat = getCatalogEntry(f.subType);
    const hasCat = cat.core.length || cat.masking.length;
    if (!hasCat && !(f.games || '').trim()) miss.push('список игр (или заполните каталог в Настройках)');
    if (!f.durations.some(d => String(d.price).trim())) miss.push('хотя бы одну цену в «Сроки и цены»');
  } else if (f.category === 'ai_sub') {
    if (!String(f.aiPrice).trim()) miss.push('цену');
    if (!(f.aiFeatures || '').trim()) miss.push('ключевые фичи');
  } else if (f.category === 'digital') {
    if (!(f.digitalName || '').trim()) miss.push('название товара');
    if (!(f.digitalDesc || '').trim()) miss.push('описание');
    if (!String(f.digitalPrice).trim()) miss.push('цену');
  } else if (f.category === 'game') {
    if (!(f.gameName || '').trim()) miss.push('название игры');
    if (!f.gamePlatforms.length) miss.push('платформы');
  }
  return miss;
}

// UX-15: «Ещё варианты» живут отдельно от основного набора — эти хелперы
// ищут/мутируют вариант в обоих списках сразу, чтобы карточка вела себя одинаково в обоих местах
function resultsPool() { return [...state.results, ...state.extraResults]; }
function findResult(id) { return state.results.find(r => r.id === id) || state.extraResults.find(r => r.id === id); }
function findResultRef(id) {
  let idx = state.results.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.results, idx };
  idx = state.extraResults.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.extraResults, idx };
  return { arr: null, idx: -1 };
}

async function doGenerate() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  if (state.batchMode && !state.batchRegions.length) { toast('Пакетный режим включён — выберите хотя бы один регион'); return; }
  if (state.batchMode && state.batchRegions.length) { doBatchGenerate(); return; }
  state.loading = true; state.error = null; state.loadingKind = null;
  state.batchResults = []; state.titleStep = null; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: одна генерация и вся её судьба — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg() }], { webSearch });
    state.results = parseVariants(text);
    // F4: снимок формы + штамп товара/категории на каждый вариант — чтобы действия
    // карточки (Размещено/Сканер/Экспорт/↻×5) не читали форму, переключённую позже
    state.resultsForm = JSON.parse(JSON.stringify(state.form));
    state.results.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    save();
    jlog('generated', jChain, {
      path: 'main', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      style: state.form.style, notes: state.form.notes || '', webSearch,
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_main', message: String(e.message || '').slice(0, 300), latencyMs: Date.now() - jT0 });
  } finally {
    state.loading = false;
    refreshResults();
  }
}

// UX-15: «➕ Ещё варианты» — дописывает в отдельный список, НЕ трогая основной набор
// (в отличие от doGenerate/doRegen, которые заменяют state.results целиком)
async function doGenerateMore() {
  if (state.loading || state.extraLoading || !state.results.length) return;
  state.extraLoading = true;
  refreshResults();
  const jChain = state.results[0]?._chain || ('gen-' + Date.now()); // журнал: «ещё» — та же цепочка, что основной набор
  const jT0 = Date.now();
  try {
    const snapForm = state.resultsForm || state.form; // F4: та же форма, что породила основной набор
    const excl = resultsPool().map(v => v.title);
    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg(snapForm.count, excl, snapForm) }], { webSearch });
    const fresh = parseVariants(text);
    if (!fresh.length) throw new Error('AI не вернул варианты');
    const product  = state.results[0]?._product  || currentProductName(snapForm);
    const category = state.results[0]?._category || snapForm.category;
    fresh.forEach(v => {
      v._product = product; v._category = category;
      v._scan = checkAds(v.title || '', v.description || '', category);
      v._chain = jChain;
    });
    state.extraResults.push(...fresh);
    save();
    jlog('generated', jChain, {
      path: 'more', category, product, excluded: excl.length,
      latencyMs: Date.now() - jT0, variants: jVariants(fresh),
    });
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', jChain, { stage: 'generate_more', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.extraLoading = false;
    refreshResults();
  }
}

async function doBatchGenerate() {
  const regions = state.batchRegions;
  state.loading = true; state.error = null; state.loadingKind = null; state.batchResults = []; state.titleStep = null; state.extraResults = [];
  // Пакет и обычные варианты взаимоисключающие — чистим обычный набор,
  // чтобы он не всплыл после «✕ Очистить» или перезагрузки (UX-3)
  state.results = []; state.conveyorIdx = 0;
  // F2: один запрос на весь пакет при фиксированном max_tokens обрезал JSON на 7+ регионах
  // (список регионов не ограничен, до 25 по умолчанию) — бьём на чанки, каждый со своим бюджетом
  const CHUNK = 4;
  const chunks = [];
  for (let i = 0; i < regions.length; i += CHUNK) chunks.push(regions.slice(i, i + CHUNK));
  state.batchChunkProgress = chunks.length > 1 ? { done: 0, total: chunks.length } : null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'batch-' + Date.now(); // журнал: пакет по регионам — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const variants = [];
    let chunkFails = 0;
    for (const chunk of chunks) {
      try {
        const msg = buildMsg(chunk.length, variants.map(v => v.title));
        const text = await callAI([{ role: 'user', content: msg }],
          { webSearch, max_tokens: Math.min(8000, 800 + chunk.length * 1200) });
        variants.push(...parseVariants(text));
      } catch(e) {
        console.error('Пакет: чанк не удался', e);
        chunkFails++;
      }
      if (state.batchChunkProgress) { state.batchChunkProgress.done++; refreshResults(); }
    }
    if (!variants.length) throw new Error('Не удалось сгенерировать ни одного варианта — все запросы завершились ошибкой');
    // F4: штамп товара/категории по форме на момент генерации (регион у пакета свой на каждой позиции)
    variants.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    if (variants.length < regions.length) {
      toast(`⚠️ AI вернул ${variants.length} из ${regions.length} вариантов — ${regions.length - variants.length} регионов без текста${chunkFails ? ` (${chunkFails} запрос(ов) не удалось)` : ''}. Повторите генерацию.`);
    }
    state.batchResults = regions.map((region, i) => ({
      region,
      variant: variants[i] || null,
    }));
    state.batchExpanded = null;
    save();
    jlog('generated', jChain, {
      path: 'batch', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      regions, chunkFails, latencyMs: Date.now() - jT0,
      variants: state.batchResults.map(it => ({ region: it.region, ...(it.variant ? { title: it.variant.title || '', description: it.variant.description || '', scan: jScanLevel(it.variant) } : { empty: true }) })),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_batch', message: String(e.message || '').slice(0, 300), regions: regions.length });
  } finally {
    state.loading = false;
    state.batchChunkProgress = null;
    if (state.batchResults.length) { refreshBatchResults(); }
    else { refreshResults(); }
  }
}

function buildTitlesMsg(n) {
  const f = state.form;
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}${notes}

ЗАДАЧА: сгенерируй ${n} вариантов НАЗВАНИЙ (только названия, БЕЗ описаний) для одного и того же объявления. Каждое — из РАЗНОЙ точки пространства вариаций (разный крючок, разное написание/сокращение, разный порядок слов). Строго следуй формуле и правилам названий из системного промпта (лимит 50 символов, запрещённые слова, для игр — без цены).${fewShotBlock(f.category)}

Верни строго JSON без markdown-обёртки:
{"titles":[{"title":"...","hook":"крючок одним-двумя словами"}]}`;
}

async function doGenTitlesOnly() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  state.loading = true; state.error = null; state.loadingKind = 'titles';
  state.titleStep = null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: воронка (заголовки + описания) — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const n = Math.max(8, Math.min(12, (state.form.count || 5) * 2));
    const text = await callAI([{ role: 'user', content: buildTitlesMsg(n) }], { webSearch, max_tokens: webSearch ? 2200 : 1400 });
    const data = JSON.parse(extractJSON(text));
    const titles = (data.titles || [])
      .map((t, i) => ({ id: i + 1, title: t.title || '', hook: t.hook || '', len: [...(t.title || '')].length }))
      .filter(t => t.title);
    if (!titles.length) throw new Error('AI не вернул названия');
    state.titleStep = { titles, selected: {}, form: JSON.parse(JSON.stringify(state.form)), _chain: jChain };
    jlog('generated', jChain, {
      path: 'titles', category: state.form.category, product: currentProductName(state.form),
      latencyMs: Date.now() - jT0, titles: titles.map(t => t.title),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_titles', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

async function doGenDescriptionsForTitles() {
  const step = state.titleStep;
  if (!step) return;
  const chosen = step.titles.filter(t => step.selected[t.id]);
  if (!chosen.length) { toast('Выберите хотя бы одно название'); return; }
  state.loading = true; state.error = null; state.loadingKind = 'descriptions'; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = step._chain || ('gen-' + Date.now()); // журнал: продолжение цепочки шага заголовков
  const jT0 = Date.now();
  try {
    const f = step.form;
    const webSearch = f.isPreorder && f.category === 'game';
    const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
    const list = chosen.map((t, i) => `${i + 1}. "${t.title}" (крючок: ${t.hook || '—'})`).join('\n');
    const msg = `${catInfoBlock(f)}${notes}
Стиль: ${styleLabel(f)}

Названия УЖЕ ВЫБРАНЫ продавцом — менять текст названия НЕЛЬЗЯ, перенеси его в поле title символ-в-символ:
${list}

Для каждого напиши полное описание — разное по структуре и подаче цены между вариантами (см. правила описаний в системном промпте).${fewShotBlock(f.category)}
Верни строго JSON без markdown-обёртки:
{"variants":[{"id":1,"title":"(как в списке, без изменений)","title_length":число,"description":"...","style":"...","price_format":"...","hook":"...","structure":"..."}]}`;
    const text = await callAI([{ role: 'user', content: msg }], { webSearch, max_tokens: Math.min(8000, 800 + chosen.length * 1200) });
    const variants = parseVariants(text);
    if (!variants.length) throw new Error('AI не вернул описания');
    // Название продавцом уже выбрано — принудительно прописываем его поверх ответа AI
    // (промпт просит не менять, но гарантию даёт только клиент). Порядок AI держит,
    // маппим по индексу; если AI вернул меньше описаний, чем выбрано, — берём сколько есть.
    const n = Math.min(variants.length, chosen.length);
    const results = variants.slice(0, n).map((v, i) => ({
      ...v,
      title: chosen[i].title,
      title_length: chosen[i].len,
    }));
    if (n < chosen.length) {
      toast(`⚠️ AI описал ${n} из ${chosen.length} названий. Остальные повторите отдельно.`);
    }
    state.results = results;
    state.resultsForm = JSON.parse(JSON.stringify(f));
    state.results.forEach(v => {
      v._product = currentProductName(f); v._category = f.category;
      v._scan = checkAds(v.title || '', v.description || '', f.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    state.titleStep = null;
    save();
    jlog('generated', jChain, {
      path: 'descriptions', category: f.category, product: currentProductName(f),
      offered: step.titles.length, chosen: chosen.map(t => t.title), // выбор Дениса из предложенных заголовков
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_descriptions', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

  state.altTitlesLoading = id;
  delete state.altTitles[id];
  refreshResults();
  try {
    const v = findResult(id);
    const base = buildMsg(1, [], state.resultsForm);  // F4: промпт из формы на момент генерации, не из живой
    const msg = `${base}
Текущее название: ${v?.title || ''}

ЗАДАЧА: сгенерируй 5 альтернативных названий для этого же объявления. Каждое — в ДРУГОЙ стилистической точке: разный крючок, разные слова, для игры — обязательно разная форма написания названия (рус/англ/аббревиатура, транслит). Строго до 50 символов. ЗАПРЕЩЕНО: для категории «Игра» — любая цена/сумма/₽ в названии; для любой категории — слова «рублей»/«руб», даты/годы/«старт»/«релиз». Верни только JSON:
{"titles":[{"title":"...","hook":"крючок одним словом"},{"title":"...","hook":"..."},{"title":"...","hook":"..."},{"title":"...","hook":"..."},{"title":"...","hook":"..."}]}`;
    const snapForm = state.resultsForm || state.form; // F12: webSearch из того же снимка, что и промпт (buildMsg выше)
    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    // F5: при webSearch сама генерация вспомогательных tool-use блоков ест бюджет
    // до финального текста — 600 обрезало 5 заголовков; 2000 — тот же запас, что в doRephrase
    const text = await callAI([{ role: 'user', content: msg }], { webSearch, max_tokens: webSearch ? 2000 : 600 });
    const data = JSON.parse(extractJSON(text));
    state.altTitles[id] = (data.titles || []).map(t => ({ ...t, len: [...(t.title||'')].length }));
    jlog('generated', v?._chain || null, {
      path: 'alt_titles', baseTitle: v?.title || '', titles: state.altTitles[id].map(t => t.title),

  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', null, { stage: 'alt_titles', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.altTitlesLoading = null; refreshResults();

async function doRegen(id) {
  if (state.regenId !== null) return;
  state.regenId = id; refreshResults();
  try {
    // F12: перегенерация одного варианта должна опираться на форму НА МОМЕНТ генерации
    // (снимок resultsForm + штампы варианта), а не на живую форму — иначе после переключения
    // формы ↻ выдаёт ДРУГОЙ товар, теряет _product/_category и не ищет бонусы предзаказа (Bug #6).
    const prev = findResult(id) || {};
    const snapForm = state.resultsForm || state.form;
    const category = prev._category || snapForm.category;
    const product  = prev._product  || currentProductName(snapForm);
    const excl = resultsPool().filter(v => v.id !== id).map(v => v.title);
    const webSearch = snapForm.isPreorder && category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg(1, excl, snapForm) }], { webSearch });
    const [v] = parseVariants(text);
    const { arr, idx } = findResultRef(id);
    if (arr && idx !== -1 && v) {
      // Журнал: перегенерация = «этот вариант не устроил». Старый текст пишем ДО перезаписи —
      // после неё он безвозвратен (правило «логировать до перезаписи»).
      jlog('regen', prev._chain || null, {
        category, product,
        before: { title: prev.title || '', description: prev.description || '', scan: jScanLevel(prev) },
        after:  { title: v.title || '', description: v.description || '' },
      });
      arr[idx] = { ...v, id, _product: product, _category: category, _chain: prev._chain }; // штампы F4 сохраняются
      arr[idx]._scan = checkAds(v.title || '', v.description || '', category); // бейдж под НОВЫЙ текст
      save();
    }
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', null, { stage: 'regen', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.regenId = null; refreshResults();
  }
}

function toggleFav(variant) {
  const key = variant.title + variant.description;
  const idx = state.favorites.findIndex(f => f.title + f.description === key);
  if (idx !== -1) {
    // F15: удаление из избранного = потеря few-shot/источника очереди; если варианта уже нет
    // в результатах — текст безвозвратен. Добавление (else) не подтверждаем — оно не деструктивно.
    if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
    state.favorites.splice(idx, 1);
    jlog('fav_remove', variant._chain || null, { title: variant.title || '' });
  } else {
    state.favorites.push({ ...variant, _fid: Date.now() });
    jlog('fav_add', variant._chain || null, { title: variant.title || '', category: variant._category || null, scan: jScanLevel(variant) });
  }
  save(); refreshResults(); refreshFavs();
}

function removeFav(fid) {
  // F15: то же удаление, но из списка избранного (кнопка ★ на карточке избранного)
  if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
  const gone = state.favorites.find(f => f._fid === fid);
  state.favorites = state.favorites.filter(f => f._fid !== fid);
  if (gone) jlog('fav_remove', gone._chain || null, { title: gone.title || '' });
  save(); refreshResults(); refreshFavs();
}

function isFav(v) {
  const key = v.title + v.description;
  return state.favorites.some(f => f.title + f.description === key);
}

function copyBtn(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Скопировано';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('Скопировано!');
  });
}

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3000);
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lenClass(n) {
  return n <= 44 ? 'ok' : n <= 50 ? 'warn' : 'over';
}

// UX-13: пороги счётчика длины объяснены в подсказке (раньше «N/50» желтел молча).
// Лимит Авито — 50; жёлтый с 45 (впритык), красный с 51 (лимит превышен).
const LEN_TIP = 'Лимит названия на Авито — 50 символов. Жёлтый с 45 (впритык к лимиту — Авито может обрезать название в списке), красный с 51 (лимит превышен, объявление не примут).';
function tlenHTML(len, cls, style) {
  return `<span class="tlen ${cls ? cls + ' ' : ''}${lenClass(len)}"${style ? ` style="${style}"` : ''} title="${LEN_TIP}">${len}/50</span>`;
}

function conveyorHTML() {
  const variants = state.results;
  if (!variants.length) return '';
  const idx = Math.max(0, Math.min(state.conveyorIdx, variants.length - 1));
  const v = variants[idx];
  const len  = v.title ? [...v.title].length : 0;
  const fav  = isFav(v);
  const tAttr = (v.title || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const dAttr = (v.description || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');

  return `<div class="conv-wrap" id="conv-wrap">
    <div class="conv-nav">
      <button class="conv-nav-btn" data-act="conv-prev" ${idx===0?'disabled':''}>←</button>
      <div class="conv-counter">Вариант ${idx+1} из ${variants.length}</div>
      <button class="conv-nav-btn" data-act="conv-next" ${idx===variants.length-1?'disabled':''}>→</button>
    </div>

    <div>
      <div class="conv-title">${esc(v.title || '')}</div>
      <div class="conv-tlen-row">${tlenHTML(len)}</div>
    </div>

    <button class="conv-btn conv-btn-title" data-act="conv-copy-title" data-text="${tAttr}" data-j="title" data-jvid="${v.id}">
      📋 Копировать название
    </button>

    <hr class="div">

    <div>
      <div class="desc-label">Описание</div>
      <div class="conv-desc">${esc(v.description || '')}</div>
    </div>

    <div class="conv-actions-row">
      <button class="conv-btn conv-btn-desc" data-act="conv-copy-desc" data-text="${dAttr}" data-j="desc" data-jvid="${v.id}">
        📋 Копировать описание
      </button>
      <button class="conv-btn conv-btn-photo" data-act="conv-photo" title="Перейти к обложкам">🖼️</button>
    </div>

    <div class="conv-meta">
      <button class="btn-sm ${fav?'fav-on':''}"
        data-act="fav" data-vid="${v.id}">${fav?'★ Избранное':'☆ В избранное'}</button>
      <button class="btn-sm" data-act="regen" data-vid="${v.id}">↻ Перегенерировать</button>
      <button class="btn-sm" data-act="scan-check" data-vid="${v.id}" title="Проверить на запрещёнку в Сканере">🔍 Проверить</button>
      <button class="btn-sm" data-act="mark-posted" data-vid="${v.id}" title="Отметить как размещено">✓ Размещено</button>
    </div>
  </div>`;
}

let _convTouchX = null;

function bindConveyorSwipe() {
  const wrap = document.getElementById('conv-wrap');
  if (!wrap) return;
  wrap.addEventListener('touchstart', e => { _convTouchX = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => {
    if (_convTouchX === null) return;
    const dx = e.changedTouches[0].clientX - _convTouchX;
    _convTouchX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && state.conveyorIdx < state.results.length - 1) { state.conveyorIdx++; refreshResults(); }
    if (dx > 0 && state.conveyorIdx > 0)                        { state.conveyorIdx--; refreshResults(); }
  }, { passive: true });
}

// UX-11: на мобиле (≤780px форма и результаты в одну колонку) результаты уходят вниз
// под длинную форму — подскроллим к ним при старте генерации, чтобы продавец сразу видел
// спиннер/варианты и не решил, что кнопка не сработала.
function scrollToResults() {
  if (window.innerWidth > 780) return;
  const el = document.getElementById('results-box');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function refreshResults() {
  const el = document.getElementById('results-box');
  if (!el) return;

  if (state.batchResults.length) { refreshBatchResults(); return; }

  if (state.loading) {
    const chunkInfo = state.batchChunkProgress ? ` (чанк ${state.batchChunkProgress.done}/${state.batchChunkProgress.total})` : '';
    const loadingText = state.loadingKind === 'titles' ? 'Подбираю заголовки…'
      : state.loadingKind === 'descriptions' ? 'Пишу описания для выбранных названий…'
      : (state.batchMode && state.batchRegions.length ? `Генерирую пакет для ${state.batchRegions.length} регионов…${chunkInfo}` : 'Генерирую варианты…');
    el.innerHTML = `<div class="loading-box">
      <div class="spinner"></div>
      <div>${loadingText}</div>
      <div style="font-size:12px;color:var(--muted)">Обычно 5–15 секунд</div>
    </div>`;
    return;
  }
  if (state.error) {
    el.innerHTML = `<div class="err-box"><b>Ошибка:</b> ${esc(state.error)}</div>`;
    return;
  }
  if (state.titleStep) {
    el.innerHTML = titleStepHTML();
    return;
  }
  if (!state.results.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="ico">✨</div>
      <div>Заполните форму и сгенерируйте объявление</div>
    </div>`;
    return;
  }

  const toggleBtn = `<button class="conv-mode-toggle ${state.conveyorMode?'active':''}" data-act="toggle-conveyor">
    ${state.conveyorMode ? '☰ Список' : '▶ Конвейер'}
  </button>${(state.results.length || state.favorites.length) ? `<button class="conv-mode-toggle" data-act="export-pkg" style="margin-right:6px" title="Скачать варианты + избранное как .txt">📦 Экспорт</button>` : ''}
  <button class="conv-mode-toggle" data-act="gen-more" ${state.extraLoading?'disabled':''} title="Догенерировать ещё варианты, не заменяя текущие">${state.extraLoading?'⏳':'➕'} Ещё варианты</button>`;

  // F16: подпись «какой товар · когда» над вариантами — вернулся через неделю (персона 2),
  // форма уже переключена, а тут варианты старого товара; данные берём из штампа/снимка, не из живой формы.
  const _rp = state.results[0];
  const _prodName = _rp?._product || (state.resultsForm ? currentProductName(state.resultsForm) : '');
  const _genDate  = _rp?.id ? new Date(_rp.id).toLocaleDateString('ru') : '';
  const productBadge = _prodName
    ? `<div class="results-product-badge">📦 ${esc(_prodName)}${_genDate ? ` · ${_genDate}` : ''}</div>` : '';

  // UX-15: «Ещё варианты» — отдельный блок под основным набором, не смешивается со списком/конвейером
  const extraSection = (state.extraResults.length || state.extraLoading) ? `
    <div class="extra-results-sep">
      <div class="card-title" style="font-size:13px">➕ Ещё варианты${state.extraResults.length ? ` (${state.extraResults.length})` : ''}</div>
      ${state.extraLoading ? `<div class="loading-box" style="padding:14px 0"><div class="spinner"></div><div style="font-size:12px;color:var(--muted)">Генерирую ещё варианты…</div></div>` : ''}
      <div class="results-list" style="margin-top:10px;">${state.extraResults.map(v => vcardHTML(v, false)).join('')}</div>
    </div>` : '';

  if (state.conveyorMode) {
    el.innerHTML = toggleBtn + productBadge + conveyorHTML() + extraSection;
    bindConveyorSwipe();
  } else {
    el.innerHTML = toggleBtn + productBadge + `<div class="results-list" style="margin-top:10px;">${state.results.map(v => vcardHTML(v, false)).join('')}</div>` + extraSection;
  }
}

function refreshFavs() {
  const el  = document.getElementById('fav-box');
  const cnt = document.getElementById('fav-cnt');
  if (!el) return;
  if (cnt) cnt.textContent = state.favorites.length;
  if (!state.favorites.length) {
    el.innerHTML = '<div class="fav-empty">Нет сохранённых вариантов</div>';
    return;
  }
  el.innerHTML = `<div class="results-list">${state.favorites.map(v => vcardHTML(v, true)).join('')}</div>`;
}

function refreshBatchResults() {
  const el = document.getElementById('results-box');
  if (!el) return;
  const rows = state.batchResults;
  if (!rows.length) return;

  const tableRows = rows.map((item, i) => {
    const len = item.variant?.title ? [...item.variant.title].length : 0;
    const tAttr = (item.variant?.title || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    const dAttr = (item.variant?.description || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
    const expanded = state.batchExpanded === i;
    return `<div class="batch-row ${expanded?'expanded':''}" data-batch-i="${i}">
      <div class="batch-row-head" data-act="batch-expand" data-i="${i}">
        <span class="batch-region-badge">📍 ${esc(item.region)}</span>
        ${scanBadgeHTML(item.variant)}

        ${tlenHTML(len, 'batch-tlen')}
        <div class="batch-row-btns">
          <button class="btn-copy" data-act="copy" data-text="${tAttr}" data-j="title" data-jbi="${i}" title="Копировать название">📋 Назв</button>
          <button class="btn-copy" data-act="copy" data-text="${dAttr}" data-j="desc" data-jbi="${i}" title="Копировать описание">📋 Опис</button>
          <button class="btn-copy" data-act="conv-photo" title="Обложки">🖼️</button>
          <button class="btn-copy" data-act="scan-check" data-i="${i}" title="Проверить в Сканере">🔍</button>
          <button class="btn-copy" data-act="batch-fav" data-i="${i}" title="Сохранить в избранное (для few-shot)">☆</button>
          <button class="btn-copy" data-act="batch-mark-posted" data-i="${i}" title="Отметить как размещено (${esc(item.region)})">✓</button>
        </div>
      </div>
      <div class="batch-row-body">
        <div class="batch-desc-box">${esc(item.variant?.description || '')}</div>
        <div class="batch-copy-row">
          <button class="btn-copy" data-act="copy" data-text="${tAttr}" data-j="title" data-jbi="${i}">📋 Копировать название</button>
          <button class="btn-copy" data-act="copy" data-text="${dAttr}" data-j="desc" data-jbi="${i}">📋 Копировать описание</button>
          <button class="btn-copy" data-act="conv-photo">🖼️ Обложки</button>
          <button class="btn-copy" data-act="scan-check" data-i="${i}">🔍 Проверить</button>
          <button class="btn-copy" data-act="batch-fav" data-i="${i}">☆ В избранное</button>
          <button class="btn-copy" data-act="batch-mark-posted" data-i="${i}">✓ Размещено (${esc(item.region)})</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const toggleBtn = `<button class="conv-mode-toggle" data-act="batch-clear" style="float:right">✕ Очистить</button>`;
  el.innerHTML = `${toggleBtn}<div class="batch-header"><span>📦 Пакет: ${rows.length} объявлений</span></div><div class="batch-table">${tableRows}</div>
  <button class="btn-copy" data-act="queue-add-batch" style="margin-top:10px;width:100%;justify-content:center;padding:8px;">🚀 Добавить весь пакет в очередь</button>`;
}

async function doStartSession() {
  const q = state.postQueue;
  if (!q.length) return;

  const autoItems = q.filter(item => item.source === 'auto');
  const autoVariants = {}; // сгенерированный вариант для каждой авто-позиции по её id

  if (autoItems.length) {
    state.loading = true;
    // Create overlay immediately so spinner shows during AI call (renderSession creates it later)
    let el = document.getElementById('session-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'session-overlay';
      document.body.appendChild(el);
    }
    const setProg = n => { el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--muted)"><div class="spinner"></div><div>Генерирую объявления… ${n}/${autoItems.length}</div></div>`; };
    setProg(0);

    try {
      // Каждая авто-позиция генерируется из СВОЕЙ формы-снимка (UX-1).
      // Старые позиции без снимка — из текущей формы (обратная совместимость).
      for (let i = 0; i < autoItems.length; i++) {
        const it = autoItems[i];
        const form = it.form || state.form;
        const webSearch = form.isPreorder && form.category === 'game';
        const text = await callAI([{ role: 'user', content: buildMsg(1, [], form) }], { webSearch });
        autoVariants[it.id] = parseVariants(text)[0] || null;
        setProg(i + 1);
      }
    } catch(e) {
      toast('Ошибка генерации: ' + e.message);
      state.loading = false;
      document.getElementById('session-overlay')?.remove();
      return;
    }
    state.loading = false;
  }

  const items = q.map(item => {
    if (item.source === 'fav') {
      // UX-6: искать по стабильному _fid, не по индексу (индекс ломался при изменении избранного)
      const fav = state.favorites.find(f => f._fid === item.favId);
      return { ...item, variant: item.variant || fav || null };
    } else {
      return { ...item, variant: item.variant || autoVariants[item.id] || null };
    }
  });

  state.postSession = { active: true, idx: 0, items };
  renderSession();
}

function renderSession() {
  let overlay = document.getElementById('session-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'session-overlay';
    document.body.appendChild(overlay);
  }

  const s = state.postSession;
  if (!s.active) { overlay.remove(); return; }

  if (s.idx >= s.items.length) {
    overlay.innerHTML = `<div class="session-done-screen">
      <div class="session-done-ico">🎉</div>
      <div style="font-size:20px;font-weight:600;color:var(--text)">Сессия завершена!</div>
      <div style="color:var(--muted);font-size:14px;">Размещено ${s.items.length} объявлений</div>
      <button class="btn-gen" data-act="session-close" style="margin-top:10px;padding:12px 32px;">Готово</button>
    </div>`;
    return;
  }

  const item = s.items[s.idx];
  const v = item.variant;
  const pct = Math.round((s.idx / s.items.length) * 100);
  const tAttr = (v?.title||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const dAttr = (v?.description||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');

  overlay.innerHTML = `
    <div class="session-header">
      <div class="session-progress-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:13px;color:var(--text2);">Сессия постинга</span>
          <span class="session-counter">${s.idx+1} / ${s.items.length}</span>
        </div>
        <div class="session-progress-bar"><div class="session-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="btn-sm" data-act="session-close" style="flex-shrink:0;">✕ Завершить</button>
    </div>
    <div class="session-body">
      <div>
        <div class="session-label">Регион</div>
        <span class="session-region-badge">📍 ${esc(item.region)}</span>
        <div class="session-product">${esc(item.product)}</div>
      </div>
      ${v ? `
      <div>
        <div class="session-label">Название ${tlenHTML(v.title ? [...v.title].length : 0, '', 'margin-left:6px;')}</div>
        <div class="session-title-val">${esc(v.title||'')}</div>
        <button class="conv-btn conv-btn-title" data-act="conv-copy-title" data-text="${tAttr}" data-j="title" data-jsess="1" style="margin-top:6px;">📋 Копировать название</button>
      </div>
      <div>
        <div class="session-label">Описание</div>
        <div class="session-desc-val">${esc(v.description||'')}</div>
        <button class="conv-btn conv-btn-desc" data-act="conv-copy-desc" data-text="${dAttr}" data-j="desc" data-jsess="1" style="margin-top:8px;">📋 Копировать описание</button>
      </div>` : `<div style="color:var(--muted);font-size:13px;">⚠️ Нет варианта для этой позиции</div>`}
      <div class="session-actions">
        <button class="session-btn-done" data-act="session-done">✓ Готово — следующий</button>
        <button class="session-btn-skip" data-act="session-skip">⏩ Пропустить</button>
      </div>
    </div>`;
}

async function cvFetchFromIGDB() {
  const ta = document.getElementById('cv-igdb-names');
  if (!ta) return;
  const allNames = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!allNames.length) return;
  cv.igdbNames = ta.value;

  const prog = document.getElementById('cv-igdb-prog');
  // F18: коллаж — не больше 10 фото (как в ручной загрузке cvAddFiles); лишние имена не молчим
  const room = Math.max(0, 10 - cv.images.length);
  if (room === 0) { if (prog) prog.textContent = '⚠ Уже 10 обложек — удалите лишние, чтобы добавить'; return; }
  const names = allNames.slice(0, room);
  const skipped = allNames.slice(room);

  const btn  = document.getElementById('cv-igdb-btn');
  if (btn) btn.disabled = true;

  let loaded = 0;
  const failed = [];

  for (const name of names) {
    if (prog) prog.textContent = `⏳ ${loaded}/${names.length} — ищем «${name}»...`;
    try {
      const resp = await fetch(`https://api.poigraem.shop/igdb/cover?name=${encodeURIComponent(name)}&type=game`);
      const data = await resp.json();
      if (!data.cover) { failed.push(name); continue; }
      const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.cover.replace(/\/t_[a-z0-9_]+\//, '/t_1080p/'));
      await new Promise(resolve => {
        const el = new Image();
        el.crossOrigin = 'anonymous';
        el.onload  = () => { cv.images.push({ id: ++_cvId, url: el.src, el, transform:{scale:1,ox:0,oy:0} }); loaded++; resolve(); };
        el.onerror = () => { failed.push(name); resolve(); };
        el.src = url;
      });
    } catch(e) { failed.push(name); }
  }

  if (prog) prog.textContent = `✓ Загружено: ${loaded}/${names.length}` +
    (failed.length ? ` · Не найдено: ${failed.join(', ')}` : '') +
    (skipped.length ? ` · Пропущено (лимит 10): ${skipped.join(', ')}` : '');
  if (btn) btn.disabled = false;
  jlog('cv_images', null, { source: 'igdb', added: loaded, failed: failed.length, names });
  cvRenderState();
}

// ── Canvas ──

function cvRR(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// Вычисляет прямоугольник-источник (cover-fit + zoom/pan из transform) — общий для cvFit и cvDrawCirc4
function cvFitSrcRect(img, w, h, t) {
  const ir = img.naturalWidth / img.naturalHeight, cr = w / h;
  let sx, sy, sw, sh;
  if (ir > cr) { sh=img.naturalHeight; sw=sh*cr; sx=(img.naturalWidth-sw)/2; sy=0; }
  else         { sw=img.naturalWidth;  sh=sw/cr; sx=0; sy=(img.naturalHeight-sh)/2; }
  if (t) {
    const s = Math.max(1, Math.min(4, t.scale || 1));
    const nsw = sw/s, nsh = sh/s;
    const maxOx = (sw-nsw)/2, maxOy = (sh-nsh)/2;
    const ox = Math.max(-maxOx, Math.min(maxOx, (t.ox||0)*sw));
    const oy = Math.max(-maxOy, Math.min(maxOy, (t.oy||0)*sh));
    sx += (sw-nsw)/2 + ox; sy += (sh-nsh)/2 + oy;
    sw = nsw; sh = nsh;
  }
  return { sx, sy, sw, sh };
}

function cvFit(ctx, img, x, y, w, h, r, t) {
  const { sx, sy, sw, sh } = cvFitSrcRect(img, w, h, t);
  ctx.save();
  if (r > 0) { cvRR(ctx,x,y,w,h,r); ctx.clip(); }
  ctx.drawImage(img, sx,sy,sw,sh, x,y,w,h);
  ctx.restore();
}

const COLLAGE_LAYOUTS = {
  'single':  { name:'1 фото',    n:1, cells:(cw,ch,p)=>[{x:p,y:p,w:cw-2*p,h:ch-2*p}] },
  '1x2':     { name:'1+1',       n:2, cells:(cw,ch,p)=>{ const iw=(cw-3*p)/2; return [{x:p,y:p,w:iw,h:ch-2*p},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:ch-2*p}]; } },
  '2+1':     { name:'2+1',       n:3, cells:(cw,ch,p)=>{ const th=(ch-3*p)*.56,bh=ch-3*p-th,iw=(cw-3*p)/2; return [{x:p,y:p,w:iw,h:th},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:th},{x:p,y:2*p+th,w:cw-2*p,h:bh}]; } },
  '2x2':     { name:'2×2',       n:4, cells:(cw,ch,p)=>{ const iw=(cw-3*p)/2,ih=(ch-3*p)/2; return [{x:p,y:p,w:iw,h:ih},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:ih},{x:p,y:2*p+ih,w:iw,h:ch-2*p-ih-p},{x:2*p+iw,y:2*p+ih,w:cw-2*p-iw-p,h:ch-2*p-ih-p}]; } },
  '3+1':     { name:'3+1',       n:4, cells:(cw,ch,p)=>{ const th=(ch-3*p)*.62,bh=ch-3*p-th,tw=(cw-4*p)/3; return [{x:p,y:p,w:tw,h:th},{x:2*p+tw,y:p,w:tw,h:th},{x:3*p+2*tw,y:p,w:cw-2*p-2*(tw+p),h:th},{x:p,y:2*p+th,w:cw-2*p,h:bh}]; } },

  { sep: null,              ids: ['auto', 'strip'] },

  { sep: '5 изображений',   ids: ['2+3','3+2','1+4','4+1','1+4h','3v+2v','2v+3v','c4','2c2','circ4','circ4d','square5','frame5','arch5'] },
  { sep: '6 изображений',   ids: ['3x2','2x3','2+4','4+2','2v+4v','4v+2v','pyr6','rpyr6','corner6','panel6'] },
  { sep: '7 изображений',   ids: ['3+4','4+3','2+3+2'] },

  { sep: 'Спецраскладки',    ids: ['diag','stack'] },
