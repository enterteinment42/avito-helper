    :root {
      --bg:       #1a1a2e;
      --card:     #16213e;
      --card2:    #1e293b;
      --card3:    #0f172a;
      --accent:   #B45309;
      --accent-h: #d97706;
      --accent-d: rgba(180,83,9,.15);
      --teal:     #0F766E;
      --teal-h:   #0d9488;
      --teal-d:   rgba(15,118,110,.15);
      --text:     #e2e8f0;
      --text2:    #cbd5e1;
      --muted:    #64748b;
      --border:   #1e293b;
      --border2:  #334155;
      --ok:       #10b981;
      --warn:     #f59e0b;
      --err:      #ef4444;
      --r:  12px;
      --rs: 8px;
      --ft: 'Literata', Georgia, serif;
      --fm: 'JetBrains Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ft);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 1140px; margin: 0 auto;
      display: flex; align-items: center; gap: 16px; height: 54px;
    }
    .logo {
      font-family: var(--fm); font-size: 13px; font-weight: 500;
      color: var(--accent-h); white-space: nowrap; letter-spacing: -.3px;
    }
    .logo span { color: var(--muted); }

    nav { display: flex; gap: 2px; flex: 1; }
    .tab-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: var(--ft); font-size: 14px;
      padding: 6px 14px; border-radius: var(--rs);
      transition: all .15s; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: var(--card2); }
    .tab-btn.active { color: var(--accent-h); background: var(--accent-d); font-weight: 600; }
    .tab-btn.dimmed { opacity: .45; cursor: default; }

    .ai-btn {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; padding: 4px 10px; border-radius: var(--rs);
      font-family: var(--fm); font-size: 12px; transition: all .15s; white-space: nowrap;
    }
    .ai-btn:hover { color: var(--text); border-color: var(--accent); }
    .ai-btn.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }

    main {
      flex: 1; max-width: 1140px; margin: 0 auto;
      width: 100%; padding: 20px;
    }

    /* ── Settings Panel ── */
    .settings-panel {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 16px 20px; margin-bottom: 18px;
      display: none;
    }
    .settings-panel.open { display: block; }
    /* UX-14: та же панель провайдера/модели, но всегда открыта прямо в форме генератора */
    .ai-inline-panel {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px;
    }
    .settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    /* UX-15: «Ещё варианты» — визуально отделённый блок под основным набором */
    .extra-results-sep { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--border2); }
    .s-group { display: flex; flex-direction: column; gap: 5px; }
    .s-note { font-size: 12px; color: var(--muted); max-width: 280px; padding-top: 18px; }

    /* ── Forms ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .3px; }
    input, select, textarea {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text);
      font-family: var(--ft); font-size: 14px;
      padding: 8px 12px; outline: none; transition: border-color .15s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 76px; font-family: var(--fm); font-size: 13px; }

    .check-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 5px; cursor: pointer;
      font-size: 13px; color: var(--text2);
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; padding: 3px 11px;
      transition: all .15s; user-select: none;
    }
    .chip:hover { border-color: var(--teal); }
    .chip input[type="checkbox"] { display: none; }
    .chip.on { border-color: var(--teal); background: var(--teal-d); color: var(--text); }

    .dur-rows { display: flex; flex-direction: column; gap: 7px; }
    .dur-row { display: flex; align-items: center; gap: 7px; }
    .dur-row select { width: 140px; flex-shrink: 0; }
    .dur-row input  { width: 110px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; width: 28px; height: 28px; border-radius: var(--rs);
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .btn-icon:hover { color: var(--err); border-color: var(--err); }
    .btn-add {
      background: none; border: 1px dashed var(--border2); color: var(--muted);
      cursor: pointer; padding: 5px 11px; border-radius: var(--rs);
      font-size: 12px; transition: all .15s; width: fit-content; margin-top: 4px;
    }
    .btn-add:hover { border-color: var(--teal); color: var(--teal); }

    /* Style pills & count */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; color: var(--muted); cursor: pointer;
      font-size: 13px; padding: 3px 12px; transition: all .15s; user-select: none;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .count-btns { display: flex; gap: 4px; }
    .cnt-btn {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-family: var(--fm); font-size: 14px;
      padding: 4px 14px; transition: all .15s;
    }
    .cnt-btn:hover { border-color: var(--accent); color: var(--text); }
    .cnt-btn.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .btn-gen {
      background: var(--accent); border: none; border-radius: var(--rs);
      color: #fff; cursor: pointer; font-family: var(--ft);
      font-size: 15px; font-weight: 600; padding: 11px 24px;
      width: 100%; transition: all .15s; margin-top: 2px;
    }
    .btn-gen:hover { background: var(--accent-h); transform: translateY(-1px); }
    .btn-gen:active { transform: none; }
    .btn-gen:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .btn-gen-secondary {
      background: transparent; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-family: var(--ft);
      font-size: 12.5px; padding: 7px 14px; width: 100%; margin-top: 6px; transition: all .15s;
    }
    .btn-gen-secondary:hover { border-color: var(--accent); color: var(--text); }
    .btn-gen-secondary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Title-first step (шаг 1 из 2) ── */
    .title-step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .title-step-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card3); border: 1px solid var(--border2); border-radius: var(--rs);
      padding: 10px 12px; cursor: pointer; transition: all .15s;
    }
    .title-step-item:hover { border-color: var(--accent); }
    .title-step-item.on { border-color: var(--accent); background: var(--accent-d); }
    .title-step-text { flex: 1; font-size: 14px; }

    /* ── Generator layout ── */
    .gen-wrap {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px; align-items: start;
    }
    @media (max-width: 780px) { .gen-wrap { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 18px;
    }
    .card + .card { margin-top: 16px; }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text2);
      margin-bottom: 14px; letter-spacing: .3px;
    }
    .form-body { display: flex; flex-direction: column; gap: 13px; }

    /* ── Results ── */
    .results-list { display: flex; flex-direction: column; gap: 14px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px;
      color: var(--muted); gap: 8px; font-size: 14px;
    }
    .empty-state .ico { font-size: 36px; opacity: .3; }

    .loading-box {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px; gap: 12px;
      color: var(--muted); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-box {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
      border-radius: var(--rs); color: var(--err); font-size: 13px; padding: 12px 15px;
    }

    /* ── Variant card ── */
    .vcard {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; transition: border-color .15s;
    }
    .vcard:hover { border-color: var(--border2); }
    .vcard.is-fav { border-color: rgba(180,83,9,.4); }

    .vcard-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .vnum {
      font-family: var(--fm); font-size: 10px; color: var(--muted);
      background: var(--card3); padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    }
    .scan-badge { font-size: 12px; cursor: help; flex-shrink: 0; }
    .results-product-badge {
      display: inline-block; margin: 8px 0 2px; padding: 4px 11px; border-radius: 8px;
      background: var(--card3); border: 1px solid var(--border2);
      font-size: 12px; color: var(--text2); font-weight: 600; letter-spacing: .2px;
    }
    .vtags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .vtag {
      font-size: 10px; padding: 1px 6px; border-radius: 3px;
      background: var(--card3); color: var(--muted); border: 1px solid var(--border2);
    }
    .vcard-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .btn-sm {
      background: none; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-size: 11px;
      padding: 3px 8px; transition: all .15s; white-space: nowrap;
    }
    .btn-sm:hover { color: var(--text); }
    .btn-sm.fav-on { border-color: var(--accent); color: var(--accent-h); }
    .btn-sm:disabled { opacity: .5; cursor: not-allowed; }

    /* Title */
    .title-row { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 4px; }
    .title-val {
      font-family: var(--fm); font-size: 14px; font-weight: 500;
      color: var(--text); flex: 1; line-height: 1.4; word-break: break-word;
    }
    .tlen {
      font-family: var(--fm); font-size: 10px; padding: 2px 6px;
      border-radius: 3px; flex-shrink: 0; margin-top: 2px;
    }
    .tlen.ok   { background: rgba(16,185,129,.12); color: var(--ok); }
    .tlen.warn { background: rgba(245,158,11,.12);  color: var(--warn); }
    .tlen.over { background: rgba(239,68,68,.12);   color: var(--err); }

    hr.div { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    .desc-label {
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
    }
    .desc-val {
      font-size: 13px; color: var(--text2);
      white-space: pre-wrap; word-break: break-word; line-height: 1.7;
    }

    .copy-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .btn-copy {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 4px 10px; transition: all .18s;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-copy:hover { border-color: var(--teal); color: var(--teal); }
    .btn-copy.copied {
      border-color: var(--ok); color: var(--ok); background: rgba(16,185,129,.1);
    }

    /* Favorites */
    .sec-title {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .7px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
    }
    .sec-badge {
      background: var(--accent-d); color: var(--accent-h);
      border-radius: 10px; font-size: 10px; padding: 1px 7px;
    }
    .fav-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

    /* Conveyor mode */
    .conv-mode-toggle {
      float: right; background: none; border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 3px 9px; transition: all .15s;
    }
    .conv-mode-toggle:hover { color: var(--text); border-color: var(--accent); }
    .conv-mode-toggle.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }
    .conv-wrap { display: flex; flex-direction: column; gap: 14px; }
    .conv-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .conv-nav-btn {
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text2); cursor: pointer;
      font-size: 20px; line-height: 1; padding: 8px 20px; transition: all .15s; flex-shrink: 0;
    }
    .conv-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-h); }
    .conv-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
    .conv-counter { font-family: var(--fm); font-size: 13px; color: var(--muted); text-align: center; }
    .conv-title {
      font-family: var(--fm); font-size: 17px; font-weight: 600;
      color: var(--text); line-height: 1.4; word-break: break-word;
    }
    .conv-tlen-row { display: flex; justify-content: flex-end; margin-top: 5px; }
    .conv-desc {
      font-size: 13px; color: var(--text2); white-space: pre-wrap;
      word-break: break-word; line-height: 1.7; max-height: 260px; overflow-y: auto;
      background: var(--card3); border-radius: var(--rs); padding: 12px;
    }
    .conv-btn {
      width: 100%; padding: 13px; border-radius: var(--rs); cursor: pointer;
      font-family: var(--ft); font-size: 15px; font-weight: 600; border: none;
      transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .conv-btn-title { background: var(--teal); color: #fff; }
    .conv-btn-title:hover { background: var(--teal-h); }
    .conv-btn-title.copied { background: var(--ok); }
    .conv-btn-desc { background: var(--accent); color: #fff; }
    .conv-btn-desc:hover { background: var(--accent-h); }
    .conv-btn-desc.copied { background: var(--ok); }
    .conv-btn-photo {
      background: var(--card2); border: 1px solid var(--border2); color: var(--text2);
      flex: 0 0 auto; width: auto; padding: 13px 18px;
    }
    .conv-btn-photo:hover { border-color: var(--border2); color: var(--text); }
    .conv-actions-row { display: flex; gap: 8px; }
    .conv-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Batch mode */
    .preset-bar { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .preset-bar select { flex: 1; min-width: 0; }
    .btn-preset-save { padding: 7px 13px; font-size: 12px; background: var(--card3); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text2); cursor: pointer; white-space: nowrap; }
    .btn-preset-save:hover { border-color: var(--accent); color: var(--accent-h); }
    .preset-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r); background: var(--card2); border: 1px solid var(--border); }
    .preset-item-name { flex: 1; font-size: 13px; color: var(--text); }
    .preset-item-meta { font-size: 11px; color: var(--muted); }
    /* ── Редактор категорий (конструктор, направление 1) ── */
    .cat-ed-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cat-ed-bar select { width: auto; min-width: 190px; }
    .cat-ed-note { font-size: 11.5px; color: var(--muted); background: var(--card2); border: 1px dashed var(--border2); border-radius: var(--r); padding: 7px 10px; }
    .cat-ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cat-ed-fields-title { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 4px; }
    .cat-ed-fields { display: flex; flex-direction: column; gap: 7px; }
    .cat-ed-soon { font-size: 10.5px; color: var(--teal-h); font-weight: 400; margin-left: 5px; }
    .cat-fld { background: var(--card2); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
    .cat-fld.off { opacity: .55; }
    .cat-fld-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .cat-fld-num { font-size: 11px; color: var(--muted); min-width: 14px; }
    .cat-fld-type { font-size: 11.5px; color: var(--teal-h); background: var(--card3); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
    .cat-fld-type-sel { width: auto; font-size: 12px; padding: 4px 7px; }
    .cat-fld-label { flex: 1; min-width: 130px; font-size: 13px; }
    .cat-fld-key { font-family: var(--mono, monospace); font-size: 10.5px; color: var(--muted); }
    .cat-fld-body { display: flex; flex-direction: column; gap: 7px; padding-left: 21px; }
    .cat-fld-sub { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text2); }
    .cat-fld-note { font-size: 11.5px; color: var(--muted); }
    .cat-fld-flags { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .cat-rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 5px 14px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r); padding: 9px 11px; }
    .cat-fld-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; }
    .cat-fld-chk input { accent-color: var(--teal); width: 14px; height: 14px; }
    .cat-fld-chk input:disabled { cursor: not-allowed; }
    .cat-fld-p { max-width: 230px; font-size: 12px; }
    .cat-dirty { box-shadow: 0 0 0 2px var(--accent); }
    @media (max-width: 720px) { .cat-ed-grid { grid-template-columns: 1fr; } .cat-fld-body { padding-left: 0; } }
    /* ── Vision: распознавание товара по фото (направление 2а, план сближения с Айдентикой) ── */
    .vision-card { background: var(--card2); border: 1px solid var(--border2); border-radius: var(--r); padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
    .vision-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .vision-head b { font-size: 13.5px; color: var(--text); }
    .vision-hint { font-size: 11px; color: var(--muted); }
    /* Уточняющие чипы: модель не смогла различить версию по этому фото */
    .vision-ask { display: flex; flex-direction: column; gap: 8px; background: var(--card3); border: 1px solid var(--border2); border-radius: var(--r); padding: 9px 11px; }
    .vision-ask-head { font-size: 12px; color: var(--text2); font-weight: 600; }
    .vision-ask-row { display: flex; flex-direction: column; gap: 5px; }
    .vision-ask-label { font-size: 12px; color: var(--text2); }
    .vision-ask-opts { display: flex; flex-wrap: wrap; gap: 6px; }
    /* Список сцен: частые сверху, остальные — под раскрывающейся строкой с подзаголовками */
    .staged-more { margin-top: 2px; }
    .staged-more > summary { cursor: pointer; user-select: none; font-size: 12px; color: var(--teal-h); padding: 3px 0; list-style: none; }
    .staged-more > summary::-webkit-details-marker { display: none; }
    .staged-more > summary::before { content: '▾ '; }
    .staged-more[open] > summary::before { content: '▴ '; }
    .staged-group { font-size: 11px; color: var(--muted); letter-spacing: .3px; margin: 8px 0 4px; }
    .vision-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .vision-pick { display: flex; align-items: center; justify-content: center; width: 74px; height: 74px; flex: none; border-radius: var(--rs); border: 2px dashed var(--border2); background: var(--card3); color: var(--muted); font-size: 20px; cursor: pointer; overflow: hidden; transition: all .15s; }
    .vision-pick:hover { border-color: var(--teal); color: var(--teal); }
    .vision-pick.busy { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .vision-pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vision-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .vision-btn { padding: 6px 12px; font-size: 12px; border-radius: var(--rs); background: var(--card3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; font-family: var(--ft); white-space: nowrap; transition: all .15s; }
    .vision-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal-h); }
    .vision-btn:disabled { opacity: .45; cursor: not-allowed; }
    .vision-btn-main { background: var(--teal-d); border-color: var(--teal); color: var(--teal-h); }
    .vision-res { background: var(--card3); border: 1px solid var(--border); border-radius: var(--rs); padding: 9px 11px; display: flex; flex-direction: column; gap: 7px; }
    .vision-res-top { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .vision-conf { font-size: 10.5px; font-family: var(--fm); border-radius: 10px; padding: 1px 7px; border: 1px solid; }
    .vision-res-sub { font-size: 11.5px; color: var(--muted); }
    .vision-price-box { border-top: 1px dashed var(--border2); padding-top: 7px; font-size: 12.5px; color: var(--text2); display: flex; flex-direction: column; gap: 5px; }
    .vision-err { font-size: 12px; color: var(--err); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); border-radius: var(--rs); padding: 7px 10px; }
    /* «Товар в интерьере» (2б): картинка вертикальная (3:4), поэтому ограничиваем
       по высоте, а не по ширине — иначе на телефоне она занимает весь экран. */
    .staged-out { display: flex; flex-direction: column; gap: 6px; }
    .staged-out img { max-width: 100%; max-height: 380px; width: auto; border-radius: var(--rs); border: 1px solid var(--border2); display: block; }

    .batch-toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .batch-toggle-label { font-size: 13px; color: var(--text2); cursor: pointer; user-select: none; }
    .batch-regions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .batch-reg-chip {
      font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border2); background: var(--card2); color: var(--text2);
      transition: all .15s;
    }
    .batch-reg-chip.on { background: var(--teal-d); border-color: var(--teal); color: var(--teal-h); }
    .batch-reg-chip:hover:not(.on) { border-color: var(--border2); color: var(--text); }
    .batch-header {
      font-size: 12px; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .batch-table { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .batch-row {
      border-bottom: 1px solid var(--border); background: var(--card2);
    }
    .batch-row:last-child { border-bottom: none; }
    .batch-row-head {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
      transition: background .12s;
    }
    .batch-row-head:hover { background: var(--card3); }
    .batch-row.expanded .batch-row-head { background: var(--card3); }
    .batch-region-badge {
      font-family: var(--fm); font-size: 11px; color: var(--teal-h);
      background: var(--teal-d); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; min-width: 80px; text-align: center;
    }
    .batch-title-preview {
      font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .batch-tlen { font-family: var(--fm); font-size: 10px; flex-shrink: 0; }
    .batch-row-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .batch-row-body {
      display: none; padding: 0 12px 12px; flex-direction: column; gap: 8px;
    }
    .batch-row.expanded .batch-row-body { display: flex; }
    .batch-desc-box {
      font-size: 12px; color: var(--text2); white-space: pre-wrap; word-break: break-word;
      line-height: 1.65; max-height: 200px; overflow-y: auto;
      background: var(--card3); border-radius: var(--rs); padding: 10px;
    }
    .batch-copy-row { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Queue tab */
    .queue-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 700px; margin: 0 auto; }
    .queue-form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .queue-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media(max-width:560px) { .queue-form-grid { grid-template-columns: 1fr; } }
    .queue-source-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .queue-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .queue-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-item-num { font-family: var(--fm); font-size: 11px; color: var(--muted); min-width: 22px; }
    .queue-item-product { font-size: 13px; color: var(--text); flex: 1; }
    .queue-item-region { font-family: var(--fm); font-size: 11px; color: var(--teal-h); background: var(--teal-d); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
    .queue-item-source { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .queue-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 16px; text-align: center; }

    /* Session wizard */
    #session-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 500;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .session-header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .session-progress-wrap { flex: 1; }
    .session-progress-bar {
      height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; margin-top: 5px;
    }
    .session-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
    .session-counter { font-family: var(--fm); font-size: 12px; color: var(--muted); }
    .session-body { flex: 1; padding: 24px 20px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .session-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .session-region-badge { display: inline-block; font-family: var(--fm); font-size: 13px; color: var(--teal-h); background: var(--teal-d); padding: 3px 10px; border-radius: 6px; margin-bottom: 6px; }
    .session-product { font-size: 15px; color: var(--text2); }
    .session-title-val { font-family: var(--fm); font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.4; word-break: break-word; margin-bottom: 6px; }
    .session-desc-val { font-size: 13px; color: var(--text2); white-space: pre-wrap; word-break: break-word; line-height: 1.7; max-height: 240px; overflow-y: auto; background: var(--card3); border-radius: var(--rs); padding: 12px; }
    .session-actions { display: flex; flex-direction: column; gap: 8px; }
    .session-btn-done { background: var(--ok); color: #fff; border: none; border-radius: var(--rs); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .session-btn-done:hover { opacity: .88; }
    .session-btn-skip { background: var(--card2); border: 1px solid var(--border2); color: var(--text2); border-radius: var(--rs); padding: 11px; font-size: 14px; cursor: pointer; transition: all .15s; }
    .session-btn-skip:hover { color: var(--text); }
    .session-done-screen { text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .session-done-ico { font-size: 52px; }

    /* Coming soon */
    .soon {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 300px; gap: 10px; color: var(--muted);
    }
    .soon .ico { font-size: 44px; opacity: .25; }
    .soon h2 { font-size: 18px; color: var(--text2); }
    .soon p { font-size: 14px; max-width: 280px; text-align: center; }

    /* Toast */
    #toast {
      position: fixed; bottom: 22px; right: 22px;
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text);
      font-size: 13px; padding: 9px 15px;
      opacity: 0; transform: translateY(6px);
      transition: all .2s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Covers Module ── */
    .cv-wrap { display: grid; grid-template-columns: 310px 1fr; gap: 18px; max-width: 1140px; margin: 0 auto; padding: 24px 20px; align-items: start; }
    /* На ПК у каждой колонки своя прокрутка высотой в экран: иначе липкое превью выше экрана,
       и его низ открывался только после того, как длинное меню слева докрутится до конца */
    @media (min-width: 721px) {
      .cv-wrap { padding-top: 0; }
      .cv-controls, .cv-preview-wrap { position: sticky; top: 62px; max-height: calc(100vh - 87px); overflow-y: auto; }
      .cv-controls { padding-right: 4px; }
    }
    @media (max-width: 720px) {
      .cv-wrap { grid-template-columns: 1fr; }
      /* GFX-9: превью — первым, липнет сверху во время прокрутки настроек, а не прячется внизу */
      .cv-preview-wrap { order: -1; top: 8px; }
    }
    .cv-mode-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
    .tab-pill { flex: 1; padding: 8px 0; border-radius: var(--rs); background: var(--card2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; font-family: var(--ft); font-size: 13px; font-weight: 500; transition: all .15s; text-align: center; }
    .tab-pill.active { background: var(--accent-d); color: var(--accent-h); border-color: var(--accent); }
    .tab-pill:not(.active):hover { border-color: var(--teal); color: var(--teal-h); }
    .cv-controls { display: flex; flex-direction: column; gap: 12px; }
    .cv-drop { border: 2px dashed var(--border2); border-radius: var(--r); min-height: 96px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s; }
    .cv-drop:hover { border-color: var(--teal); }
    .cv-drop-hint { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; pointer-events: none; }
    .cv-drop-hint small { font-size: 11px; }
    .cv-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .cv-thumb { position: relative; width: 64px; height: 64px; border-radius: var(--rs); overflow: hidden; border: 1px solid var(--border2); }
    .cv-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cv-thumb-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.75); color: #fff; border: none; border-radius: 50%; width: 17px; height: 17px; cursor: pointer; font-size: 11px; line-height: 17px; text-align: center; padding: 0; }
    .cv-thumb-add { display: flex; align-items: center; justify-content: center; background: var(--card2); color: var(--muted); font-size: 20px; cursor: pointer; border: 2px dashed var(--border2); transition: all .15s; }
    .cv-thumb-add:hover { border-color: var(--teal); color: var(--teal); }

  { id: 'travel', label: '🎒 В дороге',    group: 'tech', p: 'рядом с раскрытой сумкой или рюкзаком на столе, как перед поездкой, дневной свет' },
  // Хобби и коллекции

  { id: 'display', label: '🗄 Витрина',    group: 'hobby', p: 'на застеклённой полке-витрине среди других предметов коллекции, подсветка полки' },
  { id: 'window', label: '🪟 Подоконник',  group: 'hobby', p: 'на широком подоконнике при дневном свете, за окном размытая городская улица' },
  { id: 'workbench', label: '🧰 Верстак',  group: 'hobby', p: 'на рабочем столе-верстаке среди инструментов, боковой свет рабочей лампы' },
  // Музыкальные инструменты
  { id: 'stand',  label: '🎸 На стойке',   group: 'music', p: 'на инструментальной стойке в жилой комнате, рядом угол дивана, дневной свет из окна' },
  { id: 'homestudio', label: '🎙 Домашняя студия', group: 'music', p: 'в домашней студии рядом с микрофоном на стойке и наушниками, приглушённый свет' },
  { id: 'rehearsal', label: '🪑 Репетиционная', group: 'music', p: 'в репетиционной комнате у стены с акустическими панелями, рядом усилитель и стул' },
  { id: 'case',   label: '💼 Кейс открыт', group: 'music', p: 'рядом с открытым кейсом или чехлом на полу комнаты, дневной свет' },
];

// Правила «снято живым человеком, а не нарисовано нейросетью». Это не украшение:

const REALISM_ROOM = [
  '',
  'СНИМОК ДОЛЖЕН ВЫГЛЯДЕТЬ КАК ОБЫЧНОЕ ФОТО, А НЕ КАК КАРТИНКА ИЗ НЕЙРОСЕТИ:',
  '- Съёмка на смартфон в реальной комнате: естественный свет из окна или обычная комнатная лампа, живые тени и отражения',
  '- Допустимы бытовые мелочи: лёгкая пыль, неидеальный порядок вокруг, случайные предметы на заднем плане, слегка неровный ракурс',
  '- Обычная глубина резкости телефонной камеры, естественное зерно, без вылизанной резкости по всему кадру',
  '- НЕ надо: глянцевый рекламный рендер, 3D-графика, CGI, иллюстрация, цифровой арт, HDR-обработка, идеально симметричная композиция, «пластиковые» блики, вылизанные градиенты, светящиеся ореолы вокруг предмета, неестественно насыщенные цвета, контурная студийная подсветка',
  '- Товар и фон в одном освещении и в одной перспективе: предмет не должен выглядеть вклеенным в сцену',
].join('\n');
const REALISM_CLEAN = [
  '',
  'ЭТО ЧЕСТНАЯ ПРЕДМЕТНАЯ СЪЁМКА, А НЕ КАРТИНКА ИЗ НЕЙРОСЕТИ:',
  '- Настоящая фотография предмета на фоне: обычный мягкий свет, одна естественная тень под товаром, реальная фактура поверхностей',
  '- Обычная детализация фотографии, естественное зерно, без вылизанной резкости по всему кадру',
  '- НЕ надо: 3D-рендер, CGI, иллюстрация, цифровой арт, HDR-обработка, «пластиковые» блики, светящиеся ореолы, контурная подсветка, неестественно насыщенные цвета, идеально ровные градиенты фона',
  '- Товар и фон в одном освещении: предмет не должен выглядеть вклеенным',
].join('\n');

// Сцены — данные: заводские правятся патчем-отличием, свои живут рядом. Тот же
// приём, что у категорий: «сбросить к заводской» = удалить патч, а новые
// заводские сцены доезжают до владельца, а не замирают его копией.
let SCENES = BUILTIN_SCENES.slice();

// Псевдо-id открытого черновика новой сцены: в наборе её ещё нет
const SCENE_NEW = '__new_scene__';

function applyScenePatch(base, patch) {
  if (!patch) return base;
  const out = { ...base };
  for (const k of ['label', 'p', 'group', 'clean', 'hidden']) {
    if (Object.prototype.hasOwnProperty.call(patch, k)) out[k] = patch[k];
  }
  return out;
}

function rebuildScenes() {
  const cfg = state.scenesCfg || { builtin: {}, custom: [] };
  const builtin = cfg.builtin || {};
  const custom = Array.isArray(cfg.custom) ? cfg.custom : [];
  // Своя сцена попадает в список сразу после «+ Своя сцена», ещё без текста:
  // иначе её не увидел бы собственный редактор. От пустого запроса «покажи
  // товар .» защищает не фильтр здесь, а stagedScenes() — список для выбора.
  SCENES = [
    ...BUILTIN_SCENES.map(s => applyScenePatch(s, builtin[s.id])),
    ...custom.filter(s => s && s.id),
  ].filter(s => !s.hidden);
  // Список не должен опустеть: скрыть все сцены не даёт обработчик, но набор
  // может приехать битым из файла или с сервера. Возвращаем заводские С УЧЁТОМ
  // правок — голый BUILTIN_SCENES отменил бы переименования владельца.
  if (!SCENES.length) SCENES = BUILTIN_SCENES.map(s => ({ ...applyScenePatch(s, builtin[s.id]), hidden: false }));
  // Выбранная сцена могла исчезнуть вместе с пересборкой — правим здесь, в одном
  // месте, а не в каждом вызывающем (их шесть, и два уже забывали это сделать).
  sceneEnsureValid();
  return SCENES;
}

// Сцена по id и сцена по умолчанию. Скрытая или удалённая сцена могла остаться
// выбранной в состоянии — тогда отдаём первую доступную, а не роняем карточку.
// Сцены, пригодные для генерации: недописанная своя сцена (текст ещё пустой)
// в карточку не идёт — она дала бы запрос «покажи товар .» и сожгла деньги.
function stagedScenes() {
  const ok = SCENES.filter(s => s.p && s.p.trim());
  return ok.length ? ok : BUILTIN_SCENES;
}
function sceneById(id) { return SCENES.find(s => s.id === id) || stagedScenes()[0]; }
function sceneFirstId() { return stagedScenes()[0].id; }

// Сцены, которые показываются наверху карточки: выбранная сейчас плюс те, чем
// пользовались в последний раз. Список ведётся сам — заранее решать, какие сцены

const SCENE_TOP_MAX = 6;
function sceneRecentSaved() {

}
function sceneRecent() {
  const list = stagedScenes();
  const cur = state.vision?.staged?.scene;
  const ids = [];
  for (const id of [cur, ...sceneRecentSaved()]) {
    if (id && !ids.includes(id) && list.some(s => s.id === id)) ids.push(id);
  }
  // До первого использования верх занимают первые сцены списка — пустая полка
  // выглядела бы поломкой. Ширина ряда постоянная, чтобы кнопки не прыгали.
  for (const s of list) { if (ids.length >= SCENE_TOP_MAX) break; if (!ids.includes(s.id)) ids.push(s.id); }
  return ids.slice(0, SCENE_TOP_MAX);
}
function sceneUsed(id) {
  if (!SCENES.some(s => s.id === id)) return;
  const next = [id, ...sceneRecentSaved().filter(x => x !== id)].slice(0, SCENE_TOP_MAX);
  try { localStorage.setItem('avito_scene_recent', JSON.stringify(next)); } catch(e) {}
}

// Выбранная сцена могла исчезнуть: её скрыли здесь, либо набор приехал с сервера
// или из бэкапа. Тогда ни один чип не подсвечен, а генерация молча ушла бы по
// первой сцене — и в журнале с именем файла осталась бы та, которой не было.
function sceneEnsureValid() {
  const st = state.vision?.staged;
  if (!st) return;
  if (!stagedScenes().some(s => s.id === st.scene)) st.scene = sceneFirstId();
}

const USER_FIELD_TYPES = [
  { id: 'text',   label: 'Строка' },

  { id: 'area',   label: 'Многострочное' },

  { id: 'toggle', label: 'Тумблер' },
];

// Список опций поля: у встроенных это функция (список живёт в коде и может
// меняться), у собранных в конструкторе — обычный массив из localStorage.
function fdOptions(fd) {
  const o = fd.options;
  if (typeof o === 'function') { try { return o() || []; } catch(e) { return []; } }
  return Array.isArray(o) ? o : [];
}

// Допустимо ли текущее значение select. Пустой список опций (поле ещё не
// заполнено в редакторе) ничего не ограничивает — тогда значение считаем годным.
function selectValueOk(fd, v) {
  const opts = fdOptions(fd);
  return !opts.length || opts.includes(String(v));
}

// CATS пересобирается из встроенных + пользовательских: категория — это данные,
// новая заводится в Настройках без правок кода. Потребители (селект формы,
// catDef, Сканер, эталоны) читают CATS как раньше и о слоях не знают.
let CATS = BUILTIN_CATS.slice();

// Категория по id. Неизвестная (например, удалённая пользовательская, оставшаяся
// в сохранённой форме) не должна ронять рендер — отдаём первую. Дескриптор без
// fields (битый импорт JSON) тоже не должен ронять: подставляем пустой список.
function catDef(id) {
  const c = CATS.find(x => x.id === id) || CATS[0] || {};
  return Array.isArray(c.fields) ? c : { ...c, fields: [] };
}

// Значение поля с безопасным дефолтом по типу: у пользовательской категории
// ключа может ещё не быть в сохранённой форме.
function fieldVal(f, fd) {
  const v = f[fd.key];
  if (fd.type === 'chips') return Array.isArray(v) ? v : [];
  if (fd.type === 'toggle') return !!v;
  return v == null ? '' : v;
}

// ── Конструктор категорий (этап 2) ────────────────────────────────
// Встроенные категории правятся ОВЕРЛЕЕМ (патчем), а не копией: заводской
// дескриптор остаётся источником правды, патч хранит только отличия — поэтому
// «сбросить к заводской» это просто удалить патч, а будущие правки заводских
// категорий в коде доезжают до Дениса, а не замораживаются его копией.

// Поле из data-вида (localStorage / импорт JSON) в дескриптор движка.
function fieldFromData(d) {
  const fd = { key: d.key, type: d.type, label: d.label || d.key };
  if (d.ph) fd.ph = d.ph;
  if (d.rows) fd.rows = d.rows;
  if (Array.isArray(d.options)) fd.options = d.options;
  if (d.hint) fd.hint = d.hint;
  if (d.isName) fd.isName = true;
  if (d.isPrice) fd.isPrice = true;
  // p — подпись в промпте. Пустая (снят флаг «в промпт») означает: поле в промпт
  // не идёт. Так живёт цена игры — по правилам площадки её нет в тексте объявления.
  if (d.p) { fd.p = d.p; if (d.pSuffix) fd.pSuffix = d.pSuffix; if (d.pEmpty) fd.pEmpty = d.pEmpty; }
  if (d.req) fd.req = d.reqText || (d.label || d.key).toLowerCase();
  return fd;
}

// Применение патча к встроенной категории. Без патча — возвращаем заводской
// объект как есть (ссылкой), чтобы поведение осталось байт-в-байт прежним.
function applyCatPatch(base, p) {
  if (!p || typeof p !== 'object') return base;
  const c = { ...base };
  // Сравнение с null, а не на truthy: пустая строка — это осознанная очистка поля
  // в редакторе, и она обязана применяться, а не молча откатываться к заводскому
  if (p.label != null) c.label = p.label;
  if (p.pName != null) c.pName = p.pName;

  const fp = p.fields || {};
  let fields = base.fields
    .filter(fd => !fp[fd.key]?.hidden)
    .map(fd => {
      const patch = fp[fd.key];
      if (!patch) return fd;
      const out = { ...fd };
      if (patch.label != null) out.label = patch.label;
      if (patch.ph != null) out.ph = patch.ph;
      if (patch.isPrice) out.isPrice = true;
      // Снять обязательность можно только у поля с простым req: за reqCheck
      // (сроки и цены, каталог игр) стоит логика, а не галочка.
      if (patch.req === false && out.req) delete out.req;
      if (patch.isName) out.isName = true;
      return out;
    });
  // Свои поля, дописанные к встроенной категории
  if (Array.isArray(p.add)) fields = fields.concat(p.add.map(fieldFromData));
  // Порядок: ключи из order идут первыми в заданном порядке, остальные — следом
  if (Array.isArray(p.order) && p.order.length) {
    const pos = k => { const i = p.order.indexOf(k); return i === -1 ? 1e6 : i; };
    fields = fields.slice().sort((a, b) => pos(a.key) - pos(b.key));
  }
  c.fields = fields;

  // Своё правило промпта дописывается ПОСЛЕ заводского (у игры это блок предзаказа)
  if (p.extraText) {
    const baseExtra = base.extra;
    c.extra = f => (baseExtra ? baseExtra(f) : '') + '\n' + p.extraText;
  }
  if (Array.isArray(p.scanRequire) && p.scanRequire.length) c.scanRequire = p.scanRequire;
  if (Array.isArray(p.scanForbid)  && p.scanForbid.length)  c.scanForbid  = p.scanForbid;
  // Патч правил — поверх заводского набора категории, а не вместо него:
  // иначе снятая одна галочка обнулила бы остальные заводские значения
  if (p.scanRules && Object.keys(p.scanRules).length) c.scanRules = { ...(base.scanRules || {}), ...p.scanRules };
  if (p.visionHint != null) c.visionHint = p.visionHint;
  return c;
}

// Пользовательская категория целиком из данных.
function catFromData(d) {
  const c = {
    id: d.id, label: d.label || d.id, pName: d.pName || d.label || d.id,
    fields: Array.isArray(d.fields) ? d.fields.map(fieldFromData) : [],
  };
  if (d.extraText) c.extra = () => '\n' + d.extraText;
  if (Array.isArray(d.scanRequire) && d.scanRequire.length) c.scanRequire = d.scanRequire;
  if (Array.isArray(d.scanForbid)  && d.scanForbid.length)  c.scanForbid  = d.scanForbid;
  if (d.scanRules && typeof d.scanRules === 'object') c.scanRules = d.scanRules;
  if (d.visionHint) c.visionHint = d.visionHint;
  return c;
}

// Пересобрать CATS из заводских + оверлея. Зовётся при старте и после каждой
// правки в редакторе категорий.
function rebuildCats() {
  const cfg = (typeof state !== 'undefined' && state.catsCfg) || {};
  const builtin = cfg.builtin || {};
  const custom  = Array.isArray(cfg.custom) ? cfg.custom : [];
  const seen = new Set(BUILTIN_CATS.map(c => c.id));
  CATS = BUILTIN_CATS.map(c => applyCatPatch(c, builtin[c.id]))
    .concat(custom
      // id пользовательской категории не должен затенять встроенную — иначе
      // catDef отдал бы её вместо заводской, а форма молча лишилась бы полей
      .filter(d => d && d.id && !seen.has(d.id) && (seen.add(d.id), true))
      .map(catFromData));
}

// АККАУНТЫ И РОТАЦИЯ (История)
// Объявление на Авито выдыхается: площадка опускает старое. Ротация — это не
// новая генерация, а прокрутка уже работающего текста; см. rotPrompt().
// ══════════════════════════════════════════

const DEF_ACCOUNTS = [{ id: 'a1', name: 'Основной' }];

// Список аккаунтов. Пустой или битый список в настройках не должен обезличивать
// записи: тогда отдаём заводской, иначе accName() вернул бы «удалён» для всех.
// Отсев ДО проверки длины: список из одних битых записей (импорт настроек,
// правка localStorage руками) иначе давал пустой массив, и accList()[0].id
// ронял и «✓ Размещено», и открытие панели ротации.
function accList() {
  const a = Array.isArray(state.settings?.accounts) ? state.settings.accounts : [];
  const ok = a.filter(x => x && x.id);
  return ok.length ? ok : DEF_ACCOUNTS;
}
function accFirstId() { return accList()[0].id; }
// Аккаунт записи. У записей до этой версии поля нет — считаем их первым
// аккаунтом (миграция проставит явно, но чтение не должно её дожидаться).
function accOf(r) { return (r && r.account) || accFirstId(); }
function accName(id) {
  const a = accList().find(x => x.id === id);
  return a ? a.name : (id ? 'удалён' : accList()[0].name);
}
// Существующий аккаунт или первый. Удалённый профиль мог остаться выбранным в
// черновике формы — тогда селект показывает «Основной», а запись ушла бы с
// меткой «удалён»: то есть форма обещала одно, а записала другое.
function accPick(id) {
  return id && accList().some(a => a.id === id) ? id : accFirstId();
}
// Аккаунт для новой записи из генератора. Спрашивать при каждом «✓ Размещено»
// значит рвать темп сессии постинга, поэтому берём последний выбранный в форме
// Истории (а изначально — первый): почти весь поток идёт с одного профиля.
function accActive() {
  return accPick(state.dbForm && state.dbForm.account);
}

// Дата публикации: обычно момент нажатия «✓ Размещено» (он же id записи), но
// её можно поправить — отметить размещение задним числом или наоборот.
function rotPostedAt(r) { return (r && Number(r.postedAt)) || (r && r.id) || 0; }
function rotDaysFor(r) {
  const own = r && Number(r.rotDays);
  if (own > 0) return own;
  const g = Number(state.settings?.rotDays);
  return g > 0 ? g : DEF_SETTINGS.rotDays;
}
const DAY_MS = 86400000;
function rotAgeDays(r, now = Date.now()) {
  const at = rotPostedAt(r);
  return at ? Math.floor((now - at) / DAY_MS) : 0;
}
// Ротация касается только живых объявлений: снятое и поставленное на паузу
// обновлять незачем, а запись с rotOff владелец отметил как «не трогать».
function rotWatched(r) { return !!r && r.status === 'active' && !r.rotOff; }
function rotDue(r, now = Date.now()) {
  return rotWatched(r) && rotAgeDays(r, now) >= rotDaysFor(r);
}
function rotDueList(now = Date.now()) { return (state.db || []).filter(r => rotDue(r, now)); }

// Текст, который реально висит на Авито: донесённый финал важнее бот-версии —
// крутить надо то, что опубликовано, иначе ротация вернёт правки владельца назад.
function rotLiveText(r) {
  return {
    title: (r && (r.finalTitle || r.title)) || '',
    desc:  (r && (r.finalDesc  || r.description)) || '',
  };
}

// Дата публикации в поле <input type="date"> и обратно. Час берём полуденный:
// полночь при отрицательном смещении пояса уезжает на сутки назад, и объявление
// «старело» бы на день быстрее, чем висит на самом деле.
function rotTsToInput(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function rotInputToTs(s) {
  if (!s) return 0;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if (!m) return 0;
  const d = new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
  return isNaN(d) ? 0 : d.getTime();
}

// Положить текст объявления в эталоны. Повторный вызов с тем же текстом ничего
// не делает: тот же текст двумя строками ушёл бы в промпт дважды и перевесил бы
// остальной корпус — та же ошибка, что была с бот-близнецом из избранного.
function addRefFromText(title, desc, source = 'mine', category = null) {
  const t = (title || '').trim(), d = (desc || '').trim();
  if (!t && !d) return false;
  // Категорию задаёт человек (в форме Истории есть селект). Молчаливый фолбэк на
  // текущую категорию генератора клал бы объявление второго аккаунта в чужой
  // раздел корпуса — тихий перекос few-shot в самом невосполнимом.
  const cat = category || 'other';
  const same = (state.refs || []).some(r =>
    (r.title || '').trim() === t && (r.desc || '').trim() === d);
  if (same) return false;
  state.refs.push({ id: Date.now(), source, category: cat, title: t, desc: d,
                    date: new Date().toLocaleDateString('ru') });
  jlog('reference_added', null, { source, category: cat, title: t, description: d, via: 'db' });
  return true;
}

  rotBusy:  new Set(),
