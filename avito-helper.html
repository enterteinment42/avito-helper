function bindCoversTab() {
  cvSave(); // GFX-10: mode/ratio/toggle/layout меняют cv и зовут render() → сюда — персистим настройки
  // UX-8: если сюда пришли по кнопке 🖼️ с названием игры — подставить и сразу искать
  if (cv._pendingSearchName !== null) {
    const name = cv._pendingSearchName;
    cv._pendingSearchName = null;
    const inp = document.getElementById('cv-igdb-game');
    if (inp && name) {
      inp.value = name;
      document.querySelector('[data-act="cv-igdb-game-fetch"]')?.click();
    }
  }

  const drop = document.getElementById('cv-drop');
  const fin  = document.getElementById('cv-file');
  if (!drop || !fin) return;

  drop.addEventListener('click', e => { if (!e.target.closest('.cv-thumb-del,.cv-thumb-add')) fin.click(); });
  drop.addEventListener('dragover',  e => { e.preventDefault(); drop.style.borderColor='var(--teal)'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor=''; });
  drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor=''; cvAddFiles(e.dataTransfer.files); });
  fin.addEventListener('change', e => { cvAddFiles(e.target.files); fin.value=''; });

  document.getElementById('cv-padding')?.addEventListener('input', e => {
    cv.padding = +e.target.value;
    const v = document.getElementById('cv-padding-val');
    if (v) v.textContent = cv.padding + 'px';
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  document.getElementById('cv-bg-custom')?.addEventListener('input', e => {
    cv.bg = e.target.value;
    document.querySelectorAll('[data-cv-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvBg === cv.bg));
    cvReDraw();
  });
  // Рамка одиночной картинки (режим Игра)
  [['cv-game-pad','gamePad'],['cv-game-corner','gameCorner'],['cv-game-border','gameBorder']].forEach(([id,key]) => {
    document.getElementById(id)?.addEventListener('input', e => {
      cv[key] = +e.target.value;
      const v = document.getElementById(id + '-val');
      if (v) v.textContent = e.target.value + 'px';
      cvReDraw();
    });
  });
  document.getElementById('cv-game-border-color')?.addEventListener('input', e => {
    cv.gameBorderColor = e.target.value; cvReDraw();
  });

  // Поля выбранного слоя (текст, цвет, плотность) — делегированием, один раз на документ:
  // карточка элементов перерисовывается при каждой смене выбора и своих слушателей не держит
  if (!window._cvLayerInputBound) {
    window._cvLayerInputBound = true;
    document.addEventListener('input', e => {
      const el = e.target.closest && e.target.closest('[data-cv-lp]');
      if (!el) return;
      const L = cvSelLayer();
      if (!L) return;
      const p = el.dataset.cvLp;
      L[p] = el.type === 'range' ? +el.value / (+el.dataset.cvDiv || 1) : el.value;
      cvReDraw();
      // подпись в списке следует за текстом, не пересоздавая поле ввода (фокус и курсор на месте)
      if (p === 'text') { const r = document.getElementById('cv-lrows'); if (r) r.innerHTML = cvLayerRowsHTML(); }
    });
    // Клавиши для выделенного слоя: Del — удалить, Esc — снять выделение, стрелки — сдвиг (Shift — ×10)
    document.addEventListener('keydown', e => {
      if (state.tab !== 'covers' || !cv._selLayer) return;
      if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
      const L = cvSelLayer();
      if (!L) return;
      // Только Del: Backspace после клика по цвету (фокус на кнопке) удалял элемент нечаянно
      if (e.key === 'Delete') { e.preventDefault(); cvLayerAction('del'); return; }
      if (e.key === 'Escape') { cv._selLayer = null; cvLayersChanged(); return; }
      const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!dir || L.type === 'ribbon') return;
      e.preventDefault();
      const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'], st = e.shiftKey ? 10 : 1;
      L.x += dir[0] * st / cw; L.y += dir[1] * st / ch;
      cvReDraw();
    });
  }
  document.getElementById('cv-bg2-custom')?.addEventListener('input', e => {
    cv.bg2 = e.target.value; cvReDraw();
  });
  document.getElementById('cv-neon-color')?.addEventListener('input', e => {
    cv.neonColor = e.target.value; cvReDraw();
  });

  // Drag-to-reorder thumbnails — делегируем через document один раз,
  // т.к. cvRenderState() пересоздаёт контейнер миниатюр без id и слушателей
  if (!window._cvDragBound) {
    window._cvDragBound = true;
    document.addEventListener('dragstart', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (t) { cv._dragIdx = +t.dataset.cvDidx; t.style.opacity = '0.4'; }
    });
    document.addEventListener('dragend', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (t) t.style.opacity = '';
    });
    document.addEventListener('dragover', e => {
      if (e.target.closest('.cv-thumbs')) e.preventDefault();
    });
    document.addEventListener('drop', e => {
      if (!e.target.closest('.cv-thumbs')) return;
      e.preventDefault();
      const t = e.target.closest('[data-cv-didx]');
      if (!t || cv._dragIdx === undefined) return;
      const toIdx = +t.dataset.cvDidx;
      if (toIdx === cv._dragIdx) { cv._dragIdx = undefined; return; }
      const [moved] = cv.images.splice(cv._dragIdx, 1);
      cv.images.splice(toIdx, 0, moved);
      cv._dragIdx = undefined;
      cv._selCell = null;
      cvRenderState();
    });
  }

  // GFX-8: та же перестановка миниатюр на тач — HTML5 DnD там мёртв
  if (!window._cvTouchDragBound) {
    window._cvTouchDragBound = true;
    let touchDragEl = null;
    document.addEventListener('touchstart', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (!t) return;
      cv._dragIdx = +t.dataset.cvDidx;
      touchDragEl = t;
      t.style.opacity = '0.4';
    }, {passive: true});
    document.addEventListener('touchmove', e => {
      if (cv._dragIdx === undefined || !touchDragEl) return;
      e.preventDefault();
    }, {passive: false});
    document.addEventListener('touchend', e => {
      if (cv._dragIdx === undefined || !touchDragEl) return;
      const touch = e.changedTouches[0];
      const el = touch && document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el && el.closest('.cv-thumbs [data-cv-didx]');
      touchDragEl.style.opacity = '';
      touchDragEl = null;
      if (target) {
        const toIdx = +target.dataset.cvDidx;
        if (toIdx !== cv._dragIdx) {
          const [moved] = cv.images.splice(cv._dragIdx, 1);
          cv.images.splice(toIdx, 0, moved);
          cv._selCell = null;
          cvRenderState();
        }
      }
      cv._dragIdx = undefined;
    });
  }

  // Canvas — drag to swap, click to select, wheel to zoom selected cell
  const canvas = document.getElementById('cv-canvas');
  if (canvas) {
    // cvRenderState, а не голая отрисовка: шаблон вкладки не содержит панели масштаба,
    // и после любого render() (тень, кадр, стиль фона) она пропадала до следующей смены картинок
    if (cv.images.length) cvRenderState();

    // GFX-8/GFX-14: точка-в-полигоне для poly-ячеек (circ4d) — общий хелпер для хит-теста и клика
    function cvPointInPoly(mx, my, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi,yi] = poly[i], [xj,yj] = poly[j];
        if (((yi > my) !== (yj > my)) && (mx < (xj-xi)*(my-yi)/(yj-yi)+xi)) inside = !inside;
      }
      return inside;
    }

    function canvasHitCell(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const cells = cvCells(cv.layout, cv.images.length, cw, ch, cv.padding);
      return cells.findIndex(c => c.circle
        ? Math.sqrt((mx-c.cx)**2+(my-c.cy)**2) <= c.r
        : c.poly
        ? cvPointInPoly(mx, my, c.poly)
        : mx>=c.x && mx<=c.x+c.w && my>=c.y && my<=c.y+c.h);
    }

    let _drag = null;
    let _gameDrag = null;
    // Слой под рукой: move — тянем сам слой, rotate / scale — за ручки рамки; _pinch — два пальца
    let _layerDrag = null;
    let _pinch = null;

    function canvasMouse(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        mx: (e.clientX - rect.left) * (canvas.width / rect.width),
        my: (e.clientY - rect.top)  * (canvas.height / rect.height),
      };
    }
    const cvSz = () => CV_SZ[cv.ratio] || CV_SZ['4:5'];
    const redraw = () => cv.mode === 'game' ? cvDrawGame(canvas, cv.images[0], {}) : cvDrawCollage(canvas);
    const nearPt = (p, mx, my, k) => !!p && Math.hypot(mx - p.x, my - p.y) <= 18 * k;
    // Какую ручку выделенного слоя задевает точка: 'rotate' | 'scale' | null
    function handleAt(mx, my) {
      const L = cvSelLayer();
      if (!L || L.hidden) return null;
      const [cw, ch] = cvSz(), k = cvScreenK(canvas);
      const f = cvLayerFrame(L, cw, ch), h = cvLayerHandles(f, k);
      if (nearPt(h.rotate, mx, my, k)) return { kind: 'rotate', L, f, h };
      if (nearPt(h.scale, mx, my, k)) return { kind: 'scale', L, f, h };
      return null;
    }
    // Выбор слоя на холсте открывает его настройки; на ПК карточку подтягиваем в видимую часть меню
    function selectLayer(id) {
      if (cv._selLayer === id) return;
      cv._selLayer = id;
      cvRefreshLayersCard();
      const card = document.getElementById('cv-layers-card'), col = document.querySelector('.cv-controls');
      if (id && card && col && getComputedStyle(col).overflowY === 'auto') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function onPointerDown(e) {
      if (!cv.images.length) return;
      const { mx, my } = canvasMouse(e);
      const [cw, ch] = cvSz();
      // 1) ручки выделенного слоя — поверх всего
      const hd = handleAt(mx, my);
      if (hd) {
        e.preventDefault();
        _layerDrag = hd.kind === 'rotate'
          ? { mode: 'rotate', L: hd.L, cx: hd.f.cx, cy: hd.f.cy, a0: Math.atan2(my - hd.f.cy, mx - hd.f.cx), angle0: hd.L.angle || 0 }
          : { mode: 'scale', L: hd.L, ax: hd.h.anchor.x, ay: hd.h.anchor.y, d0: Math.max(1, Math.hypot(mx - hd.h.anchor.x, my - hd.h.anchor.y)), s0: hd.L.scale || 1 };
        return;
      }
      // 2) сам слой: выделить и тянуть
      const hit = cvLayerAt(mx, my, cw, ch);
      if (hit) {
        e.preventDefault();
        const f = cvLayerFrame(hit, cw, ch);
        _layerDrag = { mode: 'move', L: hit, offX: mx - f.cx, offY: my - f.cy, sx: mx, sy: my, moved: false };
        selectLayer(hit.id);
        redraw();
        canvas.style.cursor = 'grabbing';
        return;
      }
      // 3) мимо слоёв — снимаем выделение и работаем с картинкой, как раньше
      if (cv._selLayer) { selectLayer(null); redraw(); }
      if (cv.mode === 'game') {
        e.preventDefault();
        const img = cv.images[0];
        if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
        cvClampTransform(img);
        _gameDrag = { startMx: mx, startMy: my, ox: img.transform.ox||0, oy: img.transform.oy||0 };
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Коллаж: перетаскивание двигает кадр внутри ячейки (решение Дениса 23.09.2026 — неудачный
      // ракурс иначе не поправить). Поменять ячейки местами — перетаскиванием миниатюр.
      const hitCell = canvasHitCell(e);
      if (hitCell === -1 || !cv.images[hitCell]) return;
      e.preventDefault();
      _drag = { cellIdx: hitCell, startX: e.clientX, startY: e.clientY, moved: false, lastMx: mx, lastMy: my };
    }

    function moveLayer(e, mx, my) {
      const [cw, ch] = cvSz(), k = cvScreenK(canvas), D = _layerDrag, L = D.L;
      if (D.mode === 'move') {
        if (!D.moved && Math.hypot(mx - D.sx, my - D.sy) < 3 * k) return;
        D.moved = true;
        if (L.type === 'ribbon') {
          // лента живёт в углу: тянешь — переезжает в тот угол, в чьей четверти курсор
          const c = (my < ch / 2 ? 't' : 'b') + (mx < cw / 2 ? 'l' : 'r');
          if (c !== L.corner) { L.corner = c; cvRefreshLayersCard(); }
        } else {
          let x = mx - D.offX, y = my - D.offY;
          // прилипание центра к осям холста — ровно по центру без «на глаз»
          const snap = 10 * k, gv = Math.abs(x - cw / 2) < snap, gh = Math.abs(y - ch / 2) < snap;
          if (gv) x = cw / 2;
          if (gh) y = ch / 2;
          cv._guides = { v: gv, h: gh };
          L.x = x / cw; L.y = y / ch;
        }
      } else if (D.mode === 'rotate') {
        let a = D.angle0 + (Math.atan2(my - D.cy, mx - D.cx) - D.a0) * 180 / Math.PI;
        a = ((a % 360) + 540) % 360 - 180;
        if (e.shiftKey) a = Math.round(a / 15) * 15;
        else { const r = Math.round(a / 45) * 45; if (Math.abs(a - r) < 4) a = r; }   // прилипание к 0°/45°/90°
        L.angle = Math.round(a * 10) / 10;
      } else if (D.mode === 'scale') {
        L.scale = Math.max(0.25, Math.min(6, D.s0 * Math.hypot(mx - D.ax, my - D.ay) / D.d0));
      }
      cvUpdateLayerReadout(L);
      redraw();
    }

    function onPointerMove(e) {
      if (_layerDrag) { const { mx, my } = canvasMouse(e); moveLayer(e, mx, my); return; }
      if (_gameDrag) {
        const { mx, my } = canvasMouse(e);
        const img = cv.images[0];
        if (!img) return;
        if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
        // Сдвиг в долях окна источника: картинка идёт ровно за курсором, если делить на размер рамки.
        // Приращениями от прошлой точки, а не от начала: упёрлись в край и повели обратно — кадр
        // сразу едет назад, без мёртвого хода.
        const f = cvFrameOf(img);
        const s = img.transform.scale || 1;
        img.transform.ox -= (mx - _gameDrag.startMx) / (s * f.w);
        img.transform.oy -= (my - _gameDrag.startMy) / (s * f.h);
        _gameDrag.startMx = mx; _gameDrag.startMy = my;
        cvClampTransform(img);
        cvDrawGame(canvas, img, {});
        return;
      }
      if (!_drag) {
        // Подсказка курсором: над ручкой — крутить/тянуть размер, над слоем — двигать
        if (!cv.images.length || e.buttons === undefined) return;
        const { mx, my } = canvasMouse(e);
        const hd = handleAt(mx, my);
        const [cw, ch] = cvSz();
        canvas.style.cursor = hd ? (hd.kind === 'rotate' ? 'crosshair' : 'nwse-resize') : cvLayerAt(mx, my, cw, ch) ? 'move' : '';
        return;
      }
      const dx = e.clientX - _drag.startX, dy = e.clientY - _drag.startY;
      if (!_drag.moved && Math.sqrt(dx*dx+dy*dy) > 6) _drag.moved = true;
      if (!_drag.moved) return;
      canvas.style.cursor = 'grabbing';
      // Сдвиг кадра ячейки — той же арифметикой, что в режиме «Игра»: приращениями, с ограничением
      const img = cv.images[_drag.cellIdx];
      const f = img && cvFrameOf(img);
      if (!f) return;
      if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
      const { mx, my } = canvasMouse(e);
      const s = img.transform.scale || 1;
      img.transform.ox = (img.transform.ox || 0) - (mx - _drag.lastMx) / (s * f.w);
      img.transform.oy = (img.transform.oy || 0) - (my - _drag.lastMy) / (s * f.h);
      _drag.lastMx = mx; _drag.lastMy = my;
      cvClampTransform(img);
      cvDrawCollage(canvas);
    }

    function endLayerDrag() {
      const D = _layerDrag;
      _layerDrag = null; cv._guides = null;
      canvas.style.cursor = '';
      if (D.mode !== 'move' || D.moved) jCvBump('drags');
      cvSave();
      // элемент сдвинули после удаления/шаблона — кнопка «Отменить» больше не честная, убираем
      if (cv._layersUndo && !cvUndoValid()) cvRefreshLayersCard();
      redraw();   // убрать направляющие
    }

    function onPointerUp() {
      if (_layerDrag) { endLayerDrag(); return; }
      // Журнал: любой завершившийся drag на канвасе — в счётчик сессии (уйдёт с cv_download)
      if (_gameDrag || (_drag && _drag.moved)) jCvBump('drags');
      if (_gameDrag) { _gameDrag = null; canvas.style.cursor = ''; return; }
      if (!_drag) return;
      canvas.style.cursor = '';
      const wasClick = !_drag.moved;
      if (wasClick) cv._selCell = (cv._selCell === _drag.cellIdx) ? null : _drag.cellIdx;
      _drag = null;
      if (wasClick) cvRenderState();
    }

    function onPointerLeave() {
      if (_layerDrag) { endLayerDrag(); return; }
      if (_gameDrag) { _gameDrag = null; canvas.style.cursor = ''; return; }
      if (!_drag) return;
      _drag = null;
      canvas.style.cursor = '';
      cvDrawCollage(canvas);
    }

    canvas.addEventListener('mousedown', e => { if (e.button === 0) onPointerDown(e); });
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerLeave);
    // Двойной щелчок по элементу — сразу к его тексту в меню
    canvas.addEventListener('dblclick', e => {
      const { mx, my } = canvasMouse(e);
      const [cw, ch] = cvSz();
      const L = cvLayerAt(mx, my, cw, ch);
      if (!L) return;
      selectLayer(L.id);
      const inp = document.querySelector('#cv-layers-card [data-cv-lp="text"]');
      if (inp) { inp.focus(); inp.select?.(); }
    });

    // GFX-8: touch-эквиваленты — слои, ячейки и сдвиг кадра игры на мобиле.
    // Два пальца на выделенном слое — щипок меняет размер, поворот пальцев крутит.
    const pinchOf = e => {
      const [a, b] = e.touches;
      return { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), a: Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) };
    };
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        const L = cvSelLayer();
        if (!L || L.hidden) return;
        e.preventDefault();
        _layerDrag = null; _drag = null; _gameDrag = null;
        const p = pinchOf(e);
        _pinch = { L, d0: Math.max(1, p.d), a0: p.a, s0: L.scale || 1, angle0: L.angle || 0 };
        return;
      }
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      onPointerDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() });
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      if (_pinch && e.touches.length === 2) {
        e.preventDefault();
        const p = pinchOf(e), L = _pinch.L;
        L.scale = Math.max(0.25, Math.min(6, _pinch.s0 * p.d / _pinch.d0));
        if (L.type !== 'ribbon') L.angle = Math.round((_pinch.angle0 + (p.a - _pinch.a0) * 180 / Math.PI) * 10) / 10;
        cvUpdateLayerReadout(L);
        redraw();
        return;
      }
      if (!_drag && !_gameDrag && !_layerDrag) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      const t = e.touches[0];
      onPointerMove({ clientX: t.clientX, clientY: t.clientY });
    }, {passive: false});
    canvas.addEventListener('touchend', e => {
      if (_pinch) { if (e.touches.length < 2) { _pinch = null; jCvBump('drags'); cvSave(); } return; }
      onPointerUp();
    });
    canvas.addEventListener('touchcancel', () => { _pinch = null; onPointerLeave(); });

    // Масштаб колесом мыши, свайпом двумя пальцами и щипком на тачпаде. Шаг пропорционален
    // величине прокрутки: тачпад шлёт десятки мелких событий за жест, и фиксированный шаг
    // на каждое событие прыгал от 100% к 400% за одно движение. Щипок приходит как
    // wheel с ctrlKey и мелкими дельтами — ему своя чувствительность.
    canvas.addEventListener('wheel', e => {
      const dyL = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      // Над выделенным элементом колесо и щипок меняют его размер, а не масштаб картинки
      const sel = cvSelLayer();
      if (sel && !sel.hidden) {
        const { mx, my } = canvasMouse(e);
        const [cw, ch] = cvSz();
        if (cvLayerHit(sel, mx, my, cw, ch)) {
          e.preventDefault();
          sel.scale = Math.max(0.25, Math.min(6, (sel.scale || 1) * Math.exp(-dyL * (e.ctrlKey ? 0.01 : 0.0015))));
          cvUpdateLayerReadout(sel);
          cvReDraw();
          return;
        }
      }
      let img;
      if (cv.mode === 'game') img = cv.images[0];
      else if (cv._selCell !== null && cv._selCell !== undefined) img = cv.images[cv._selCell];
      if (!img) return;
      e.preventDefault();
      if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
      const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      const k = Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015));
      img.transform.scale = Math.max(1, Math.min(4, (img.transform.scale||1) * k));
      cvClampTransform(img);
      const pct = Math.round(img.transform.scale*100);
      const slider = document.getElementById('cv-tz-scale');
      if (slider) slider.value = pct;
      const valEl = document.getElementById('cv-tz-scale-val');
      if (valEl) valEl.textContent = pct + '%';
      cv.mode === 'game' ? cvDrawGame(canvas, img, {}) : cvDrawCollage(canvas);
    }, {passive: false});
  }
}

// DATABASE MODULE
// ══════════════════════════════════════════

function dbUniqueProducts() {
  return [...new Set(state.db.map(r => r.product).filter(Boolean))].sort();
}

function dbHintHTML(product) {
  const p = (product || '').trim().toLowerCase();
  if (!p) return '';
  const used = state.db
    .filter(r => r.product.toLowerCase() === p && r.id !== state.dbEditId)
    .map(r => r.region);
  if (!used.length) return '<span class="free">Ещё не размещалось — все регионы свободны</span>';
  const regs = state.settings.regions || REGIONS;
  const freeCount = regs.length - regs.filter(r => used.includes(r)).length;
  return `<span class="used">Уже: ${used.join(', ')}</span> &middot; <span class="free">Свободны: ${freeCount}</span>`;
}

// Сводка «пора обновить» — над формой, чтобы попадаться на глаза при заходе в
// Историю. Пустая (ничего не выдохлось) не рисуется вовсе: постоянная плашка с
// нулём быстро перестаёт читаться.
function dueCardHTML(due, now) {
  if (!due.length) return '';
  const accs = accList();
  const byAcc = accs.length > 1
    ? accs.map(a => { const n = due.filter(r => accOf(r) === a.id).length; return n ? `${esc(a.name)}: ${n}` : ''; }).filter(Boolean).join(' · ')
    : '';
  const oldest = due.reduce((m, r) => Math.max(m, rotAgeDays(r, now)), 0);
  return `<div class="card" style="margin-bottom:16px;border-color:var(--warn)">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="font-size:15px;font-weight:600">🔁 Пора обновить: ${due.length}</span>
      <span style="font-size:12px;color:var(--muted)">самое старое висит ${oldest} дн${byAcc ? ' · ' + byAcc : ''}</span>
      <div style="flex:1"></div>
      <button class="btn-sm" data-act="db-show-due">Показать только их</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">Порог — ${state.settings.rotDays || DEF_SETTINGS.rotDays} дн (меняется в ⚙ Настройках; у отдельной записи можно задать свой или выключить ротацию).</div>
  </div>`;
}

// Панель ротации под строкой Истории: срок, две степени переписывания и результат.
function rotPanelHTML(r, now) {
  const live = rotLiveText(r);
  const res  = state.rotResult && state.rotResult.recId === r.id ? state.rotResult : null;
  const busyLight = state.rotBusy.has(`${r.id}:light`);
  const busyMid   = state.rotBusy.has(`${r.id}:mid`);
  const busy = busyLight || busyMid;
  const noText = !live.title && !live.desc;

  const resHTML = () => {
    if (busy) return `<div style="padding:10px 2px;color:var(--muted);font-size:13px">⏳ ${busyMid ? 'Переписываю' : 'Прокручиваю'}…</div>`;
    if (!res) return '';
    if (res.error) return `<div style="padding:8px 2px;color:var(--err);font-size:13px">✗ ${esc(res.error)}</div>`;
    const len = [...(res.title || '')].length;
    const tAttr = (res.title || '').replace(/&/g,'&amp;').replace(/"/g, '&quot;');
    const dAttr = (res.desc  || '').replace(/&/g,'&amp;').replace(/"/g, '&quot;').replace(/\n/g, '&#10;');
    return `<div style="border:1px solid var(--border2);border-radius:10px;padding:12px;margin-top:10px;background:var(--card2)">
      <div style="font-size:11px;color:var(--teal-h);font-weight:600;margin-bottom:8px;letter-spacing:.3px">${res.mode === 'mid' ? '↺ ПЕРЕФРАЗ' : '🔁 РОТАЦИЯ'} ${scanBadgeHTML({ _scan: res.scan })}</div>
      ${res.dupAcc ? `<div style="font-size:12px;color:var(--accent-h);margin-bottom:8px">⚠️ Такое название уже стоит на другом твоём аккаунте — внутри одного профиля это был бы дубль, между профилями решай сам.</div>` : ''}
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
        <span style="font-size:14px;font-weight:600">${esc(res.title || '')}</span>
        ${tlenHTML(len)}
      </div>
      <div style="font-size:13px;color:var(--text2);white-space:pre-wrap;margin:8px 0">${esc(res.desc || '')}</div>
      <div class="copy-row">
        <button class="btn-copy" data-act="copy" data-text="${tAttr}" data-j="title" data-jrot="${r.id}">📋 Название</button>
        <button class="btn-copy" data-act="copy" data-text="${dAttr}" data-j="desc" data-jrot="${r.id}">📋 Описание</button>
        <button class="btn-copy" data-act="copy-both" data-t="${tAttr}" data-d="${dAttr}" data-j="both" data-jrot="${r.id}">📋 Всё</button>
        <button class="btn-copy" data-act="db-rot-posted" data-id="${r.id}" style="color:var(--ok)">✓ Разместил</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">«✓ Разместил» заведёт новую запись с этим текстом, а эту переведёт в «Снято». Прежний текст останется в ней.</div>
    </div>`;
  };

  return `<div style="border:1px solid var(--border2);border-radius:10px;padding:12px;background:var(--card)">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn-sm" data-act="db-rotate" data-id="${r.id}" data-mode="light"${busy || noText ? ' disabled' : ''}
        title="Тот же текст, прокручены формы написания, порядок и эмодзи; заголовок новый">🔁 Лёгкая</button>
      <button class="btn-sm" data-act="db-rotate" data-id="${r.id}" data-mode="mid"${busy || noText ? ' disabled' : ''}
        title="Структурно другое объявление: другой порядок блоков, тон и подача цены. Факты сохраняются">↺ Средняя</button>
      <div style="flex:1"></div>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap">
        напомнить через
        <input type="number" min="1" max="365" value="${r.rotDays || ''}" placeholder="${state.settings.rotDays || DEF_SETTINGS.rotDays}"
          data-rot-days="${r.id}" style="width:64px;padding:3px 6px" title="Свой срок для этой записи. Пусто — общий из настроек">
        дн
      </label>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap">
        <input type="checkbox" data-rot-off="${r.id}"${r.rotOff ? ' checked' : ''}>
        не ротировать
      </label>
      <button class="btn-icon" data-act="db-rot-close" title="Закрыть">×</button>
    </div>
    ${noText
      ? `<div style="font-size:12px;color:var(--muted);margin-top:10px">В записи нет текста объявления — внесите его кнопкой ✎, и ротация заработает.</div>`
      : `<div style="font-size:11px;color:var(--muted);margin-top:8px">Крутим ${r.finalDesc ? '<b>финальный текст с Авито</b>' : 'текст из записи'} · висит ${rotAgeDays(r, now)} дн · исключаем ${rotUsedTitles(r, !!state.settings.rotXAcc).length} прежних назв.</div>`}
    ${resHTML()}
  </div>`;
}

function dbTabHTML() {
  const f       = state.dbForm;
  const isEdit  = state.dbEditId !== null;
  const fProd   = state.dbFilter.product.toLowerCase();
  const fStatus = state.dbFilter.status;
  const fAcc    = state.dbFilter.account;
  const fDue    = !!state.dbFilter.due;
  const now     = Date.now();
  const accs    = accList();
  const multiAcc = accs.length > 1;
  const filtered = state.db.filter(r => {
    if (fProd   && !r.product.toLowerCase().includes(fProd)) return false;
    if (fStatus && r.status !== fStatus) return false;
    if (fAcc    && accOf(r) !== fAcc) return false;
    if (fDue    && !rotDue(r, now)) return false;
    return true;
  });
  const rows  = [...filtered].sort((a, b) => b.id - a.id);
  const prods = dbUniqueProducts();
  const due   = rotDueList(now);

  // Возраст объявления: пока ротация не нужна — тихая серая подпись, после
  // порога — заметная. Числа в подсказке, чтобы строка не разрасталась.
  const ageHTML = r => {
    if (!rotWatched(r)) return '';
    const age = rotAgeDays(r, now), lim = rotDaysFor(r), left = lim - age;
    const cls = left <= 0 ? 'color:var(--warn);font-weight:600' : left <= 2 ? 'color:var(--accent-h)' : 'color:var(--muted)';
    const tip = left <= 0
      ? `Висит ${age} дн при пороге ${lim} — пора обновить`
      : `Висит ${age} дн, напомню через ${left}`;
    return ` <span style="${cls};font-size:11px;white-space:nowrap" title="${esc(tip)}">🔁 ${age}д</span>`;
  };

  const rowHTML = r => `<tr data-db-id="${r.id}"${state.dbEditId === r.id ? ' class="db-row-edit"' : ''}>
    <td class="db-product">${esc(r.product)}${r.title || r.description ? ` <span title="${esc((r.title || '') + '\n\n' + (r.description||''))}" style="cursor:help;color:var(--teal-h)">📝</span>` : ''}${ageHTML(r)}</td>
    <td>${esc(r.region)}</td>
    ${multiAcc ? `<td style="font-size:12px;color:var(--muted);white-space:nowrap">${esc(accName(accOf(r)))}</td>` : ''}
    <td><span class="status-badge ${STATUS_CLS[r.status] || 'muted'}">${STATUS_LABELS[r.status] || r.status}</span></td>
    <td class="db-note" title="${esc(r.note || '')}">${esc(r.note || '—')}</td>
    <td style="color:var(--muted);font-size:12px;white-space:nowrap;font-family:var(--fm)">${new Date(rotPostedAt(r)).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})}</td>
    <td style="white-space:nowrap">
      <button class="btn-sm" data-act="db-rot-panel" data-id="${r.id}" title="Ротация: прокрутить текст против дублей" style="margin-right:4px;${rotDue(r, now) ? 'color:var(--warn);border-color:var(--warn)' : ''}">🔁</button>
      ${(r.title || r.description) ? `<button class="btn-sm" data-act="db-final" data-id="${r.id}" title="${r.editShare != null ? `Финал сохранён — изменено ~${Math.round(r.editShare*100)}% описания. Обновить?` : 'Вставить финальный текст, как он ушёл на Авито (для журнала самообучения)'}" style="margin-right:4px;${r.editShare != null ? 'color:var(--ok);border-color:var(--ok)' : ''}">${r.editShare != null ? `✓ ${Math.round(r.editShare*100)}%` : '📥 финал'}</button>` : ''}
      <button class="btn-sm" data-act="db-edit" data-id="${r.id}" title="Редактировать">✎</button>
      <button class="btn-sm" data-act="db-del"  data-id="${r.id}" title="Удалить" style="margin-left:4px">×</button>
    </td>
  </tr>${state.rotPanel === r.id ? `<tr><td colspan="${multiAcc ? 7 : 6}" style="padding:0 10px 12px">${rotPanelHTML(r, now)}</td></tr>` : ''}`;

  return `<div class="db-wrap">
    <div class="db-toolbar">
      <span class="db-page-name">📋 ${esc(state.settings.pageName || 'Страница 1')}</span>
      <div style="flex:1"></div>
      <button class="btn-sm" data-act="db-export">⬇ Бэкап JSON</button>
      <label class="btn-sm" style="cursor:pointer">⬆ Импорт<input type="file" id="db-import-file" accept=".json" style="display:none"></label>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:-8px 0 10px">
      💾 <b>Бэкап</b> сохраняет всё накопленное: историю, эталоны (${(state.refs || []).length}), избранное (${(state.favorites || []).length}), пресеты, очередь и настройки с категориями.
      Всё это живёт только в этом браузере — чистка данных сайта стирает его целиком, а на другом устройстве его нет. Делай бэкап после каждой большой порции сырья и держи файл вне компьютера (облако/почта). Токен в файл не попадает.
    </div>
    <div style="font-size:12px;color:var(--muted);margin:-8px 0 14px">📝 = сохранён текст объявления — участвует в проверке на дубли (кнопка 🔎 Дубли) и в ротации. Заполняется кнопками «✓ Размещено» и «✓ Готово», а для объявлений, размещённых без генератора, — полем «Текст объявления» ниже.</div>

    ${dueCardHTML(due, now)}

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">${isEdit ? '✎ Редактировать запись' : '+ Добавить объявление'}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div class="field" style="flex:2;min-width:180px">
          <label>Товар</label>
          <input type="text" id="db-f-product" value="${esc(f.product)}" placeholder="PS Plus Extra" list="db-prod-list" autocomplete="off">
          <datalist id="db-prod-list">${prods.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
          <div class="db-hint" id="db-hint">${dbHintHTML(f.product)}</div>
        </div>
        <div class="field" style="flex:1;min-width:160px">
          <label>Регион</label>
          <input type="text" id="db-f-region" value="${esc(f.region)}" placeholder="Москва" list="db-reg-list">
          <datalist id="db-reg-list">${(state.settings.regions || REGIONS).map(r => `<option value="${r}">`).join('')}</datalist>
        </div>
        ${multiAcc ? `<div class="field" style="min-width:150px">
          <label>Аккаунт</label>
          <select id="db-f-account">
            ${accs.map(a => `<option value="${esc(a.id)}"${(f.account || accFirstId()) === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="field" style="min-width:130px">
          <label>Статус</label>
          <select id="db-f-status">
            ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${f.status === v ? ' selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:150px">
          <label>Дата публикации</label>
          <input type="date" id="db-f-posted" value="${esc(f.postedAt || '')}">
        </div>
        <div class="field" style="flex:3;min-width:200px">
          <label>Заметка (необязательно)</label>
          <input type="text" id="db-f-note" value="${esc(f.note)}" placeholder="Вариант 2, коллаж 3, цена снижена…">
        </div>
      </div>

      <details class="db-text-block"${(f.title || f.desc) ? ' open' : ''} style="margin-top:10px">
        <summary style="cursor:pointer;font-size:13px;color:var(--teal-h);user-select:none">📝 Текст объявления${(f.title || f.desc) ? '' : ' (для размещённых без генератора)'}</summary>
        <div style="margin-top:10px">
          <div class="field">
            <label>Название <span class="tlen ${[...(f.title||'')].length > 50 ? 'over' : [...(f.title||'')].length >= 45 ? 'warn' : 'ok'}">${[...(f.title||'')].length}/50</span></label>
            <input type="text" id="db-f-title" value="${esc(f.title)}" placeholder="Как объявление называется на Авито">
          </div>
          <div class="field" style="margin-top:8px">
            <label>Описание</label>
            <textarea id="db-f-desc" rows="5" placeholder="Текст объявления целиком — как он висит на Авито">${esc(f.desc)}</textarea>
          </div>
          <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:8px">
            <label style="display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer">
              <input type="checkbox" id="db-f-torefs"${f.toRefs ? ' checked' : ''}>
              <span>✍ Заодно положить в эталоны — это твой текст, он учит генератор твоему голосу</span>
            </label>
            <div class="field" style="min-width:170px;margin:0">
              <label>Категория эталона</label>
              <select id="db-f-refcat">
                ${CATS.map(c => `<option value="${esc(c.id)}"${(f.refCat || state.form.category) === c.id ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}
                <option value="other"${f.refCat === 'other' ? ' selected' : ''}>Другое</option>
              </select>
            </div>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px">У записи Истории категории нет, а эталону она нужна: по ней подбираются примеры твоего голоса. По умолчанию — та, что выбрана в генераторе; поправь, если объявление из другой.</div>
        </div>
      </details>

      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <button class="btn-gen" data-act="${isEdit ? 'db-save' : 'db-add'}" style="width:auto;padding:9px 22px">
          ${isEdit ? '✓ Сохранить' : '+ Добавить'}
        </button>
        ${isEdit ? `<button class="btn-add" data-act="db-cancel">Отмена</button>` : ''}
      </div>
    </div>

    <div class="db-filter-row">
      <input type="text" id="db-filter-product" placeholder="Фильтр по товару…" value="${esc(state.dbFilter.product)}">
      <select id="db-filter-status">
        <option value=""${!fStatus ? ' selected' : ''}>Все статусы</option>
        ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${fStatus === v ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
      ${multiAcc ? `<select id="db-filter-account">
        <option value=""${!fAcc ? ' selected' : ''}>Все аккаунты</option>
        ${accs.map(a => `<option value="${esc(a.id)}"${fAcc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}
      </select>` : ''}
      <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap">
        <input type="checkbox" id="db-filter-due"${fDue ? ' checked' : ''}>
        <span>🔁 только «пора обновить»</span>
      </label>
      <span style="font-size:13px;color:var(--muted)">${filtered.length} из ${state.db.length}</span>
    </div>

    ${!state.db.length
      ? `<div class="card"><div class="empty-state"><div class="ico">📋</div><div>Нет объявлений. Добавьте первое!</div></div></div>`
      : !rows.length
        ? `<div class="card"><div class="empty-state"><div class="ico">🔍</div><div>Ничего не найдено по фильтру</div></div></div>`
        : `<div class="card"><div class="db-table-wrap">
            <table class="db-table">
              <thead><tr><th>Товар</th><th>Регион</th>${multiAcc ? '<th>Аккаунт</th>' : ''}<th>Статус</th><th>Заметка</th><th>Дата</th><th></th></tr></thead>
              <tbody>${rows.map(rowHTML).join('')}</tbody>
            </table>
          </div></div>`
    }
    ${refsCardHTML()}
  </div>`;
}

// ══════════════════════════════════════════
// ЭТАЛОНЫ (журнал самообучения, вариант Г)
// Сюда складываются объявления, составленные БЕЗ инструмента (руками), и чужие
// понравившиеся — с пометкой источника. При месячном разборе язык эталонов
// сравнивается с языком генератора; позже эталоны можно подмешивать в few-shot.
// ══════════════════════════════════════════

function refsCardHTML() {
  const refs = state.refs || [];
  const rf = state.refForm;
  const listHTML = refs.length ? `<div style="display:flex;flex-direction:column;gap:7px;margin-top:12px">
    ${[...refs].sort((a, b) => b.id - a.id).map(r => `<div class="preset-item">
      <button class="btn-sm" data-act="ref-voice" data-id="${r.id}" style="flex-shrink:0;white-space:nowrap;padding:2px 7px;font-size:11px;color:${r.source === 'mine' ? 'var(--teal-h)' : 'var(--accent-h)'}"
        title="${r.source === 'mine' ? 'Голос мой — текст идёт в примеры генерации. Нажми, если голос на самом деле не твой' : 'Голос не мой — текст в примеры НЕ идёт, берутся только приёмы. Нажми, если голос всё-таки твой'}">${r.source === 'mine' ? '✍ мой голос' : '👀 не мой'}</button>
      <span class="preset-item-name" title="${esc((r.title || '') + '\n\n' + (r.desc || ''))}" style="cursor:help">${esc(r.title || (r.desc || '').slice(0, 60))}</span>
      <span class="preset-item-meta">${esc(r.date || '')}</span>
      ${r.source === 'other' && Array.isArray(r.tricks) && r.tricks.length
        ? `<span class="preset-item-meta" style="color:var(--teal-h);cursor:help" title="Приёмы, которые ушли в генерацию:&#10;${esc(r.tricks.join('\n'))}">🔎 ${r.tricks.length}</span>` : ''}
      <button class="btn-icon" data-act="ref-del" data-id="${r.id}" title="Удалить эталон" style="color:var(--warn)">×</button>
    </div>`).join('')}
  </div>` : '';
  const pending = refsToAnalyze().length;
  const tricksTotal = refs.filter(r => Array.isArray(r.tricks) && r.tricks.length).length;
  return `<div class="card" style="margin-top:16px">
    <div class="card-title">📥 Эталоны — объявления без инструмента и чужие удачные <span class="sec-badge">${refs.length}</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">
      Делим не по авторству, а по ГОЛОСУ. <b style="color:var(--teal-h)">✍ Мой голос</b> — текст идёт в генерацию как образец того, как пишешь ты.
      <b style="color:var(--accent-h)">👀 Не мой</b> — объявление рабочее, но написано не твоим голосом (например, нейросетью): текст в промпт не идёт,
      кнопка ниже вытаскивает из него только приёмы — ходы и структуру, без формулировок и фактов. Метку на любой строке можно переключить нажатием.
    </div>
    ${refs.some(r => r.source === 'other') ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn-add" data-act="ref-tricks" ${state._refTricksLoading || !pending ? 'disabled' : ''}>
        ${state._refTricksLoading ? '⏳ Разбираю…' : pending ? `🔎 Разобрать приёмы (${pending})` : '🔎 Все разобраны'}
      </button>
      <span style="font-size:11.5px;color:var(--muted)">${tricksTotal ? `Разобрано объявлений: ${tricksTotal} — их приёмы уже подмешиваются в генерацию` : 'Пока ни одно чужое объявление не разобрано'}</span>
    </div>` : ''}
    ${refs.length || (state.favorites || []).length ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn-sm" data-act="ref-preview">👁 Что уходит в промпт</button>
      <span style="font-size:11.5px;color:var(--muted)">Показывает точный блок, который подмешивается к запросу по товару из формы генератора</span>
    </div>` : ''}
    <div class="form-body">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field" style="min-width:170px">
          <label>Источник</label>
          <select id="ref-source">
            <option value="mine"${rf.source === 'mine' ? ' selected' : ''}>✍ Мой голос — в примеры</option>
            <option value="other"${rf.source === 'other' ? ' selected' : ''}>👀 Не мой голос — только приёмы</option>
          </select>
        </div>
        <div class="field" style="min-width:170px">
          <label>Категория</label>
          <select id="ref-cat">
            ${CATS.map(c => `<option value="${esc(c.id)}"${rf.category === c.id ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}
            <option value="other"${rf.category === 'other' ? ' selected' : ''}>Другое</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Название объявления</label>
        <input type="text" id="ref-title" placeholder="Как в объявлении на Авито" style="font-family:var(--fm);font-size:13px" value="${esc(rf.title)}">
      </div>
      <div class="field">
        <label>Описание</label>
        <textarea id="ref-desc" rows="6" placeholder="Вставь полный текст описания...">${esc(rf.desc)}</textarea>
      </div>

    </div>
    ${listHTML}
  </div>`;
}

// «Что уходит в промпт» — предпросмотр накопленного блока ровно в том виде, в
// каком он подмешивается к запросу. Сырьё эталонов собиралось долго, и вопрос
// «а точно ли оно используется и ничего не теряется по дороге» должен решаться
// проверкой, а не обещанием: тут видно и сами примеры целиком, и сколько их, и
// по какому товару подобран близкий. Выборка случайная — кнопка «другая выборка»
// показывает, что при каждой генерации она новая (это и есть антидубль).
function showLearnedPreview() {
  try {
    document.getElementById('learned-overlay')?.remove();
    const block = learnedBlock(state.form);
    const product = currentProductName(state.form);
    const ov = document.createElement('div');
    ov.id = 'learned-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,20,.82);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
    ov.innerHTML = `<div class="card" style="max-width:760px;width:100%;border-color:var(--border2);max-height:90vh;display:flex;flex-direction:column">
      <div class="card-title">👁 Что уходит в промпт — ${esc(product)}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
        ${block
          ? `Этот текст добавляется к каждому запросу генерации по текущему товару. Примеры показаны целиком, как они лежат в эталонах. Выборка при каждой генерации новая — иначе модель начала бы пересказывать одно и то же объявление.`
          : `Пока пусто: по этой категории нет ни своих эталонов (✍), ни избранного, ни разобранных чужих приёмов.`}
      </div>
      <pre style="flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--fm);font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin:0">${esc(block.trim() || '—')}</pre>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
        <span style="flex:1;font-size:11.5px;color:var(--muted);align-self:center">${block ? `${block.length} символов` : ''}</span>
        <button class="btn-sm" data-act="learned-again">🎲 Другая выборка</button>
        <button class="btn-gen" data-act="learned-close" style="width:auto;padding:8px 20px">Закрыть</button>
      </div>
    </div>`;
    ov.addEventListener('click', e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'learned-close' || e.target === ov) ov.remove();
      if (act === 'learned-again') { ov.remove(); showLearnedPreview(); }
    });
    document.body.appendChild(ov);
  } catch(e) { toast('Не удалось показать блок: ' + e.message); }
}

// Разбор чужих эталонов на приёмы. Один вызов на всю пачку неразобранных:
// текст чужого объявления в генерацию не попадает никогда — только вытащенные
// из него ходы, поэтому чужие комплектации и цены физически не могут протечь
// в наше объявление.
const REF_TRICKS_SYS = `Ты — редактор, который разбирает чужие объявления Авито и вытаскивает из них ПРИЁМЫ.

Приём — это ХОД, а не текст: с чего начали, как построили структуру, чем зацепили, как подали выгоду, как закрыли возражение, как оформили список.

ПРАВИЛА:
- Формулируй приём так, чтобы его можно было применить к ЛЮБОМУ товару: «начинает с вопроса, который сам себе задаёт покупатель», «список через тире, а не запятыми», «закрывает возражение о состоянии сразу после названия».
- НЕ переписывай фразы из объявления и не цитируй их. Ни одной чужой формулировки.
- НЕ переноси факты: комплектации, цены, города, сроки, названия конкретных товаров.
- 2-3 приёма на объявление, только сильные. Нечего вытащить — верни пустой список для этого объявления.
- Каждый приём — одна короткая строка на русском.

ФОРМАТ ОТВЕТА — ТОЛЬКО JSON:
{"items": [{"id": <id объявления как дано>, "tricks": ["приём", "приём"]}]}`;

// Разобранным считается эталон, у которого tricks вообще ЕСТЬ — даже пустой
// список. Иначе объявление, из которого приёмов не вытащилось, уходило бы на
// разбор при каждом нажатии кнопки и жгло токены.
function refsToAnalyze() {
  return (state.refs || []).filter(r => r.source === 'other' && !Array.isArray(r.tricks) && (r.title || r.desc));
}

const REF_TRICKS_CHUNK = 6;   // объявлений на один запрос
const REF_TRICK_MAX_LEN = 160;

// Приёмы вытащены из ЧУЖОГО текста, который мы не контролируем, и дальше идут
// в КАЖДЫЙ промпт генерации. Поэтому перед сохранением они проходят тот же
// фильтр, что и готовое объявление: приём вида «зовёт продолжить общение в
// мессенджере» толкал бы генератор ровно к тому, за что Авито снимает.
function sanitizeTricks(list) {
  const out = [];
  for (const raw of (Array.isArray(list) ? list : [])) {
    const s = String(raw).trim().replace(/\s+/g, ' ').slice(0, REF_TRICK_MAX_LEN);
    if (!s) continue;
    if (SCAN_ERRORS.some(p => p.re.test(s))) continue;
    if (SCAN_WARNINGS.some(p => (p.rule === 'messenger' || p.rule === 'account') && p.re.test(s))) continue;
    out.push(s);
  }
  return out.slice(0, 3);
}

async function doRefTricks() {
  if (state._refTricksLoading) return;
  const pending = refsToAnalyze();
  if (!pending.length) { toast('Нечего разбирать — все чужие эталоны уже разобраны'); return; }
  state._refTricksLoading = true;
  renderDb();
  const jT0 = Date.now();
  // Разбираем чанками: на одном запросе большая пачка упирается в max_tokens,
  // ответ обрывается на полуслове, JSON.parse падает — и кнопка не срабатывает
  // уже никогда, пока эталоны не удалить руками.
  const chunks = [];
  for (let i = 0; i < pending.length; i += REF_TRICKS_CHUNK) chunks.push(pending.slice(i, i + REF_TRICKS_CHUNK));
  let filled = 0, seen = 0, fails = 0;
  for (const chunk of chunks) {
    try {
      const list = chunk.map(r => `id: ${r.id}\nНазвание: ${r.title || '—'}\nОписание: ${(r.desc || '').slice(0, 1200)}`).join('\n---\n');
      const text = await callAI([{ role: 'user', content: `Разбери на приёмы эти объявления:\n\n${list}` }], {
        system: REF_TRICKS_SYS, max_tokens: Math.min(4000, 500 + chunk.length * 300),
      });
      const data = JSON.parse(extractJSON(text));
      for (const item of (Array.isArray(data?.items) ? data.items : [])) {
        // Ищем только среди отправленных: выдуманный или перепутанный моделью id
        // иначе прицепил бы приёмы к своему эталону или перезаписал чужие прежние
        const ref = chunk.find(r => String(r.id) === String(item?.id));
        if (!ref) continue;
        const tricks = sanitizeTricks(item.tricks);
        // Пустым списком помечаем ТОЛЬКО то, о чём модель реально ответила:
        // остальные останутся неразобранными и попадут в следующий заход, а не
        // застрянут навсегда в «разобрано, приёмов нет» без кнопки сброса
        ref.tricks = tricks;
        seen++;
        if (tricks.length) filled++;
      }
    } catch (e) {
      fails++;
      console.error('Разбор приёмов: чанк не удался', e);
      jlog('error', null, { stage: 'ref_tricks', message: String(e.message || '').slice(0, 300) });
    }
  }
  save();
  jlog('refs_tricks', null, { asked: pending.length, answered: seen, filled, chunks: chunks.length, fails, latencyMs: Date.now() - jT0 });
  if (!seen) toast(fails ? 'Не удалось разобрать — попробуйте ещё раз' : 'Модель не нашла приёмов в этих объявлениях');
  else toast(`Разобрано: ${filled} из ${seen}${seen < pending.length ? ` · осталось ${pending.length - seen}` : ''}`);
  state._refTricksLoading = false;
  renderDb();
}

// Зеркалим ввод в state.refForm — иначе перерисовка вкладки Истории (фильтр по товару
// дёргает renderDb на каждый символ) стирала бы недописанный/вставленный эталон
function bindRefsCard() {
  document.getElementById('ref-source')?.addEventListener('change', e => { state.refForm.source = e.target.value; });
  document.getElementById('ref-cat')?.addEventListener('change',    e => { state.refForm.category = e.target.value; });
  document.getElementById('ref-title')?.addEventListener('input',   e => { state.refForm.title = e.target.value; });
  document.getElementById('ref-desc')?.addEventListener('input',    e => { state.refForm.desc = e.target.value; });
}

function renderDb() {
  const el = document.getElementById('db-content');
  if (!el) return;
  el.innerHTML = dbTabHTML();
  bindDbTab();
}

function bindDbTab() {
  document.getElementById('db-import-file')?.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const raw = JSON.parse(ev.target.result);
        // Три поколения файлов: v1 — голый массив записей Истории; v2 — {db, refs};
        // v3 — полный бэкап (плюс избранное, пресеты, очередь, настройки).
        const obj = (raw && !Array.isArray(raw) && typeof raw === 'object') ? raw : {};
        const data = Array.isArray(raw) ? raw : (Array.isArray(obj.db) ? obj.db : null);
        if (!data) throw new Error('Ожидался массив записей или объект бэкапа');
        if (data.some(r => typeof r?.product !== 'string')) throw new Error('В записях отсутствует поле "product"');
        const arr = v => Array.isArray(v) ? v : [];
        const refsIn = arr(obj.refs), favsIn = arr(obj.favorites), presetsIn = arr(obj.presets), queueIn = arr(obj.queue);

        // Списки сравниваются по СОДЕРЖИМОМУ, а не по id: id — это Date.now() того
        // устройства, где запись создали, у разных баз он ничего не значит.
        const refKey    = r => [r.source || '', r.category || '', (r.title || '').trim(), (r.desc || '').trim()].join('|');
        const favKey    = f => [(f.title || '').trim(), (f.description || '').trim()].join('|');
        const presetKey = p => (p.name || '').trim();
        const queueKey  = q => [q.product || '', q.region || '', q.source || '', q.variant?.title || ''].join('|');
        const newOnes = (incoming, have, key) => {
          const seen = new Set((have || []).map(key));
          return incoming.filter(x => { const k = key(x); if (seen.has(k)) return false; seen.add(k); return true; });
        };
        const refsAdded    = newOnes(refsIn,    state.refs,       refKey);
        const favsAdded    = newOnes(favsIn,    state.favorites,  favKey);
        const presetsAdded = newOnes(presetsIn, state.presets,    presetKey);
        const queueAdded   = newOnes(queueIn,   state.postQueue,  queueKey);

        // А вот сами id при слиянии двух баз совпасть МОГУТ — и тогда удаление,
        // которое ищет строго по id, снесло бы обе записи разом. Коллизии
        // переименовываем; у избранного заодно чиним ссылки очереди из этого же
        // файла (позиция source:'fav' указывает на _fid).
        const restampIds = (added, have, idField = 'id') => {
          const busy = new Set((have || []).map(x => x[idField]));
          const map = new Map();
          let n = 0;
          for (const x of added) {
            if (busy.has(x[idField])) {
              let fresh = Date.now() + (++n);
              while (busy.has(fresh)) fresh = Date.now() + (++n);
              map.set(x[idField], fresh);
              x[idField] = fresh;
            }
            busy.add(x[idField]);
          }
          return map;
        };
        const favIdMap = restampIds(favsAdded, state.favorites, '_fid');
        restampIds(refsAdded,    state.refs);
        restampIds(presetsAdded, state.presets);
        restampIds(queueAdded,   state.postQueue);
        for (const q of queueAdded) if (q.source === 'fav' && favIdMap.has(q.favId)) q.favId = favIdMap.get(q.favId);

        // F14: раньше импорт молча ЗАМЕНЯЛ всю базу — бэкап со второго устройства стирал
        // локальную историю дублей без единого подтверждения. Теперь явно спрашиваем слияние
        // или замену, а замену дополнительно подтверждаем отдельно (двойная защита от потери).
        const has = [`${data.length} записей истории`];
        if (refsIn.length)    has.push(`${refsIn.length} эталонов`);
        if (favsIn.length)    has.push(`${favsIn.length} избранного`);
        if (presetsIn.length) has.push(`${presetsIn.length} пресетов`);
        if (queueIn.length)   has.push(`${queueIn.length} позиций очереди`);
        const merge = confirm(`Файл содержит: ${has.join(', ')}.\nТекущая база: ${state.db.length} записей.\n\nOK — слить с текущей базой (добавить новые, не трогая старые)\nОтмена — полностью заменить базу\n\nЭталоны, избранное, пресеты и очередь в обоих случаях ДОБАВЛЯЮТСЯ, ничего не стирая.`);
        // Замену подтверждаем сразу, до остальных вопросов: отказ здесь — это отказ
        // от импорта целиком, и спрашивать после него про настройки незачем.
        if (!merge && !confirm(`Точно заменить всю базу? Текущие ${state.db.length} записей будут удалены безвозвратно.`)) return;

        // Накопленное руками сливается ВСЕГДА, даже при выборе «заменить»: замена
        // относится к истории размещений, а терять эталоны и избранное молча — ровно
        // та ловушка, из-за которой они и не попадали в бэкап.
        // ВАЖНО: дописываем только ПОСЛЕ всех подтверждений (ниже). Раньше слияние
        // стояло выше второго confirm — и при отказе от замены базы функция выходила
        // без save()/renderDb(): данные из файла уже лежали в памяти, в интерфейсе их
        // не было, а на диск уезжали молча при первом же постороннем save().
        const mergeLists = () => {
          if (refsAdded.length)    state.refs      = [...(state.refs || []),      ...refsAdded];
          if (favsAdded.length)    state.favorites = [...(state.favorites || []), ...favsAdded];
          if (presetsAdded.length) state.presets   = [...(state.presets || []),   ...presetsAdded];
          if (queueAdded.length)   state.postQueue = [...(state.postQueue || []), ...queueAdded];
        };
        const addedNote = [
          refsAdded.length    ? `эталонов ${refsAdded.length}`    : '',
          favsAdded.length    ? `избранного ${favsAdded.length}`  : '',
          presetsAdded.length ? `пресетов ${presetsAdded.length}` : '',
          queueAdded.length   ? `очередь ${queueAdded.length}`    : '',
        ].filter(Boolean).join(', ');

        // Настройки (категории, каталоги, оформление, обложки) — отдельный вопрос:
        // при восстановлении на чистом браузере их нужно вернуть, а при подливке
        // сырья с телефона на рабочий ПК — точно нет, там свои правки категорий.
        const cfgHas = [];
        if (obj.cats)     cfgHas.push(`категории (своих ${arr(obj.cats.custom).length})`);
        if (obj.scenes)   cfgHas.push(`сцены интерьера (своих ${arr(obj.scenes.custom).length})`);
        if (obj.catalogs) cfgHas.push('каталоги игр');
        if (obj.settings) cfgHas.push('настройки генератора');
        if (obj.cv)       cfgHas.push('настройки обложек');
        const restoreCfg = cfgHas.length && confirm(`В файле есть ещё ${cfgHas.join(', ')}.\n\nOK — восстановить их, ЗАМЕНИВ текущие\nОтмена — оставить текущие настройки как есть (данные выше всё равно импортируются)`);
        const applyCfg = () => {
          if (!restoreCfg) return;
          if (obj.cats && typeof obj.cats === 'object') {
            state.catsCfg = { builtin: obj.cats.builtin || {}, custom: arr(obj.cats.custom) };
            rebuildCats();
          }
          if (obj.scenes && typeof obj.scenes === 'object') {
            state.scenesCfg = { builtin: obj.scenes.builtin || {}, custom: arr(obj.scenes.custom) };
            rebuildScenes();
          }
          if (obj.catalogs && typeof obj.catalogs === 'object') state.catalogs = obj.catalogs;
          if (obj.settings && typeof obj.settings === 'object') {
            state.settings = { ...DEF_SETTINGS, ...obj.settings };
            if (MODEL_MIGRATION[state.settings.model]) state.settings.model = MODEL_MIGRATION[state.settings.model];
          }
          if (obj.cv && typeof obj.cv === 'object') {
            // Только известные поля, старый формат переводится в слои — всё в cvApplyCfg
            cvApplyCfg(obj.cv);
            cvSave();
          }
        };

        if (merge) {
          const key = rec => [rec.product, rec.region, rec.title || '', rec.date || ''].join('|');
          const existing = new Set(state.db.map(key));
          const added = data.filter(rec => !existing.has(key(rec)));
          state.db = [...state.db, ...added];
          mergeLists(); applyCfg(); save();
          toast(`Слияние: добавлено ${added.length} из ${data.length}${addedNote ? `, ${addedNote}` : ''} (пропущено дублей: ${data.length - added.length})`);
        } else {
          state.db = data;
          // Замена базы — явное намерение, подтверждённое двумя вопросами. Метим
          // хранилище своим, иначе saveMerged увидел бы в нём «чужое» и подлил бы
          // заменённые записи обратно, обессмыслив оба подтверждения.
          _lsMine['avito_db'] = lsRaw('avito_db');
          mergeLists(); applyCfg(); save();
          toast(`База заменена: ${data.length} записей${addedNote ? `, ${addedNote}` : ''}`);
        }
        // Категории и настройки меняют интерфейс целиком, одной вкладкой не обойтись
        if (restoreCfg) render(); else renderDb();
      } catch(err) { toast('Ошибка импорта: ' + err.message); }
    };
    r.readAsText(file);
  });
  document.getElementById('db-f-product')?.addEventListener('input', e => {
    state.dbForm.product = e.target.value;
    const h = document.getElementById('db-hint');
    if (h) h.innerHTML = dbHintHTML(e.target.value);
  });
  document.getElementById('db-f-region')?.addEventListener('input',  e => { state.dbForm.region = e.target.value; });
  document.getElementById('db-f-note')?.addEventListener('input',    e => { state.dbForm.note = e.target.value; });
  document.getElementById('db-f-status')?.addEventListener('change', e => { state.dbForm.status = e.target.value; });
  document.getElementById('db-f-account')?.addEventListener('change', e => { state.dbForm.account = e.target.value; });
  document.getElementById('db-f-posted')?.addEventListener('change', e => { state.dbForm.postedAt = e.target.value; });
  // Текст объявления в черновике state, а не только в DOM: вкладка Истории
  // перерисовывается на каждый символ фильтра, и вставленное описание иначе
  // пропало бы — та же ловушка, что была с черновиком эталона.
  document.getElementById('db-f-title')?.addEventListener('input', e => {
    state.dbForm.title = e.target.value;
    const lab = e.target.closest('.field')?.querySelector('.tlen');
    if (lab) {
      const n = [...e.target.value].length;
      lab.textContent = `${n}/50`;
      lab.className = 'tlen ' + (n > 50 ? 'over' : n >= 45 ? 'warn' : 'ok');
    }
  });
  document.getElementById('db-f-desc')?.addEventListener('input',   e => { state.dbForm.desc = e.target.value; });
  document.getElementById('db-f-torefs')?.addEventListener('change', e => { state.dbForm.toRefs = e.target.checked; });
  document.getElementById('db-f-refcat')?.addEventListener('change', e => { state.dbForm.refCat = e.target.value; });
  document.getElementById('db-filter-product')?.addEventListener('input',  e => { state.dbFilter.product = e.target.value; renderDb(); });
  document.getElementById('db-filter-status')?.addEventListener('change',  e => { state.dbFilter.status = e.target.value; renderDb(); });
  document.getElementById('db-filter-account')?.addEventListener('change', e => { state.dbFilter.account = e.target.value; renderDb(); });
  document.getElementById('db-filter-due')?.addEventListener('change',     e => { state.dbFilter.due = e.target.checked; renderDb(); });
  // Срок и выключатель ротации правятся прямо в панели записи
  document.querySelectorAll('[data-rot-days]').forEach(inp => {
    inp.addEventListener('change', e => {
      const rec = state.db.find(r => r.id === +e.target.dataset.rotDays);
      if (!rec) return;
      const v = parseInt(e.target.value, 10);
      // Очищенное поле пишем нулём, а не удаляем: удаление неотличимо от «срок
      // не задавали», и слияние с соседнего устройства вернуло бы прежнее число.
      rec.rotDays = v > 0 ? v : 0;   // 0 = общий порог из настроек
      save(); renderDb();
    });
  });
  document.querySelectorAll('[data-rot-off]').forEach(inp => {
    inp.addEventListener('change', e => {
      const rec = state.db.find(r => r.id === +e.target.dataset.rotOff);
      if (!rec) return;
      // Снятая галочка — это false, а не отсутствие поля: иначе соседнее
      // устройство вернуло бы своё true и объявление снова выпало бы из напоминаний.
      rec.rotOff = !!e.target.checked;
      save(); renderDb();
    });
  });
  bindRefsCard();
}

// ══════════════════════════════════════════
// ФИНАЛЬНЫЙ ТЕКСТ С АВИТО (журнал самообучения)
// Денис дошлифовывает объявление уже в форме Авито — инструмент финала не видит.
// Диалог (необязательный) появляется после «✓ Размещено» и по кнопке «📥 финал»
// в Истории: вставленный финал сравнивается с бот-версией (editShare — доля
// изменённого), обе версии уходят в журнал событием edited. Что стабильно
// правится руками → кандидаты в SYS-промпт при месячном разборе.
// ══════════════════════════════════════════

function showFinalDialog(recId) {
  try {
    const r = state.db.find(x => x.id === recId);
    if (!r || (!r.title && !r.description)) return; // без бот-версии сравнивать не с чем
    // Повторное открытие («✓ N%» в Истории) — штатный сценарий: подсказка кнопки
    // сама предлагает обновить финал. Поля предзаполняем УЖЕ СОХРАНЁННЫМ финалом:
    // пустое поле означает «описание не менял» и раньше затирало донесённый финал
    // бот-версией — потеря невосполнимого сырья от простого «открыл посмотреть».
    const hadFinal = !!r.finalDesc;
    const preTitle = r.finalTitle || r.title || '';
    const preDesc  = hadFinal ? r.finalDesc : '';
    document.getElementById('final-overlay')?.remove();
    const ov = document.createElement('div');
    ov.id = 'final-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,20,.82);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
    ov.innerHTML = `<div class="card" style="max-width:560px;width:100%;border-color:var(--border2)">
      <div class="card-title">📥 Финальный текст с Авито <span style="color:var(--muted);font-weight:400">— необязательно, можно пропустить</span></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
        ${esc(r.product)} · 📍 ${esc(r.region)}. Если правил текст уже в форме Авито — вставь сюда финальную версию:
        инструмент сравнит с сгенерированной и запомнит, что ты меняешь руками.
        ${hadFinal ? `<div style="color:var(--ok);margin-top:6px">✓ Финал уже сохранён (изменено ~${Math.round((r.editShare || 0) * 100)}%) — он в полях ниже. Правь или закрывай, текст не потеряется.</div>` : ''}
      </div>
      <div class="form-body">
        <div class="field">
          <label>Финальное название${hadFinal ? ' (сохранённый финал)' : (r.title ? ' (предзаполнено сгенерированным — поправь, если менял)' : '')}</label>
          <input type="text" id="final-title" value="${esc(preTitle)}" style="font-family:var(--fm);font-size:13px">
        </div>
        <div class="field">
          <label>Финальное описание${hadFinal ? ' (сохранённый финал — правь поверх)' : ' — вставь как ушло на Авито (Ctrl+V)'}</label>
          <textarea id="final-desc" rows="8" placeholder="${hadFinal ? 'Очистить поле нельзя: пустое = оставить сохранённый финал как есть' : 'Пусто = «описание не менял, взять сгенерированное как финал»'}">${esc(preDesc)}</textarea>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-gen" id="final-save" style="flex:1;padding:10px">✓ Сохранить финал</button>
          <button class="btn-gen-secondary" id="final-skip" style="width:auto;margin-top:0;padding:10px 18px">Пропустить</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(ov);
    // Закрытие без сохранения: если текст уже вставлен, промах мимо карточки не должен
    // молча его стирать — диалог сам не откроется повторно, доносить пришлось бы через Историю
    const finalDirty = () => {
      const t = (ov.querySelector('#final-title')?.value || '').trim();
      const d = (ov.querySelector('#final-desc')?.value || '').trim();
      // Сравниваем с тем, чем поля были ЗАПОЛНЕНЫ, а не с бот-версией: иначе
      // повторное открытие уже сохранённого финала всегда считалось бы правкой
      // и спрашивало «закрыть без сохранения?» на каждый просмотр.
      return t !== preTitle.trim() || d !== preDesc.trim();
    };
    const closeFinal = () => {
      if (finalDirty() && !confirm('Закрыть без сохранения? Вставленный финальный текст не сохранится.')) return;
      ov.remove();
    };
    ov.querySelector('#final-skip').addEventListener('click', closeFinal);
    ov.addEventListener('click', e => { if (e.target === ov) closeFinal(); });
    ov.querySelector('#final-save').addEventListener('click', () => {
      const ft = (ov.querySelector('#final-title')?.value || '').trim();
      const fdRaw = (ov.querySelector('#final-desc')?.value || '').trim();
      // Пустое поле НИКОГДА не стирает уже сохранённый финал: для записи с финалом
      // оно значит «оставить как есть», и только для записи без финала — «описание
      // не менял, годится сгенерированное».
      const fd = fdRaw || r.finalDesc || r.description || '';
      // Открыл посмотреть и нажал «Сохранить» — ничего не изменилось. Второе
      // событие edited с тем же текстом задвоило бы пару «бот → правка» при
      // разборе и потянуло бы медиану editShare, поэтому просто закрываем.
      if (hadFinal && fd === r.finalDesc && ft === (r.finalTitle || '')) {
        ov.remove();
        toast('Финал не изменился');
        return;
      }
      r.finalTitle = ft; r.finalDesc = fd;
      r.editShare = jEditShare(r.description || '', fd);
      save();
      jlog('edited', r._chain || null, {
        product: r.product, region: r.region,
        botTitle: r.title || '', finalTitle: ft, titleChanged: ft !== (r.title || ''),
        botDescription: r.description || '', finalDescription: fd,
        // descPasted отвечает на один вопрос разбора: финал ОТЛИЧАЕТСЯ от
        // сгенерированного? Считать по «поле было непустым» больше нельзя — поле
        // теперь предзаполняется, и правка одного заголовка притащила бы в выборку
        // editShare структурный ноль (финал равен бот-версии), ради исключения
        // которого фильтр `descPasted === true` в анализаторе и заведён.
        editShare: r.editShare, descPasted: fd.trim() !== (r.description || '').trim(),
      });
      ov.remove();
      toast(r.editShare != null ? `Финал сохранён — изменено ~${Math.round(r.editShare * 100)}% описания` : 'Финал сохранён');
      if (state.tab === 'database') renderDb();
    });
  } catch(e) { console.error('journal:', e); }
}

// ══════════════════════════════════════════
// EXPORT PACKAGE
// ══════════════════════════════════════════

// Имя товара по категории формы — subType/aiService/gameName/digitalName заполнены
// одновременно (дефолты формы), поэтому нельзя брать первое непустое подряд
// Название товара — поле категории с флажком «название товара» (isName).
// У встроенных он проставлен в дескрипторе, поэтому результат прежний;
// пользовательская категория тоже получает осмысленный штамп, а не «Товар».
function currentProductName(f) {
  const fd = catDef(f.category).fields.find(x => x.isName);
  if (fd) {
    const v = fieldVal(f, fd);
    const s = Array.isArray(v) ? v.join(', ') : String(v);
    if (s.trim()) return s.trim();
  }
  return 'Товар';
}

function exportPackage() {
  const all  = resultsPool(); // UX-15: включает и «Ещё варианты»
  const favs = state.favorites;
  const batch = state.batchResults.filter(it => it.variant); // F10: пакет по регионам тоже выгружаем
  if (!all.length && !favs.length && !batch.length) { toast('Нечего экспортировать — сначала сгенерируйте варианты'); return; }

  // F4: товар из формы на момент генерации / штампа варианта, не из живой формы
  const product = state.resultsForm ? currentProductName(state.resultsForm)
    : (state.results[0]?._product || batch[0]?.variant?._product || state.favorites[0]?._product || currentProductName(state.form));
  const date = new Date().toLocaleDateString('ru');
  const sep = '━'.repeat(44);

  const fmtVariant = (v, label) => {
    const len = v.title ? [...v.title].length : 0;
    const lenNote = len > 50 ? ` ⚠ ПРЕВЫШАЕТ ЛИМИТ (${len}/50)` : ` (${len}/50)`;
    const tags = [v.style, v.price_format, v.structure].filter(Boolean).join(' · ');
    return [
      `[${label}]${tags ? '  ' + tags : ''}`,
      `НАЗВАНИЕ${lenNote}:`,
      v.title || '(нет)',
      '',
      'ОПИСАНИЕ:',
      v.description || '(нет)',
    ].join('\n');
  };

  const lines = [
    'АВИТО-ПОМОЩНИК — Пакет объявлений',
    `Товар: ${product}`,
    `Дата:  ${date}`,
    `Итого: ${all.length} вариантов, ${batch.length} по регионам, ${favs.length} избранных`,
    sep,
    '',
  ];

  all.forEach((v, i) => {
    lines.push(fmtVariant(v, `ВАРИАНТ ${i + 1}`));
    lines.push('');
    lines.push(sep);
    lines.push('');
  });

  if (batch.length) {
    lines.push('📦 ПАКЕТ ПО РЕГИОНАМ');
    lines.push(sep);
    lines.push('');
    batch.forEach(it => {
      lines.push(fmtVariant(it.variant, `РЕГИОН: ${it.region}`));
      lines.push('');
      lines.push(sep);
      lines.push('');
    });
  }

  if (favs.length) {
    lines.push('★ ИЗБРАННОЕ');
    lines.push(sep);
    lines.push('');
    favs.forEach((v, i) => {
      lines.push(fmtVariant(v, `ИЗБРАННОЕ ${i + 1}`));
      lines.push('');
      lines.push(sep);
      lines.push('');
    });
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const slug = product.replace(/[^a-zа-яё0-9]/gi, '_').toLowerCase().slice(0, 20);
  a.download = `avito-pack-${slug}-${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  jlog('export', state.results[0]?._chain || null, { product, variants: all.length, batch: batch.length, favs: favs.length });
  toast(`Экспортировано: ${all.length} вар. + ${batch.length} рег. + ${favs.length} избр.`);
}

// ══════════════════════════════════════════
// DUPLICATE DETECTOR
// ══════════════════════════════════════════

const _DUP_STOP = new Set('для это что как при или без под над всё все его её они мне вам нас том там где кто чем уже еще ещё очень также тоже такой такая один два три можно нужно есть быть будет после через более менее'.split(' '));

function _dupTokenize(s) {
  return new Set(
    s.toLowerCase().replace(/[^\wа-яё\s]/gi, ' ').split(/\s+/)
      .filter(w => w.length >= 3 && !_DUP_STOP.has(w))
  );
}

function _dupSim(a, b) {
  const sA = _dupTokenize(a), sB = _dupTokenize(b);
  if (!sA.size || !sB.size) return 0;
  const inter = [...sA].filter(w => sB.has(w)).length;
  return inter / new Set([...sA, ...sB]).size;
}

function dupCheck(vid, fid) {
  const pool = [...resultsPool(), ...state.favorites]; // UX-15: включает и «Ещё варианты»
  // Use _fid to identify a favorite unambiguously (avoids id collision with results)
  const cur = fid
    ? state.favorites.find(v => v._fid === fid)
    : findResult(vid);
  if (!cur) return [];
  const curText = (cur.title || '') + ' ' + (cur.description || '');
  const seen = new Set();
  const hits = [];
  for (const v of pool) {
    if (v === cur) continue; // object identity — immune to id collisions
    const key = (v.title || '') + (v.description || '');
    if (seen.has(key)) continue;
    seen.add(key);
    const score = _dupSim(curText, key);
    if (score >= 0.25) {
      const inResults = resultsPool().includes(v);
      hits.push({ label: inResults ? `Вариант #${v.id}` : `★ Избранное`, score });
    }
  }
  // UX-4: сравнение также с историей уже размещённых объявлений (не только текущей сессией)
  for (const r of state.db) {
    if (!r.title && !r.description) continue;
    const key = (r.title || '') + (r.description || '');
    if (seen.has(key)) continue;
    seen.add(key);
    const score = _dupSim(curText, key);
    if (score >= 0.25) {
      hits.push({ label: `📋 История · ${r.region}${r.date ? ', ' + r.date : ''}`, score });
    }
  }
  return hits.sort((a, b) => b.score - a.score).slice(0, 5);
}
