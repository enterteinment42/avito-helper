  '2+3+2':   { name:'2+3+2',    n:7, cells:(cw,ch,p)=>{ const rh=(ch-4*p)/3,cw2=(cw-3*p)/2,cw3=(cw-4*p)/3; return [{x:p,y:p,w:cw2,h:rh},{x:2*p+cw2,y:p,w:cw-2*p-cw2-p,h:rh},{x:p,y:2*p+rh,w:cw3,h:rh},{x:2*p+cw3,y:2*p+rh,w:cw3,h:rh},{x:3*p+2*cw3,y:2*p+rh,w:cw-2*p-2*(cw3+p),h:rh},{x:p,y:3*p+2*rh,w:cw2,h:ch-2*p-2*(rh+p)},{x:2*p+cw2,y:3*p+2*rh,w:cw-2*p-cw2-p,h:ch-2*p-2*(rh+p)}]; } },
  '3x3':     { name:'3×3',       n:9, cells:(cw,ch,p)=>{ const iw=(cw-4*p)/3,ih=(ch-4*p)/3,out=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++) out.push({x:p+c*(iw+p),y:p+r*(ih+p),w:c===2?cw-2*p-2*(iw+p):iw,h:r===2?ch-2*p-2*(ih+p):ih}); return out; } },
};

const COLLAGE_UI_GROUPS = [
  { sep: null,              ids: ['auto', 'strip'] },
  { sep: '2–4 изображения', ids: ['1x2','2+1','2x2','3+1','1+3h','1v+3v','3v+1v','asym4'] },
  { sep: '5 изображений',   ids: ['2+3','3+2','1+4','4+1','1+4h','3v+2v','2v+3v','c4','2c2','circ4','circ4d','square5','arch5'] },
  { sep: '6 изображений',   ids: ['3x2','2x3','2+4','4+2','2v+4v','4v+2v','pyr6','rpyr6','corner6','panel6'] },
  { sep: '7 изображений',   ids: ['3+4','4+3','2+3+2'] },
  { sep: '8–10 изображений', ids: ['4x2','3x3','5x2'] },
  { sep: 'Спецраскладки',    ids: ['diag','stack'] },
];

function cvAutoLayout(count) {
  if (count <= 1) return 'single';
  if (count === 2) return '1x2';
  if (count === 3) return '2+1';
  if (count === 4) return '2x2';
  if (count === 5) return '2+3';
  if (count === 6) return '3x2';
  if (count === 7) return '3+4';
  if (count === 8) return '4x2';
  if (count === 9) return '3x3';
  return '5x2';
}

function cvResolveLayout(layout, count) {
  if (layout === 'auto') return cvAutoLayout(count);
  if (layout === 'strip') return layout;
  if (layout === 'diag' || layout === 'stack') return layout;
  if (layout === 'circ4') return count === 5 ? 'circ4' : cvAutoLayout(count);
  if (layout === 'circ4d') return count === 5 ? 'circ4d' : cvAutoLayout(count);
  if (layout === 'square5') return count === 5 ? 'square5' : cvAutoLayout(count);
  const L = COLLAGE_LAYOUTS[layout];
  if (!L) return cvAutoLayout(count);
  if (L.n !== count) return cvAutoLayout(count);
  return layout;
}

function cvCells(layout, count, cw, ch, p) {
  const L = cvResolveLayout(layout, count);
  if (L === 'strip') {
    const iw = (cw - (count + 1) * p) / count;
    return Array.from({length: count}, (_, i) => ({x: p + i * (iw + p), y: p, w: iw, h: ch - 2 * p}));
  }
  // circ4: imgs[0]=centre circle, imgs[1..4]=bg quads (order matches draw fn)
  if (L === 'circ4') {
    const hw=(cw-3*p)/2, hw2=cw-2*p-hw-p;
    const hh=(ch-3*p)/2, hh2=ch-2*p-hh-p;
    const r=Math.floor(Math.min(cw,ch)*0.30);
    return [
      {cx:cw/2,cy:ch/2,r,circle:true},
      {x:p,y:p,w:hw,h:hh},
      {x:2*p+hw,y:p,w:hw2,h:hh},
      {x:p,y:2*p+hh,w:hw,h:hh2},
      {x:2*p+hw,y:2*p+hh,w:hw2,h:hh2},
    ];
  }
  // circ4d: imgs[0]=centre circle, imgs[1..4]=диагональные (pinwheel) фоновые квадранты
  if (L === 'circ4d') {
    const cx=cw/2, cy=ch/2, off=Math.min(cw,ch)*0.16, r=Math.floor(Math.min(cw,ch)*0.30);
    return [
      {cx,cy,r,circle:true},
      {poly:[[p,p],[cw-p,p],[cx+off,cy],[cx-off,cy]]},
      {poly:[[cw-p,p],[cw-p,ch-p],[cx,cy+off],[cx,cy-off]]},
      {poly:[[cw-p,ch-p],[p,ch-p],[cx-off,cy],[cx+off,cy]]},
      {poly:[[p,ch-p],[p,p],[cx,cy-off],[cx,cy+off]]},
    ];
  }
  // square5: imgs[0]=centre square, imgs[1..4]=bg quads
  if (L === 'square5') {
    const hw=(cw-3*p)/2, hw2=cw-2*p-hw-p;
    const hh=(ch-3*p)/2, hh2=ch-2*p-hh-p;
    const side=Math.floor(Math.min(cw,ch)*0.55);
    return [
      {x:Math.round(cw/2-side/2),y:Math.round(ch/2-side/2),w:side,h:side,square:true},
      {x:p,y:p,w:hw,h:hh},
      {x:2*p+hw,y:p,w:hw2,h:hh},
      {x:p,y:2*p+hh,w:hw,h:hh2},
      {x:2*p+hw,y:2*p+hh,w:hw2,h:hh2},
    ];
  }
  return COLLAGE_LAYOUTS[L]?.cells(cw, ch, p, count) ?? [];
}

function cvDrawCirc4(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  // 4 фоновые картинки = сетка 2×2 на ВЕСЬ canvas (как обычный 2x2, без пустот)
  const halfW = (cw - 3 * p) / 2, halfW2 = cw - 2 * p - halfW - p;
  const halfH = (ch - 3 * p) / 2, halfH2 = ch - 2 * p - halfH - p;
  const grid = [
    {x: p,             y: p,             w: halfW,  h: halfH },
    {x: 2*p + halfW,   y: p,             w: halfW2, h: halfH },
    {x: p,             y: 2*p + halfH,   w: halfW,  h: halfH2},
    {x: 2*p + halfW,   y: 2*p + halfH,   w: halfW2, h: halfH2},
  ];
  grid.forEach((cell, i) => {
    if (i + 1 < imgs.length) cvFit(ctx, imgs[i + 1].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i + 1].transform);
  });
  // Круг сверху по центру, перекрывает стык 4 блоков
  const r = Math.floor(Math.min(cw, ch) * 0.30);
  const img = imgs[0].el;
  const d = r * 2;
  const { sx, sy, sw, sh } = cvFitSrcRect(img, d, d, imgs[0].transform);
  ctx.save();
  ctx.fillStyle = cv.bg;
  ctx.beginPath(); ctx.arc(cx, cy, r + Math.max(8, Math.round(p * 0.7)), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.shadowColor = 'transparent';
  ctx.drawImage(img, sx, sy, sw, sh, cx - r, cy - r, d, d);
  ctx.restore();
}

// circ4d: те же 4 картинки + круг, но фон — 4 диагональных (pinwheel) квадранта вместо прямой сетки 2×2
function cvDrawCirc4D(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  const off = Math.min(cw, ch) * 0.16;
  const polys = [
    [[p,p],[cw-p,p],[cx+off,cy],[cx-off,cy]],
    [[cw-p,p],[cw-p,ch-p],[cx,cy+off],[cx,cy-off]],
    [[cw-p,ch-p],[p,ch-p],[cx-off,cy],[cx+off,cy]],
    [[p,ch-p],[p,p],[cx,cy-off],[cx,cy+off]],
  ];
  polys.forEach((poly, i) => {
    if (i + 1 >= imgs.length) return;
    const xs = poly.map(pt => pt[0]), ys = poly.map(pt => pt[1]);
    const bx = Math.min(...xs), by = Math.min(...ys);
    const bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
    ctx.save();
    ctx.beginPath();
    poly.forEach(([x,y], k) => k === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
    ctx.closePath(); ctx.clip();
    // cvFit с transform, а не cvFitClip: иначе сдвиг и масштаб треугольника игнорировались
    cvFit(ctx, imgs[i + 1].el, bx, by, bw, bh, 0, imgs[i + 1].transform);
    ctx.restore();
  });
  // Круг сверху по центру, перекрывает стык 4 квадрантов
  const r = Math.floor(Math.min(cw, ch) * 0.30);
  const img = imgs[0].el;
  const d = r * 2;
  const { sx, sy, sw, sh } = cvFitSrcRect(img, d, d, imgs[0].transform);
  ctx.save();
  ctx.fillStyle = cv.bg;
  ctx.beginPath(); ctx.arc(cx, cy, r + Math.max(8, Math.round(p * 0.7)), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.shadowColor = 'transparent';
  ctx.drawImage(img, sx, sy, sw, sh, cx - r, cy - r, d, d);
  ctx.restore();
}

// Вписать картинку в произвольную clip-область (заполнение с обрезкой)
function cvFitClip(ctx, img, bx, by, bw, bh) {
  const ir = img.naturalWidth / img.naturalHeight, cr = bw / bh;
  let sx, sy, sw, sh;
  if (ir > cr) { sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth - sw) / 2; sy = 0; }
  else         { sw = img.naturalWidth;  sh = sw / cr; sx = 0; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, bx, by, bw, bh);
}

// square5: сетка 2×2 + квадратная плашка по центру
function cvDrawSquare5(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  const halfW = (cw - 3 * p) / 2, halfW2 = cw - 2 * p - halfW - p;
  const halfH = (ch - 3 * p) / 2, halfH2 = ch - 2 * p - halfH - p;
  const grid = [
    {x: p,           y: p,           w: halfW,  h: halfH },
    {x: 2*p + halfW, y: p,           w: halfW2, h: halfH },
    {x: p,           y: 2*p + halfH, w: halfW,  h: halfH2},
    {x: 2*p + halfW, y: 2*p + halfH, w: halfW2, h: halfH2},
  ];
  grid.forEach((cell, i) => {
    if (i + 1 < imgs.length) cvFit(ctx, imgs[i + 1].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i + 1].transform);
  });
  // Центральная квадратная плашка (+30% крупнее)
  const side = Math.floor(Math.min(cw, ch) * 0.55);
  const sqX = Math.round(cx - side / 2), sqY = Math.round(cy - side / 2);
  const sqRing = Math.max(8, Math.round(p * 0.7));
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 28;
  ctx.fillStyle = cv.bg;
  cvRR(ctx, sqX - sqRing, sqY - sqRing, side + sqRing*2, side + sqRing*2, cr); ctx.fill();
  ctx.restore();
  cvFit(ctx, imgs[0].el, sqX, sqY, side, side, cr, imgs[0].transform);
}

function cvDrawBurst(ctx, cx, cy, outerR, innerR, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    if (i === 0) ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    else ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
  }
  ctx.closePath();
}

// ── Слои оформления: модель ──
function cvNewLayerId() { return 'L' + Date.now().toString(36) + (++_cvLid); }

function cvLayerDefaults(type) {
  const b = { id: cvNewLayerId(), type, x: 0.5, y: 0.5, angle: 0, scale: 1, hidden: false };
  // Буквы: доли — от кегля. Тень по умолчанию — та, что надпись рисовала без подложки до 25.09.
  const tx = { font: type === 'text' ? 'serif' : 'mono', fill: 'solid', color2: '#facc15',
    stroke: false, strokeW: 0.08, strokeColor: '#000000',
    shadow: false, shadowColor: '#000000', shadowOpacity: 0.55, shadowBlur: 0.18, shadowDist: 0.04, shadowDir: 'down' };
  switch (type) {
    case 'sticker': return { ...b, ...tx, x: 0.8, y: 0.14, angle: -12, text: 'ХИТ', shape: 'burst', size: 180, bg: '#B45309', color: '#ffffff' };
    case 'ribbon':  return { ...b, ...tx, corner: 'tr', text: 'ПРЕДЗАКАЗ', size: 76, bg: '#dc2626', color: '#ffffff' };
    case 'text':    return { ...b, ...tx, shadow: true, text: 'Ваш текст', size: 80, color: '#ffffff', bold: true, bgOn: false, bgColor: '#000000', bgOpacity: 0.55 };
    case 'infog':   return { ...b, ...tx, text: '', size: 38, bg: '#0f172a', opacity: 0.82, color: '#ffffff', align: 'left' };
    case 'plat':    return { ...b, plats: ['PS5'] };
  }
  return null;
}
// Слой, сохранённый до шрифтов и эффектов букв (localStorage, сервер, бэкап, свой шаблон):
// надпись тогда сама отбрасывала тень, если у неё не было подложки. Переносим это в явный
// флаг, иначе заводское shadow: true легло бы и на надписи с подложкой — обложка изменилась бы.
function cvLayerCompat(spec) {
  if (spec && spec.type === 'text' && !('shadow' in spec)) return { ...spec, shadow: !spec.bgOn };
  return spec;
}

// Слой из чужих рук (сервер, бэкап, старая версия) доводим до полного: неизвестный тип
// выбрасываем, недостающие поля — заводские, битые координаты — в центр. Числа приводим
// к числам: «0.3» строкой после стрелки на клавиатуре склеивалось в «0.30.0009…» → NaN,
// и слой пропадал с обложки. Текст — к строке, платформы — к списку известных.
function cvSanitizeLayers() {
  const NUM = ['x', 'y', 'angle', 'scale', 'size', 'opacity', 'bgOpacity', 'strokeW', 'shadowOpacity', 'shadowBlur', 'shadowDist'];
  cv.layers = (Array.isArray(cv.layers) ? cv.layers : [])
    .filter(L => L && typeof L === 'object' && CV_LAYER_TYPES[L.type])
    .map(L => {
      const d = cvLayerDefaults(L.type);
      const o = { ...d, ...cvLayerCompat(L) };
      if ('font' in d && !CV_FONTS.some(f => f.id === o.font)) o.font = d.font;
      if ('fill' in d && o.fill !== 'grad') o.fill = 'solid';
      if (!o.id || typeof o.id !== 'string') o.id = cvNewLayerId();
      for (const k of NUM) {
        if (!(k in d)) continue;
        const v = +o[k];
        o[k] = Number.isFinite(v) ? v : (k === 'x' || k === 'y' ? 0.5 : d[k]);
      }
      if (o.scale <= 0) o.scale = 1;
      if (o.size <= 0) o.size = d.size;
      if ('text' in d && typeof o.text !== 'string') o.text = o.text == null ? '' : String(o.text);
      if ('plats' in d) o.plats = (Array.isArray(o.plats) ? o.plats : []).filter(id => CV_PLATFORMS.some(p => p.id === id));
      o.hidden = !!o.hidden;
      if ('stroke' in d) { o.stroke = !!o.stroke; o.shadow = !!o.shadow; }
      return o;
    });
  cv.tpls = (Array.isArray(cv.tpls) ? cv.tpls : []).filter(t => t && t.id && t.name && Array.isArray(t.layers));
  if (cv._selLayer && !cv.layers.some(L => L.id === cv._selLayer)) cv._selLayer = null;
}

// Перевод прежнего плоского формата (один стикер, одна надпись, одна инфографика, значки
// платформ) в слои. Выключенные надпись и инфографика со своим текстом переезжают скрытыми —
// написанное руками не пропадает. Позиции были в пикселях холста, теперь доли.
function cvLegacyLayers(o) {
  const [cw, ch] = CV_SZ[o.ratio] || CV_SZ['4:5'];
  const num = v => (v === null || v === undefined || v === '' || !Number.isFinite(+v)) ? null : +v;
  const out = [];
  const stTx = String(o.maskStickerText || '').trim();
  if (o.maskSticker && stTx) {
    const sz = num(o.maskStickerSize) || 180, pos = o.maskStickerPos || 'tr';
    const common = { text: stTx, bg: o.maskStickerBg || '#B45309', color: o.maskStickerColor || '#ffffff' };
    if (o.maskStickerShape === 'ribbon') {
      out.push({ ...cvLayerDefaults('ribbon'), ...common, corner: /^[tb][lr]$/.test(pos) ? pos : 'tr', size: Math.round(sz * 0.42) });
    } else {
      const L = { ...cvLayerDefaults('sticker'), ...common, size: sz, angle: num(o.maskStickerAngle) || 0,
        shape: CV_STICKER_SHAPES.some(([s]) => s === o.maskStickerShape) ? o.maskStickerShape : 'burst' };
      let x = num(o.maskStickerX), y = num(o.maskStickerY);
      if (x === null || y === null) {
        const mg = sz * 0.3;
        x = pos === 'tl' || pos === 'bl' ? mg + sz / 2 : pos === 'tr' || pos === 'br' ? cw - mg - sz / 2 : cw / 2;
        y = pos === 'tl' || pos === 'tr' ? mg + sz / 2 : pos === 'bl' || pos === 'br' ? ch - mg - sz / 2 : ch / 2;
      }
      L.x = x / cw; L.y = y / ch;
      out.push(L);
    }
  }
  const toTx = String(o.textOverlayText || '').trim();
  if (toTx) {
    const x = num(o.textOverlayX), y = num(o.textOverlayY);
    out.push({ ...cvLayerDefaults('text'), hidden: !o.textOverlay, text: o.textOverlayText,
      size: num(o.textOverlaySize) || 80, angle: num(o.textOverlayAngle) || 0,
      color: o.textOverlayColor || '#ffffff', bold: o.textOverlayBold !== false,
      bgOn: !!o.textOverlayBg, shadow: !o.textOverlayBg, bgColor: o.textOverlayBgColor || '#000000',
      bgOpacity: num(o.textOverlayBgOpacity) ?? 0.55,
      x: x === null ? 0.5 : x / cw, y: y === null ? 0.5 : y / ch });
  }
  if (o.platBadge && Array.isArray(o.platSel) && o.platSel.length) {
    const L = { ...cvLayerDefaults('plat'), plats: o.platSel.filter(id => CV_PLATFORMS.some(p => p.id === id)) };
    cvPlaceLayer(L, /^[tb][lr]$/.test(o.platBadgePos) ? o.platBadgePos : 'bl', cw, ch);
    out.push(L);
  }
  if (String(o.infogText || '').trim()) {
    const L = { ...cvLayerDefaults('infog'), hidden: !o.infog, text: o.infogText, size: num(o.infogSize) || 38,
      bg: o.infogBg || '#0f172a', opacity: num(o.infogBgOpacity) ?? 0.82, color: o.infogColor || '#ffffff',
      align: o.infogAlign === 'right' ? 'right' : 'left' };
    const x = num(o.infogX), y = num(o.infogY);
    if (x !== null && y !== null) {
      // прежние координаты — левый верхний угол блока плашек, у слоя — центр
      const f = cvLayerFrame(L, cw, ch);
      L.x = (x + f.w / 2) / cw; L.y = (y + f.h / 2) / ch;
    } else cvPlaceLayer(L, L.align === 'right' ? 'br' : 'bl', cw, ch);
    out.push(L);
  }
  return out;
}

function cvSelLayer() { return (cv.layers || []).find(L => L && L.id === cv._selLayer) || null; }
function cvHasLayer(type) { return (cv.layers || []).some(L => L && !L.hidden && L.type === type); }

// ── Слои: геометрия. Всё в пикселях холста шириной 1080, до масштаба слоя ──
function cvMctx() {
  if (!_cvMctx) _cvMctx = document.createElement('canvas').getContext('2d');
  return _cvMctx;
}
function cvLinesOf(text) { return String(text || '').split('\n').map(s => s.trim()).filter(Boolean); }

// Шрифт букв слоя строкой для ctx.font. Без поля font — прежний шрифт своего типа.
function cvFontOf(L) { return CV_FONTS.find(f => f.id === L.font) || CV_FONTS[L.type === 'text' ? 1 : 0]; }
function cvFontStr(L, fs) {
  const f = cvFontOf(L);
  return `${f.w || (L.type === 'text' && !L.bold ? 400 : 700)} ${fs}px ${f.fam}`;
}
// На сколько обводка выносит букву за её контур с каждой стороны — форма и плашка растут на это
function cvStrokeEx(L, fs) { return L.stroke ? Math.max(0, +L.strokeW || 0) * fs : 0; }

// Шрифт подгружается, только когда он впервые понадобился холсту; до загрузки буквы рисуются
// запасным, после — перерисовка. Строка в наборе — «уже просили»: сбойный файл не зациклит
// перерисовку. Образец с кириллицей — иначе грузится только латинский кусок шрифта.
const _cvFontAsked = new Set();
const CV_FONT_SAMPLE = 'АяAz';
function cvEnsureFont(L) {
  if (!document.fonts || !CV_TEXT_TYPES.includes(L.type)) return;
  const s = cvFontStr(L, 40);
  if (_cvFontAsked.has(s)) return;
  _cvFontAsked.add(s);
  if (document.fonts.check(s, CV_FONT_SAMPLE)) return;
  document.fonts.load(s, CV_FONT_SAMPLE).then(() => cvReDraw(), () => {});
}
// Перед скачиванием: все шрифты видимых слоёв на месте (иначе в файл уйдёт запасной)
function cvFontsReady() {
  if (!document.fonts) return Promise.resolve();
  const ls = (cv.layers || []).filter(L => L && !L.hidden && CV_TEXT_TYPES.includes(L.type));
  return Promise.all(ls.map(L => document.fonts.load(cvFontStr(L, 40), CV_FONT_SAMPLE))).catch(() => {});
}

// Перенос по словам ровно в k строк примерно равной ширины
function cvWrapWords(ctx, words, k) {
  if (k <= 1 || words.length < 2) return [words.join(' ')];
  const target = ctx.measureText(words.join(' ')).width / k;
  const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && lines.length < k - 1 && ctx.measureText(test).width > target * 1.08) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Стикер: шрифт задан размером, а форма растёт под текст. Пилюля и бейдж тянутся вширь;
// круглые формы подбирают перенос по словам, при котором описанный вокруг текста круг
// меньше («ЛУЧШАЯ ЦЕНА» в две строки даёт стикер компактнее, чем в одну длинную).
function cvStickerGeom(L) {
  const ctx = cvMctx();
  const S = +L.size || 180;
  const fs = Math.round(S * 0.3);
  ctx.font = cvFontStr(L, fs);
  const lh = fs * 1.12, ex = 2 * cvStrokeEx(L, fs);
  const meas = lines => ({ lines, tw: lines.length ? Math.max(...lines.map(l => ctx.measureText(l).width)) + ex : 0, th: lines.length ? lines.length * lh + ex : 0 });
  const given = cvLinesOf(L.text);
  let t = null;
  if (L.shape === 'pill' || L.shape === 'badge' || given.length !== 1) t = meas(given);
  else {
    const words = given[0].split(/\s+/);
    for (let k = 1; k <= Math.min(4, words.length); k++) {
      const m = meas(cvWrapWords(ctx, words, k));
      m.r = Math.hypot(m.tw / 2, m.th / 2);
      if (!t || m.r < t.r - 0.5) t = m;
    }
  }
  const tr = Math.hypot(t.tw / 2, t.th / 2), pad = fs * 0.4;
  let w, h, R = 0, inner = 0;
  switch (L.shape) {
    case 'pill':    h = t.th + fs * 0.95; w = Math.max(t.tw + h * 0.95, h * 1.6); break;
    case 'badge':   h = t.th + fs * 0.85; w = Math.max(t.tw + fs * 1.4, h * 1.5); break;
    case 'circle':  R = Math.max(S * 0.5, tr + pad); w = h = 2 * R; break;
    // текст — в круге, вписанном в шестиугольник (апофема = R·cos30°)
    case 'hex':     R = Math.max(S * 0.52, (tr + pad) / 0.866); w = 2 * R * 0.866; h = 2 * R; break;
    // ромб |x|+|y| ≤ R: угол прямоугольника текста должен лечь внутрь
    case 'diamond': R = Math.max(S * 0.52, t.tw / 2 + t.th / 2 + pad); w = h = 2 * R; break;
    // взрыв: ближе всего к центру впадины между лучами — текст в круге по впадинам
    default:        inner = Math.max(S * 0.3, tr + pad * 0.6); R = inner / 0.58; w = h = 2 * R;
  }
  return { fs, lh, lines: t.lines, w, h, R, inner };
}

// Лента в углу: срезается краями холста, сама отодвигается от угла под длину надписи.
// Середина ленты лежит на диагонали угла на расстоянии m; хорда внешней кромки = 2m − t,
// в неё должен уместиться текст с полями. Геометрия — сразу в координатах холста.
function cvRibbonGeom(L, cw, ch) {
  const ctx = cvMctx();
  const t = (+L.size || 76) * (L.scale || 1);
  const fs = Math.round(t * 0.46);
  ctx.font = cvFontStr(L, fs);
  const text = cvLinesOf(L.text).join(' ');
  const tw = text ? ctx.measureText(text).width + 2 * cvStrokeEx(L, fs) : 0;
  const m = Math.max(t * 1.6, (tw + fs * 1.4 + t) / 2);
  const c = /^[tb][lr]$/.test(L.corner) ? L.corner : 'tr';
  const sx = c[1] === 'r' ? -1 : 1, sy = c[0] === 'b' ? -1 : 1;   // направление внутрь холста
  const Cx = sx < 0 ? cw : 0, Cy = sy < 0 ? ch : 0;
  return { t, fs, text, tw, m, sx, sy, Cx, Cy,
    cx: Cx + sx * m / Math.SQRT2, cy: Cy + sy * m / Math.SQRT2,
    rot: (sx * sy < 0 ? 1 : -1) * Math.PI / 4, w: 2 * m, h: t };
}

function cvTextGeom(L) {
  const ctx = cvMctx();
  const fs = +L.size || 80;
  ctx.font = cvFontStr(L, fs);
  const lines = cvLinesOf(L.text);
  const lh = fs * 1.28, ex = cvStrokeEx(L, fs);
  const tw = lines.length ? Math.max(...lines.map(l => ctx.measureText(l).width)) : 0;
  const padX = fs * 0.55 + ex, padY = fs * 0.32 + ex;
  return { fs, lines, lh, tw, w: tw + padX * 2, h: lines.length * lh + padY * 2 };
}

// shift вращает строки, но первая (название товара) остаётся на месте — ось антидубля «4 вариантов»
function cvInfogLinesOf(text, shift) {
  let ls = cvLinesOf(text).slice(0, 6);
  if (shift && ls.length > 2) {
    const rest = ls.slice(1), s = shift % rest.length;
    ls = [ls[0], ...rest.slice(s), ...rest.slice(0, s)];

}
// Плашка растёт под строку. Если блок шире холста, уменьшается шрифт всего блока —
// строки больше не срезаются по буквам (раньше хвост строки просто пропадал).
function cvInfogGeom(L, cw, shift) {
  const ctx = cvMctx();
  const lines = cvInfogLinesOf(L.text, shift);
  const limit = cw * 0.92 / (L.scale || 1);
  let fs = +L.size || 38, widths = [], maxW = 0;
  for (let pass = 0; pass < 2; pass++) {
    ctx.font = cvFontStr(L, fs);
    widths = lines.map(l => ctx.measureText(l).width + fs * 1.5 + 2 * cvStrokeEx(L, fs));
    maxW = widths.length ? Math.max(...widths) : 0;
    if (maxW <= limit || pass) break;
    fs = Math.max(12, Math.floor(fs * limit / maxW));
  }
  const bh = fs * 1.75, gap = fs * 0.42;
  return { lines, fs, padX: fs * 0.75 + cvStrokeEx(L, fs), bh, gap, widths, w: maxW, h: lines.length ? lines.length * bh + (lines.length - 1) * gap : 0 };

function cvPlatGeom(L) {
  const ctx = cvMctx();
  const badges = (L.plats || []).map(id => CV_PLATFORMS.find(p => p.id === id)).filter(Boolean);
  const fs = 37;
  ctx.font = `bold ${fs}px ${CV_FONT_MONO}`;
  const bh = fs * 1.9, padX = fs * 0.85, gap = fs * 0.5;
  const widths = badges.map(b => ctx.measureText(b.id).width + padX * 2);
  const w = widths.reduce((a, x) => a + x, 0) + gap * Math.max(0, badges.length - 1);
  return { fs, badges, widths, bh, gap, w, h: badges.length ? bh : 0 };

function cvLayerGeom(L, cw, shift) {
  switch (L.type) {
    case 'sticker': return cvStickerGeom(L);
    case 'text':    return cvTextGeom(L);
    case 'infog':   return cvInfogGeom(L, cw, shift);
    case 'plat':    return cvPlatGeom(L);
  }
  return { w: 0, h: 0 };
}

// Рамка слоя на холсте: центр, размер с учётом масштаба, угол в радианах.
// Пустой слой получает рамку-минимум, чтобы его можно было найти и выделить.
function cvLayerFrame(L, cw, ch) {
  if (L.type === 'ribbon') { const g = cvRibbonGeom(L, cw, ch); return { cx: g.cx, cy: g.cy, w: g.w, h: g.h, rot: g.rot, ribbon: g }; }
  const g = cvLayerGeom(L, cw);
  const s = L.scale || 1;
  return { cx: L.x * cw, cy: L.y * ch, w: Math.max(g.w, 40) * s, h: Math.max(g.h, 40) * s, rot: (L.angle || 0) * Math.PI / 180, g };
}
// Полуразмеры повёрнутой рамки по осям холста
function cvFrameHalf(f) {
  const c = Math.abs(Math.cos(f.rot)), s = Math.abs(Math.sin(f.rot));
  return { hx: (f.w * c + f.h * s) / 2, hy: (f.w * s + f.h * c) / 2 };
}

// Поставить слой в угол/к краю/в центр холста: where — 'tl','tr','bl','br','c', 't','b'
function cvPlaceLayer(L, where, cw, ch) {
  if (L.type === 'ribbon') { if (/^[tb][lr]$/.test(where)) L.corner = where; return; }
  const { hx, hy } = cvFrameHalf(cvLayerFrame(L, cw, ch));
  const mg = cw * 0.045, v = where[0], h = where.length > 1 ? where[1] : '';
  const x = h === 'l' ? mg + hx : h === 'r' ? cw - mg - hx : cw / 2;
  const y = v === 't' ? mg + hy : v === 'b' ? ch - ch * 0.06 - hy : ch / 2;
  L.x = x / cw; L.y = y / ch;
}

// Перед отрисовкой возвращаем слои на холст (перетащенное в 4:5 вниз не должно пропасть
// в квадрате — дефект 23.09). Надпись, инфографика и значки — целиком внутри, если влезают;
// стикер может заходить за край (это приём), но его центр остаётся на холсте.
function cvClampLayers(cw, ch) {
  let changed = false;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  for (const L of cv.layers || []) {
    if (!L || L.type === 'ribbon') continue;
    const f = cvLayerFrame(L, cw, ch);
    let x, y;
    if (L.type === 'sticker') { x = cl(f.cx, 0, cw); y = cl(f.cy, 0, ch); }
    else {
      const { hx, hy } = cvFrameHalf(f);
      x = hx * 2 >= cw ? cw / 2 : cl(f.cx, hx, cw - hx);
      y = hy * 2 >= ch ? ch / 2 : cl(f.cy, hy, ch - hy);
    }
    if (Math.abs(x - f.cx) > 0.01 || Math.abs(y - f.cy) > 0.01) { L.x = x / cw; L.y = y / ch; changed = true; }
  }
  return changed;
}

// Попадание точки холста в рамку слоя (с допуском в несколько пикселей)
function cvLayerHit(L, mx, my, cw, ch) {
  const f = cvLayerFrame(L, cw, ch);
  const dx = mx - f.cx, dy = my - f.cy, c = Math.cos(-f.rot), s = Math.sin(-f.rot);
  const lx = dx * c - dy * s, ly = dx * s + dy * c;
  return Math.abs(lx) <= f.w / 2 + 6 && Math.abs(ly) <= f.h / 2 + 6;
}
// Верхний видимый слой под точкой
function cvLayerAt(mx, my, cw, ch) {
  const ls = cv.layers || [];
  for (let i = ls.length - 1; i >= 0; i--) {
    const L = ls[i];
    if (L && !L.hidden && cvLayerHit(L, mx, my, cw, ch)) return L;
  }
  return null;
}

// Ручки выделенного слоя. k — пикселей холста на пиксель экрана: ручки одного экранного
// размера при любом масштабе превью. У ленты нет поворота, а размер тянут от угла холста.
function cvLayerHandles(f, k) {
  if (f.ribbon) {
    const g = f.ribbon, d = g.m + g.t / 2 + 16 * k;
    return { scale: { x: g.Cx + g.sx * d / Math.SQRT2, y: g.Cy + g.sy * d / Math.SQRT2 }, rotate: null, anchor: { x: g.Cx, y: g.Cy } };
  }
  const at = (lx, ly) => ({ x: f.cx + lx * Math.cos(f.rot) - ly * Math.sin(f.rot), y: f.cy + lx * Math.sin(f.rot) + ly * Math.cos(f.rot) });

}
function cvScreenK(canvas) {
  const r = canvas.getBoundingClientRect();
  return r.width ? canvas.width / r.width : 1;
}

// ── Слои: отрисовка ──
function cvStickerPath(ctx, shape, g) {
  switch (shape) {
    case 'pill':  cvRR(ctx, -g.w / 2, -g.h / 2, g.w, g.h, g.h / 2); break;
    case 'badge': cvRR(ctx, -g.w / 2, -g.h / 2, g.w, g.h, g.h * 0.25); break;
    case 'circle': ctx.beginPath(); ctx.arc(0, 0, g.R, 0, Math.PI * 2); break;
    case 'hex':
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; const px = g.R * Math.cos(a), py = g.R * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); break;
    case 'diamond':
      ctx.beginPath(); ctx.moveTo(0, -g.R); ctx.lineTo(g.R, 0); ctx.lineTo(0, g.R); ctx.lineTo(-g.R, 0); ctx.closePath(); break;

  }
}
function cvHexA(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  const n = m ? parseInt(m[1], 16) : 0;
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${Math.max(0, Math.min(1, +a || 0))})`;
}
// Буквы слоя: заливка цветом или градиентом (сверху вниз по строке), обводка, тень.
// Размытие и сдвиг тени холст не масштабирует вместе с рисунком, поэтому k — текущий
// масштаб слоя: тень растёт вместе с буквами. Базовая линия у всех — middle.
function cvDrawLetters(ctx, L, text, x, y, fs) {
  const ex = cvStrokeEx(L, fs);

    if (ex > 0) {
      c.lineJoin = 'round';
      c.lineWidth = 2 * ex;
      c.strokeStyle = L.strokeColor || '#000000';
      c.strokeText(text, x, y);
    }

      gr.addColorStop(0, L.color); gr.addColorStop(1, L.color2 || L.color);
      c.fillStyle = gr;

  ctx.shadowOffsetY = diag ? d * Math.SQRT1_2 : d;
  if (!(ex > 0)) { paint(ctx); ctx.restore(); return; }
  // С обводкой буквы рисуются двумя слоями, и тень от каждого по отдельности не годится:
  // от одной обводки выходит пустое кольцо (дефект ревью 25.09), от обоих — двойная темнота
  // там, где они перекрываются. Поэтому буквы с обводкой собираем на отдельном холсте
  // (вдвое плотнее — повёрнутая надпись не мылится) и кладём его одним куском с тенью.
  const m = ctx.measureText(text), pad = ex + 2;

  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight + 2 * pad;

  oc.width = Math.max(1, Math.ceil(w * s)); oc.height = Math.max(1, Math.ceil(h * s));
  const o = oc.getContext('2d');
  o.scale(s, s); o.translate(-left, -top);
  o.font = ctx.font; o.textAlign = ctx.textAlign; o.textBaseline = ctx.textBaseline;
  paint(o);

}
function cvDrawSticker(ctx, L, g) {

  cvStickerPath(ctx, L.shape, g); ctx.fillStyle = L.bg; ctx.fill();
  ctx.restore();
  ctx.font = cvFontStr(L, g.fs);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  g.lines.forEach((l, i) => cvDrawLetters(ctx, L, l, 0, (i - (g.lines.length - 1) / 2) * g.lh + g.fs * 0.04, g.fs));
}
function cvDrawRibbon(ctx, L, cw, ch) {
  const g = cvRibbonGeom(L, cw, ch);

  ctx.save();
  ctx.translate(g.cx, g.cy); ctx.rotate(g.rot);
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = g.t * 0.25; ctx.shadowOffsetY = g.t * 0.06;

  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1.5, g.t * 0.035);
  ctx.beginPath(); ctx.moveTo(-len / 2, -e); ctx.lineTo(len / 2, -e); ctx.moveTo(-len / 2, e); ctx.lineTo(len / 2, e); ctx.stroke();
  ctx.font = cvFontStr(L, g.fs);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  cvDrawLetters(ctx, L, g.text, 0, g.fs * 0.05, g.fs);
  ctx.restore();
}
function cvDrawTextLayer(ctx, L, g) {
  if (!g.lines.length) return;
  if (L.bgOn) {
    ctx.save();
    ctx.globalAlpha = +L.bgOpacity;
    cvRR(ctx, -g.w / 2, -g.h / 2, g.w, g.h, g.fs * 0.22); ctx.fillStyle = L.bgColor; ctx.fill();
    ctx.restore();

  ctx.save();
  ctx.font = cvFontStr(L, g.fs);

  if (!g.lines.length) return;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let x = -g.w / 2;
  const y = -g.h / 2;
  g.badges.forEach((b, i) => {
    const w = g.widths[i];
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = g.fs * 0.6; ctx.shadowOffsetY = g.fs * 0.12;
    cvRR(ctx, x, y, w, g.bh, g.bh * 0.24); ctx.fillStyle = b.bg; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#fff';
    ctx.fillText(b.id, x + w / 2, y + g.bh / 2 + g.fs * 0.04);
    x += w + g.gap;
  });
  ctx.restore();
}
function cvDrawLayer(ctx, L, cw, ch, shift) {
  if (L.type === 'ribbon') return cvDrawRibbon(ctx, L, cw, ch);
  const g = cvLayerGeom(L, cw, shift);
  ctx.save();
  ctx.translate(L.x * cw, L.y * ch);
  if (L.angle) ctx.rotate(L.angle * Math.PI / 180);
  const s = L.scale || 1;
  if (s !== 1) ctx.scale(s, s);
  if (L.type === 'sticker') cvDrawSticker(ctx, L, g);
  else if (L.type === 'text') cvDrawTextLayer(ctx, L, g);
  else if (L.type === 'infog') cvDrawInfogLayer(ctx, L, g);
  else if (L.type === 'plat') cvDrawPlatLayer(ctx, L, g);
  ctx.restore();
}
// ov (переопределение для «✨ 4 варианта»): {align, bg, shift} для инфографики — сторона, цвет
// плашек и порядок строк как оси антидубля; перетащенное место при этом не держим, иначе
// варианты не отличались бы.
// Переопределяется только ПЕРВАЯ видимая инфографика: вторую тот же угол положил бы поверх неё.
function cvDrawLayers(ctx, cw, ch, ov) {
  const ovTarget = ov ? (cv.layers || []).find(L => L && !L.hidden && L.type === 'infog') : null;
  for (const L of cv.layers || []) {
    if (!L || L.hidden) continue;
    cvEnsureFont(L);
    if (L === ovTarget) {
      const V = { ...L, bg: ov.bg || L.bg, align: ov.align || L.align };
      cvPlaceLayer(V, V.align === 'right' ? 'br' : 'bl', cw, ch);
      cvDrawLayer(ctx, V, cw, ch, ov.shift);
    } else cvDrawLayer(ctx, L, cw, ch);
  }
}
// Рамка выделенного слоя с ручками — только на живом превью, в скачанный файл не попадает
function cvDrawSelection(ctx, canvas, cw, ch) {
  const L = cvSelLayer();
  if (!L || L.hidden) return;
  const k = cvScreenK(canvas);
  const f = cvLayerFrame(L, cw, ch), h = cvLayerHandles(f, k);
  ctx.save();
  if (cv._guides && (cv._guides.v || cv._guides.h)) {
    ctx.strokeStyle = 'rgba(45,212,191,0.9)'; ctx.lineWidth = 1.5 * k; ctx.setLineDash([6 * k, 6 * k]);
    ctx.beginPath();
    if (cv._guides.v) { ctx.moveTo(cw / 2, 0); ctx.lineTo(cw / 2, ch); }
    if (cv._guides.h) { ctx.moveTo(0, ch / 2); ctx.lineTo(cw, ch / 2); }
    ctx.stroke();
  }
  ctx.translate(f.cx, f.cy); ctx.rotate(f.rot);
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2 * k; ctx.setLineDash([8 * k, 6 * k]);
  ctx.strokeRect(-f.w / 2 - 4 * k, -f.h / 2 - 4 * k, f.w + 8 * k, f.h + 8 * k);
  ctx.setLineDash([]);
  if (h.rotate) { ctx.beginPath(); ctx.moveTo(0, -f.h / 2 - 4 * k); ctx.lineTo(0, -f.h / 2 - 22 * k); ctx.stroke(); }
  ctx.restore();
  const dot = (p, fill) => {
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, 10 * k, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.5 * k; ctx.strokeStyle = '#B45309'; ctx.stroke();
    ctx.restore();
  };
  if (h.rotate) dot(h.rotate, '#ffffff');
  dot(h.scale, '#facc15');
}

// ⚡ Автозаполнение инфографики из формы генератора — набор строк зависит от категории.
// Для игр цену НЕ подставляем (запрет цен в объявлениях игр — тот же принцип, что в сканере),
// вместо неё — обязательная фраза «Оформляется в цифре».
function cvInfogBuildLines() {
  const f = state.form;
  const L = [];
  if (f.category === 'gaming_sub') {
    L.push(`🎮 ${f.subType}`);
    if (f.platforms?.length) L.push(`✔️ ${f.platforms.join(' / ')}`);
    const games = (f.games || '').split(',').map(s => s.trim()).filter(Boolean);
    if (games.length) L.push(`🔥 ${games.length > 1 ? `${games[0]} +${games.length - 1} игр` : games[0]}`);
    const ds = (f.durations || []).filter(d => d.price && +String(d.price).replace(/\D/g, ''));
    if (ds.length) {
      const last = ds[ds.length - 1];
      const months = parseInt(last.period) || 1;
      const price = +String(last.price).replace(/\D/g, '');
      L.push(months > 1 ? `💲 от ${Math.round(price / months)}₽/мес` : `💲 ${price}₽`);
    }
  } else if (f.category === 'ai_sub') {
    if (f.aiService) L.push(`🧠 ${f.aiService}`);
    (f.aiFeatures || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 2)
      .forEach(x => L.push(`✔️ ${x}`));
    if (f.aiPrice) L.push(`💲 ${f.aiPrice}₽ / ${f.aiDuration || '1 месяц'}`);
  } else if (f.category === 'game') {
    if (f.gameName) L.push(`🕹️ ${f.gameName}`);
    if (f.gamePlatforms?.length) L.push(`✔️ ${f.gamePlatforms.join(' / ')}`);
    if (f.gameGenre) L.push(`🎯 ${f.gameGenre}`);
    L.push('⚡ Оформляется в цифре');
  } else if (f.category === 'digital') {
    if (f.digitalName) L.push(`📦 ${f.digitalName}`);
    if (f.digitalPrice) L.push(`💲 ${f.digitalPrice}₽`);
    L.push('⚡ Быстрая выдача');
  } else {
    // Категория из конструктора: строки собираются по дескриптору — название
    // (флажок «название товара»), цена (флажок «цена товара»), остальные
    // заполненные поля в порядке формы.
    const c = catDef(f.category);
    const nameFd  = c.fields.find(fd => fd.isName);
    const priceFd = c.fields.find(fd => fd.isPrice);
    if (nameFd) { const v = String(fieldVal(f, nameFd)).trim(); if (v) L.push(`📦 ${v}`); }
    const others = [];
    for (const fd of c.fields) {
      if (fd === nameFd || fd.isPrice) continue;
      if (!['text', 'num', 'area', 'select', 'chips'].includes(fd.type)) continue;
      const v = fieldVal(f, fd);
      const s = (Array.isArray(v) ? v.join(' / ') : String(v)).trim();
      if (s) others.push(`✔️ ${s.length > 40 ? s.slice(0, 39).trim() + '…' : s}`);
    }
    // Цена — последней строкой, как у встроенных категорий: оставляем ей место.
    // Но если категория сама запрещает цену в тексте (правило game_price, у
    // физтовара оно включено), на обложку её тоже не ставим — иначе Сканер
    // ругается на ту же цифру, которую инфографика только что нарисовала.
    const priceAllowed = priceFd && !scanRuleOn(f.category, 'game_price');
    const price = priceAllowed ? String(fieldVal(f, priceFd)).replace(/\D/g, '') : '';
    L.push(...others.slice(0, price ? 3 : 4));
    if (price) L.push(`💲 ${price}₽`);
  }
  return L.slice(0, 5);
}
// Заполняет выбранную инфографику, а если выбрана не она — первую на обложке
function cvInfogFillFromForm() {
  const lines = cvInfogBuildLines();
  if (!lines.length) { toast('Форма генератора пуста — заполнить нечего'); return; }
  const sel = cvSelLayer();
  const L = sel && sel.type === 'infog' ? sel : (cv.layers || []).find(x => x.type === 'infog');
  if (!L) return;
  jlog('cv_infog_fill', null, { category: state.form.category, lines: lines.length });
  L.text = lines.join('\n');
  cvLayersChanged();
}

// Платформы для значков — из формы генератора (подписка или игра — по категории), иначе PS5
function cvFormPlats() {
  const f = state.form || {};
  const list = f.category === 'game' ? f.gamePlatforms : f.category === 'gaming_sub' ? f.platforms : null;
  const src = (Array.isArray(list) ? list : []).join(' ');
  const got = CV_PLATFORMS.map(p => p.id).filter(id => new RegExp('(^|[^a-z0-9])' + id + '([^a-z0-9]|$)', 'i').test(src));
  return got.length ? got : ['PS5'];
}

// ── Слои: действия из панели ──
// «↶ Отменить» — ровно одно последнее действие (удаление, шаблон). Вместе со снимком «до»
// запоминаем отпечаток «сразу после»: любая следующая правка элементов, фона или эффектов
// его меняет, и отмена гаснет. Иначе она молча стирала бы всё, сделанное после (находка ревью).
function cvLayersSnap(what) { cv._layersUndo = { what, layers: JSON.parse(JSON.stringify(cv.layers || [])), style: Object.fromEntries(CV_TPL_STYLE_KEYS.map(k => [k, cv[k]])), after: null }; }
function cvUndoStamp() { return JSON.stringify({ l: cv.layers || [], s: CV_TPL_STYLE_KEYS.map(k => cv[k]) }); }
function cvLayersSnapDone() {
  if (!cv._layersUndo) return;
  // отрисовка возвращает слои на холст — делаем это до отпечатка, чтобы он не разошёлся сам
  const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  cvClampLayers(cw, ch);
  cv._layersUndo.after = cvUndoStamp();
}
function cvUndoValid() {
  const u = cv._layersUndo;
  if (u && u.after !== cvUndoStamp()) cv._layersUndo = null;
  return !!cv._layersUndo;
}
function cvLayersChanged() { cvReDraw(); cvRefreshLayersCard(); }
function cvRefreshLayersCard() {
  const c = document.getElementById('cv-layers-card');
  if (c) c.outerHTML = cvLayersCardHTML();
}
function cvRefreshTplCard() {
  const c = document.getElementById('cv-tpl-card');
  if (c) c.outerHTML = cvTplCardHTML();
}
// Подпись «угол · масштаб» в редакторе — живьём во время перетаскивания ручек
function cvUpdateLayerReadout(L) {
  const el = document.getElementById('cv-ltf');
  if (el && L && L.id === cv._selLayer) el.textContent = L.type === 'ribbon' ? `${Math.round((L.scale || 1) * 100)}%` : `${Math.round(L.angle || 0)}° · ${Math.round((L.scale || 1) * 100)}%`;
}

function cvAddLayer(type) {
  const L = cvLayerDefaults(type);
  if (!L) return;
  const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  if (type === 'infog') {
    L.text = cvInfogBuildLines().join('\n') || '✔️ Первая характеристика\n✔️ Вторая';
    cvPlaceLayer(L, 'bl', cw, ch);
  } else if (type === 'plat') { L.plats = cvFormPlats(); cvPlaceLayer(L, 'tl', cw, ch); }
  // занятый угол не перекрываем: новая лента встаёт в первый свободный
  else if (type === 'ribbon') L.corner = ['tr', 'tl', 'br', 'bl'].find(c => !(cv.layers || []).some(x => x.type === 'ribbon' && !x.hidden && x.corner === c)) || 'tr';
  cv.layers.push(L);
  cv._selLayer = L.id;
  jCvBump('layers');
  cvLayersChanged();
}

function cvLayerAction(a) {
  const i = a.indexOf(':');
  const op = i < 0 ? a : a.slice(0, i), arg = i < 0 ? '' : a.slice(i + 1);
  if (op === 'add') return cvAddLayer(arg);
  if (op === 'undo') {
    if (!cvUndoValid()) {
      toast('После этого уже были правки — отмена стёрла бы их, поэтому её нет');
      cvRefreshLayersCard(); return;
    }
    const u = cv._layersUndo;
    cv.layers = u.layers;
    for (const k of CV_TPL_STYLE_KEYS) if (k in u.style) cv[k] = u.style[k];
    cv._layersUndo = null; cv._selLayer = null;
    cvSanitizeLayers();
    render(); return;
  }
  if (op === 'sel') { cv._selLayer = arg; return cvLayersChanged(); }
  if (op === 'hide') {
    const L = cv.layers.find(x => x.id === arg);
    if (L) L.hidden = !L.hidden;
    return cvLayersChanged();
  }
  const L = cvSelLayer();
  if (!L) return;
  const idx = cv.layers.indexOf(L);
  switch (op) {
    case 'del': {
      const name = cvLinesOf(L.text)[0] || CV_LAYER_TYPES[L.type].name;
      cvLayersSnap(`удаление «${name.slice(0, 20)}»`);
      cv.layers.splice(idx, 1); cv._selLayer = null; cvLayersSnapDone(); break;
    }
    case 'dup': {
      const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const D = { ...JSON.parse(JSON.stringify(L)), id: cvNewLayerId() };
      // свободный угол — как у «+ Лента»: скрытые ленты угол не занимают
      if (D.type === 'ribbon') D.corner = ['tr', 'tl', 'br', 'bl'].find(c => !cv.layers.some(x => x.type === 'ribbon' && !x.hidden && x.corner === c)) || D.corner;
      else { D.x = Math.min(1, D.x + 40 / cw); D.y = Math.min(1, D.y + 40 / ch); }
      cv.layers.splice(idx + 1, 0, D); cv._selLayer = D.id; break;
    }
    case 'up':   if (idx < cv.layers.length - 1) cv.layers.splice(idx + 1, 0, cv.layers.splice(idx, 1)[0]); break;
    case 'down': if (idx > 0) cv.layers.splice(idx - 1, 0, cv.layers.splice(idx, 1)[0]); break;
    case 'reset-rot':   L.angle = 0; break;
    case 'reset-scale': L.scale = 1; break;
    case 'fill': return cvInfogFillFromForm();
  }
  cvLayersChanged();
}

function cvLayerClick(el) {
  const ds = el.dataset;
  if (ds.cvTpl) return cvTplAction(ds.cvTpl);
  if (ds.cvLa) return cvLayerAction(ds.cvLa);
  const L = cvSelLayer();
  if (!L) return;
  if (ds.cvLv) { const i = ds.cvLv.indexOf(':'); L[ds.cvLv.slice(0, i)] = ds.cvLv.slice(i + 1); }
  else if (ds.cvLt) L[ds.cvLt] = !L[ds.cvLt];
  else if (ds.cvLplat) {
    const on = new Set(L.plats || []);
    on.has(ds.cvLplat) ? on.delete(ds.cvLplat) : on.add(ds.cvLplat);
    L.plats = CV_PLATFORMS.map(p => p.id).filter(id => on.has(id));
  }
  cvLayersChanged();
}

// ── Шаблоны оформления ──
function cvTplAction(a) {
  const i = a.indexOf(':');
  const op = i < 0 ? a : a.slice(0, i), id = i < 0 ? '' : a.slice(i + 1);
  if (op === 'save') return cvSaveTpl();
  if (op === 'apply') return cvApplyTpl(id);
  if (op === 'del') {
    const t = (cv.tpls || []).find(x => x.id === id);
    if (!t || !confirm(`Удалить шаблон «${t.name}»?`)) return;
    cv.tpls = cv.tpls.filter(x => x !== t);
    cvSave(); cvRefreshTplCard();
  }
}

// Шаблон ЗАМЕНЯЕТ элементы на обложке своим набором (и у своих шаблонов — фон, эффекты,
// рамку). Прежнее состояние уходит в «↶ Отменить».
function cvApplyTpl(id) {
  const tpl = CV_TPL_BUILTIN.find(t => t.id === id) || (cv.tpls || []).find(t => t.id === id);
  if (!tpl) return;
  cvLayersSnap(`шаблон «${tpl.name}»`);
  const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  let emptyForm = false;
  cv.layers = (tpl.layers || []).map(spec => {
    const { place, fromForm, id: _old, ...rest } = spec;
    if (!CV_LAYER_TYPES[spec.type]) return null;
    const L = { ...cvLayerDefaults(spec.type), ...cvLayerCompat(JSON.parse(JSON.stringify(rest))), id: cvNewLayerId() };
    if (fromForm && L.type === 'infog') { L.text = cvInfogBuildLines().join('\n'); if (!L.text) emptyForm = true; }
    if (fromForm && L.type === 'plat') L.plats = cvFormPlats();
    if (place) cvPlaceLayer(L, place, cw, ch);
    return L;
  }).filter(Boolean);
  if (tpl.style) for (const k of CV_TPL_STYLE_KEYS) if (k in tpl.style) cv[k] = tpl.style[k];
  cv._selLayer = null;
  cvLayersSnapDone();
  jCvBump('tpls');
  jlog('cv_tpl', null, { tpl: tpl.name, builtin: !!CV_TPL_BUILTIN.find(t => t.id === id), layers: cv.layers.length });
  if (emptyForm) toast('Форма генератора пуста — строки инфографики впиши сам');
  render();
}

function cvSaveTpl() {
  const name = (prompt('Название шаблона:', '') || '').trim();
  if (!name) return;
  const same = (cv.tpls || []).find(t => t.name === name);
  if (same && !confirm(`Шаблон «${name}» уже есть. Заменить?`)) return;
  // Инфографика, заполненная из формы и не тронутая руками, запоминается как «из формы»:
  // иначе шаблон таскал бы строки одного товара на обложки всех следующих
  const formLines = cvInfogBuildLines().join('\n');
  const layers = (cv.layers || []).map(({ id, ...rest }) => {
    const L = JSON.parse(JSON.stringify(rest));
    if (L.type === 'infog' && formLines && cvLinesOf(L.text).join('\n') === formLines) { L.fromForm = true; L.text = ''; }
    return L;
  });
  const style = Object.fromEntries(CV_TPL_STYLE_KEYS.map(k => [k, cv[k]]));
  const tpl = { id: same ? same.id : 'u' + Date.now().toString(36), name, layers, style };
  cv.tpls = same ? cv.tpls.map(t => t === same ? tpl : t) : [...(cv.tpls || []), tpl];
  cvSave(); cvRefreshTplCard();
  toast(`Шаблон «${name}» сохранён`);
}

// ── Effects over collage (vignette / tone / neon seam) ──
function cvDrawEffects(ctx, cw, ch, lay, p, count, opts) {
  const special = ['diag','stack'];
  // Neon seam — glowing outline of each cell (incl. single image, circ4/square5)
  if (cv.neonGap && !special.includes(lay)) {
    const cells = cvCells(lay, count, cw, ch, p);
    if (cells.length) {
      ctx.save();
      ctx.shadowColor = cv.neonColor;
      ctx.shadowBlur = Math.max(12, p * 1.7);
      ctx.strokeStyle = cv.neonColor;
      ctx.lineWidth = Math.max(2.5, p * 0.32);
      const rad = Math.max(4, p * 0.7);
      const strokeCell = c => {
        if (c.circle) { ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2); }
        else if (c.poly) { ctx.beginPath(); c.poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); }
        else cvRR(ctx, c.x, c.y, c.w, c.h, rad);
        ctx.stroke(); ctx.stroke();
      };
      // Круг+4, круг+4 диагональный, квадрат+4: фоновые ячейки уходят под центральную фигуру,
      // и их швы, нарисованные поверх всего, перечёркивали круг белыми линиями. Режем швы
      // фона по центральной фигуре с её кольцом, саму фигуру обводим отдельно.
      const centre = (lay === 'circ4' || lay === 'circ4d' || lay === 'square5') ? cells[0] : null;
      if (centre) {
        const ring = Math.max(8, Math.round(p * 0.7));
        ctx.save();
        ctx.beginPath(); ctx.rect(0, 0, cw, ch);
        if (centre.circle) { ctx.moveTo(centre.cx + centre.r + ring, centre.cy); ctx.arc(centre.cx, centre.cy, centre.r + ring, 0, Math.PI * 2); }
        else ctx.rect(centre.x - ring, centre.y - ring, centre.w + 2*ring, centre.h + 2*ring);
        ctx.clip('evenodd');
        cells.slice(1).forEach(strokeCell);
        ctx.restore();
        strokeCell(centre);
      } else cells.forEach(strokeCell);
      ctx.restore();
    }
  }
  // Vignette
  if (cv.vignette) {
    const vg = ctx.createRadialGradient(cw/2, ch/2, Math.min(cw,ch)*0.30, cw/2, ch/2, Math.max(cw,ch)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,cw,ch);
  }
  // Color tone
  if (cv.grade && cv.grade !== 'none') {
    const g = ctx.createLinearGradient(0,0,cw,ch);
    if (cv.grade === 'warm') {
      g.addColorStop(0,'rgba(180,83,9,0.22)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(124,45,18,0.20)');
    } else {
      g.addColorStop(0,'rgba(13,148,136,0.22)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(30,64,175,0.22)');
    }
    ctx.fillStyle = g; ctx.fillRect(0,0,cw,ch);
  }
}

// ── Diagonal stripes (scales to any photo count) ──
function cvDrawDiagStripes(ctx, imgs, cw, ch, p) {
  const n = imgs.length; if (!n) return;
  const skew = cw * 0.16;
  const W = (cw + skew) / n;
  const g = Math.max(2, p * 0.5);
  for (let i = 0; i < n; i++) {
    const poly = [
      [i*W + g,            0],
      [(i+1)*W - g,        0],
      [(i+1)*W - skew - g, ch],
      [i*W - skew + g,     ch],
    ];
    ctx.save();
    ctx.beginPath();
    poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
    ctx.closePath(); ctx.clip();
    const xs = poly.map(pt=>pt[0]), ys = poly.map(pt=>pt[1]);
    const bx = Math.min(...xs), by = Math.min(...ys);
    cvFitClip(ctx, imgs[i].el, bx, by, Math.max(...xs)-bx, Math.max(...ys)-by);
    ctx.restore();
  }
}

// ── Stack of overlapping rotated cards ──
function cvDrawStack(ctx, imgs, cw, ch, p) {
  const n = imgs.length; if (!n) return;
  const cols = n <= 2 ? n : (n <= 4 ? 2 : 3);
  const rows = Math.ceil(n / cols);
  const cellW = cw / cols, cellH = ch / rows;
  const cardW = cellW * 1.04, cardH = cellH * 1.04;
  const cr = Math.max(10, p * 1.3);
  imgs.forEach((img, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = col*cellW + cellW/2, cy = row*cellH + cellH/2;
    const rot = (((i*53) % 11) - 5) * Math.PI/180;
    const x = cx - cardW/2, y = cy - cardH/2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(-cx, -cy);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = cw*0.03; ctx.shadowOffsetY = cw*0.012;
    cvRR(ctx, x, y, cardW, cardH, cr); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save(); cvRR(ctx, x, y, cardW, cardH, cr); ctx.clip();
    cvFitClip(ctx, img.el, x, y, cardW, cardH);
    ctx.restore();
    ctx.restore();
  });
}

// Redraw active preview (collage or game-mode variants)
function cvReDraw() {
  cvSave(); // GFX-10: слайдеры/цвета/эффекты меняют cv и зовут cvReDraw — персистим настройки
  const c = document.getElementById('cv-canvas');
  if (!c || !cv.images.length) return;
  if (cv.mode === 'game') { cvDrawGame(c, cv.images[0], {}); if (cv._gameVars) cvGenerateVariations(); }
  else cvDrawCollage(c);
}

function cvDrawCollage(canvas, opts) {
  const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  canvas.width=cw; canvas.height=ch;
  const ctx = canvas.getContext('2d');
  if (cvClampLayers(cw, ch)) cvSave();
  const p   = opts?.padding ?? cv.padding;
  const imgs= opts?.images ?? cv.images;
  // Раскладку разрешаем по числу картинок так же, как cvCells: иначе «Круг+4» с четырьмя фото
  // рисовался кругом, а швы, клики и перетаскивание шли по ячейкам «авто»-сетки
  const lay = cvResolveLayout(opts?.layout ?? cv.layout, imgs.length);
  // Background: solid (original) or gradient
  if (!opts?.bg && cv.bgStyle === 'gradient') {
    const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
    bgGrad.addColorStop(0, cv.bg);
    bgGrad.addColorStop(1, cv.bg2);
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = opts?.bg ?? cv.bg;
  }
  ctx.fillRect(0,0,cw,ch);
  if (!imgs.length) return;
  const cr = Math.max(4, p * 0.7);
  if (lay === 'circ4') {
    cvDrawCirc4(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'circ4d') {
    cvDrawCirc4D(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'square5') {
    cvDrawSquare5(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'diag') {
    cvDrawDiagStripes(ctx, imgs, cw, ch, p);
  } else if (lay === 'stack') {
    cvDrawStack(ctx, imgs, cw, ch, p);
  } else {
    const cells = cvCells(lay, imgs.length, cw, ch, p);
    cells.forEach((cell,i) => {
      if (i < imgs.length) cvFit(ctx, imgs[i].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i].transform);
    });
  }
  // Universal selection highlight — works for all layouts incl. circ4/square5
  if (!opts && cv._selCell !== null && cv._selCell !== undefined) {
    const _sc = cvCells(lay, imgs.length, cw, ch, p)[cv._selCell];
    if (_sc) {
      ctx.save();
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = Math.max(6, p * 0.5);
      if (_sc.circle) { ctx.beginPath(); ctx.arc(_sc.cx,_sc.cy,_sc.r-3,0,Math.PI*2); ctx.stroke(); }
      else if (_sc.poly) { ctx.beginPath(); _sc.poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.stroke(); }
      else { ctx.strokeRect(_sc.x+3,_sc.y+3,_sc.w-6,_sc.h-6); }
      ctx.restore();
    }
  }
  cvDrawEffects(ctx, cw, ch, lay, p, imgs.length, opts);
  cvDrawLayers(ctx, cw, ch, opts?.infog);
  if (canvas.id === 'cv-canvas') cvDrawSelection(ctx, canvas, cw, ch);
}

function cvDrawGame(canvas, imgObj, opts) {
  const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  canvas.width=cw; canvas.height=ch;
  const ctx = canvas.getContext('2d');
  if (cvClampLayers(cw, ch)) cvSave();
  const pad = opts?.pad ?? cv.gamePad;
  const cr  = opts?.corner ?? cv.gameCorner;
  // Фон: сплошной или градиент (как в cvDrawCollage)
  if (!opts?.bg && cv.bgStyle === 'gradient') {
    const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
    bgGrad.addColorStop(0, cv.bg);
    bgGrad.addColorStop(1, cv.bg2);
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = opts?.bg ?? cv.bg;
  }
  const bgFill = ctx.fillStyle;
  ctx.fillRect(0,0,cw,ch);
  const fw = cw-2*pad, fh = ch-2*pad;
  const contain = cv.gameFit === 'contain';
  // Тень под картинкой (видна при отступе > 0)
  if (cv.gameShadow && pad > 0) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = cw*0.035; ctx.shadowOffsetY = cw*0.012;
    cvRR(ctx, pad, pad, fw, fh, cr); ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
    // Вписанная обложка не закрывает рамку целиком — поля под ней должны быть фоном, а не чёрной подложкой тени
    if (contain && cv.gameFill !== 'blur') { ctx.save(); cvRR(ctx, pad, pad, fw, fh, cr); ctx.fillStyle = bgFill; ctx.fill(); ctx.restore(); }
  }
  if (contain && cv.gameFill === 'blur') cvDrawBlurFill(ctx, imgObj.el, pad, pad, fw, fh, cr);
  cvFit(ctx, imgObj.el, pad, pad, fw, fh, cr, imgObj.transform, cv.gameFit);
  // Обводка по краю картинки
  if (cv.gameBorder > 0) {
    ctx.save();
    cvRR(ctx, pad + cv.gameBorder/2, pad + cv.gameBorder/2, cw-2*pad-cv.gameBorder, ch-2*pad-cv.gameBorder, Math.max(0, cr - cv.gameBorder/2));
    ctx.strokeStyle = cv.gameBorderColor; ctx.lineWidth = cv.gameBorder;
    ctx.stroke();
    ctx.restore();
  }
  cvDrawEffects(ctx, cw, ch, 'single', pad || 12, 1, opts);
  cvDrawLayers(ctx, cw, ch, opts?.infog);
  if (canvas.id === 'cv-canvas') cvDrawSelection(ctx, canvas, cw, ch);
}

// meta (необязательно): { variant: N, spec: {...}, keepCounters: true } — для вариантов из
// «✨ 4 варианта». spec описывает, чем вариант ПЕРЕОПРЕДЕЛИЛ живые настройки (иначе в журнале
// четыре одинаковых записи, не описывающие ни один из вариантов), а keepCounters не даёт
// «Скачать все 4» отдать счётчики сессии первому файлу и нули остальным трём.
function cvDownload(canvas, name, meta) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/jpeg', 0.93);
  a.download = name || 'avito.jpg';
  a.click();
  // Журнал: скачивание = «эта обложка пошла в дело» — точный аналог posted для графики.
  const m = meta || {};
  jlog('cv_download', null, {
    name: name || 'avito.jpg', mode: cv.mode, layout: cv.layout, imageCount: cv.images.length,
    product: currentProductName(state.form), category: state.form.category,
    variant: m.variant || null, variantSpec: m.spec || null, batch: !!m.batch,
    settings: jCvSnapshot(), counters: m.keepCounters ? null : jCvTakeCounters(),
  });
}

function cvGenerateVariations() {
  if (!cv.images.length) return;
  const img   = cv.images[0];
  const grid  = document.getElementById('cv-vars-grid');
  if (!grid) return;
  // infog-переопределения — ось антидубля: позиция/цвет плашек/порядок строк меняются между вариантами
  const vars = [
    { label:'1. Без отступов', bg:cv.bg,     pad:0,  corner:0,  infog:{align:'left',  bg:null,        shift:0} },
    { label:'2. Тонкий фон',   bg:cv.bg,     pad:36, corner:14, infog:{align:'right', bg:'#0F766E',  shift:1} },
    { label:'3. Тёмный',       bg:'#000',    pad:24, corner:10, infog:{align:'left',  bg:'#7c2d12',  shift:2} },
    { label:'4. Синий',        bg:'#1e3a5f', pad:28, corner:12, infog:{align:'right', bg:null,        shift:3} },
  ];

  cv._gameVars = vars;
  jlog('cv_variants', null, { mode: 'game', infog: cvHasLayer('infog') });

  grid.innerHTML = vars.map((v,i) => `
    <div class="cv-var">
      <canvas id="cv-var-${i}"></canvas>
      <div class="cv-var-label">${v.label}</div>
      <button class="btn-sm" data-cv-dl-var="${i}">⬇ Скачать</button>
    </div>`).join('') +
    `<button class="btn-copy" data-act="cv-dl-all-game" style="margin-top:8px;width:100%;justify-content:center;padding:7px">⬇ Скачать все 4</button>`;

  vars.forEach((v,i) => cvDrawGame(document.getElementById(`cv-var-${i}`), img, v));

  grid.querySelectorAll('[data-cv-dl-var]').forEach(btn => {
    const i = +btn.dataset.cvDlVar;
    // шрифты слоёв должны догрузиться, иначе в файл уйдут буквы запасным шрифтом
    btn.addEventListener('click', () => cvFontsReady().then(() => {
      const tmp = document.createElement('canvas');
      cvDrawGame(tmp, img, vars[i]);
      cvDownload(tmp, `game-var-${i+1}.jpg`, { variant: i + 1, spec: vars[i] });
    }));
  });
}

function cvGenerateCollageVars() {
  if (!cv.images.length) return;
  const grid = document.getElementById('cv-collage-vars-grid');
  if (!grid) return;
  // infog-переопределения — та же ось антидубля, что в вариантах игры
  const vars = [
    { label: '1. Чёрный · 0px',   bg: '#000000', padding: 0,  infog:{align:'left',  bg:null,        shift:0} },
    { label: '2. Синий · 20px',    bg: '#1a1a2e', padding: 20, infog:{align:'right', bg:'#0F766E',  shift:1} },
    { label: '3. Зелёный · 16px',  bg: '#0f2010', padding: 16, infog:{align:'left',  bg:'#7c2d12',  shift:2} },
    { label: '4. Текущий · ' + cv.padding + 'px', bg: cv.bg, padding: cv.padding, infog:{align:'right', bg:null,        shift:3} },
  ];
  jlog('cv_variants', null, { mode: 'collage', layout: cv.layout, imageCount: cv.images.length, infog: cvHasLayer('infog') });
  grid.innerHTML = vars.map((v,i) => `
    <div class="cv-var">
      <canvas id="cv-cvar-${i}"></canvas>
      <div class="cv-var-label">${esc(v.label)}</div>
      <button class="btn-sm" data-cv-dl-cvar="${i}">⬇ Скачать</button>
    </div>`).join('') +
    `<button class="btn-copy" data-act="cv-dl-all-collage" style="margin-top:8px;width:100%;justify-content:center;padding:7px">⬇ Скачать все 4</button>`;
  vars.forEach((v,i) => {
    const c = document.getElementById(`cv-cvar-${i}`);
    if (c) cvDrawCollage(c, { bg: v.bg, padding: v.padding, infog: v.infog });
  });

    const i = +btn.dataset.cvDlCvar;
    btn.addEventListener('click', () => cvFontsReady().then(() => {
      const tmp = document.createElement('canvas');
      cvDrawCollage(tmp, { bg: vars[i].bg, padding: vars[i].padding, infog: vars[i].infog });
      cvDownload(tmp, `collage-var-${i+1}.jpg`, { variant: i + 1, spec: vars[i] });
    }));
  });
  grid._vars = vars;
}

function cvLayoutSVG(id, imgCount) {
  const W = 44, H = 44, p = 3, r = 2;
  const stroke = 'var(--border2)', fill = 'var(--card3)';
  function rect(x,y,w,h) { return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`; }
  function getCells(id2) {
    if (id2==='strip') { const n=Math.max(2,imgCount||4),iw=(W-(n+1)*p)/n; return Array.from({length:n},(_,i)=>({x:p+i*(iw+p),y:p,w:iw,h:H-2*p})); }
    if (id2==='circ4') { const hw=(W-3*p)/2,hh=(H-3*p)/2,rv=Math.min(W,H)*0.30; return [{x:p,y:p,w:hw,h:hh},{x:2*p+hw,y:p,w:W-2*p-hw-p,h:hh},{x:p,y:2*p+hh,w:hw,h:H-2*p-hh-p},{x:2*p+hw,y:2*p+hh,w:W-2*p-hw-p,h:H-2*p-hh-p},{cx:W/2,cy:H/2,r:rv,circle:true}]; }
    if (id2==='circ4d') { const cx=W/2,cy=H/2,off=Math.min(W,H)*0.16,rv=Math.min(W,H)*0.30; return [
      {poly:[[p,p],[W-p,p],[cx+off,cy],[cx-off,cy]]},
      {poly:[[W-p,p],[W-p,H-p],[cx,cy+off],[cx,cy-off]]},
      {poly:[[W-p,H-p],[p,H-p],[cx-off,cy],[cx+off,cy]]},
      {poly:[[p,H-p],[p,p],[cx,cy-off],[cx,cy+off]]},
      {cx:cx,cy:cy,r:rv,circle:true},
    ]; }
    if (id2==='square5') { const hw=(W-3*p)/2,hh=(H-3*p)/2,side=Math.min(W,H)*0.42; return [{x:p,y:p,w:hw,h:hh},{x:2*p+hw,y:p,w:W-2*p-hw-p,h:hh},{x:p,y:2*p+hh,w:hw,h:H-2*p-hh-p},{x:2*p+hw,y:2*p+hh,w:W-2*p-hw-p,h:H-2*p-hh-p},{x:W/2-side/2,y:H/2-side/2,w:side,h:side,plate:true}]; }
    if (id2==='auto') return getCells(cvAutoLayout(imgCount||4));
    const L=COLLAGE_LAYOUTS[id2]; return L?L.cells(W,H,p):[];
  }
  const shapes = getCells(id).map(c=>{
    if (c.circle) return `<circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="${c.r.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    if (c.poly) return `<polygon points="${c.poly.map(pt=>pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
    if (c.plate) return `<rect x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" width="${c.w.toFixed(1)}" height="${c.h.toFixed(1)}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    return rect(c.x,c.y,c.w,c.h);
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}

function cvLayoutButtonsHTML(activeLayout, imgCount) {
  // Подходит ли раскладка под текущее число фото (0 фото — не гасим ничего)
  const fits = id => {
    if (!imgCount) return true;
    if (id==='auto'||id==='strip'||id==='diag'||id==='stack') return true;
    if (id==='circ4'||id==='circ4d'||id==='square5') return imgCount===5;
    return COLLAGE_LAYOUTS[id]?.n === imgCount;
  };
  return COLLAGE_UI_GROUPS.map(({sep,ids})=>{
    const sepHtml = sep?`<div class="cv-layout-sep">${sep}</div>`:'';
    const btns = ids.map(id=>{
      const nm=id==='auto'?'Авто':id==='strip'?'Полоска':id==='circ4'?'⭕ Круг+4':id==='circ4d'?'💠 Круг+4 диаг':id==='square5'?'⬜ Квадрат+4':id==='diag'?'╱ Полосы':id==='stack'?'🃏 Стопка':(COLLAGE_LAYOUTS[id]?.name||id);
      const svg=cvLayoutSVG(id,imgCount);
      const off = !fits(id);
      return `<button class="cv-layout-btn cv-layout-thumb ${activeLayout===id?'active':''}${off?' dimmed':''}" data-cv-layout="${id}" title="${off?nm+' — не подходит под число фото':nm}">${svg}<span class="cv-layout-label">${nm}</span></button>`;
    }).join('');
    return sepHtml+btns;
  }).join('');
}

function cvLayerEditorHTML(L) {
  const swatches = (prop, list) => `<div class="cv-bg-row" style="margin-top:0">${list.map(c => `<button class="cv-color ${L[prop] === c ? 'active' : ''}" data-cv-lv="${prop}:${c}" style="background:${c};${c === '#ffffff' ? 'border:1px solid #555' : ''}"></button>`).join('')}<input type="color" data-cv-lp="${prop}" value="${esc(L[prop] || '#000000')}" title="Свой цвет" style="width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;padding:0"></div>`;
  const choice = (prop, opts) => `<div class="cv-layouts" style="flex:1;margin-top:0">${opts.map(([v, l]) => `<button class="cv-layout-btn ${L[prop] === v ? 'active' : ''}" data-cv-lv="${prop}:${v}">${l}</button>`).join('')}</div>`;
  const toggle = prop => `<button class="toggle-btn ${L[prop] ? 'on' : ''}" data-cv-lt="${prop}">${L[prop] ? 'Вкл' : 'Выкл'}</button>`;
  const range = (prop, min, max) => `<input type="range" data-cv-lp="${prop}" data-cv-div="100" min="${min}" max="${max}" value="${Math.round((+L[prop] || 0) * 100)}">`;
  const row = (label, inner, top) => `<div class="cv-row"${top ? ' style="align-items:flex-start"' : ''}><label${top ? ' style="padding-top:4px"' : ''}>${label}</label>${inner}</div>`;
  const area = (rows, ph) => `<textarea data-cv-lp="text" rows="${rows}" placeholder="${ph}" style="flex:1;font-size:13px;resize:vertical">${esc(L.text || '')}</textarea>`;
  // Буквы — общий блок у всех слоёв с текстом (план Fotor, Ф1): шрифт, цвет или градиент,
  // обводка, тень. Подробности эффекта раскрываются, только когда он включён.
  const letters = () => {
    const f = cvFontOf(L), grad = L.fill === 'grad';
    const fonts = `<div class="cv-layouts" style="flex:1;margin-top:0">${CV_FONTS.map(x => `<button class="cv-layout-btn ${f.id === x.id ? 'active' : ''}" data-cv-lv="font:${x.id}" style="font-family:${x.fam};font-weight:${x.w || 700}">${x.name}</button>`).join('')}</div>`;
    return `<div class="cv-layout-sep">Буквы</div>`
      + row('Шрифт', fonts, true)
      + (L.type === 'text' && !f.w ? row('Жирный', toggle('bold')) : '')
      + row('Заливка', choice('fill', [['solid', 'Цвет'], ['grad', 'Градиент']]))
      + row(grad ? 'Сверху' : 'Цвет', swatches('color', CV_STC))
      + (grad ? row('Снизу', swatches('color2', CV_STC)) : '')
      + row('Обводка', toggle('stroke'))
      + (L.stroke ? row('Толщина', range('strokeW', 2, 25)) + row('Цвет', swatches('strokeColor', CV_STC)) : '')
      + row('Тень', toggle('shadow'))
      + (L.shadow ? row('Цвет', swatches('shadowColor', CV_STC)) + row('Размытие', range('shadowBlur', 0, 60))
          + row('Сдвиг', range('shadowDist', 0, 30)) + row('Направл.', choice('shadowDir', [['down', '↓ Вниз'], ['diag', '↘ Наискось']]))
          + row('Плотность', range('shadowOpacity', 10, 100)) : '');
  };
  let body = '';
  switch (L.type) {
    case 'sticker':
      body = row('Текст', area(2, 'ХИТ&#10;Enter — новая строка'), true)
        + row('Форма', choice('shape', CV_STICKER_SHAPES))
        + row('Фон', swatches('bg', CV_SC)) + letters();
      break;
    case 'ribbon':
      body = row('Текст', `<input type="text" data-cv-lp="text" value="${esc(L.text || '')}" placeholder="ПРЕДЗАКАЗ" style="flex:1">`)
        + row('Угол', choice('corner', [['tl', '↖'], ['tr', '↗'], ['bl', '↙'], ['br', '↘']]))
        + row('Фон', swatches('bg', CV_SC)) + letters();
      break;
    case 'text':
      body = row('Текст', area(3, 'Ваш текст&#10;Enter — новая строка'), true)
        + row('Подложка', toggle('bgOn'))
        + (L.bgOn ? row('Цвет', swatches('bgColor', CV_SC)) + row('Плотность', range('bgOpacity', 0, 100)) : '')
        + letters();
      break;
    case 'infog':
      body = row('Строки', area(4, '✔️ 405+ игр&#10;✔️ PS4 / PS5&#10;(строка = плашка, до 6)'), true)
        + `<button class="btn-sm" data-cv-la="fill" style="margin:6px 0 2px">⚡ Заполнить из формы генератора</button>`
        + row('Выравнив.', choice('align', [['left', '⬅ По левому'], ['right', '➡ По правому']]))
        + row('Плашка', swatches('bg', CV_SC)) + row('Плотность', range('opacity', 20, 100))
        + letters();
      break;
    case 'plat':
      body = row('Какие', `<div class="cv-layouts" style="flex:1;margin-top:0">${CV_PLATFORMS.map(p => {
        const on = (L.plats || []).includes(p.id);
        return `<button class="cv-layout-btn ${on ? 'active' : ''}" data-cv-lplat="${p.id}" style="${on ? `background:${p.bg};color:#fff;border-color:${p.bg}` : ''}">${p.id}</button>`;
      }).join('')}</div>`);
      break;
  }
  const s = Math.round((L.scale || 1) * 100), a = Math.round(L.angle || 0);
  const tf = `<div class="cv-row"><label>Положение</label><span class="cv-val" id="cv-ltf">${L.type === 'ribbon' ? `${s}%` : `${a}° · ${s}%`}</span>
    ${L.type === 'ribbon' ? '' : '<button class="btn-sm" data-cv-la="reset-rot" title="Повернуть ровно">↺ Прямо</button>'}
    <button class="btn-sm" data-cv-la="reset-scale" title="Вернуть исходный размер">↺ 100%</button></div>`;
  const hint = L.type === 'ribbon'
    ? '💡 Тяни ленту в другой угол · жёлтая ручка — толщина · колёсико над лентой — размер · Del — удалить'
    : '💡 Тяни элемент — двигать · белая ручка сверху — крутить (Shift — шаг 15°) · жёлтая в углу — размер · колёсико над элементом — размер · Del — удалить';
  const d = CV_LAYER_TYPES[L.type];
  return `<div class="cv-leditor">
    <div class="cv-leditor-head">${d.icon} ${d.name}<span style="flex:1"></span>
      <button class="cv-lrow-btn" data-cv-la="up" title="Выше других">▲</button>
      <button class="cv-lrow-btn" data-cv-la="down" title="Ниже других">▼</button>
      <button class="cv-lrow-btn" data-cv-la="dup" title="Дублировать">⧉</button>
      <button class="cv-lrow-btn" data-cv-la="del" title="Удалить (Del)">🗑</button>
    </div>
    ${body}${tf}
    <div class="cv-lhint">${hint}</div>
  </div>`;
}
