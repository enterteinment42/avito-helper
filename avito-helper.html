  }
}

async function doRegen(id) {
  if (state.regenId !== null) return;
  state.regenId = id; refreshResults();
  try {
    // F12: перегенерация одного варианта должна опираться на форму НА МОМЕНТ генерации
    // (снимок resultsForm + штампы варианта), а не на живую форму — иначе после переключения
    // формы ↻ выдаёт ДРУГОЙ товар, теряет _product/_category и не ищет бонусы предзаказа (Bug #6).
    const prev = findResult(id) || {};
    const snapForm = state.resultsForm || state.form;
    const category = prev._category || snapForm.category;
    const product  = prev._product  || currentProductName(snapForm);
    const excl = resultsPool().filter(v => v.id !== id).map(v => v.title);
    const webSearch = snapForm.isPreorder && category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg(1, excl, snapForm) }], { webSearch, category });
    const [v] = parseVariants(text);
    const { arr, idx } = findResultRef(id);
    if (arr && idx !== -1 && v) {
      // Журнал: перегенерация = «этот вариант не устроил». Старый текст пишем ДО перезаписи —
      // после неё он безвозвратен (правило «логировать до перезаписи»).
      jlog('regen', prev._chain || null, {
        category, product,
        before: { title: prev.title || '', description: prev.description || '', scan: jScanLevel(prev) },
        after:  { title: v.title || '', description: v.description || '' },
      });
      arr[idx] = { ...v, id, _product: product, _category: category, _chain: prev._chain }; // штампы F4 сохраняются
      arr[idx]._scan = checkAds(v.title || '', v.description || '', category); // бейдж под НОВЫЙ текст
      save();
    }
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', null, { stage: 'regen', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.regenId = null; refreshResults();
  }
}

${v.description}

Верни ОДИН вариант в JSON:
{"variants": [{"id": 1, "title": "...", "title_length": 0, "description": "...", "style": "...", "price_format": "...", "hook": "...", "structure": "..."}]}`;

    const webSearch = state.form.isPreorder && state.form.category === 'game';

function toggleFav(variant) {
  const key = variant.title + variant.description;
  const idx = state.favorites.findIndex(f => f.title + f.description === key);
  if (idx !== -1) {
    // F15: удаление из избранного = потеря few-shot/источника очереди; если варианта уже нет
    // в результатах — текст безвозвратен. Добавление (else) не подтверждаем — оно не деструктивно.
    if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
    state.favorites.splice(idx, 1);
    jlog('fav_remove', variant._chain || null, { title: variant.title || '' });
  } else {
    state.favorites.push({ ...variant, _fid: Date.now() });
    jlog('fav_add', variant._chain || null, { title: variant.title || '', category: variant._category || null, scan: jScanLevel(variant) });
  }
  save(); refreshResults(); refreshFavs();
}

function removeFav(fid) {
  // F15: то же удаление, но из списка избранного (кнопка ★ на карточке избранного)
  if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
  const gone = state.favorites.find(f => f._fid === fid);
  state.favorites = state.favorites.filter(f => f._fid !== fid);
  if (gone) jlog('fav_remove', gone._chain || null, { title: gone.title || '' });
  save(); refreshResults(); refreshFavs();
}

function isFav(v) {
  const key = v.title + v.description;
  return state.favorites.some(f => f.title + f.description === key);
}

function copyBtn(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Скопировано';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('Скопировано!');
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lenClass(n) {
  return n <= 44 ? 'ok' : n <= 50 ? 'warn' : 'over';
}

// UX-13: пороги счётчика длины объяснены в подсказке (раньше «N/50» желтел молча).
// Лимит Авито — 50; жёлтый с 45 (впритык), красный с 51 (лимит превышен).
const LEN_TIP = 'Лимит названия на Авито — 50 символов. Жёлтый с 45 (впритык к лимиту — Авито может обрезать название в списке), красный с 51 (лимит превышен, объявление не примут).';
function tlenHTML(len, cls, style) {
  return `<span class="tlen ${cls ? cls + ' ' : ''}${lenClass(len)}"${style ? ` style="${style}"` : ''} title="${LEN_TIP}">${len}/50</span>`;
}

let _convTouchX = null;

function bindConveyorSwipe() {
  const wrap = document.getElementById('conv-wrap');
  if (!wrap) return;
  wrap.addEventListener('touchstart', e => { _convTouchX = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => {
    if (_convTouchX === null) return;
    const dx = e.changedTouches[0].clientX - _convTouchX;
    _convTouchX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && state.conveyorIdx < state.results.length - 1) { state.conveyorIdx++; refreshResults(); }
    if (dx > 0 && state.conveyorIdx > 0)                        { state.conveyorIdx--; refreshResults(); }
  }, { passive: true });
}

// спиннер/варианты и не решил, что кнопка не сработала.
function scrollToResults() {
  if (window.innerWidth > 780) return;
  const el = document.getElementById('results-box');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function refreshResults() {
  const el = document.getElementById('results-box');
  if (!el) return;

  if (state.batchResults.length) { refreshBatchResults(); return; }

  if (state.loading) {
    const chunkInfo = state.batchChunkProgress ? ` (чанк ${state.batchChunkProgress.done}/${state.batchChunkProgress.total})` : '';
    const loadingText = state.loadingKind === 'titles' ? 'Подбираю заголовки…'
      : state.loadingKind === 'descriptions' ? 'Пишу описания для выбранных названий…'
      : (state.batchMode && state.batchRegions.length ? `Генерирую пакет для ${state.batchRegions.length} регионов…${chunkInfo}` : 'Генерирую варианты…');
    el.innerHTML = `<div class="loading-box">
      <div class="spinner"></div>
      <div>${loadingText}</div>
      <div style="font-size:12px;color:var(--muted)">Обычно 5–15 секунд</div>
    </div>`;
    return;
  }
  if (state.error) {
    el.innerHTML = `<div class="err-box"><b>Ошибка:</b> ${esc(state.error)}</div>`;
    return;
  }
  if (state.titleStep) {
    el.innerHTML = titleStepHTML();
    return;
  }
  if (!state.results.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="ico">✨</div>
      <div>Заполните форму и сгенерируйте объявление</div>
    </div>`;
    return;
  }

  const toggleBtn = `<button class="conv-mode-toggle ${state.conveyorMode?'active':''}" data-act="toggle-conveyor">
    ${state.conveyorMode ? '☰ Список' : '▶ Конвейер'}

  const extraSection = (state.extraResults.length || state.extraLoading) ? `

}

// ══════════════════════════════════════════
// VISION: РАСПОЗНАВАНИЕ ТОВАРА ПО ФОТО
// Направление 2а плана сближения с Айдентикой. Идёт через уже работающий
// /api/claude (прокси пересылает тело как есть — vision-блоки проходят без
// правок на VPS, в отличие от направления 2б, которому нужен /api/openrouter).
// Цена — отдельной кнопкой с веб-поиском: платный поиск не жжём на каждом
// фото и не подставляем цифру молча.
// ══════════════════════════════════════════

const VISION_MAX_PX = 1568; // рекомендация Anthropic: больший размер модель всё равно ужмёт сама

// Типы полей, которые распознавание умеет заполнять. num исключён: цену модель
// придумывать не должна — её узнаёт веб-поиск отдельной кнопкой.
const VISION_FIELD_TYPES = ['text', 'area', 'select', 'chips'];
function visionFields(c) {
  return c.fields.filter(fd => VISION_FIELD_TYPES.includes(fd.type) && !fd.isPrice);
}

// Список категорий и их полей собирается из дескрипторов: категория, заведённая
// в Настройках, распознаётся так же, как встроенная — ровно та дыра, ради
// которой начиналось направление 1 (физтовар сваливался в «Цифровой товар»).
function visionCatBlock() {
  return CATS.map(c => {
    const fields = visionFields(c).map(fd => {
      const opts = ['select', 'chips'].includes(fd.type) ? fdOptions(fd) : [];
      const listed = opts.length ? ` — строго одно из: ${opts.join(', ')}` : '';
      return `    ${fd.key} (${fd.label}${fd.type === 'chips' ? ', массив' : ''})${listed}`;
    });
    return `- "${c.id}" — ${c.visionHint || c.pName || c.label}\n  поля:\n${fields.join('\n') || '    (нет заполняемых полей)'}`;
  }).join('\n');
}

function visionSys() {
  return `Ты — помощник продавца на Авито. По фотографии определяешь, ЧТО это за товар, и заполняешь карточку товара для генератора объявлений.

КАТЕГОРИЯ — строго один из id ниже, других нет:
${visionCatBlock()}

ПРАВИЛА:
- Пиши только то, что реально видно на фото. НЕ додумывай объём памяти, ревизию, комплектацию, год — если этого не видно на самом товаре или упаковке.
- Для физического товара опиши состояние и комплектацию ровно по фото: коробка есть/нет, провода, следы использования, царапины, потёртости.
- Если разобрать невозможно (темно, размыто, товара не видно) — поставь confidence "low" и объясни в recognized, что именно мешает.
- Цену НЕ придумывай никогда — её узнают отдельно веб-поиском.
- Где у поля перечислены допустимые значения — бери строго из этого списка, ничего своего.
- Значения полей — на русском, кроме оригинальных названий игр, сервисов и моделей техники.
- В "fields" клади ТОЛЬКО ключи выбранной категории, остальные не упоминай вовсе.

ФОРМАТ ОТВЕТА — ТОЛЬКО JSON, без единого слова до или после:
{
  "recognized": "коротко, что на фото",
  "confidence": "high|medium|low",
  "category": "<id из списка выше>",
  "fields": { "<ключ поля этой категории>": "<значение>" },
  "notes": "одна строка доп. указаний генератору: состояние, комплектация, чем зацепить",
  "priceQuery": "поисковый запрос для рыночной цены, например: PlayStation 5 Slim бу цена авито"
}`;
}

// Отдельный промпт для шага цены. Раньше сюда уходил VISION_SYS — а он требует
// схему распознавания и прямым текстом запрещает называть цену, то есть модель
// имела полное право вернуть не тот JSON, и оплаченный веб-поиск сгорал впустую.
const VISION_PRICE_SYS = `Ты — помощник продавца на Авито. Твоя задача — узнать реальную рыночную цену товара в России по данным из интернета.

ПРАВИЛА:
- Опирайся на найденные объявления и витрины, а не на память. Приоритет — Авито, затем маркетплейсы.
- Цены — в рублях, за товар целиком, на текущий момент.
- Учитывай состояние и комплектацию, если они указаны в запросе: за б/у без коробки цена ниже.
- low — нижняя граница разумных предложений, high — верхняя, typical — цена, по которой товар реально уходит.
- Если данных мало и разброс огромный — всё равно дай числа, а осторожность объясни в comment.

ФОРМАТ ОТВЕТА — ТОЛЬКО JSON, без единого слова до или после:
{"low": число, "typical": число, "high": число, "comment": "одна строка: от чего зависит разброс"}`;

// Ужимаем фото до отправки: телефонный снимок на 4-12 МБ упёрся бы в лимит тела
// прокси (10 МБ, а base64 — это ещё +33%), при том что модель всё равно работает
// с уменьшенной копией. Заодно нормализуем формат в JPEG (HEIC/PNG/что угодно).
function visionPrepFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type || !file.type.startsWith('image/')) { reject(new Error('Это не изображение')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, VISION_MAX_PX / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth  || 1) * k));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * k));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        resolve({ dataUrl, media_type: 'image/jpeg', data: dataUrl.slice(dataUrl.indexOf(',') + 1), w, h });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}

// Занят = идёт распознавание или поиск цены. Пока занят, фото менять и убирать
// нельзя: запрос в полёте держит ссылку на state.vision и по возвращении записал
// бы результат по СТАРОМУ фото в карточку, где уже показано новое.
function visionBusy() { return state.vision.loading || state.vision.priceLoading; }

async function visionPick(file) {
  const v = state.vision;
  if (visionBusy()) { toast('Дождитесь окончания — запрос по текущему фото ещё идёт'); return; }
  try {
    const prep = await visionPrepFile(file);
    v.dataUrl = prep.dataUrl;
    v.media = { media_type: prep.media_type, data: prep.data };
    v.error = ''; v.result = null; v.price = null; v.prevForm = null;
    v.applied = false; v.warn = ''; v.appliedForm = '';
    reForm();
  } catch (e) {
    v.error = e.message || 'Не удалось прочитать фото';
    reForm();
  }
}

function visionClear() {
  if (visionBusy()) { toast('Дождитесь окончания запроса'); return; }
  state.vision = { dataUrl: null, media: null, loading: false, error: '', result: null, prevForm: null,
                   priceLoading: false, price: null, applied: false, warn: '', appliedForm: '' };
  reForm();
}

// Раскладываем ответ модели по полям формы. Всё, что модель могла выдумать за
// пределами известных списков, отсекаем здесь — форма не должна получить
// платформу «PS6» или тип подписки, которого нет в каталоге.
function visionApplyToForm(r) {
  const f = state.form;
  const fl = r.fields || {};
  const pick = (arr, allowed) => (Array.isArray(arr) ? arr : []).map(String).filter(x => allowed.includes(x));
  const known = CATS.some(c => c.id === r.category);
  const cat = known ? r.category : 'digital';
  f.category = cat;
  let filled = 0; // сколько полей ЭТОЙ категории реально заполнено ответом модели

  // Раскладка по дескриптору категории — работает и для категорий из конструктора.
  for (const fd of visionFields(catDef(cat))) {
    const raw = fl[fd.key];
    if (raw == null || raw === '') continue;
    if (fd.type === 'chips') {
      const picked = pick(raw, fdOptions(fd));
      if (picked.length) { f[fd.key] = picked; filled++; }
    } else if (fd.type === 'select') {
      const opts = fdOptions(fd);
      const val = String(raw);
      if (opts.includes(val)) { f[fd.key] = val; filled++; }
      // «Другой»/«Другое» в списке — честный приют для сервиса, которого нет в каталоге
      else {
        const other = opts.find(o => /^друг/i.test(o));
        if (other) { f[fd.key] = other; filled++; }
      }
    } else {
      f[fd.key] = String(raw); filled++;
    }
  }
  if (r.notes) f.notes = String(r.notes).slice(0, 300);
  save();

  // Модель могла ответить категорией не из списка (напр. "Игра" вместо "game") —
  // тогда мы падаем в «Цифровой товар», а её поля игры отбрасываются. Молчать
  // об этом нельзя: карточка отрапортует «поля заполнены», и генерация уйдёт по
  // пустой форме, сжигая токены.
  if (!filled) {
    return known
      ? 'Модель не вернула ни одного поля — заполните форму вручную'
      : `Категория «${String(r.category || '—').slice(0, 40)}» не из списка — форма переключена на «Цифровой товар», поля не заполнены`;
  }
  return '';
}

async function doVisionRecognize() {
  const v = state.vision;
  if (v.loading || !v.media) return;
  v.loading = true; v.error = ''; v.price = null;
  reForm();
  const jT0 = Date.now();
  try {
    const content = [
      { type: 'image', source: { type: 'base64', media_type: v.media.media_type, data: v.media.data } },
      { type: 'text',  text: 'Определи товар на фото и заполни карточку по правилам. Ответ — только JSON.' },
    ];
    // provider жёстко claude: у OpenRouter другой формат картинок, и сам эндпоинт
    // на VPS отсутствует (Bug #9) — молча уводить распознавание в 404 нельзя.
    const text = await callAI([{ role: 'user', content }], {
      // thinking: разглядеть товар на фото — как раз задача, где нужен разбор, а не
      // первое впечатление. max_tokens поднят: размышление тратится из того же лимита.
      provider: 'claude', system: visionSys(), max_tokens: 4000, temperature: 0.2, thinking: true,
    });
    const r = JSON.parse(extractJSON(text));
    if (!r || typeof r !== 'object') throw new Error('Модель вернула не JSON');
    v.result = r;
    // Снимок для отката: цель — вернуть то, что писал ЧЕЛОВЕК, а не выхлоп
    // предыдущего распознавания. Поэтому обновляем его, только если форма с
    // прошлого раза изменилась (Денис что-то поправил) или снимка ещё нет.
    // Иначе два распознавания подряд подменили бы «прежнюю форму» результатом
    // первого, и откат перестал бы доставать ручной ввод.
    const curForm = JSON.stringify(state.form);
    if (!v.prevForm || curForm !== v.appliedForm) v.prevForm = JSON.parse(curForm);
    v.warn = visionApplyToForm(r);
    v.applied = true;
    v.appliedForm = JSON.stringify(state.form); // с чем сравнивать в следующий раз
    jlog('vision', null, {
      phase: 'recognize', ok: true, category: state.form.category,
      recognized: String(r.recognized || '').slice(0, 200), confidence: r.confidence || '',
      product: currentProductName(state.form), model: state.settings.model,
      latencyMs: Date.now() - jT0, warn: v.warn || '',
    });
    toast(v.warn ? '⚠ ' + v.warn : 'Распознано — поля формы заполнены');
  } catch (e) {
    v.error = e.message || String(e);
    console.error(e);
    jlog('error', null, { stage: 'vision_recognize', message: String(e.message || '').slice(0, 300), latencyMs: Date.now() - jT0 });
  } finally {
    v.loading = false;
    reForm();
  }
}

async function doVisionPrice() {
  const v = state.vision;
  if (v.priceLoading || !v.result) return;
  v.priceLoading = true; v.error = '';
  reForm();
  const jT0 = Date.now();
  try {
    const q = v.result.priceQuery || v.result.recognized || currentProductName(state.form);
    const msg = `Найди в интернете актуальную цену в России на этот товар: ${q}.
Ориентируйся на Авито и маркетплейсы, на текущий месяц. Учитывай состояние и комплектацию: ${v.result.notes || 'не указано'}.
Ответ — ТОЛЬКО JSON, без пояснений:
{"low": число, "typical": число, "high": число, "comment": "одна строка: от чего зависит разброс"}`;
    const text = await callAI([{ role: 'user', content: msg }], {
      provider: 'claude', system: VISION_PRICE_SYS, webSearch: true, max_tokens: 6000, temperature: 0.2, thinking: true,
    });
    const p = JSON.parse(extractJSON(text));
    const num = x => { const n = Math.round(Number(x)); return Number.isFinite(n) && n > 0 ? n : null; };
    v.price = { low: num(p.low), typical: num(p.typical), high: num(p.high), comment: String(p.comment || '') };
    if (!v.price.typical && !v.price.low) throw new Error('Не удалось разобрать цены в ответе');
    jlog('vision', null, {
      phase: 'price', ok: true, category: state.form.category, query: String(q).slice(0, 200),
      low: v.price.low, typical: v.price.typical, high: v.price.high, latencyMs: Date.now() - jT0,
    });
  } catch (e) {
    v.price = null;
    v.error = e.message || String(e);
    console.error(e);
    jlog('error', null, { stage: 'vision_price', message: String(e.message || '').slice(0, 300), latencyMs: Date.now() - jT0 });
  } finally {
    v.priceLoading = false;
    reForm();
  }
}

// Поле цены категории — то, что помечено флажком «цена товара» в редакторе.
// У игровой подписки такого поля нет: цен там несколько (по сроку), однозначного
// адресата не существует — там кнопка подстановки не показывается вовсе.
function catPriceField(catId) { return catDef(catId).fields.find(fd => fd.isPrice) || null; }

function visionApplyPrice(val) {
  const n = Math.round(Number(val));
  if (!Number.isFinite(n) || n <= 0) return;
  const fd = catPriceField(state.form.category);
  if (!fd) return;
  state.form[fd.key] = String(n);
  save(); reForm();
  toast(`Цена ${n} ₽ подставлена в форму`);
}

function visionUndoForm() {
  const v = state.vision;
  if (!v.prevForm) return;
  state.form = { ...DEF_FORM, ...v.prevForm };
  v.prevForm = null;
  // Результат распознавания оставляем (по нему ещё ищется цена), но помечаем,
  // что к форме он больше НЕ применён — иначе карточка врала бы «поля заполнены».
  v.applied = false; v.warn = ''; v.appliedForm = '';
  save(); reForm();
  toast('Форма возвращена к состоянию до распознавания');
}

// Фото товара чаще всего и есть будущая обложка — переносим в конструктор явно,
// по кнопке: автоматический перенос затирал бы уже загруженную картинку в режиме
// «Игра» и молча занимал бы слот в коллаже.
function visionToCovers() {
  const v = state.vision;
  if (!v.dataUrl) return;
  if (cv.mode === 'game' && cv.images.length && !confirm('В режиме «Игра» картинка одна — заменить текущую фотографией товара?')) return;
  if (cv.mode === 'collage' && cv.images.length >= 10) { toast('Уже 10 картинок — удалите лишние в конструкторе'); return; }
  const el = new Image();
  el.onload = () => {
    if (cv.mode === 'game') { cvRevokeGameBlobs(); cv.images = []; }
    cv.images.push({ id: ++_cvId, url: v.dataUrl, el, transform: { scale: 1, ox: 0, oy: 0 } });
    jlog('cv_images', null, { source: 'vision', mode: cv.mode, added: 1 });
    state.tab = 'covers';
    render();
  };
  el.onerror = () => toast('Не удалось перенести фото в обложки');
  el.src = v.dataUrl;
}

function visionCardHTML() {
  const v = state.vision;
  const CONF = {
    high:   { label: 'уверенно',   color: 'var(--ok)'   },
    medium: { label: 'вероятно',   color: 'var(--warn)' },
    low:    { label: 'не уверен',  color: 'var(--err)'  },
  };
  const r = v.result;
  const conf = r ? (CONF[r.confidence] || CONF.medium) : null;
  const catLabel = r ? (CATS.find(c => c.id === state.form.category)?.label || '') : '';
  const p = v.price;
  const canApplyPrice = !!catPriceField(state.form.category);
  const busy = visionBusy();
  // Диапазон: у модели могла не найтись часть границ — «1200– ₽» показывать нельзя
  const bounds = [p?.low, p?.high].filter(Boolean);
  const rangeTxt = bounds.length === 2 ? `${bounds[0]}–${bounds[1]}` : String(bounds[0] || p?.typical || '');
  const showTypical = p?.typical && String(p.typical) !== rangeTxt;

  return `<div class="vision-card">
    <div class="vision-head">
      <b>📷 Распознать по фото</b>
      <span class="vision-hint">сфоткал товар — Claude заполнит поля формы</span>
    </div>
    <div class="vision-row">
      <label class="vision-pick ${busy ? 'busy' : ''}" ${busy ? '' : 'for="vision-file"'} title="${busy ? 'Идёт запрос — фото пока не сменить' : 'Выбрать фото товара'}">
        ${v.dataUrl ? `<img src="${v.dataUrl}" alt="фото товара">` : '📷'}
      </label>
      <input type="file" id="vision-file" accept="image/*" style="display:none" ${busy ? 'disabled' : ''}>
      <div class="vision-btns">
        <button class="vision-btn vision-btn-main" data-act="vision-recognize" ${!v.media || busy ? 'disabled' : ''}>
          ${v.loading ? '⏳ Смотрю на фото…' : '🔍 Распознать'}
        </button>
        ${v.dataUrl ? `<button class="vision-btn" data-act="vision-covers" ${busy ? 'disabled' : ''}>🖼 → в обложки</button>` : ''}
        ${v.dataUrl ? `<button class="vision-btn" data-act="vision-clear" ${busy ? 'disabled' : ''}>✕ Убрать фото</button>` : ''}
      </div>
    </div>
    ${v.error ? `<div class="vision-err">⚠ ${esc(v.error)}</div>` : ''}
    ${r ? `
    <div class="vision-res">
      <div class="vision-res-top">
        <span class="vision-conf" style="color:${conf.color};border-color:${conf.color}">${conf.label}</span>
        <span>${esc(r.recognized || '—')}</span>
      </div>
      <div class="vision-res-sub" ${v.warn ? 'style="color:var(--warn)"' : ''}>${
        v.warn ? '⚠ ' + esc(v.warn)
        : !v.applied ? 'форма возвращена к прежнему состоянию — поля из фото не применены'
        : `→ категория «${esc(catLabel)}», поля формы заполнены${r.notes ? ` · доп. указания: ${esc(String(r.notes).slice(0, 120))}` : ''}`
      }</div>
      <div class="vision-btns">
        <button class="vision-btn" data-act="vision-price" ${busy ? 'disabled' : ''}>
          ${v.priceLoading ? '⏳ Ищу цены в сети…' : '💰 Узнать рыночную цену'}
        </button>
        ${v.prevForm ? `<button class="vision-btn" data-act="vision-undo">↩ Вернуть форму</button>` : ''}
      </div>
      ${p ? `
      <div class="vision-price-box">
        <div>Рынок: <b style="color:var(--text)">${rangeTxt} ₽</b>${showTypical ? `, типично <b style="color:var(--teal-h)">${p.typical} ₽</b>` : ''}</div>
        ${p.comment ? `<div style="color:var(--muted);font-size:11.5px">${esc(p.comment)}</div>` : ''}
        ${canApplyPrice && p.typical ? `<button class="vision-btn" data-act="vision-apply-price" data-val="${p.typical}" style="width:fit-content">↓ Подставить ${p.typical} ₽ в форму</button>`
          : `<div style="color:var(--muted);font-size:11.5px">${canApplyPrice ? '' : 'У подписки несколько сроков — впишите цены вручную в «Сроки и цены»'}</div>`}
      </div>` : ''}
    </div>` : ''}
  </div>`;
}

function formHTML() {
  const f = state.form;

  // data-k — ключ поля в state.form: один обработчик обслуживает любые чипы,
  // в том числе поля категорий, которых ещё нет в коде.
  function chips(list, selected, key) {
    return list.map(p =>
      `<button class="chip ${selected.includes(p) ? 'on' : ''}" data-act="fchip" data-k="${key}" data-val="${esc(p)}">${esc(p)}</button>`
    ).join('');
  }

  function durRows() {
    return f.durations.map((d, i) => `
      <div class="dur-row" data-i="${i}">
        <select data-act="dur-period" data-i="${i}">
          ${DURATIONS.map(o => `<option ${d.period===o?'selected':''}>${o}</option>`).join('')}
        </select>
        <input type="number" min="0" placeholder="Цена ₽"
          value="${esc(d.price)}" data-act="dur-price" data-i="${i}">
        <button class="btn-icon" data-act="dur-del" data-i="${i}" title="Удалить">×</button>
      </div>`).join('');
  }

  // Список игр у подписки — единственное поле с живой подсказкой: вид зависит
  // от того, заполнен ли каталог этого типа подписки в Настройках.
  function subGamesHTML() {
    const cat = getCatalogEntry(f.subType);
    if (cat.core.length || cat.masking.length) return `
      <div class="field">
        <label>Каталог активен:
          <span style="color:var(--ok)">${cat.core.length} ядровых</span> +
          <span style="color:var(--teal-h)">${cat.masking.length} маскирующих</span>
          <span style="color:var(--muted);font-size:11px;margin-left:4px">— список рандомизируется при каждой генерации</span>
        </label>
        <input type="text" data-act="field" data-k="games"
          placeholder="Доп. игры через запятую (необязательно)"
          value="${esc(f.games)}" style="font-size:13px">
      </div>`;
    return `
      <div class="field">
        <label>Список игр
          <span style="color:var(--warn);font-size:11px;margin-left:6px">каталог не заполнен — укажите игры вручную или заполните каталог в Настройках</span>
        </label>
        <textarea data-act="field" data-k="games" rows="4"
          placeholder="GTA 5, Spider-Man 2, God of War…">${esc(f.games)}</textarea>
      </div>`;
  }

  // Поля категории собираются из дескриптора, а не пишутся руками под каждую:
  // новая категория подхватывается формой автоматически.
  function fieldHTML(fd) {
    const v = fieldVal(f, fd);
    const ph = fd.ph ? ` placeholder="${esc(fd.ph)}"` : '';
    const lbl = esc(fd.label);
    switch (fd.type) {
      case 'text': return `
        <div class="field">
          <label>${lbl}</label>
          <input type="text" value="${esc(v)}" data-act="field" data-k="${fd.key}"${ph}>
        </div>`;
      case 'num': return `
        <div class="field">
          <label>${lbl}</label>
          <input type="number" min="0" value="${esc(v)}" data-act="field" data-k="${fd.key}"${ph}>
        </div>`;
      case 'area': return `
        <div class="field">
          <label>${lbl}</label>
          <textarea data-act="field" data-k="${fd.key}" rows="${fd.rows || 3}"${ph}>${esc(v)}</textarea>
        </div>`;
      case 'select': {
        // Значение может не входить в список — например, опцию убрали в редакторе
        // категорий уже после того, как форма её запомнила. Молча показать первую
        // опцию нельзя: селект утверждал бы одно, а в промпт уходило другое.
        const opts = fdOptions(fd);
        const known = opts.includes(String(v));
        const stale = !known ? `<option value="" selected disabled>${v ? `${esc(v)} — нет в списке` : '— не выбрано —'}</option>` : '';
        return `
        <div class="field">
          <label>${lbl}</label>
          <select data-act="field" data-k="${fd.key}">
            ${stale}
            ${opts.map(o => `<option value="${esc(o)}"${String(v) === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}
          </select>
          ${known ? '' : `<div style="font-size:11px;color:var(--warn);margin-top:3px">Выберите значение — прежнее «${esc(v || '')}» больше не в списке</div>`}
        </div>`;
      }
      case 'chips': return `
        <div class="field">
          <label>${lbl}</label>
          <div class="check-group">${chips(fdOptions(fd), v, fd.key)}</div>
        </div>`;
      case 'toggle': return `
        <div class="field" style="flex-direction:row;align-items:center;gap:10px">
          <button class="chip ${v ? 'on' : ''}" data-act="ftoggle" data-k="${fd.key}" style="padding:8px 16px;font-size:14px">${lbl}</button>
          ${v && fd.hint ? `<span style="font-size:12px;color:var(--teal-h)">${esc(fd.hint)}</span>` : ''}
        </div>`;
      case 'durations': return `
        <div class="field">
          <label>${lbl}</label>
          <div class="dur-rows" id="dur-rows">${durRows()}</div>
          <button class="btn-add" data-act="dur-add">+ добавить срок</button>
        </div>`;
      case 'subGames': return subGamesHTML();
      // Тип, которого эта версия инструмента не знает (категория пришла из JSON
      // новее приложения). Молча пропасть поле не должно — иначе непонятно, куда
      // делось. В валидацию оно не попадает (см. validateForm).
      default: return `
        <div class="field">
          <label>${lbl}</label>
          <div style="font-size:12px;color:var(--warn);border:1px dashed var(--border2);border-radius:8px;padding:8px 10px">
            ⚠ Тип поля «${esc(fd.type || '—')}» не поддерживается этой версией — поле пропущено. Проверьте категорию в ⚙ Настройках.
          </div>
        </div>`;
    }
  }

  const catFields = catDef(f.category).fields.map(fieldHTML).join('');

  return `<div class="form-body">
    <div id="ai-inline-panel" class="ai-inline-panel">${settingsHTML()}</div>
    ${state.presets.length ? `<div class="preset-bar">
      <select id="preset-sel">
        <option value="">— выбрать пресет —</option>
        ${state.presets.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </select>
      <button class="btn-icon" data-act="preset-load" title="Загрузить пресет в форму">↓ Загрузить</button>
      <button class="btn-preset-save" data-act="preset-save">💾 Сохранить</button>
    </div>` : `<div class="preset-bar">
      <span style="font-size:12px;color:var(--muted);">Пресетов нет —</span>
      <button class="btn-preset-save" data-act="preset-save">💾 Сохранить текущую форму как пресет</button>
    </div>`}
    ${visionCardHTML()}
    <div class="field">
      <label>Категория</label>
      <select data-act="cat">
        ${CATS.map(c => `<option value="${c.id}" ${f.category===c.id?'selected':''}>${c.label}</option>`).join('')}
      </select>
    </div>
    ${catFields}
    <div class="field">
      <label>Доп. указания</label>
      <input type="text" value="${esc(f.notes)}" data-act="field" data-k="notes"
        placeholder="Акцент на цену/мес, объединить с Deluxe…">
    </div>
    <div class="field">
      <label>Стиль</label>
      <div class="pills">
        ${STYLES.map(s =>
          `<span class="pill ${f.style===s.id?'on':''}" data-act="style" data-val="${s.id}">${s.label}</span>`
        ).join('')}
      </div>
      ${f.style === 'custom' ? `
      <input type="text" value="${esc(f.customStyle)}" data-act="field" data-k="customStyle"
        placeholder="Например: пиши как уличный торговец, кратко и с юмором"
        style="margin-top:6px">` : ''}
    </div>
    <div class="field">
      <label>Количество вариантов</label>
      <div class="count-btns">
        ${[1,2,3,4,5].map(n =>
          `<button class="cnt-btn ${f.count===n?'on':''}" data-act="count" data-val="${n}">${n}</button>`
        ).join('')}
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
      <div class="batch-toggle-row">
        <label class="batch-toggle-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" data-act="toggle-batch" ${state.batchMode?'checked':''} style="accent-color:var(--teal);width:15px;height:15px;">
          📦 Пакетный режим — разные объявления для каждого региона
        </label>
      </div>
      ${state.batchMode ? `
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Выбери регионы — для каждого сгенерируется уникальное объявление:</div>
        <div class="batch-regions">
          ${(state.settings.regions || REGIONS).map(r =>
            `<span class="batch-reg-chip ${state.batchRegions.includes(r)?'on':''}" data-act="batch-region" data-val="${esc(r)}">${esc(r)}</span>`
          ).join('')}
        </div>
        <div style="font-size:11px;margin-top:6px;color:${state.batchRegions.length?'var(--teal-h)':'var(--warn)'}">${state.batchRegions.length ? `Выбрано: ${state.batchRegions.length} регионов` : '⚠ Выберите хотя бы 1 регион'}</div>
      ` : ''}
    </div>
    ${state.batchMode ? `
    <button class="btn-gen" data-act="gen" ${state.loading || !state.batchRegions.length ? 'disabled':''}>
      ${state.loading ? '⏳ Генерирую…' :
        state.batchRegions.length ? `📦 Сгенерировать пакет (${state.batchRegions.length} регионов)` :
        '⚠ Выберите регионы для пакета'}
    </button>
    ` : `
    <button class="btn-gen" data-act="gen-titles" ${state.loading ? 'disabled':''}>
      ${state.loading && state.loadingKind === 'titles' ? '⏳ Подбираю заголовки…' : state.loading ? '⏳ Работаю…' : '🏷️ Сначала заголовки (шаг 1 из 2)'}
    </button>
    <button class="btn-gen-secondary" data-act="gen" ${state.loading ? 'disabled':''}>
      ${state.loading && !state.loadingKind ? '⏳ Генерирую…' : '⚡ Сразу полный вариант, без выбора заголовков'}
    </button>
    `}
  </div>`;
}

function bindQueueTab() {
  document.querySelectorAll('[data-act="qf-field"]').forEach(el => {
    el.addEventListener('input', e => { state.queueForm[e.target.dataset.k] = e.target.value; });
  });
  document.querySelectorAll('[data-act="qf-source"]').forEach(el => {
    el.addEventListener('change', e => {
      state.queueForm.source = e.target.value;
      // UX-6: favId — стабильный _fid, не индекс массива (ломался при удалении/перестановке избранного)
      if (e.target.value === 'fav') {
        const favs = state.favorites;
        if (!favs.some(f => f._fid === state.queueForm.favId)) {
          state.queueForm.favId = favs.length ? favs[0]._fid : null;
        }
      }
      document.getElementById('queue-content').innerHTML = queueTabHTML();
      bindQueueTab();
    });
  });
  const favSel = document.getElementById('qf-fav');
  if (favSel) favSel.addEventListener('change', e => { state.queueForm.favId = e.target.value ? +e.target.value : null; });
}

async function doStartSession() {
  const q = state.postQueue;
  if (!q.length) return;

  const autoItems = q.filter(item => item.source === 'auto');
  const autoVariants = {}; // сгенерированный вариант для каждой авто-позиции по её id

  if (autoItems.length) {
    state.loading = true;
    // Create overlay immediately so spinner shows during AI call (renderSession creates it later)
    let el = document.getElementById('session-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'session-overlay';
      document.body.appendChild(el);
    }
    const setProg = n => { el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--muted)"><div class="spinner"></div><div>Генерирую объявления… ${n}/${autoItems.length}</div></div>`; };
    setProg(0);

    try {
      // Каждая авто-позиция генерируется из СВОЕЙ формы-снимка (UX-1).
      // Старые позиции без снимка — из текущей формы (обратная совместимость).
      for (let i = 0; i < autoItems.length; i++) {
        const it = autoItems[i];
        const form = it.form || state.form;
        const webSearch = form.isPreorder && form.category === 'game';
        const jT0 = Date.now();
        const text = await callAI([{ role: 'user', content: buildMsg(1, [], form) }], { webSearch, category: form.category });
        const v = parseVariants(text)[0] || null;
        // Это платные генерации, и раньше они не попадали в журнал вообще: путь «очередь →
        // сессия постинга» выглядел как размещения без единой генерации, а posted уходил
        // с пустой цепочкой. Штампуем как обычную генерацию.
        if (v) {
          const jChain = 'gen-' + Date.now() + '-' + i;
          v._chain = jChain;
          v._product = it.product || currentProductName(form);
          v._category = form.category;
          v._scan = checkAds(v.title || '', v.description || '', form.category);
          jlog('generated', jChain, {
            path: 'session', category: form.category, product: v._product, region: it.region || null,
            provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
            webSearch, latencyMs: Date.now() - jT0, variants: jVariants([v]),
          });
        }
        autoVariants[it.id] = v;
        setProg(i + 1);
      }
    } catch(e) {
      toast('Ошибка генерации: ' + e.message);
      jlog('error', null, { stage: 'generate_session', message: String(e.message || '').slice(0, 300) });
      state.loading = false;
      document.getElementById('session-overlay')?.remove();
      return;
    }
    state.loading = false;
  }

  const items = q.map(item => {
    if (item.source === 'fav') {
      // UX-6: искать по стабильному _fid, не по индексу (индекс ломался при изменении избранного)
      const fav = state.favorites.find(f => f._fid === item.favId);
      return { ...item, variant: item.variant || fav || null };
    } else {
      return { ...item, variant: item.variant || autoVariants[item.id] || null };
    }
  });

  state.postSession = { active: true, idx: 0, items };
  renderSession();
}

function renderSession() {
  let overlay = document.getElementById('session-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'session-overlay';
    document.body.appendChild(overlay);
  }

  const s = state.postSession;
  if (!s.active) { overlay.remove(); return; }

  if (s.idx >= s.items.length) {
    overlay.innerHTML = `<div class="session-done-screen">
      <div class="session-done-ico">🎉</div>
      <div style="font-size:20px;font-weight:600;color:var(--text)">Сессия завершена!</div>
      <div style="color:var(--muted);font-size:14px;">Размещено ${s.items.length} объявлений</div>
      <button class="btn-gen" data-act="session-close" style="margin-top:10px;padding:12px 32px;">Готово</button>
    </div>`;
    return;
  }

  const item = s.items[s.idx];
  const v = item.variant;
  const pct = Math.round((s.idx / s.items.length) * 100);
  const tAttr = (v?.title||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const dAttr = (v?.description||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');

  overlay.innerHTML = `
    <div class="session-header">
      <div class="session-progress-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:13px;color:var(--text2);">Сессия постинга</span>
          <span class="session-counter">${s.idx+1} / ${s.items.length}</span>
        </div>
        <div class="session-progress-bar"><div class="session-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="btn-sm" data-act="session-close" style="flex-shrink:0;">✕ Завершить</button>
    </div>
    <div class="session-body">
      <div>
        <div class="session-label">Регион</div>
        <span class="session-region-badge">📍 ${esc(item.region)}</span>
        <div class="session-product">${esc(item.product)}</div>
      </div>
      ${v ? `
      <div>
        <div class="session-label">Название ${tlenHTML(v.title ? [...v.title].length : 0, '', 'margin-left:6px;')}</div>
        <div class="session-title-val">${esc(v.title||'')}</div>
        <button class="conv-btn conv-btn-title" data-act="conv-copy-title" data-text="${tAttr}" data-j="title" data-jsess="1" style="margin-top:6px;">📋 Копировать название</button>
      </div>
      <div>
        <div class="session-label">Описание</div>
        <div class="session-desc-val">${esc(v.description||'')}</div>
        <button class="conv-btn conv-btn-desc" data-act="conv-copy-desc" data-text="${dAttr}" data-j="desc" data-jsess="1" style="margin-top:8px;">📋 Копировать описание</button>
      </div>` : `<div style="color:var(--muted);font-size:13px;">⚠️ Нет варианта для этой позиции</div>`}
      <div class="session-actions">
        <button class="session-btn-done" data-act="session-done">✓ Готово — следующий</button>
        <button class="session-btn-skip" data-act="session-skip">⏩ Пропустить</button>
      </div>
    </div>`;
}

// ══════════════════════════════════════════
// РЕДАКТОР КАТЕГОРИЙ (этап 2 направления 1)
// Категория правится как ДАННЫЕ. Встроенные — оверлеем-патчем (см. applyCatPatch),
// поэтому «сбросить к заводской» = удалить патч. Правки живут в черновике
// (state.catDraft) и уезжают в state.catsCfg только по кнопке «Сохранить» —
// иначе полуготовая категория ломала бы форму генератора прямо во время набора.
// ══════════════════════════════════════════

function splitLines(s) { return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }

// Какая категория открыта в редакторе. По умолчанию — та, что выбрана в форме.
function catEditTarget() {
  if (state.catEditId && CATS.some(c => c.id === state.catEditId)) return state.catEditId;
  state.catEditId = CATS.some(c => c.id === state.form.category) ? state.form.category : (CATS[0]?.id || null);
  return state.catEditId;
}

function draftFieldFromData(d) {
  return {
    key: d.key, type: d.type, code: false, builtin: false,
    label: d.label || '', ph: d.ph || '', hidden: false,
    req: !!d.req, reqLocked: false, reqText: d.reqText || '',
    inPrompt: !!d.p, promptLocked: false, p: d.p || '',
    options: (Array.isArray(d.options) ? d.options : []).join('\n'), optionsLocked: false,
    isName: !!d.isName, isPrice: !!d.isPrice,
  };
}

function draftFieldToData(fd) {
  const out = { key: fd.key, type: fd.type, label: (fd.label || '').trim() || fd.key };
  if (fd.ph) out.ph = fd.ph;
  if (fd.type === 'select' || fd.type === 'chips') out.options = splitLines(fd.options);
  if (fd.inPrompt) out.p = (fd.p || '').trim() || out.label;
  if (fd.req) { out.req = true; if (fd.reqText) out.reqText = fd.reqText; }
  if (fd.isName) out.isName = true;
  if (fd.isPrice) out.isPrice = true;
  return out;
}

// Черновик категории: единый data-вид и для встроенной (заводское + патч),
// и для пользовательской — редактор не различает их, кроме набора замков.
function catDraftFor(id) {
  const base = BUILTIN_CATS.find(c => c.id === id);
  if (base) {
    const p  = (state.catsCfg.builtin || {})[id] || {};
    const fp = p.fields || {};
    const fields = base.fields.map(fd => ({
      key: fd.key, type: fd.type, builtin: true,
      code: CODE_FIELD_TYPES.includes(fd.type), // сроки/каталог игр: логика в коде
      label: fp[fd.key]?.label || fd.label,
      ph: fp[fd.key]?.ph != null ? fp[fd.key].ph : (fd.ph || ''),
      hidden: !!fp[fd.key]?.hidden,
      req: fp[fd.key]?.req === false ? false : !!(fd.req || fd.reqCheck),
      reqLocked: !!fd.reqCheck,       // за reqCheck стоит логика, а не галочка
      reqText: fd.req || '',
      inPrompt: !!(fd.p || fd.pRender),
      promptLocked: !!fd.pRender,     // своя строка промпта — правится только в коде
      p: fd.p || '',
      options: fdOptions(fd).join('\n'),
      optionsLocked: typeof fd.options === 'function', // список живёт в коде
      isName: !!(fd.isName || fp[fd.key]?.isName),
      isPrice: !!(fd.isPrice || fp[fd.key]?.isPrice),
    })).concat((Array.isArray(p.add) ? p.add : []).map(draftFieldFromData));
    if (Array.isArray(p.order) && p.order.length) {
      const pos = k => { const i = p.order.indexOf(k); return i === -1 ? 1e6 : i; };
      fields.sort((a, b) => pos(a.key) - pos(b.key));
    }
    return {
      id, builtin: true, patched: !!Object.keys(p).length,
      label: p.label || base.label, pName: p.pName || base.pName || '',
      extraText: p.extraText || '',
      visionHint: p.visionHint || base.visionHint || '',
      scanRequire: (p.scanRequire || []).join('\n'),
      scanForbid:  (p.scanForbid  || []).join('\n'),
      scanRules: Object.fromEntries(SCAN_RULES.map(r => [r.id,
        p.scanRules && Object.prototype.hasOwnProperty.call(p.scanRules, r.id) ? !!p.scanRules[r.id] : scanRuleFactory(id, r.id)])),
      fields,
    };
  }
  const d = (state.catsCfg.custom || []).find(c => c.id === id);
  if (!d) return null;
  return {
    id, builtin: false, patched: false,
    label: d.label || '', pName: d.pName || '', extraText: d.extraText || '',
    visionHint: d.visionHint || '',
    scanRequire: (d.scanRequire || []).join('\n'),
    scanForbid:  (d.scanForbid  || []).join('\n'),
    scanRules: Object.fromEntries(SCAN_RULES.map(r => [r.id,
      d.scanRules && Object.prototype.hasOwnProperty.call(d.scanRules, r.id) ? !!d.scanRules[r.id] : scanRuleFactory(id, r.id)])),
    fields: (Array.isArray(d.fields) ? d.fields : []).map(draftFieldFromData),
  };
}

function catDraftEnsure() {
  const id = catEditTarget();
  if (!id) { state.catDraft = null; return null; }
  if (!state.catDraft || state.catDraft.id !== id) state.catDraft = catDraftFor(id);
  return state.catDraft;
}

// Черновик → оверлей. Для встроенной пишем только ОТЛИЧИЯ от заводской: так
// правки заводских категорий в будущих версиях доедут, а не замрут копией.
function catDraftApply(draft) {
  const keys = draft.fields.map(f => f.key);
  if (new Set(keys).size !== keys.length) return 'В категории есть поля с одинаковым ключом';
  if (!(draft.label || '').trim()) return 'Название категории не может быть пустым';

  if (draft.builtin) {
    const base = BUILTIN_CATS.find(c => c.id === draft.id);
    const p = {}, fields = {}, add = [];
    if (draft.label.trim() !== base.label)            p.label = draft.label.trim();
    if (draft.pName.trim() !== (base.pName || ''))    p.pName = draft.pName.trim();
    if (draft.extraText.trim())                        p.extraText = draft.extraText.trim();
    if (draft.visionHint.trim() !== (base.visionHint || '')) p.visionHint = draft.visionHint.trim();
    const req = splitLines(draft.scanRequire), forb = splitLines(draft.scanForbid);
    if (req.length)  p.scanRequire = req;
    if (forb.length) p.scanForbid  = forb;
    // В патч пишем только правила, отличающиеся от заводского значения
    const rules = {};
    for (const r of SCAN_RULES) {
      const want = !!draft.scanRules[r.id];
      if (want !== scanRuleFactory(draft.id, r.id)) rules[r.id] = want;
    }
    if (Object.keys(rules).length) p.scanRules = rules;
    for (const fd of draft.fields) {
      if (!fd.builtin) { add.push(draftFieldToData(fd)); continue; }
      const bf = base.fields.find(x => x.key === fd.key);
      if (!bf) continue;
      const patch = {};
      if ((fd.label || '').trim() && fd.label.trim() !== bf.label) patch.label = fd.label.trim();
      if ((fd.ph || '') !== (bf.ph || ''))     patch.ph = fd.ph || '';
      if (fd.hidden)                           patch.hidden = true;
      if (!fd.req && bf.req)                   patch.req = false;
      if (fd.isName && !bf.isName)             patch.isName = true;
      if (fd.isPrice && !bf.isPrice)           patch.isPrice = true;
      if (Object.keys(patch).length) fields[fd.key] = patch;
    }
    if (Object.keys(fields).length) p.fields = fields;
    if (add.length) p.add = add;
    const order     = draft.fields.map(f => f.key).join('|');
    const baseOrder = base.fields.map(f => f.key).concat(add.map(f => f.key)).join('|');
    if (order !== baseOrder) p.order = draft.fields.map(f => f.key);
    if (!state.catsCfg.builtin) state.catsCfg.builtin = {};
    if (Object.keys(p).length) state.catsCfg.builtin[draft.id] = p;
    else delete state.catsCfg.builtin[draft.id]; // правок не осталось — это и есть заводская
  } else {
    const d = {
      id: draft.id,
      label: draft.label.trim(),
      pName: draft.pName.trim() || draft.label.trim(),
      fields: draft.fields.map(draftFieldToData),
    };
    if (draft.extraText.trim())  d.extraText  = draft.extraText.trim();
    if (draft.visionHint.trim()) d.visionHint = draft.visionHint.trim();
    const req = splitLines(draft.scanRequire), forb = splitLines(draft.scanForbid);
    if (req.length)  d.scanRequire = req;
    if (forb.length) d.scanForbid  = forb;
    const rules = {};
    for (const r of SCAN_RULES) {
      const want = !!draft.scanRules[r.id];
      if (want !== scanRuleFactory(draft.id, r.id)) rules[r.id] = want;
    }
    if (Object.keys(rules).length) d.scanRules = rules;
    if (!Array.isArray(state.catsCfg.custom)) state.catsCfg.custom = [];
    const i = state.catsCfg.custom.findIndex(c => c.id === d.id);
    if (i === -1) state.catsCfg.custom.push(d); else state.catsCfg.custom[i] = d;
  }
  rebuildCats(); save();
  return '';
}

function catNewFieldKey(draft) {
  let k;
  do { k = 'u_' + Math.random().toString(36).slice(2, 7); } while (draft.fields.some(f => f.key === k));
  return k;
}

// Перерисовываем только карточку категорий: полный render() на каждую правку
// сбрасывал бы фокус и в соседних карточках Настроек (каталог, промпт).
function renderCatEditor() {
  const box = document.getElementById('cat-editor-box');
  if (!box) return;
  box.innerHTML = catEditorHTML();
  bindCatEditor();
}

function bindCatEditor() {
  const box = document.getElementById('cat-editor-box');
  if (!box) return;
  const d = () => state.catDraft;

  const dirty = () => {
    // Черновик отличается от сохранённого — подсветим кнопку сохранения
    box.querySelector('[data-act="cat-ed-save"]')?.classList.add('cat-dirty');
  };

  box.querySelector('#cat-ed-sel')?.addEventListener('change', e => {
    state.catEditId = e.target.value; state.catDraft = null; renderCatEditor();
  });

  // Текстовые поля черновика пишутся БЕЗ перерисовки — иначе теряется фокус
  box.querySelectorAll('[data-act="catd"]').forEach(el => {
    el.addEventListener('input', () => { if (d()) { d()[el.dataset.k] = el.value; dirty(); } });
  });
  box.querySelectorAll('[data-act="catf"]').forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') {
      el.addEventListener('change', () => {
        const fd = d()?.fields[i]; if (!fd) return;
        if (el.type === 'checkbox') {
          fd[k] = el.checked;
          // «Название товара» — ровно одно поле на категорию: иначе непонятно,
          // что писать в штамп варианта и в историю
          if (k === 'isName' && el.checked) d().fields.forEach((o, j) => { if (j !== i) o.isName = false; });
        } else {
          fd[k] = el.value;
          if (k === 'type' && !['select', 'chips'].includes(el.value)) fd.options = '';
        }
        dirty(); renderCatEditor();
      });
    } else {
      el.addEventListener('input', () => { const fd = d()?.fields[i]; if (fd) { fd[k] = el.value; dirty(); } });
    }
  });

  box.querySelectorAll('[data-act="catr"]').forEach(el => {
    el.addEventListener('change', () => {
      if (!d()) return;
      d().scanRules[el.dataset.k] = el.checked;
      dirty();
    });
  });

  box.querySelectorAll('[data-act="cat-fld-up"], [data-act="cat-fld-down"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i, j = btn.dataset.act === 'cat-fld-up' ? i - 1 : i + 1;
      const arr = d()?.fields; if (!arr || j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      renderCatEditor();
    });
  });
  box.querySelectorAll('[data-act="cat-fld-del"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i, fd = d()?.fields[i]; if (!fd) return;
      if (!confirm(`Удалить поле «${fd.label || fd.key}» из категории?`)) return;
      d().fields.splice(i, 1); renderCatEditor();
    });
  });
  box.querySelector('[data-act="cat-fld-add"]')?.addEventListener('click', () => {
    if (!d()) return;
    d().fields.push({
      key: catNewFieldKey(d()), type: 'text', builtin: false, code: false,
      label: '', ph: '', hidden: false, req: false, reqLocked: false, reqText: '',
      inPrompt: true, promptLocked: false, p: '', options: '', optionsLocked: false, isName: false,
    });
    renderCatEditor();
  });

  box.querySelector('[data-act="cat-new"]')?.addEventListener('click', () => {
    const name = prompt('Название новой категории (как в списке Генератора):', '🧷 Физический товар');
    if (!name || !name.trim()) return;
    const id = 'u_' + Date.now().toString(36);
    state.catEditId = id;
    state.catDraft = {
      id, builtin: false, patched: false,
      // В промпт имя категории идёт без ведущего эмодзи. Отрезаем всё до первой
      // буквы/цифры через \p{L}: \W в JS не считает буквой кириллицу и срезал бы
      // название целиком (та же ловушка, что была в правиле сканера F19).
      label: name.trim(), pName: name.trim().replace(/^[^\p{L}\p{N}]+/u, ''), extraText: '',
      visionHint: '', scanRequire: '', scanForbid: '',
      scanRules: Object.fromEntries(SCAN_RULES.map(r => [r.id, !!r.def(id)])),
      fields: [{
        key: 'u_name', type: 'text', builtin: false, code: false,
        label: 'Название товара', ph: '', hidden: false, req: true, reqLocked: false,
        reqText: 'название товара', inPrompt: true, promptLocked: false, p: 'Название',
        options: '', optionsLocked: false, isName: true,
      }],
    };
    // Сохраняем сразу — иначе новой категории нет ни в CATS, ни в селекте редактора
    const err = catDraftApply(state.catDraft);
    if (err) { toast(err); return; }
    state.catDraft = null; renderCatEditor(); toast('Категория создана — добавьте поля и сохраните');
  });

  box.querySelector('[data-act="cat-clone"]')?.addEventListener('click', () => {
    const src = d(); if (!src) return;
    const name = prompt('Название копии:', src.label + ' (копия)');
    if (!name || !name.trim()) return;
    const id = 'u_' + Date.now().toString(36);
    // Ключи полей сохраняем: клон «Игры» продолжает работать с подгрузкой обложек,
    // инфографикой и распознаванием по фото, которые ссылаются на эти же ключи.
    // Кодовые поля (сроки, каталог игр) не переносятся — их логика живёт в коде.
    const fields = src.fields.filter(f => !f.code && !f.hidden)
      .map(f => ({ ...f, builtin: false, code: false, optionsLocked: false, promptLocked: false, reqLocked: false }));
    state.catEditId = id;
    state.catDraft = { ...src, id, builtin: false, patched: false, label: name.trim(), fields };
    const err = catDraftApply(state.catDraft);
    if (err) { toast(err); return; }
    state.catDraft = null; renderCatEditor();
    toast(src.fields.some(f => f.code) ? 'Скопировано (кодовые поля пропущены)' : 'Категория скопирована');
  });

  box.querySelector('[data-act="cat-reset"]')?.addEventListener('click', () => {
    const id = d()?.id; if (!id) return;
    if (!confirm('Вернуть категорию к заводскому виду? Все правки этой категории будут потеряны.')) return;
    if (state.catsCfg.builtin) delete state.catsCfg.builtin[id];
    rebuildCats(); save(); state.catDraft = null; renderCatEditor(); reForm();
    toast('Категория сброшена к заводской');
  });

  box.querySelector('[data-act="cat-del"]')?.addEventListener('click', () => {
    const id = d()?.id; if (!id) return;
    if (!confirm(`Удалить категорию «${d().label}»? Объявления, уже сгенерированные в ней, останутся.`)) return;
    state.catsCfg.custom = (state.catsCfg.custom || []).filter(c => c.id !== id);
    rebuildCats();
    // Форма не должна остаться на несуществующей категории
    if (state.form.category === id) state.form.category = CATS[0]?.id || 'gaming_sub';
    save(); state.catEditId = null; state.catDraft = null; renderCatEditor(); reForm();
    toast('Категория удалена');
  });

  box.querySelector('[data-act="cat-ed-save"]')?.addEventListener('click', () => {
    const draft = d(); if (!draft) return;
    const err = catDraftApply(draft);
    if (err) { toast(err); return; }
    state.catDraft = null; renderCatEditor(); reForm();
    toast('Категория сохранена');
  });

  box.querySelector('[data-act="cat-json-export"]')?.addEventListener('click', () => {
    try {
      const blob = new Blob([JSON.stringify(state.catsCfg, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `avito-categories-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch(e) { toast('Не удалось выгрузить категории'); }
  });
  box.querySelector('[data-act="cat-json-import"]')?.addEventListener('click', () => {
    box.querySelector('#cat-json-file')?.click();
  });
  box.querySelector('#cat-json-file')?.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // тот же файл можно выбрать повторно
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      let data;
      try { data = JSON.parse(rd.result); } catch(err) { toast('Файл не читается как JSON'); return; }
      if (!data || typeof data !== 'object' || (!data.builtin && !data.custom)) { toast('Это не файл категорий'); return; }
      const cnt = (Array.isArray(data.custom) ? data.custom.length : 0);
      if (!confirm(`Заменить настройки категорий на файл? Своих категорий в файле: ${cnt}. Текущие правки категорий будут потеряны.`)) return;
      state.catsCfg = {
        builtin: (data.builtin && typeof data.builtin === 'object') ? data.builtin : {},
        custom:  Array.isArray(data.custom) ? data.custom.filter(c => c && c.id) : [],
      };
      rebuildCats();
      if (!CATS.some(c => c.id === state.form.category)) state.form.category = CATS[0]?.id || 'gaming_sub';
      save(); state.catEditId = null; state.catDraft = null; renderCatEditor(); reForm();
      toast(`Категории загружены: ${CATS.length} всего`);
    };
    rd.readAsText(file);
  });
}

function bindSettingsTab() {
  bindCatEditor();
  document.querySelectorAll('[data-act="preset-rename"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = +btn.dataset.id;
      const p = state.presets.find(x => x.id === id);
      if (!p) return;

    const val = regionInput?.value.trim();

      if (!state.settings.regions) state.settings.regions = [...REGIONS];
      state.settings.regions.push(val);
      save(); render();
    } else {
      toast('Уже есть в списке');

  }
  regionAddBtn?.addEventListener('click', doAddRegion);
  regionInput?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAddRegion(); } });
  document.getElementById('sys-save')?.addEventListener('click', () => {
    const val = document.getElementById('sys-prompt')?.value || '';

    toast('Промпт сброшен до дефолтного');

  });
  document.getElementById('journal-toggle')?.addEventListener('click', () => {
    try {
      if (jEnabled()) {
        jlog('journal_off', null, {});
        localStorage.setItem(J_OFF_KEY, '1');
        // Выключение останавливает СБОР, но уже собранное надо отдать — иначе оно
        // навсегда осталось бы в localStorage, занимая место и не доехав до разбора
        jFlush(true);
      } else { localStorage.removeItem(J_OFF_KEY); jlog('journal_on', null, {}); }

  document.getElementById('journal-dump')?.addEventListener('click', () => {
    try {
      if (!_jBuf.length) { toast('Буфер пуст — всё отправлено на сервер'); return; }

      a.click();
      URL.revokeObjectURL(a.href);
    } catch(e) { toast('Не удалось выгрузить буфер'); }

}

async function cvFetchFromIGDB() {
  const ta = document.getElementById('cv-igdb-names');
  if (!ta) return;
  const allNames = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!allNames.length) return;
  cv.igdbNames = ta.value;

  const prog = document.getElementById('cv-igdb-prog');
  // F18: коллаж — не больше 10 фото (как в ручной загрузке cvAddFiles); лишние имена не молчим
  const room = Math.max(0, 10 - cv.images.length);
  if (room === 0) { if (prog) prog.textContent = '⚠ Уже 10 обложек — удалите лишние, чтобы добавить'; return; }
  const names = allNames.slice(0, room);
  const skipped = allNames.slice(room);

  const btn  = document.getElementById('cv-igdb-btn');
  if (btn) btn.disabled = true;

  let loaded = 0;
  const failed = [];

  for (const name of names) {
    if (prog) prog.textContent = `⏳ ${loaded}/${names.length} — ищем «${name}»...`;
    try {
      const resp = await fetch(`https://api.poigraem.shop/igdb/cover?name=${encodeURIComponent(name)}&type=game`);
      const data = await resp.json();
      if (!data.cover) { failed.push(name); continue; }
      const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.cover.replace(/\/t_[a-z0-9_]+\//, '/t_1080p/'));
      await new Promise(resolve => {
        const el = new Image();
        el.crossOrigin = 'anonymous';
        el.onload  = () => { cv.images.push({ id: ++_cvId, url: el.src, el, transform:{scale:1,ox:0,oy:0} }); loaded++; resolve(); };
        el.onerror = () => { failed.push(name); resolve(); };
        el.src = url;
      });
    } catch(e) { failed.push(name); }
  }

  if (prog) prog.textContent = `✓ Загружено: ${loaded}/${names.length}` +
    (failed.length ? ` · Не найдено: ${failed.join(', ')}` : '') +
    (skipped.length ? ` · Пропущено (лимит 10): ${skipped.join(', ')}` : '');
  if (btn) btn.disabled = false;
  jlog('cv_images', null, { source: 'igdb', added: loaded, failed: failed.length, names });
  cvRenderState();
}

// ── Canvas ──

function cvRR(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// Вычисляет прямоугольник-источник (cover-fit + zoom/pan из transform) — общий для cvFit и cvDrawCirc4
function cvFitSrcRect(img, w, h, t) {
  const ir = img.naturalWidth / img.naturalHeight, cr = w / h;
  let sx, sy, sw, sh;
  if (ir > cr) { sh=img.naturalHeight; sw=sh*cr; sx=(img.naturalWidth-sw)/2; sy=0; }
  else         { sw=img.naturalWidth;  sh=sw/cr; sx=0; sy=(img.naturalHeight-sh)/2; }
  if (t) {
    const s = Math.max(1, Math.min(4, t.scale || 1));
    const nsw = sw/s, nsh = sh/s;
    const maxOx = (sw-nsw)/2, maxOy = (sh-nsh)/2;
    const ox = Math.max(-maxOx, Math.min(maxOx, (t.ox||0)*sw));
    const oy = Math.max(-maxOy, Math.min(maxOy, (t.oy||0)*sh));
    sx += (sw-nsw)/2 + ox; sy += (sh-nsh)/2 + oy;
    sw = nsw; sh = nsh;
  }
  return { sx, sy, sw, sh };
}

function cvFit(ctx, img, x, y, w, h, r, t) {
  const { sx, sy, sw, sh } = cvFitSrcRect(img, w, h, t);
  ctx.save();
  if (r > 0) { cvRR(ctx,x,y,w,h,r); ctx.clip(); }
  ctx.drawImage(img, sx,sy,sw,sh, x,y,w,h);
  ctx.restore();
}

const COLLAGE_LAYOUTS = {
  'single':  { name:'1 фото',    n:1, cells:(cw,ch,p)=>[{x:p,y:p,w:cw-2*p,h:ch-2*p}] },
  '1x2':     { name:'1+1',       n:2, cells:(cw,ch,p)=>{ const iw=(cw-3*p)/2; return [{x:p,y:p,w:iw,h:ch-2*p},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:ch-2*p}]; } },
  '2+1':     { name:'2+1',       n:3, cells:(cw,ch,p)=>{ const th=(ch-3*p)*.56,bh=ch-3*p-th,iw=(cw-3*p)/2; return [{x:p,y:p,w:iw,h:th},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:th},{x:p,y:2*p+th,w:cw-2*p,h:bh}]; } },
  '2x2':     { name:'2×2',       n:4, cells:(cw,ch,p)=>{ const iw=(cw-3*p)/2,ih=(ch-3*p)/2; return [{x:p,y:p,w:iw,h:ih},{x:2*p+iw,y:p,w:cw-2*p-iw-p,h:ih},{x:p,y:2*p+ih,w:iw,h:ch-2*p-ih-p},{x:2*p+iw,y:2*p+ih,w:cw-2*p-iw-p,h:ch-2*p-ih-p}]; } },

  { sep: '7 изображений',   ids: ['3+4','4+3','2+3+2'] },
