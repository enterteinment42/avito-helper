function cvAutoLayout(count) {
  if (count <= 1) return 'single';
  if (count === 2) return '1x2';
  if (count === 3) return '2+1';
  if (count === 4) return '2x2';
  if (count === 5) return '2+3';
  if (count === 6) return '3x2';
  if (count === 7) return '3+4';
  if (count === 8) return '4x2';
  if (count === 9) return '3x3';
  return '5x2';
}

function cvResolveLayout(layout, count) {
  if (layout === 'auto') return cvAutoLayout(count);
  if (layout === 'strip') return layout;
  if (layout === 'diag' || layout === 'stack') return layout;
  if (layout === 'circ4') return count === 5 ? 'circ4' : cvAutoLayout(count);
  if (layout === 'circ4d') return count === 5 ? 'circ4d' : cvAutoLayout(count);
  if (layout === 'square5') return count === 5 ? 'square5' : cvAutoLayout(count);
  const L = COLLAGE_LAYOUTS[layout];
  if (!L) return cvAutoLayout(count);
  if (L.n !== count) return cvAutoLayout(count);
  return layout;
}

function cvCells(layout, count, cw, ch, p) {
  const L = cvResolveLayout(layout, count);
  if (L === 'strip') {
    const iw = (cw - (count + 1) * p) / count;
    return Array.from({length: count}, (_, i) => ({x: p + i * (iw + p), y: p, w: iw, h: ch - 2 * p}));
  }
  // circ4: imgs[0]=centre circle, imgs[1..4]=bg quads (order matches draw fn)
  if (L === 'circ4') {
    const hw=(cw-3*p)/2, hw2=cw-2*p-hw-p;
    const hh=(ch-3*p)/2, hh2=ch-2*p-hh-p;
    const r=Math.floor(Math.min(cw,ch)*0.30);
    return [
      {cx:cw/2,cy:ch/2,r,circle:true},
      {x:p,y:p,w:hw,h:hh},
      {x:2*p+hw,y:p,w:hw2,h:hh},
      {x:p,y:2*p+hh,w:hw,h:hh2},
      {x:2*p+hw,y:2*p+hh,w:hw2,h:hh2},
    ];
  }
  // circ4d: imgs[0]=centre circle, imgs[1..4]=диагональные (pinwheel) фоновые квадранты
  if (L === 'circ4d') {
    const cx=cw/2, cy=ch/2, off=Math.min(cw,ch)*0.16, r=Math.floor(Math.min(cw,ch)*0.30);
    return [
      {cx,cy,r,circle:true},
      {poly:[[p,p],[cw-p,p],[cx+off,cy],[cx-off,cy]]},
      {poly:[[cw-p,p],[cw-p,ch-p],[cx,cy+off],[cx,cy-off]]},
      {poly:[[cw-p,ch-p],[p,ch-p],[cx-off,cy],[cx+off,cy]]},
      {poly:[[p,ch-p],[p,p],[cx,cy-off],[cx,cy+off]]},
    ];
  }
  // square5: imgs[0]=centre square, imgs[1..4]=bg quads
  if (L === 'square5') {
    const hw=(cw-3*p)/2, hw2=cw-2*p-hw-p;
    const hh=(ch-3*p)/2, hh2=ch-2*p-hh-p;
    const side=Math.floor(Math.min(cw,ch)*0.55);
    return [
      {x:Math.round(cw/2-side/2),y:Math.round(ch/2-side/2),w:side,h:side,square:true},
      {x:p,y:p,w:hw,h:hh},
      {x:2*p+hw,y:p,w:hw2,h:hh},
      {x:p,y:2*p+hh,w:hw,h:hh2},
      {x:2*p+hw,y:2*p+hh,w:hw2,h:hh2},
    ];
  }
  return COLLAGE_LAYOUTS[L]?.cells(cw, ch, p, count) ?? [];
}

function cvDrawCirc4(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  // 4 фоновые картинки = сетка 2×2 на ВЕСЬ canvas (как обычный 2x2, без пустот)
  const halfW = (cw - 3 * p) / 2, halfW2 = cw - 2 * p - halfW - p;
  const halfH = (ch - 3 * p) / 2, halfH2 = ch - 2 * p - halfH - p;
  const grid = [
    {x: p,             y: p,             w: halfW,  h: halfH },
    {x: 2*p + halfW,   y: p,             w: halfW2, h: halfH },
    {x: p,             y: 2*p + halfH,   w: halfW,  h: halfH2},
    {x: 2*p + halfW,   y: 2*p + halfH,   w: halfW2, h: halfH2},
  ];
  grid.forEach((cell, i) => {
    if (i + 1 < imgs.length) cvFit(ctx, imgs[i + 1].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i + 1].transform);
  });
  // Круг сверху по центру, перекрывает стык 4 блоков
  const r = Math.floor(Math.min(cw, ch) * 0.30);
  const img = imgs[0].el;
  const d = r * 2;
  const { sx, sy, sw, sh } = cvFitSrcRect(img, d, d, imgs[0].transform);
  ctx.save();
  ctx.fillStyle = cv.bg;
  ctx.beginPath(); ctx.arc(cx, cy, r + Math.max(8, Math.round(p * 0.7)), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.shadowColor = 'transparent';
  ctx.drawImage(img, sx, sy, sw, sh, cx - r, cy - r, d, d);
  ctx.restore();
}

// circ4d: те же 4 картинки + круг, но фон — 4 диагональных (pinwheel) квадранта вместо прямой сетки 2×2
function cvDrawCirc4D(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  const off = Math.min(cw, ch) * 0.16;
  const polys = [
    [[p,p],[cw-p,p],[cx+off,cy],[cx-off,cy]],
    [[cw-p,p],[cw-p,ch-p],[cx,cy+off],[cx,cy-off]],
    [[cw-p,ch-p],[p,ch-p],[cx-off,cy],[cx+off,cy]],
    [[p,ch-p],[p,p],[cx,cy-off],[cx,cy+off]],
  ];
  polys.forEach((poly, i) => {
    if (i + 1 >= imgs.length) return;
    const xs = poly.map(pt => pt[0]), ys = poly.map(pt => pt[1]);
    const bx = Math.min(...xs), by = Math.min(...ys);
    const bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
    ctx.save();
    ctx.beginPath();
    poly.forEach(([x,y], k) => k === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
    ctx.closePath(); ctx.clip();
    cvFitClip(ctx, imgs[i + 1].el, bx, by, bw, bh);
    ctx.restore();
  });
  // Круг сверху по центру, перекрывает стык 4 квадрантов
  const r = Math.floor(Math.min(cw, ch) * 0.30);
  const img = imgs[0].el;
  const d = r * 2;
  const { sx, sy, sw, sh } = cvFitSrcRect(img, d, d, imgs[0].transform);
  ctx.save();
  ctx.fillStyle = cv.bg;
  ctx.beginPath(); ctx.arc(cx, cy, r + Math.max(8, Math.round(p * 0.7)), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.shadowColor = 'transparent';
  ctx.drawImage(img, sx, sy, sw, sh, cx - r, cy - r, d, d);
  ctx.restore();
}

// Вписать картинку в произвольную clip-область (заполнение с обрезкой)
function cvFitClip(ctx, img, bx, by, bw, bh) {
  const ir = img.naturalWidth / img.naturalHeight, cr = bw / bh;
  let sx, sy, sw, sh;
  if (ir > cr) { sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth - sw) / 2; sy = 0; }
  else         { sw = img.naturalWidth;  sh = sw / cr; sx = 0; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, bx, by, bw, bh);
}

// square5: сетка 2×2 + квадратная плашка по центру
function cvDrawSquare5(ctx, imgs, cw, ch, p, cr) {
  if (!imgs.length) return;
  const cx = cw / 2, cy = ch / 2;
  const halfW = (cw - 3 * p) / 2, halfW2 = cw - 2 * p - halfW - p;
  const halfH = (ch - 3 * p) / 2, halfH2 = ch - 2 * p - halfH - p;
  const grid = [
    {x: p,           y: p,           w: halfW,  h: halfH },
    {x: 2*p + halfW, y: p,           w: halfW2, h: halfH },
    {x: p,           y: 2*p + halfH, w: halfW,  h: halfH2},
    {x: 2*p + halfW, y: 2*p + halfH, w: halfW2, h: halfH2},
  ];
  grid.forEach((cell, i) => {
    if (i + 1 < imgs.length) cvFit(ctx, imgs[i + 1].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i + 1].transform);
  });
  // Центральная квадратная плашка (+30% крупнее)
  const side = Math.floor(Math.min(cw, ch) * 0.55);
  const sqX = Math.round(cx - side / 2), sqY = Math.round(cy - side / 2);
  const sqRing = Math.max(8, Math.round(p * 0.7));
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 28;
  ctx.fillStyle = cv.bg;
  cvRR(ctx, sqX - sqRing, sqY - sqRing, side + sqRing*2, side + sqRing*2, cr); ctx.fill();
  ctx.restore();
  cvFit(ctx, imgs[0].el, sqX, sqY, side, side, cr, imgs[0].transform);
}

function cvDrawBurst(ctx, cx, cy, outerR, innerR, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    if (i === 0) ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    else ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
  }
  ctx.closePath();
}

function cvDrawMaskSticker(ctx, cw, ch) {
  if (!cv.maskSticker || !cv.maskStickerText.trim()) return;
  const tx = cv.maskStickerText.trim();
  const shape = cv.maskStickerShape;
  const sz = cv.maskStickerSize;
  const bg = cv.maskStickerBg;
  const color = cv.maskStickerColor;
  const mg = sz * 0.3;
  let scx, scy;
  if (cv.maskStickerX !== null && cv.maskStickerY !== null) {
    scx = cv.maskStickerX; scy = cv.maskStickerY;
  } else {
    const pos = cv.maskStickerPos;
    if      (pos==='tl') { scx=mg+sz*.5;      scy=mg+sz*.5; }
    else if (pos==='tr') { scx=cw-mg-sz*.5;   scy=mg+sz*.5; }
    else if (pos==='bl') { scx=mg+sz*.5;      scy=ch-mg-sz*.5; }
    else if (pos==='br') { scx=cw-mg-sz*.5;   scy=ch-mg-sz*.5; }
    else                 { scx=cw/2;          scy=ch/2; }
  }
  ctx.save();
  ctx.translate(scx, scy);
  if (cv.maskStickerAngle) ctx.rotate(cv.maskStickerAngle * Math.PI / 180);
  if (shape === 'badge') {
    const bw=sz*1.5, bh=sz*.7, br=bh*.35;
    cvRR(ctx, -bw/2, -bh/2, bw, bh, br); ctx.fillStyle=bg; ctx.fill();
  } else if (shape === 'burst') {
    cvDrawBurst(ctx, 0, 0, sz*.52, sz*.3, 10); ctx.fillStyle=bg; ctx.fill();
  } else if (shape === 'circle') {
    ctx.beginPath(); ctx.arc(0, 0, sz*.5, 0, Math.PI*2); ctx.fillStyle=bg; ctx.fill();
  } else if (shape === 'ribbon') {
    ctx.rotate(Math.PI/4);
    ctx.fillStyle=bg; ctx.fillRect(-sz*.9, -sz*.21, sz*1.8, sz*.42);
  } else if (shape === 'diamond') {
    ctx.beginPath(); ctx.moveTo(0,-sz*.52); ctx.lineTo(sz*.52,0); ctx.lineTo(0,sz*.52); ctx.lineTo(-sz*.52,0); ctx.closePath();
    ctx.fillStyle=bg; ctx.fill();
  } else if (shape === 'pill') {
    const bw=sz*1.45, bh=sz*.6; cvRR(ctx, -bw/2, -bh/2, bw, bh, bh/2); ctx.fillStyle=bg; ctx.fill();
  } else if (shape === 'hex') {
    ctx.beginPath();
    for (let i=0;i<6;i++){ const a=Math.PI/3*i-Math.PI/2, r=sz*.52; const px=r*Math.cos(a), py=r*Math.sin(a); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fillStyle=bg; ctx.fill();
  }
  // Доступная ширина текста для каждой формы
  const textW = {burst:sz*.62,circle:sz*.78,badge:sz*1.3,ribbon:sz*1.5,diamond:sz*.68,pill:sz*1.25,hex:sz*.82}[shape]||sz*.72;
  const lineH_mul = 1.15;
  // Авто-размер: начинаем с sz*0.32, уменьшаем пока текст не влезет или не разобьём на строки
  function fitText(maxFs) {
    let fs = maxFs;
    while (fs > 8) {
      ctx.font = `bold ${fs}px 'JetBrains Mono',monospace`;
      const words = tx.split(' ');
      const lines = []; let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > textW && line) { lines.push(line); line = w; }
        else line = test;
      }
      if (line) lines.push(line);
      if (lines.every(l => ctx.measureText(l).width <= textW)) return { lines, fs };
      fs = Math.round(fs * 0.88);
    }
    return { lines: [tx], fs: 8 };
  }
  const { lines, fs } = fitText(Math.round(sz * 0.32));
  ctx.font = `bold ${fs}px 'JetBrains Mono',monospace`;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = fs * lineH_mul;
  const totalH = lines.length * lh;
  lines.forEach((l, i) => ctx.fillText(l, 0, (i - (lines.length - 1) / 2) * lh));
  ctx.restore();
}

// ── Text overlay (stories-style) ──
function cvDrawTextOverlay(ctx, cw, ch) {
  if (!cv.textOverlay || !cv.textOverlayText.trim()) return;
  const lines = cv.textOverlayText.trim().split('\n').filter(l => l.trim());
  if (!lines.length) return;
  const fs = cv.textOverlaySize;
  const weight = cv.textOverlayBold ? 'bold' : 'normal';
  ctx.font = `${weight} ${fs}px Literata,Georgia,serif`;
  const lh = fs * 1.28;
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const totalH = lines.length * lh;
  const padX = fs * 0.55, padY = fs * 0.32;
  let scx = cv.textOverlayX ?? cw / 2;
  let scy = cv.textOverlayY ?? ch / 2;
  ctx.save();
  ctx.translate(scx, scy);
  if (cv.textOverlayAngle) ctx.rotate(cv.textOverlayAngle * Math.PI / 180);
  if (cv.textOverlayBg) {
    const bw = maxW + padX * 2, bh = totalH + padY * 2;
    const r = fs * 0.22;
    ctx.globalAlpha = cv.textOverlayBgOpacity;
    ctx.fillStyle = cv.textOverlayBgColor;
    cvRR(ctx, -bw / 2, -bh / 2, bw, bh, r);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = cv.textOverlayColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach((l, i) => {
    ctx.fillText(l, 0, (i - (lines.length - 1) / 2) * lh);
  });
  ctx.restore();
}

// ── 📋 Инфографика: пилюли-характеристики поверх обложки ──
// ov (переопределение для «✨ 4 варианта»): {align, bg, shift} — позиция/цвет/порядок строк
// как оси антидубля; при ov drag-позиция игнорируется, чтобы варианты реально отличались
function cvInfogLines(shift) {
  let ls = (cv.infogText || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 6);
  // shift вращает строки, но первая (название товара) остаётся на месте
  if (shift && ls.length > 2) {
    const rest = ls.slice(1), s = shift % rest.length;
    ls = [ls[0], ...rest.slice(s), ...rest.slice(0, s)];
  }
  return ls;
}
function cvInfogMetrics(ctx, cw, ch, ov) {
  const lines = cvInfogLines(ov?.shift);
  if (!lines.length) return null;
  const fs = cv.infogSize;
  ctx.font = `bold ${fs}px 'JetBrains Mono',monospace`;
  const padX = fs * 0.75, bh = fs * 1.75, gap = fs * 0.42;
  const widths = lines.map(l => Math.min(ctx.measureText(l).width + padX * 2, cw * 0.92));
  const maxW = Math.max(...widths);
  const totalH = lines.length * bh + (lines.length - 1) * gap;
  const align = ov?.align ?? cv.infogAlign;
  const mg = cw * 0.045;
  let x, y;
  if (!ov && cv.infogX !== null && cv.infogY !== null) { x = cv.infogX; y = cv.infogY; }
  else {
    x = align === 'right' ? cw - mg - maxW : mg;
    y = ch - ch * 0.06 - totalH;
  }
  return { lines, fs, padX, bh, gap, widths, maxW, totalH, x, y, align };
}
function cvDrawInfog(ctx, cw, ch, ov) {
  if (!cv.infog) return;
  const m = cvInfogMetrics(ctx, cw, ch, ov);
  if (!m) return;
  const bg = ov?.bg ?? cv.infogBg;
  ctx.save();
  ctx.font = `bold ${m.fs}px 'JetBrains Mono',monospace`;
  ctx.textBaseline = 'middle';
  m.lines.forEach((l, i) => {
    const py = m.y + i * (m.bh + m.gap);
    const w = m.widths[i];
    const px = m.align === 'right' ? m.x + m.maxW - w : m.x;
    ctx.globalAlpha = cv.infogBgOpacity;
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = m.fs * 0.4; ctx.shadowOffsetY = m.fs * 0.08;
    cvRR(ctx, px, py, w, m.bh, m.bh / 2); ctx.fillStyle = bg; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.globalAlpha = 1;
    ctx.fillStyle = cv.infogColor; ctx.textAlign = 'left';
    let t = l;
    while (t.length > 1 && ctx.measureText(t).width > w - m.padX * 2) t = t.slice(0, -1);
    ctx.fillText(t, px + m.padX, py + m.bh / 2 + m.fs * 0.04);
  });
  ctx.restore();
}

// ⚡ Автозаполнение инфографики из формы генератора — набор строк зависит от категории.
// Для игр цену НЕ подставляем (запрет цен в объявлениях игр — тот же принцип, что в сканере),
// вместо неё — обязательная фраза «Оформляется в цифре».
function cvInfogBuildLines() {
  const f = state.form;
  const L = [];
  if (f.category === 'gaming_sub') {
    L.push(`🎮 ${f.subType}`);
    if (f.platforms?.length) L.push(`✔️ ${f.platforms.join(' / ')}`);
    const games = (f.games || '').split(',').map(s => s.trim()).filter(Boolean);
    if (games.length) L.push(`🔥 ${games.length > 1 ? `${games[0]} +${games.length - 1} игр` : games[0]}`);
    const ds = (f.durations || []).filter(d => d.price && +String(d.price).replace(/\D/g, ''));
    if (ds.length) {
      const last = ds[ds.length - 1];
      const months = parseInt(last.period) || 1;
      const price = +String(last.price).replace(/\D/g, '');
      L.push(months > 1 ? `💲 от ${Math.round(price / months)}₽/мес` : `💲 ${price}₽`);
    }
  } else if (f.category === 'ai_sub') {
    if (f.aiService) L.push(`🧠 ${f.aiService}`);
    (f.aiFeatures || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 2)
      .forEach(x => L.push(`✔️ ${x}`));
    if (f.aiPrice) L.push(`💲 ${f.aiPrice}₽ / ${f.aiDuration || '1 месяц'}`);
  } else if (f.category === 'game') {
    if (f.gameName) L.push(`🕹️ ${f.gameName}`);
    if (f.gamePlatforms?.length) L.push(`✔️ ${f.gamePlatforms.join(' / ')}`);
    if (f.gameGenre) L.push(`🎯 ${f.gameGenre}`);
    L.push('⚡ Оформляется в цифре');
  } else if (f.category === 'digital') {
    if (f.digitalName) L.push(`📦 ${f.digitalName}`);
    if (f.digitalPrice) L.push(`💲 ${f.digitalPrice}₽`);
    L.push('⚡ Быстрая выдача');
  }
  return L.slice(0, 5);
}
function cvInfogFillFromForm() {
  const lines = cvInfogBuildLines();
  if (!lines.length) { toast('Форма генератора пуста — заполнить нечего'); return; }
  jlog('cv_infog_fill', null, { category: state.form.category, lines: lines.length });
  cv.infogText = lines.join('\n');
  const ta = document.getElementById('cv-ig-text');
  if (ta) ta.value = cv.infogText;
  cvReDraw();
}

// ── Effects over collage (vignette / tone / neon seam) ──
function cvDrawEffects(ctx, cw, ch, lay, p, count, opts) {
  const special = ['diag','stack'];
  // Neon seam — glowing outline of each cell (incl. single image, circ4/square5)
  if (cv.neonGap && !special.includes(lay)) {
    const cells = cvCells(lay, count, cw, ch, p);
    if (cells.length) {
      ctx.save();
      ctx.shadowColor = cv.neonColor;
      ctx.shadowBlur = Math.max(12, p * 1.7);
      ctx.strokeStyle = cv.neonColor;
      ctx.lineWidth = Math.max(2.5, p * 0.32);
      const rad = Math.max(4, p * 0.7);
      cells.forEach(c => {
        if (c.circle) { ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2); }
        else if (c.poly) { ctx.beginPath(); c.poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); }
        else cvRR(ctx, c.x, c.y, c.w, c.h, rad);
        ctx.stroke(); ctx.stroke();
      });
      ctx.restore();
    }
  }
  // Vignette
  if (cv.vignette) {
    const vg = ctx.createRadialGradient(cw/2, ch/2, Math.min(cw,ch)*0.30, cw/2, ch/2, Math.max(cw,ch)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,cw,ch);
  }
  // Color tone
  if (cv.grade && cv.grade !== 'none') {
    const g = ctx.createLinearGradient(0,0,cw,ch);
    if (cv.grade === 'warm') {
      g.addColorStop(0,'rgba(180,83,9,0.22)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(124,45,18,0.20)');
    } else {
      g.addColorStop(0,'rgba(13,148,136,0.22)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(30,64,175,0.22)');
    }
    ctx.fillStyle = g; ctx.fillRect(0,0,cw,ch);
  }
}

// ── Platform badges (PS4/PS5/Xbox/PC) ──
function cvDrawPlatBadge(ctx, cw, ch) {
  if (!cv.platBadge || !cv.platSel || !cv.platSel.length) return;
  const badges = cv.platSel.map(id => CV_PLATFORMS.find(p => p.id === id)).filter(Boolean);
  if (!badges.length) return;
  const fs = Math.round(cw * 0.034);
  ctx.save();
  ctx.font = `bold ${fs}px 'JetBrains Mono',monospace`;
  const bh = fs * 1.9, padX = fs * 0.85, gap = fs * 0.5;
  const widths = badges.map(b => ctx.measureText(b.id).width + padX*2);
  const totalW = widths.reduce((a,w)=>a+w,0) + gap*(badges.length-1);
  const mg = cw * 0.035;
  const pos = cv.platBadgePos;
  let x = (pos==='tl'||pos==='bl') ? mg : cw - mg - totalW;
  const y = (pos==='tl'||pos==='tr') ? mg : ch - mg - bh;
  badges.forEach((b,i) => {
    const w = widths[i];
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = fs*0.6; ctx.shadowOffsetY = fs*0.12;
    cvRR(ctx, x, y, w, bh, bh*0.24); ctx.fillStyle = b.bg; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.id, x + w/2, y + bh/2 + fs*0.04);
    x += w + gap;
  });
  ctx.restore();
}

// ── Diagonal stripes (scales to any photo count) ──
function cvDrawDiagStripes(ctx, imgs, cw, ch, p) {
  const n = imgs.length; if (!n) return;
  const skew = cw * 0.16;
  const W = (cw + skew) / n;
  const g = Math.max(2, p * 0.5);
  for (let i = 0; i < n; i++) {
    const poly = [
      [i*W + g,            0],
      [(i+1)*W - g,        0],
      [(i+1)*W - skew - g, ch],
      [i*W - skew + g,     ch],
    ];
    ctx.save();
    ctx.beginPath();
    poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
    ctx.closePath(); ctx.clip();
    const xs = poly.map(pt=>pt[0]), ys = poly.map(pt=>pt[1]);
    const bx = Math.min(...xs), by = Math.min(...ys);
    cvFitClip(ctx, imgs[i].el, bx, by, Math.max(...xs)-bx, Math.max(...ys)-by);
    ctx.restore();
  }
}

// ── Stack of overlapping rotated cards ──
function cvDrawStack(ctx, imgs, cw, ch, p) {
  const n = imgs.length; if (!n) return;
  const cols = n <= 2 ? n : (n <= 4 ? 2 : 3);
  const rows = Math.ceil(n / cols);
  const cellW = cw / cols, cellH = ch / rows;
  const cardW = cellW * 1.04, cardH = cellH * 1.04;
  const cr = Math.max(10, p * 1.3);
  imgs.forEach((img, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = col*cellW + cellW/2, cy = row*cellH + cellH/2;
    const rot = (((i*53) % 11) - 5) * Math.PI/180;
    const x = cx - cardW/2, y = cy - cardH/2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(-cx, -cy);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = cw*0.03; ctx.shadowOffsetY = cw*0.012;
    cvRR(ctx, x, y, cardW, cardH, cr); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save(); cvRR(ctx, x, y, cardW, cardH, cr); ctx.clip();
    cvFitClip(ctx, img.el, x, y, cardW, cardH);
    ctx.restore();
    ctx.restore();
  });
}

// Redraw active preview (collage or game-mode variants)
function cvReDraw() {
  cvSave(); // GFX-10: слайдеры/цвета/эффекты меняют cv и зовут cvReDraw — персистим настройки
  const c = document.getElementById('cv-canvas');
  if (!c || !cv.images.length) return;
  if (cv.mode === 'game') { cvDrawGame(c, cv.images[0], {}); if (cv._gameVars) cvGenerateVariations(); }
  else cvDrawCollage(c);
}

function cvDrawCollage(canvas, opts) {
  const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  canvas.width=cw; canvas.height=ch;
  const ctx = canvas.getContext('2d');
  const p   = opts?.padding ?? cv.padding;
  const imgs= opts?.images ?? cv.images;
  const lay = opts?.layout ?? cv.layout;
  // Background: solid (original) or gradient
  if (!opts?.bg && cv.bgStyle === 'gradient') {
    const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
    bgGrad.addColorStop(0, cv.bg);
    bgGrad.addColorStop(1, cv.bg2);
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = opts?.bg ?? cv.bg;
  }
  ctx.fillRect(0,0,cw,ch);
  if (!imgs.length) return;
  const cr = Math.max(4, p * 0.7);
  if (lay === 'circ4') {
    cvDrawCirc4(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'circ4d') {
    cvDrawCirc4D(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'square5') {
    cvDrawSquare5(ctx, imgs, cw, ch, p, cr);
  } else if (lay === 'diag') {
    cvDrawDiagStripes(ctx, imgs, cw, ch, p);
  } else if (lay === 'stack') {
    cvDrawStack(ctx, imgs, cw, ch, p);
  } else {
    const cells = cvCells(lay, imgs.length, cw, ch, p);
    cells.forEach((cell,i) => {
      if (i < imgs.length) cvFit(ctx, imgs[i].el, cell.x, cell.y, cell.w, cell.h, cr, imgs[i].transform);
    });
  }
  // Universal selection highlight — works for all layouts incl. circ4/square5
  if (!opts && cv._selCell !== null && cv._selCell !== undefined) {
    const _sc = cvCells(lay, imgs.length, cw, ch, p)[cv._selCell];
    if (_sc) {
      ctx.save();
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = Math.max(6, p * 0.5);
      if (_sc.circle) { ctx.beginPath(); ctx.arc(_sc.cx,_sc.cy,_sc.r-3,0,Math.PI*2); ctx.stroke(); }
      else if (_sc.poly) { ctx.beginPath(); _sc.poly.forEach(([x,y],k) => k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.stroke(); }
      else { ctx.strokeRect(_sc.x+3,_sc.y+3,_sc.w-6,_sc.h-6); }
      ctx.restore();
    }
  }
  cvDrawEffects(ctx, cw, ch, lay, p, imgs.length, opts);
  cvDrawMaskSticker(ctx, cw, ch);
  cvDrawTextOverlay(ctx, cw, ch);
  cvDrawPlatBadge(ctx, cw, ch);
  cvDrawInfog(ctx, cw, ch, opts?.infog);
}

function cvDrawGame(canvas, imgObj, opts) {
  const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
  canvas.width=cw; canvas.height=ch;
  const ctx = canvas.getContext('2d');
  const pad = opts?.pad ?? cv.gamePad;
  const cr  = opts?.corner ?? cv.gameCorner;
  // Фон: сплошной или градиент (как в cvDrawCollage)
  if (!opts?.bg && cv.bgStyle === 'gradient') {
    const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
    bgGrad.addColorStop(0, cv.bg);
    bgGrad.addColorStop(1, cv.bg2);
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = opts?.bg ?? cv.bg;
  }
  ctx.fillRect(0,0,cw,ch);
  // Тень под картинкой (видна при отступе > 0)
  if (cv.gameShadow && pad > 0) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = cw*0.035; ctx.shadowOffsetY = cw*0.012;
    cvRR(ctx, pad, pad, cw-2*pad, ch-2*pad, cr); ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
  }
  cvFit(ctx, imgObj.el, pad, pad, cw-2*pad, ch-2*pad, cr, imgObj.transform);
  // Обводка по краю картинки
  if (cv.gameBorder > 0) {
    ctx.save();
    cvRR(ctx, pad + cv.gameBorder/2, pad + cv.gameBorder/2, cw-2*pad-cv.gameBorder, ch-2*pad-cv.gameBorder, Math.max(0, cr - cv.gameBorder/2));
    ctx.strokeStyle = cv.gameBorderColor; ctx.lineWidth = cv.gameBorder;
    ctx.stroke();
    ctx.restore();
  }
  cvDrawEffects(ctx, cw, ch, 'single', pad || 12, 1, opts);
  cvDrawMaskSticker(ctx, cw, ch); cvDrawTextOverlay(ctx, cw, ch);
  cvDrawPlatBadge(ctx, cw, ch);
  cvDrawInfog(ctx, cw, ch, opts?.infog);
}

function cvDownload(canvas, name) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/jpeg', 0.93);
  a.download = name || 'avito.jpg';
  a.click();
  // Журнал: скачивание = «эта обложка пошла в дело» — точный аналог posted для графики.
  // Снимок настроек + накопленные счётчики действий за сессию канваса одной строкой.
  jlog('cv_download', null, {
    name: name || 'avito.jpg', mode: cv.mode, layout: cv.layout, imageCount: cv.images.length,
    product: currentProductName(state.form), category: state.form.category,
    settings: jCvSnapshot(), counters: jCvTakeCounters(),
  });
}

function cvLayoutSVG(id, imgCount) {
  const W = 44, H = 44, p = 3, r = 2;
  const stroke = 'var(--border2)', fill = 'var(--card3)';
  function rect(x,y,w,h) { return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`; }
  function getCells(id2) {
    if (id2==='strip') { const n=Math.max(2,imgCount||4),iw=(W-(n+1)*p)/n; return Array.from({length:n},(_,i)=>({x:p+i*(iw+p),y:p,w:iw,h:H-2*p})); }
    if (id2==='circ4') { const hw=(W-3*p)/2,hh=(H-3*p)/2,rv=Math.min(W,H)*0.30; return [{x:p,y:p,w:hw,h:hh},{x:2*p+hw,y:p,w:W-2*p-hw-p,h:hh},{x:p,y:2*p+hh,w:hw,h:H-2*p-hh-p},{x:2*p+hw,y:2*p+hh,w:W-2*p-hw-p,h:H-2*p-hh-p},{cx:W/2,cy:H/2,r:rv,circle:true}]; }
    if (id2==='circ4d') { const cx=W/2,cy=H/2,off=Math.min(W,H)*0.16,rv=Math.min(W,H)*0.30; return [
      {poly:[[p,p],[W-p,p],[cx+off,cy],[cx-off,cy]]},
      {poly:[[W-p,p],[W-p,H-p],[cx,cy+off],[cx,cy-off]]},
      {poly:[[W-p,H-p],[p,H-p],[cx-off,cy],[cx+off,cy]]},
      {poly:[[p,H-p],[p,p],[cx,cy-off],[cx,cy+off]]},
      {cx:cx,cy:cy,r:rv,circle:true},
    ]; }
    if (id2==='square5') { const hw=(W-3*p)/2,hh=(H-3*p)/2,side=Math.min(W,H)*0.42; return [{x:p,y:p,w:hw,h:hh},{x:2*p+hw,y:p,w:W-2*p-hw-p,h:hh},{x:p,y:2*p+hh,w:hw,h:H-2*p-hh-p},{x:2*p+hw,y:2*p+hh,w:W-2*p-hw-p,h:H-2*p-hh-p},{x:W/2-side/2,y:H/2-side/2,w:side,h:side,plate:true}]; }
    if (id2==='auto') return getCells(cvAutoLayout(imgCount||4));
    const L=COLLAGE_LAYOUTS[id2]; return L?L.cells(W,H,p):[];
  }
  const shapes = getCells(id).map(c=>{
    if (c.circle) return `<circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="${c.r.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    if (c.poly) return `<polygon points="${c.poly.map(pt=>pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
    if (c.plate) return `<rect x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" width="${c.w.toFixed(1)}" height="${c.h.toFixed(1)}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    return rect(c.x,c.y,c.w,c.h);
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}

function cvLayoutButtonsHTML(activeLayout, imgCount) {
  // Подходит ли раскладка под текущее число фото (0 фото — не гасим ничего)
  const fits = id => {
    if (!imgCount) return true;
    if (id==='auto'||id==='strip'||id==='diag'||id==='stack') return true;
    if (id==='circ4'||id==='circ4d'||id==='square5') return imgCount===5;
    return COLLAGE_LAYOUTS[id]?.n === imgCount;

  return COLLAGE_UI_GROUPS.map(({sep,ids})=>{
    const sepHtml = sep?`<div class="cv-layout-sep">${sep}</div>`:'';
    const btns = ids.map(id=>{
      const nm=id==='auto'?'Авто':id==='strip'?'Полоска':id==='circ4'?'⭕ Круг+4':id==='circ4d'?'💠 Круг+4 диаг':id==='square5'?'⬜ Квадрат+4':id==='diag'?'╱ Полосы':id==='stack'?'🃏 Стопка':(COLLAGE_LAYOUTS[id]?.name||id);

    return sepHtml+btns;
  }).join('');
}

function bindCoversTab() {
  cvSave(); // GFX-10: mode/ratio/toggle/layout меняют cv и зовут render() → сюда — персистим настройки
  // UX-8: если сюда пришли по кнопке 🖼️ с названием игры — подставить и сразу искать
  if (cv._pendingSearchName !== null) {
    const name = cv._pendingSearchName;
    cv._pendingSearchName = null;
    const inp = document.getElementById('cv-igdb-game');
    if (inp && name) {
      inp.value = name;
      document.querySelector('[data-act="cv-igdb-game-fetch"]')?.click();
    }
  }

  const drop = document.getElementById('cv-drop');
  const fin  = document.getElementById('cv-file');
  if (!drop || !fin) return;

  drop.addEventListener('click', e => { if (!e.target.closest('.cv-thumb-del,.cv-thumb-add')) fin.click(); });
  drop.addEventListener('dragover',  e => { e.preventDefault(); drop.style.borderColor='var(--teal)'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor=''; });
  drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor=''; cvAddFiles(e.dataTransfer.files); });
  fin.addEventListener('change', e => { cvAddFiles(e.target.files); fin.value=''; });

  document.getElementById('cv-padding')?.addEventListener('input', e => {
    cv.padding = +e.target.value;
    const v = document.getElementById('cv-padding-val');
    if (v) v.textContent = cv.padding + 'px';
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  document.getElementById('cv-bg-custom')?.addEventListener('input', e => {
    cv.bg = e.target.value;
    document.querySelectorAll('[data-cv-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvBg === cv.bg));
    cvReDraw();
  });
  // Рамка одиночной картинки (режим Игра)
  [['cv-game-pad','gamePad'],['cv-game-corner','gameCorner'],['cv-game-border','gameBorder']].forEach(([id,key]) => {
    document.getElementById(id)?.addEventListener('input', e => {
      cv[key] = +e.target.value;
      const v = document.getElementById(id + '-val');
      if (v) v.textContent = e.target.value + 'px';
      cvReDraw();
    });
  });
  document.getElementById('cv-game-border-color')?.addEventListener('input', e => {
    cv.gameBorderColor = e.target.value; cvReDraw();
  });

  // Mask sticker live inputs
  document.getElementById('cv-ms-text')?.addEventListener('input', e => {
    cv.maskStickerText = e.target.value;
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  document.getElementById('cv-ms-size')?.addEventListener('input', e => {
    cv.maskStickerSize = +e.target.value;
    const v = document.getElementById('cv-ms-size-val');
    if (v) v.textContent = cv.maskStickerSize + 'px';
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  document.getElementById('cv-ms-angle')?.addEventListener('input', e => {
    cv.maskStickerAngle = +e.target.value;
    const v = document.getElementById('cv-ms-angle-val');
    if (v) v.textContent = cv.maskStickerAngle + '°';
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  // Text overlay live inputs
  document.getElementById('cv-to-text')?.addEventListener('input', e => {
    cv.textOverlayText = e.target.value; cvReDraw();
  });
  document.getElementById('cv-to-size')?.addEventListener('input', e => {
    cv.textOverlaySize = +e.target.value;
    const v = document.getElementById('cv-to-size-val'); if (v) v.textContent = e.target.value + 'px';
    cvReDraw();
  });
  document.getElementById('cv-to-angle')?.addEventListener('input', e => {
    cv.textOverlayAngle = +e.target.value;
    const v = document.getElementById('cv-to-angle-val'); if (v) v.textContent = e.target.value + '°';
    cvReDraw();
  });
  document.getElementById('cv-to-color-custom')?.addEventListener('input', e => {
    cv.textOverlayColor = e.target.value; cvReDraw();
  });
  document.getElementById('cv-to-bg-custom')?.addEventListener('input', e => {
    cv.textOverlayBgColor = e.target.value; cvReDraw();
  });
  document.getElementById('cv-to-opacity')?.addEventListener('input', e => {
    cv.textOverlayBgOpacity = +e.target.value / 100;
    const v = document.getElementById('cv-to-opacity-val'); if (v) v.textContent = e.target.value + '%';
    cvReDraw();
  });
  // 📋 Инфографика — live inputs
  document.getElementById('cv-ig-text')?.addEventListener('input', e => {
    cv.infogText = e.target.value; cvReDraw();
  });
  document.getElementById('cv-ig-size')?.addEventListener('input', e => {
    cv.infogSize = +e.target.value;
    const v = document.getElementById('cv-ig-size-val'); if (v) v.textContent = e.target.value + 'px';
    cvReDraw();
  });
  document.getElementById('cv-ig-opacity')?.addEventListener('input', e => {
    cv.infogBgOpacity = +e.target.value / 100;
    const v = document.getElementById('cv-ig-opacity-val'); if (v) v.textContent = e.target.value + '%';
    cvReDraw();
  });
  document.getElementById('cv-ig-bg-custom')?.addEventListener('input', e => {
    cv.infogBg = e.target.value; cvReDraw();
  });
  document.getElementById('cv-ig-tc-custom')?.addEventListener('input', e => {
    cv.infogColor = e.target.value; cvReDraw();
  });
  document.getElementById('cv-bg2-custom')?.addEventListener('input', e => {
    cv.bg2 = e.target.value; cvReDraw();
  });
  document.getElementById('cv-neon-color')?.addEventListener('input', e => {
    cv.neonColor = e.target.value; cvReDraw();
  });
  document.getElementById('cv-ms-bg-custom')?.addEventListener('input', e => {
    cv.maskStickerBg = e.target.value;
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });
  document.getElementById('cv-ms-tc-custom')?.addEventListener('input', e => {
    cv.maskStickerColor = e.target.value;
    const c = document.getElementById('cv-canvas');
    if (c && cv.images.length) cvDrawCollage(c);
  });

  // Drag-to-reorder thumbnails — делегируем через document один раз,
  // т.к. cvRenderState() пересоздаёт контейнер миниатюр без id и слушателей
  if (!window._cvDragBound) {
    window._cvDragBound = true;
    document.addEventListener('dragstart', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (t) { cv._dragIdx = +t.dataset.cvDidx; t.style.opacity = '0.4'; }
    });
    document.addEventListener('dragend', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (t) t.style.opacity = '';
    });
    document.addEventListener('dragover', e => {
      if (e.target.closest('.cv-thumbs')) e.preventDefault();
    });
    document.addEventListener('drop', e => {
      if (!e.target.closest('.cv-thumbs')) return;
      e.preventDefault();
      const t = e.target.closest('[data-cv-didx]');
      if (!t || cv._dragIdx === undefined) return;
      const toIdx = +t.dataset.cvDidx;
      if (toIdx === cv._dragIdx) { cv._dragIdx = undefined; return; }
      const [moved] = cv.images.splice(cv._dragIdx, 1);
      cv.images.splice(toIdx, 0, moved);
      cv._dragIdx = undefined;
      cv._selCell = null;
      cvRenderState();
    });
  }

  // GFX-8: та же перестановка миниатюр на тач — HTML5 DnD там мёртв
  if (!window._cvTouchDragBound) {
    window._cvTouchDragBound = true;
    let touchDragEl = null;
    document.addEventListener('touchstart', e => {
      const t = e.target.closest('.cv-thumbs [data-cv-didx]');
      if (!t) return;
      cv._dragIdx = +t.dataset.cvDidx;
      touchDragEl = t;
      t.style.opacity = '0.4';
    }, {passive: true});
    document.addEventListener('touchmove', e => {
      if (cv._dragIdx === undefined || !touchDragEl) return;
      e.preventDefault();
    }, {passive: false});
    document.addEventListener('touchend', e => {
      if (cv._dragIdx === undefined || !touchDragEl) return;
      const touch = e.changedTouches[0];
      const el = touch && document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el && el.closest('.cv-thumbs [data-cv-didx]');
      touchDragEl.style.opacity = '';
      touchDragEl = null;
      if (target) {
        const toIdx = +target.dataset.cvDidx;
        if (toIdx !== cv._dragIdx) {
          const [moved] = cv.images.splice(cv._dragIdx, 1);
          cv.images.splice(toIdx, 0, moved);
          cv._selCell = null;
          cvRenderState();
        }
      }
      cv._dragIdx = undefined;
    });
  }

  // Canvas — drag to swap, click to select, wheel to zoom selected cell
  const canvas = document.getElementById('cv-canvas');
  if (canvas) {
    if (cv.images.length && cv.mode === 'collage') cvDrawCollage(canvas);
    if (cv.images.length && cv.mode === 'game') cvDrawGame(canvas, cv.images[0], {});

    // GFX-8/GFX-14: точка-в-полигоне для poly-ячеек (circ4d) — общий хелпер для хит-теста и клика
    function cvPointInPoly(mx, my, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi,yi] = poly[i], [xj,yj] = poly[j];
        if (((yi > my) !== (yj > my)) && (mx < (xj-xi)*(my-yi)/(yj-yi)+xi)) inside = !inside;
      }
      return inside;
    }

    function canvasHitCell(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const cells = cvCells(cv.layout, cv.images.length, cw, ch, cv.padding);
      return cells.findIndex(c => c.circle
        ? Math.sqrt((mx-c.cx)**2+(my-c.cy)**2) <= c.r
        : c.poly
        ? cvPointInPoly(mx, my, c.poly)
        : mx>=c.x && mx<=c.x+c.w && my>=c.y && my<=c.y+c.h);
    }

    let _drag = null;
    let _stickerDrag = null;
    let _textDrag = null;
    let _gameDrag = null;
    let _infogDrag = null;

    function canvasMouse(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        mx: (e.clientX - rect.left) * (canvas.width / rect.width),
        my: (e.clientY - rect.top)  * (canvas.height / rect.height),
      };
    }

    // GFX-14: круговой (rotation-invariant) хитбокс по факту размера формы стикера, не квадрат sz*1.3
    const STICKER_HIT_R = {badge:.83, burst:.55, circle:.5, ribbon:.93, diamond:.52, pill:.79, hex:.55};
    function stickerPos() {
      const [cw, ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const sz = cv.maskStickerSize, mg = sz * 0.3;
      if (cv.maskStickerX !== null && cv.maskStickerY !== null) return { scx: cv.maskStickerX, scy: cv.maskStickerY };
      const pos = cv.maskStickerPos;
      if      (pos==='tl') return { scx:mg+sz*.5,    scy:mg+sz*.5 };
      else if (pos==='tr') return { scx:cw-mg-sz*.5, scy:mg+sz*.5 };
      else if (pos==='bl') return { scx:mg+sz*.5,    scy:ch-mg-sz*.5 };
      else if (pos==='br') return { scx:cw-mg-sz*.5, scy:ch-mg-sz*.5 };
      else                 return { scx:cw/2,         scy:ch/2 };
    }
    function stickerHit(mx, my) {
      if (!cv.maskSticker || !cv.maskStickerText.trim()) return false;
      const sz = cv.maskStickerSize;
      const { scx, scy } = stickerPos();
      const hitR = sz * (STICKER_HIT_R[cv.maskStickerShape] ?? 0.6);
      return Math.sqrt((mx-scx)**2 + (my-scy)**2) <= hitR;
    }

    // GFX-14: хитбокс текста по факту измеренного размера блока, не 2×fontSize
    function textOverlayHit(mx, my) {
      if (!cv.textOverlay || !cv.textOverlayText.trim()) return null;
      const lines = cv.textOverlayText.trim().split('\n').filter(l => l.trim());
      if (!lines.length) return null;
      const [cw2, ch2] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const tcx = cv.textOverlayX ?? cw2 / 2;
      const tcy = cv.textOverlayY ?? ch2 / 2;
      const fs = cv.textOverlaySize;
      const ctx = canvas.getContext('2d');
      ctx.font = `${cv.textOverlayBold ? 'bold' : 'normal'} ${fs}px Literata,Georgia,serif`;
      const lh = fs * 1.28;
      const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const totalH = lines.length * lh;
      const hw = maxW/2 + fs*0.55, hh = totalH/2 + fs*0.32;
      const hitR = Math.sqrt(hw*hw + hh*hh);
      return Math.sqrt((mx-tcx)**2 + (my-tcy)**2) <= hitR ? { tcx, tcy } : null;
    }

    // 📋 Инфографика: хитбокс по факту измеренного блока плашек (как у текста — GFX-14)
    function infogHit(mx, my) {
      if (!cv.infog) return null;
      const [cw2, ch2] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
      const m = cvInfogMetrics(canvas.getContext('2d'), cw2, ch2);
      if (!m) return null;
      return (mx >= m.x && mx <= m.x + m.maxW && my >= m.y && my <= m.y + m.totalH) ? m : null;
    }

    function onPointerDown(e) {
      if (!cv.images.length) return;
      const { mx, my } = canvasMouse(e);
      // Text overlay drag
      const th = textOverlayHit(mx, my);
      if (th) {
        e.preventDefault();
        _textDrag = { offX: mx - th.tcx, offY: my - th.tcy };
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Sticker drag takes priority
      if (stickerHit(mx, my)) {
        e.preventDefault();
        const { scx, scy } = stickerPos();
        _stickerDrag = { offX: mx - scx, offY: my - scy };
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Infographic block drag
      const ih = infogHit(mx, my);
      if (ih) {
        e.preventDefault();
        _infogDrag = { offX: mx - ih.x, offY: my - ih.y };
        canvas.style.cursor = 'grabbing';
        return;
      }
      if (cv.mode === 'game') {
        e.preventDefault();
        const img = cv.images[0];
        if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
        _gameDrag = { startMx: mx, startMy: my, ox: img.transform.ox||0, oy: img.transform.oy||0 };
        canvas.style.cursor = 'grabbing';
        return;
      }
      const hit = canvasHitCell(e);
      if (hit === -1) return;
      e.preventDefault();
      _drag = { cellIdx: hit, startX: e.clientX, startY: e.clientY, moved: false, targetCell: -1 };
    }

    function onPointerMove(e) {
      if (_gameDrag) {
        const { mx, my } = canvasMouse(e);
        const img = cv.images[0];
        if (!img) return;
        if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
        const [cw2, ch2] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
        const s = img.transform.scale || 1;
        img.transform.ox = _gameDrag.ox - (mx - _gameDrag.startMx) / (s * cw2);
        img.transform.oy = _gameDrag.oy - (my - _gameDrag.startMy) / (s * ch2);
        cvDrawGame(canvas, img, {});
        return;
      }
      if (_textDrag) {
        const { mx, my } = canvasMouse(e);
        cv.textOverlayX = mx - _textDrag.offX;
        cv.textOverlayY = my - _textDrag.offY;
        cv.mode === 'game' ? cvDrawGame(canvas, cv.images[0], {}) : cvDrawCollage(canvas);
        return;
      }
      if (_stickerDrag) {
        const { mx, my } = canvasMouse(e);
        cv.maskStickerX = mx - _stickerDrag.offX;
        cv.maskStickerY = my - _stickerDrag.offY;
        cv.mode === 'game' ? cvDrawGame(canvas, cv.images[0], {}) : cvDrawCollage(canvas);
        return;
      }
      if (_infogDrag) {
        const { mx, my } = canvasMouse(e);
        cv.infogX = mx - _infogDrag.offX;
        cv.infogY = my - _infogDrag.offY;
        cv.mode === 'game' ? cvDrawGame(canvas, cv.images[0], {}) : cvDrawCollage(canvas);
        return;
      }
      if (!_drag) return;
      const dx = e.clientX - _drag.startX, dy = e.clientY - _drag.startY;
      if (!_drag.moved && Math.sqrt(dx*dx+dy*dy) > 6) _drag.moved = true;
      if (!_drag.moved) return;
      canvas.style.cursor = 'grabbing';
      const target = canvasHitCell(e);
      _drag.targetCell = target;
      cvDrawCollage(canvas);
      if (target !== -1 && target !== _drag.cellIdx) {
        const [cw,ch] = CV_SZ[cv.ratio] || CV_SZ['4:5'];
        const cells = cvCells(cv.layout, cv.images.length, cw, ch, cv.padding);
        const ctx = canvas.getContext('2d');
        ctx.save();
        const paintCell = (c, color) => {
          ctx.fillStyle = color;
          if (c.circle) { ctx.beginPath(); ctx.arc(c.cx,c.cy,c.r,0,Math.PI*2); ctx.fill(); }
          else if (c.poly) { ctx.beginPath(); c.poly.forEach(([x,y],k)=>k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
          else ctx.fillRect(c.x,c.y,c.w,c.h);
        };
        paintCell(cells[_drag.cellIdx], 'rgba(250,204,21,0.28)');
        paintCell(cells[target], 'rgba(15,118,110,0.38)');
        ctx.restore();
      }
    }

    function onPointerUp() {
      // Журнал: любой завершившийся drag на канвасе — в счётчик сессии (уйдёт с cv_download)
      if (_gameDrag || _textDrag || _stickerDrag || _infogDrag || (_drag && _drag.moved)) jCvBump('drags');
      if (_gameDrag) { _gameDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_textDrag) { _textDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_stickerDrag) { _stickerDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_infogDrag) { _infogDrag = null; canvas.style.cursor = 'pointer'; cvSave(); return; }
      if (!_drag) return;
      canvas.style.cursor = 'pointer';
      if (_drag.moved && _drag.targetCell !== -1 && _drag.targetCell !== _drag.cellIdx) {
        const tmp = cv.images[_drag.cellIdx];
        cv.images[_drag.cellIdx] = cv.images[_drag.targetCell];
        cv.images[_drag.targetCell] = tmp;
        cv._selCell = null;
      } else if (!_drag.moved) {
        cv._selCell = (cv._selCell === _drag.cellIdx) ? null : _drag.cellIdx;
      }
      _drag = null;
      cvRenderState();
    }

    function onPointerLeave() {
      if (_gameDrag) { _gameDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_textDrag) { _textDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_stickerDrag) { _stickerDrag = null; canvas.style.cursor = 'pointer'; return; }
      if (_infogDrag) { _infogDrag = null; canvas.style.cursor = 'pointer'; cvSave(); return; }
      if (!_drag) return;
      _drag = null;
      canvas.style.cursor = 'pointer';
      cvDrawCollage(canvas);
    }

    canvas.addEventListener('mousedown', e => { if (e.button === 0) onPointerDown(e); });
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerLeave);

    // GFX-8: touch-эквиваленты — drag стикера/текста/ячеек и сдвиг кадра игры на мобиле
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      onPointerDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() });
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      if (!_drag && !_stickerDrag && !_textDrag && !_gameDrag && !_infogDrag) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      const t = e.touches[0];
      onPointerMove({ clientX: t.clientX, clientY: t.clientY });
    }, {passive: false});
    canvas.addEventListener('touchend', onPointerUp);
    canvas.addEventListener('touchcancel', onPointerLeave);

    canvas.addEventListener('wheel', e => {
      if (cv.mode === 'game') {
        if (!cv.images.length) return;
        e.preventDefault();
        const img = cv.images[0];
        if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
        img.transform.scale = Math.max(1, Math.min(4, (img.transform.scale||1) + (e.deltaY < 0 ? 0.15 : -0.15)));
        const slider = document.getElementById('cv-tz-scale');
        if (slider) slider.value = Math.round(img.transform.scale*100);
        const valEl = document.getElementById('cv-tz-scale-val');
        if (valEl) valEl.textContent = Math.round(img.transform.scale*100) + '%';
        cvDrawGame(canvas, img, {});
        return;
      }
      if (cv._selCell === null || cv._selCell === undefined || !cv.images[cv._selCell]) return;
      e.preventDefault();
      const img = cv.images[cv._selCell];
      if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
      img.transform.scale = Math.max(1, Math.min(4, (img.transform.scale||1) + (e.deltaY < 0 ? 0.1 : -0.1)));
      const slider = document.getElementById('cv-tz-scale');
      if (slider) { slider.value = Math.round(img.transform.scale*100); }
      const valEl = document.getElementById('cv-tz-scale-val');
      if (valEl) valEl.textContent = Math.round(img.transform.scale*100) + '%';
      cvDrawCollage(canvas);
    }, {passive: false});
  }
}

// DATABASE MODULE

function dbUniqueProducts() {
  return [...new Set(state.db.map(r => r.product).filter(Boolean))].sort();
}

function dbHintHTML(product) {
  const p = (product || '').trim().toLowerCase();
  if (!p) return '';
  const used = state.db
    .filter(r => r.product.toLowerCase() === p && r.id !== state.dbEditId)
    .map(r => r.region);
  if (!used.length) return '<span class="free">Ещё не размещалось — все регионы свободны</span>';
  const regs = state.settings.regions || REGIONS;
  const freeCount = regs.length - regs.filter(r => used.includes(r)).length;
  return `<span class="used">Уже: ${used.join(', ')}</span> &middot; <span class="free">Свободны: ${freeCount}</span>`;
}

function dbTabHTML() {
  const f       = state.dbForm;
  const isEdit  = state.dbEditId !== null;
  const fProd   = state.dbFilter.product.toLowerCase();
  const fStatus = state.dbFilter.status;
  const filtered = state.db.filter(r => {
    if (fProd   && !r.product.toLowerCase().includes(fProd)) return false;
    if (fStatus && r.status !== fStatus) return false;
    return true;
  });
  const rows  = [...filtered].sort((a, b) => b.id - a.id);
  const prods = dbUniqueProducts();

  const rowHTML = r => `<tr data-db-id="${r.id}"${state.dbEditId === r.id ? ' class="db-row-edit"' : ''}>
    <td class="db-product">${esc(r.product)}${r.title ? ` <span title="${esc(r.title + '\n\n' + (r.description||''))}" style="cursor:help;color:var(--teal-h)">📝</span>` : ''}</td>
    <td>${esc(r.region)}</td>
    <td><span class="status-badge ${STATUS_CLS[r.status] || 'muted'}">${STATUS_LABELS[r.status] || r.status}</span></td>
    <td class="db-note" title="${esc(r.note || '')}">${esc(r.note || '—')}</td>
    <td style="color:var(--muted);font-size:12px;white-space:nowrap;font-family:var(--fm)">${new Date(r.id).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})}</td>
    <td style="white-space:nowrap">
      ${(r.title || r.description) ? `<button class="btn-sm" data-act="db-final" data-id="${r.id}" title="${r.editShare != null ? `Финал сохранён — изменено ~${Math.round(r.editShare*100)}% описания. Обновить?` : 'Вставить финальный текст, как он ушёл на Авито (для журнала самообучения)'}" style="margin-right:4px;${r.editShare != null ? 'color:var(--ok);border-color:var(--ok)' : ''}">${r.editShare != null ? `✓ ${Math.round(r.editShare*100)}%` : '📥 финал'}</button>` : ''}
      <button class="btn-sm" data-act="db-edit" data-id="${r.id}" title="Редактировать">✎</button>
      <button class="btn-sm" data-act="db-del"  data-id="${r.id}" title="Удалить" style="margin-left:4px">×</button>
    </td>
  </tr>`;

  return `<div class="db-wrap">
    <div class="db-toolbar">
      <span class="db-page-name">📋 ${esc(state.settings.pageName || 'Страница 1')}</span>
      <div style="flex:1"></div>
      <button class="btn-sm" data-act="db-export">⬇ Экспорт JSON</button>
      <label class="btn-sm" style="cursor:pointer">⬆ Импорт<input type="file" id="db-import-file" accept=".json" style="display:none"></label>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:-8px 0 14px">📝 = сохранён текст объявления — участвует в проверке на дубли (кнопка 🔎 Дубли). Заполняется автоматически кнопками «✓ Размещено» и «✓ Готово» в сессии постинга.</div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">${isEdit ? '✎ Редактировать запись' : '+ Добавить объявление'}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div class="field" style="flex:2;min-width:180px">
          <label>Товар</label>
          <input type="text" id="db-f-product" value="${esc(f.product)}" placeholder="PS Plus Extra" list="db-prod-list" autocomplete="off">
          <datalist id="db-prod-list">${prods.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
          <div class="db-hint" id="db-hint">${dbHintHTML(f.product)}</div>
        </div>
        <div class="field" style="flex:1;min-width:160px">
          <label>Регион</label>
          <input type="text" id="db-f-region" value="${esc(f.region)}" placeholder="Москва" list="db-reg-list">
          <datalist id="db-reg-list">${(state.settings.regions || REGIONS).map(r => `<option value="${r}">`).join('')}</datalist>
        </div>
        <div class="field" style="min-width:130px">
          <label>Статус</label>
          <select id="db-f-status">
            ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${f.status === v ? ' selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:3;min-width:200px">
          <label>Заметка (необязательно)</label>
          <input type="text" id="db-f-note" value="${esc(f.note)}" placeholder="Вариант 2, коллаж 3, цена снижена…">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <button class="btn-gen" data-act="${isEdit ? 'db-save' : 'db-add'}" style="width:auto;padding:9px 22px">
          ${isEdit ? '✓ Сохранить' : '+ Добавить'}
        </button>
        ${isEdit ? `<button class="btn-add" data-act="db-cancel">Отмена</button>` : ''}
      </div>
    </div>

    <div class="db-filter-row">
      <input type="text" id="db-filter-product" placeholder="Фильтр по товару…" value="${esc(state.dbFilter.product)}">
      <select id="db-filter-status">
        <option value=""${!fStatus ? ' selected' : ''}>Все статусы</option>
        ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${fStatus === v ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
      <span style="font-size:13px;color:var(--muted)">${filtered.length} из ${state.db.length}</span>
    </div>

    ${!state.db.length
      ? `<div class="card"><div class="empty-state"><div class="ico">📋</div><div>Нет объявлений. Добавьте первое!</div></div></div>`
      : !rows.length
        ? `<div class="card"><div class="empty-state"><div class="ico">🔍</div><div>Ничего не найдено по фильтру</div></div></div>`
        : `<div class="card"><div class="db-table-wrap">
            <table class="db-table">
              <thead><tr><th>Товар</th><th>Регион</th><th>Статус</th><th>Заметка</th><th>Дата</th><th></th></tr></thead>
              <tbody>${rows.map(rowHTML).join('')}</tbody>
            </table>
          </div></div>`
    }
    ${refsCardHTML()}
  </div>`;
}

// ЭТАЛОНЫ (журнал самообучения, вариант Г)
// Сюда складываются объявления, составленные БЕЗ инструмента (руками), и чужие
// понравившиеся — с пометкой источника. При месячном разборе язык эталонов
// сравнивается с языком генератора; позже эталоны можно подмешивать в few-shot.
// ══════════════════════════════════════════

function refsCardHTML() {
  const refs = state.refs || [];
  const listHTML = refs.length ? `<div style="display:flex;flex-direction:column;gap:7px;margin-top:12px">

            <option value="other">Другое</option>

}

function bindRefsCard() { /* поля читаются по id в обработчике ref-add — отдельных биндов не нужно */ }

function renderDb() {
  const el = document.getElementById('db-content');
  if (!el) return;
  el.innerHTML = dbTabHTML();
  bindDbTab();
}

function bindDbTab() {
  document.getElementById('db-import-file')?.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('Ожидался массив');
        if (data.some(r => typeof r?.product !== 'string')) throw new Error('В записях отсутствует поле "product"');
        // F14: раньше импорт молча ЗАМЕНЯЛ всю базу — бэкап со второго устройства стирал
        // локальную историю дублей без единого подтверждения. Теперь явно спрашиваем слияние
        // или замену, а замену дополнительно подтверждаем отдельно (двойная защита от потери).
        const merge = confirm(`Файл содержит ${data.length} записей. Текущая база: ${state.db.length} записей.\n\nOK — слить с текущей базой (добавить новые, не трогая старые)\nОтмена — полностью заменить базу`);
        if (merge) {
          const key = rec => [rec.product, rec.region, rec.title || '', rec.date || ''].join('|');
          const existing = new Set(state.db.map(key));
          const added = data.filter(rec => !existing.has(key(rec)));
          state.db = [...state.db, ...added];
          save();
          toast(`Слияние: добавлено ${added.length} из ${data.length} (пропущено дублей: ${data.length - added.length})`);
        } else {
          if (!confirm(`Точно заменить всю базу? Текущие ${state.db.length} записей будут удалены безвозвратно.`)) return;
          state.db = data; save();
          toast(`База заменена: ${data.length} записей`);
        }
        renderDb();
      } catch(err) { toast('Ошибка импорта: ' + err.message); }
    };
    r.readAsText(file);
  });
  document.getElementById('db-f-product')?.addEventListener('input', e => {
    state.dbForm.product = e.target.value;
    const h = document.getElementById('db-hint');
    if (h) h.innerHTML = dbHintHTML(e.target.value);
  });
  document.getElementById('db-f-region')?.addEventListener('input',  e => { state.dbForm.region = e.target.value; });
  document.getElementById('db-f-note')?.addEventListener('input',    e => { state.dbForm.note = e.target.value; });
  document.getElementById('db-f-status')?.addEventListener('change', e => { state.dbForm.status = e.target.value; });
  document.getElementById('db-filter-product')?.addEventListener('input',  e => { state.dbFilter.product = e.target.value; renderDb(); });
  document.getElementById('db-filter-status')?.addEventListener('change',  e => { state.dbFilter.status = e.target.value; renderDb(); });
  bindRefsCard();
}

      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
        ${esc(r.product)} · 📍 ${esc(r.region)}. Если правил текст уже в форме Авито — вставь сюда финальную версию:

        </div>
        <div class="field">
          <label>Финальное описание — вставь как ушло на Авито (Ctrl+V)</label>
          <textarea id="final-desc" rows="8" placeholder="Пусто = «описание не менял, взять сгенерированное как финал»"></textarea>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-gen" id="final-save" style="flex:1;padding:10px">✓ Сохранить финал</button>

      toast(r.editShare != null ? `Финал сохранён — изменено ~${Math.round(r.editShare * 100)}% описания` : 'Финал сохранён');
      if (state.tab === 'database') renderDb();

// Имя товара по категории формы — subType/aiService/gameName/digitalName заполнены
// одновременно (дефолты формы), поэтому нельзя брать первое непустое подряд
function currentProductName(f) {
  if (f.category === 'gaming_sub') return f.subType || 'Товар';
  if (f.category === 'ai_sub')     return f.aiService || 'Товар';
  if (f.category === 'game')       return f.gameName || 'Товар';
  if (f.category === 'digital')    return f.digitalName || 'Товар';
  return 'Товар';
}

function exportPackage() {
  const all  = resultsPool(); // UX-15: включает и «Ещё варианты»
  const favs = state.favorites;
  const batch = state.batchResults.filter(it => it.variant); // F10: пакет по регионам тоже выгружаем
  if (!all.length && !favs.length && !batch.length) { toast('Нечего экспортировать — сначала сгенерируйте варианты'); return; }

  // F4: товар из формы на момент генерации / штампа варианта, не из живой формы
  const product = state.resultsForm ? currentProductName(state.resultsForm)
    : (state.results[0]?._product || batch[0]?.variant?._product || state.favorites[0]?._product || currentProductName(state.form));
  const date = new Date().toLocaleDateString('ru');
  const sep = '━'.repeat(44);

  const fmtVariant = (v, label) => {
    const len = v.title ? [...v.title].length : 0;
    const lenNote = len > 50 ? ` ⚠ ПРЕВЫШАЕТ ЛИМИТ (${len}/50)` : ` (${len}/50)`;
    const tags = [v.style, v.price_format, v.structure].filter(Boolean).join(' · ');
    return [
      `[${label}]${tags ? '  ' + tags : ''}`,
      `НАЗВАНИЕ${lenNote}:`,
      v.title || '(нет)',
      '',
      'ОПИСАНИЕ:',
      v.description || '(нет)',
    ].join('\n');
  };

  const lines = [
    'АВИТО-ПОМОЩНИК — Пакет объявлений',
    `Товар: ${product}`,
    `Дата:  ${date}`,
    `Итого: ${all.length} вариантов, ${batch.length} по регионам, ${favs.length} избранных`,
    sep,
    '',
  ];

  all.forEach((v, i) => {
    lines.push(fmtVariant(v, `ВАРИАНТ ${i + 1}`));
    lines.push('');
    lines.push(sep);
    lines.push('');
  });

  if (batch.length) {
    lines.push('📦 ПАКЕТ ПО РЕГИОНАМ');
    lines.push(sep);
    lines.push('');
    batch.forEach(it => {
      lines.push(fmtVariant(it.variant, `РЕГИОН: ${it.region}`));
      lines.push('');
      lines.push(sep);
      lines.push('');
    });
  }

  if (favs.length) {
    lines.push('★ ИЗБРАННОЕ');
    lines.push(sep);
    lines.push('');
    favs.forEach((v, i) => {
      lines.push(fmtVariant(v, `ИЗБРАННОЕ ${i + 1}`));
      lines.push('');
      lines.push(sep);
      lines.push('');
    });
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const slug = product.replace(/[^a-zа-яё0-9]/gi, '_').toLowerCase().slice(0, 20);
  a.download = `avito-pack-${slug}-${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  jlog('export', state.results[0]?._chain || null, { product, variants: all.length, batch: batch.length, favs: favs.length });
  toast(`Экспортировано: ${all.length} вар. + ${batch.length} рег. + ${favs.length} избр.`);
}

// ══════════════════════════════════════════
// DUPLICATE DETECTOR
// ══════════════════════════════════════════

const _DUP_STOP = new Set('для это что как при или без под над всё все его её они мне вам нас том там где кто чем уже еще ещё очень также тоже такой такая один два три можно нужно есть быть будет после через более менее'.split(' '));

function _dupTokenize(s) {
  return new Set(
    s.toLowerCase().replace(/[^\wа-яё\s]/gi, ' ').split(/\s+/)
      .filter(w => w.length >= 3 && !_DUP_STOP.has(w))
  );
}

function _dupSim(a, b) {
  const sA = _dupTokenize(a), sB = _dupTokenize(b);
  if (!sA.size || !sB.size) return 0;
  const inter = [...sA].filter(w => sB.has(w)).length;
  return inter / new Set([...sA, ...sB]).size;
}

function dupCheck(vid, fid) {
  const pool = [...resultsPool(), ...state.favorites]; // UX-15: включает и «Ещё варианты»
  // Use _fid to identify a favorite unambiguously (avoids id collision with results)
  const cur = fid
    ? state.favorites.find(v => v._fid === fid)
    : findResult(vid);
  if (!cur) return [];
  const curText = (cur.title || '') + ' ' + (cur.description || '');
  const seen = new Set();
  const hits = [];
  for (const v of pool) {
    if (v === cur) continue; // object identity — immune to id collisions
    const key = (v.title || '') + (v.description || '');
    if (seen.has(key)) continue;
    seen.add(key);
    const score = _dupSim(curText, key);
    if (score >= 0.25) {
      const inResults = resultsPool().includes(v);
      hits.push({ label: inResults ? `Вариант #${v.id}` : `★ Избранное`, score });
    }
  }
  // UX-4: сравнение также с историей уже размещённых объявлений (не только текущей сессией)
  for (const r of state.db) {
    if (!r.title && !r.description) continue;
    const key = (r.title || '') + (r.description || '');
    if (seen.has(key)) continue;
    seen.add(key);
    const score = _dupSim(curText, key);
    if (score >= 0.25) {
      hits.push({ label: `📋 История · ${r.region}${r.date ? ', ' + r.date : ''}`, score });
    }
  }
  return hits.sort((a, b) => b.score - a.score).slice(0, 5);
}

// SCANNER
// ══════════════════════════════════════════

const SCAN_ERRORS = [
  { re: /https?:\/\//i,      label: 'Внешняя ссылка (http/https)' },
  { re: /www\.\S+/i,         label: 'Внешняя ссылка (www)' },
  { re: /t\.me\//i,          label: 'Ссылка на Telegram (t.me)' },
  { re: /qr.?код|qr.?code/i, label: 'QR-код' },
  { re: /\+7[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/, label: 'Номер телефона (+7...)' },
  { re: /8[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/, label: 'Номер телефона (8-...)' },
  { re: /(пишите|напишите|пиши|пишу|писать|со\s+мной|свяжитесь|связь).{0,40}(телеграм|telegram|\btg\b|вацап|(?<![а-яёa-z0-9])вк(?![а-яёa-z0-9])|whatsapp|viber|вайбер)/i, label: 'Контакт через мессенджер (запрещено Авито)' },
  { re: /(телеграм|telegram|\btg\b|вацап|(?<![а-яёa-z0-9])вк(?![а-яёa-z0-9])|whatsapp|viber|вайбер).{0,40}(пишите|напишите|пиши|пишу|писать|со\s+мной|свяжитесь|связь)/i, label: 'Контакт через мессенджер (запрещено Авито)' },
  { re: /(?<![а-яёa-z0-9])аккаунт(?![а-яёa-z0-9])/i,          label: '⛔ Слово «аккаунт» — Авито банит за продажу аккаунтов' },
  { re: /учётная\s+запись|учетная\s+запись/i, label: '⛔ «Учётная запись» — риск блокировки как продажа аккаунта' },
  { re: /(?<![а-яёa-z0-9])профил[ья](?![а-яёa-z0-9])/i,       label: '⛔ Слово «профиль» — риск блокировки как продажа аккаунта' },
];

const SCAN_WARNINGS = [
  { re: /telegram|телеграм/i, label: 'Упоминание Telegram — Авито может расценить как контакт' },
  { re: /whatsapp|вацап|ватсап/i, label: 'Упоминание WhatsApp — Авито может расценить как контакт' },
  { re: /viber|вайбер/i,      label: 'Упоминание Viber — Авито может расценить как контакт' },
  // F19: синхронизация сканера с запретами SYS-промпта. Раньше вставленный руками или
  // «уплывший» текст AI проходил «🎉 Всё чисто», хотя нарушал правила объявления.
  { re: /(?<![а-яёa-z0-9])подар(ок|к[а-яё]+|очн[а-яё]+)(?![а-яёa-z0-9])/i, label: '«Подарок» — запрещено правилами объявления (риск как передача аккаунта)' },
  { re: /(?<![а-яёa-z0-9])(плат(ишь|ить|ежи?|ежом|ежа)|оплат[а-яё]*|оплачива[а-яё]*|купишь|покупаешь|покупк[а-яё]+)(?![а-яёa-z0-9])|(?<![а-яёa-z0-9])стоит\s+\d/i, label: 'Слова оплаты («платишь/оплата/купишь») — по правилам только «оформляешь»' },
];

const PLATFORM_RE = /ps4|ps5|пс4|пс5|xbox|иксбокс|playstation|nintendo|switch/i;
const DIGITAL_RE  = /оформляется в цифре/i;

function checkAds(title, desc, category) {
  const full = title + '\n' + desc;
  const errors = [], warnings = [], ok = [];

  const len = [...title].length;
  if (len > 50) {
    errors.push(`Название слишком длинное: ${len}/50 символов`);
  } else if (len > 0) {
    ok.push(`Длина названия: ${len}/50 символов`);
  }

  let forbiddenHit = false;
  for (const p of SCAN_ERRORS) {
    if (p.re.test(full)) { errors.push(p.label); forbiddenHit = true; }
  }
  if (!forbiddenHit && full.trim()) ok.push('Запрещённые ссылки и контакты не найдены');

  const warnHits = [];
  for (const p of SCAN_WARNINGS) {
    if (p.re.test(full)) warnHits.push(p);
  }
  // Не дублировать с ошибками о контактах
  for (const p of warnHits) {
    const alreadyError = SCAN_ERRORS.some(e => e.re.test(full) && e.label.includes('Контакт'));
    if (!alreadyError || (!p.label.includes('Telegram') && !p.label.includes('WhatsApp') && !p.label.includes('Viber'))) {
      warnings.push(p.label);
    }
  }

  if (category === 'gaming_sub' || category === 'game') {
    if (!PLATFORM_RE.test(full)) {
      warnings.push('Платформа не упомянута — укажи PS4/PS5/Xbox и т.д.');
    } else {
      ok.push('Платформа упомянута');
    }
  }

  if (category === 'game') {
    if (!DIGITAL_RE.test(full)) {
      warnings.push('Нет фразы «оформляется в цифре» — обязательно для игр');
    } else {
      ok.push('«Оформляется в цифре» присутствует');
    }
    if (/\d[\d\s]*₽|₽|\d+\s*руб|\d+\s*р\.|(?<![а-яёa-z0-9])руб(?![а-яёa-z0-9])/i.test(title)) {
      errors.push('Цена в названии — для игр ЗАПРЕЩЕНА');
    }
  }

  if (/(?<![а-яёa-z0-9])рублей(?![а-яёa-z0-9])|(?<![а-яёa-z0-9])руб(?![а-яёa-z0-9])/i.test(title)) {
    warnings.push('Слово «рублей»/«руб» в названии — используй символ ₽');
  }

  if (category === 'game' && /\d[\d\s]*₽|\d+\s*руб|\d+\s*рублей|\d+\s*р(?![а-яёa-z0-9])/i.test(desc)) {
    errors.push('Цена в описании игры — ЗАПРЕЩЕНА (клиент видит цену в поле Авито)');
  }

  // F19: «цена: N» как ярлык-ценник (все категории). Для игр цена-с-валютой уже ошибка выше,
  // но голая «Цена: 3000» без ₽/руб её не триггерит — этот warning закрывает и такой пробел.
  if (/(?<![а-яёa-z0-9])цена\s*[:—\-]?\s*\d/i.test(full)) {
    warnings.push('«Цена: N» как ярлык — по правилам сумму указывают без слова «цена» («… ₽», «оформляешь за …»)');
  }

  return { errors, warnings, ok };
}

// Автопроверка вариантов: светофор-бейдж на карточке/строке пакета сразу после генерации,
// без ручного перехода в Сканер. Использует тот же checkAds(), что и вкладка «Сканер».
function scanBadgeHTML(v) {
  if (!v || !v._scan) return '';
  const { errors, warnings } = v._scan;
  const level = errors.length ? 'error' : warnings.length ? 'warn' : 'ok';
  const icon  = level === 'error' ? '🔴' : level === 'warn' ? '🟡' : '🟢';
  const color = level === 'error' ? 'var(--err)' : level === 'warn' ? 'var(--warn)' : 'var(--ok)';
  const tip   = [...errors, ...warnings].join(' · ') || 'Проверка пройдена без замечаний';
  return `<span class="scan-badge" style="color:${color}" title="${esc(tip)}">${icon}</span>`;
}

function scannerTabHTML() {
  // UX-7: приходит с карточки объявления через goToScanner() — пред-заполняет поля

function goToScanner(title, desc, category) {
  state._scanPrefill = { title: title || '', desc: desc || '', category: category || 'gaming_sub' };
  state.tab = 'scanner';
  render();
}

function bindScannerTab() {
  const titleEl   = document.getElementById('scan-title');
  const descEl    = document.getElementById('scan-desc');
  const catEl     = document.getElementById('scan-cat');
  const lenEl     = document.getElementById('scan-len');
  const resultsEl = document.getElementById('scan-results');

  function runCheck() {
    const title = titleEl.value;
    const desc  = descEl.value;
    const cat   = catEl.value;
    const len   = [...title].length;

    lenEl.textContent = `${len}/50`;
    // F7: порог выровнен с lenClass() (карточка/конвейер/пакет) — жёлтый с 45, не с 41
    lenEl.style.color = len > 50 ? 'var(--err)' : len > 44 ? 'var(--warn)' : 'var(--muted)';

    if (!title && !desc) { resultsEl.innerHTML = ''; return; }

    const { errors, warnings, ok } = checkAds(title, desc, cat);

    const errBlock = errors.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--err);margin-bottom:6px">🚫 Ошибки · ${errors.length} — объявление могут снять</div>
        ${errors.map(e => `<div style="background:rgba(239,68,68,.12);border:1px solid var(--err);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#fca5a5">✗ ${esc(e)}</div>`).join('')}
      </div>` : '';

    const warnBlock = warnings.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--warn);margin-bottom:6px">⚠ Предупреждения · ${warnings.length}</div>
        ${warnings.map(w => `<div style="background:rgba(245,158,11,.1);border:1px solid var(--warn);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#fcd34d">⚠ ${esc(w)}</div>`).join('')}
      </div>` : '';

    const okBlock = ok.length ? `
      <div style="margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;color:var(--ok);margin-bottom:6px">✓ Пройдено · ${ok.length}</div>
        ${ok.map(o => `<div style="background:rgba(16,185,129,.1);border:1px solid var(--ok);border-radius:8px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#86efac">✓ ${esc(o)}</div>`).join('')}
      </div>` : '';

    const allGood = !errors.length && !warnings.length;
    const allGoodBlock = allGood && (title || desc) ? `
      <div style="padding:16px;background:rgba(16,185,129,.12);border:1px solid var(--ok);border-radius:10px;text-align:center;color:var(--ok);font-weight:600;font-size:15px">
        🎉 Всё чисто — объявление готово к публикации
      </div>` : '';

    resultsEl.innerHTML = `<div style="margin-top:14px">${errBlock}${warnBlock}${okBlock}${allGoodBlock}</div>`;
  }

  titleEl?.addEventListener('input', runCheck);
  descEl?.addEventListener('input', runCheck);
  catEl?.addEventListener('change', runCheck);

  // UX-7: пришли с карточки объявления — поля уже заполнены шаблоном, сразу прогнать проверку
  if (state._scanPrefill) { state._scanPrefill = null; runCheck(); }
}

// UX-14: настройки AI теперь рендерятся и в шапке (ai-panel, все вкладки кроме генератора),
// и всегда-открытыми внутри формы генератора (ai-inline-panel) — перерисовываем ту копию, что реально в DOM
function aiSettingsContainer() {
  return document.getElementById('sp')?.closest('#ai-panel, #ai-inline-panel')
      || document.getElementById('token-change')?.closest('#ai-panel, #ai-inline-panel');
}
function bindAISettings() {
  document.getElementById('sp')?.addEventListener('change', e => {
    state.settings.provider = e.target.value; save();
    const c = aiSettingsContainer(); if (c) c.innerHTML = settingsHTML();
    bindAISettings();
  });
  document.getElementById('sm')?.addEventListener('change', e => {
    state.settings.model = e.target.value; save();
  });
  document.getElementById('som')?.addEventListener('change', e => {
    state.settings.orModel = e.target.value; save();
  });
  document.getElementById('token-change')?.addEventListener('click', () => {
    const cur = localStorage.getItem('avito_admin_token') || '';
    const input = prompt('Админ-токен (оставьте пустым и нажмите OK, чтобы удалить):', cur);
    if (input === null) return; // отмена — ничего не трогаем
    const val = input.trim();
    if (val) { localStorage.setItem('avito_admin_token', val); toast('Токен сохранён'); }
    else { localStorage.removeItem('avito_admin_token'); toast('Токен удалён — при следующем запросе спросит заново'); }
    const c = aiSettingsContainer(); if (c) c.innerHTML = settingsHTML();
    bindAISettings();
  });
}
