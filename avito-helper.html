// Сырое чтение ключа без разбора JSON. Обёртка нужна не для красоты: в приватном
// режиме и при запрете сайту хранить данные сам ДОСТУП к localStorage бросает
// исключение, а эти чтения стоят прямо в разметке — необёрнутое падение роняет
// рендер всей вкладки, а не одну подпись.
function lsRaw(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }

function ls(key, def) {
  try {
    const v = localStorage.getItem(key);
    if (v) {
      const parsed = JSON.parse(v);
      // Merge arrays carefully: if def is array, use parsed if array, else def
      if (Array.isArray(def)) return Array.isArray(parsed) ? parsed : def;
      return typeof parsed === 'object' ? { ...def, ...parsed } : def;
    }
  } catch(e) {}
  return typeof def === 'object' && !Array.isArray(def) ? { ...def } : def;
}

// ══════════════════════════════════════════
// ЗАПИСЬ СЫРЬЯ БЕЗ ЗАТИРАНИЯ ЧУЖИХ ПРАВОК
// ══════════════════════════════════════════
// Инструмент нередко открыт сразу в двух вкладках. `_saveAll` писал каждый ключ
// целиком, то есть побеждал тот, кто сохранил последним: вкладка, пролежавшая без
// дела три часа, при первом же действии клала на диск свой устаревший снимок и
// сносила всё, что за это время завела соседняя. Именно так 12.09.2026 пропала
// запись Истории с донесённым финалом — без следа в кладбище, потому что её никто
// не удалял. Поэтому сырьё (История, эталоны, избранное) пишется СЛИЯНИЕМ: перед
// записью смотрим, что лежит в хранилище, и дописываем к своему набору то, чего в
// нём нет. Отсев идёт по кладбищу, поэтому осознанно удалённое из хранилища назад
// не поднимается. Свой набор при этом не фильтруется: состояние этой вкладки —
// источник истины для неё самой, а чужие удаления приезжают слиянием с сервера.
// Разбираем хранилище не на каждый save, а только когда строка отличается от той,
// что эта вкладка записала последней: обычный save остаётся дешёвым.
// Что эта вкладка записала последней. Заполняется при запуске значениями из
// хранилища — иначе первое же сохранение считало бы «своё» чужим и подливало бы
// назад то, что человек только что осознанно заменил (импорт бэкапа с заменой базы).
const _lsMine = {};
for (const k of ['avito_db', 'avito_refs', 'avito_favorites']) {
  const v = lsRaw(k);
  if (v != null) _lsMine[k] = v;
}
function saveMerged(key, mine, kind) {
  let out = mine || [];
  const raw = lsRaw(key);
  if (raw != null && raw !== _lsMine[key]) {
    try {
      const stored = JSON.parse(raw);
      if (Array.isArray(stored)) {
        const tombAt = new Map(syncTombs().map(t => [t.k, t.at || 0]));
        const m = syncMatcher(out, kind);
        const busy = new Set(out.map(x => x._fid ?? x.id));
        const back = [];
        let n = 0;
        for (const x of stored) {
          if (m.find(x)) continue;                          // эта запись у нас уже есть
          if (syncKilled(x, kind, tombAt)) continue;        // удалена человеком — не поднимаем
          // Совпавшие id ломают удаление и правку (они ищут строго по id), а две
          // вкладки штампуют id из одного Date.now() — поэтому коллизии переназначаем.
          const f = x._fid != null ? '_fid' : 'id';
          if (busy.has(x[f])) {
            let fresh = Date.now() + (++n);
            while (busy.has(fresh)) fresh = Date.now() + (++n);
            x[f] = fresh;
          }
          busy.add(x[f]);
          m.add(x);
          back.push(x);
        }
        if (back.length) out = [...out, ...back];
      }
    } catch(e) {}
  }
  const s = JSON.stringify(out);
  localStorage.setItem(key, s);
  _lsMine[key] = s;
  return out;
}

function save() {
  try {
    _saveAll();
    // Любое изменение данных ставит отложенную отправку на сервер. Дешёвая подпись
    // документа внутри syncPush отсекает случаи, когда менялось что-то постороннее,
    // поэтому здесь можно не разбираться, что именно изменилось.
    try { syncPushSoon(); } catch(e) {}
  } catch(e) {
    // Упёрлись в квоту localStorage: часть ключей записана, часть нет — на F5 это
    // потеря результатов/очереди/истории. Журнал самообучения делит ту же квоту и
    // всегда уступает: сбрасываем его буфер и повторяем запись целиком.
    try { jPurgeBuffer(); _saveAll(); } catch(e2) {}
  }
}

function _saveAll() {
    localStorage.setItem('avito_settings', JSON.stringify(state.settings));
    localStorage.setItem('avito_form',     JSON.stringify(state.form));
    localStorage.setItem('avito_results',  JSON.stringify(state.results));
    localStorage.setItem('avito_extra_results', JSON.stringify(state.extraResults));
    localStorage.setItem('avito_results_form', JSON.stringify(state.resultsForm ?? null)); // F12: снимок формы для ↻/↻×5 после F5
    localStorage.setItem('avito_catalogs',  JSON.stringify(state.catalogs));
    localStorage.setItem('avito_cats',      JSON.stringify(state.catsCfg));
    localStorage.setItem('avito_scenes',    JSON.stringify(state.scenesCfg));
    // Три набора сырья — единственное невосполнимое, поэтому они пишутся слиянием
    // с тем, что уже лежит в хранилище (см. saveMerged), а не поверх него.
    state.favorites = saveMerged('avito_favorites', state.favorites, SYNC_KIND.fav);
    state.db        = saveMerged('avito_db',        state.db,        SYNC_KIND.db);
    state.refs      = saveMerged('avito_refs',      state.refs,      SYNC_KIND.ref);
    localStorage.setItem('avito_queue',     JSON.stringify(state.postQueue));
    localStorage.setItem('avito_presets',   JSON.stringify(state.presets));
    // F10: пакет по регионам переживает F5 (был только в памяти — случайное обновление сжигало токены)
    localStorage.setItem('avito_batch_results', JSON.stringify(state.batchResults));
    localStorage.setItem('avito_batch_regions', JSON.stringify(state.batchRegions));
}

// Полный бэкап (v3). localStorage живёт ровно до чистки данных сайта и не существует
// на втором устройстве, а эталоны, избранное и правки категорий вносятся руками и
// нигде больше не хранятся — их потеря невосполнима. Поэтому в файл идёт ВСЁ
// накопленное: история, эталоны, избранное, пресеты, очередь и конфигурация.
// Транзитное (текущие результаты генерации, пакет по регионам, снимок формы)
// сознательно НЕ входит: оно живёт часы, заново генерируется и только раздувало бы
// файл. Админ-токен тоже НЕ входит — это ключ к платному API, а бэкап уезжает
// в облако и пересылается между устройствами.
// Слияние списков, пришедших извне (импорт файла и синхронизация с сервером —
// одна и та же задача). Сравниваем по СОДЕРЖИМОМУ: id это Date.now() того
// устройства, где запись создали, у чужой базы он ничего не значит.
// Новыми считаются те входящие, для которых не нашлось «той же самой» записи
// (правила сопоставления — в syncMatcher: личность важнее содержимого).
function mergeNewOnes(incoming, have, kind) {
  const m = syncMatcher(have, kind);
  const out = [];
  for (const x of (incoming || [])) {
    if (m.find(x)) continue;
    m.add(x);
    out.push(x);
  }
  return out;
}

// А вот сами id при слиянии двух баз совпасть МОГУТ — и тогда удаление, которое
// ищет строго по id, снесло бы обе записи разом. Коллизии переименовываем и
// возвращаем карту «старый id → новый», чтобы чинить ссылки на них.
function restampIds(added, have, idField = 'id') {
  const busy = new Set((have || []).map(x => x[idField]));
  const map = new Map();
  let n = 0;
  for (const x of added) {
    if (busy.has(x[idField])) {
      let fresh = Date.now() + (++n);
      while (busy.has(fresh)) fresh = Date.now() + (++n);
      map.set(x[idField], fresh);
      x[idField] = fresh;
    }
    busy.add(x[idField]);
  }
  return map;
}

function backupPayload() {
  let cvCfg = null;
  try { cvCfg = JSON.parse(lsRaw('avito_cv') || 'null'); } catch(e) {}
  return {
    v: 3,
    exported: new Date().toISOString(),
    db:        state.db || [],
    refs:      state.refs || [],
    favorites: state.favorites || [],
    presets:   state.presets || [],
    queue:     state.postQueue || [],
    cats:      state.catsCfg || null,
    scenes:    state.scenesCfg || null,
    catalogs:  state.catalogs || null,
    settings:  state.settings || null,
    cv:        cvCfg,
  };
}

// ══════════════════════════════════════════
// СИНХРОНИЗАЦИЯ С СЕРВЕРОМ (сессия 2026-09-11)
// Сырьё — эталоны, избранное и финальные тексты с Авито — невосполнимо: оно
// вносится руками и живёт в localStorage, который стирается вместе с данными
// сайта и не существует на втором устройстве. Журнал рядом это сырьё видит, но
// он поток: ретеншн 6 месяцев, читать его клиент не умеет, удаления он не знает.
// Документа два, потому что природа разная:
//   voice    — накопительное; сливается в обе стороны, потерять почти невозможно
//   settings — состояние (категории, каталоги, пресеты, очередь, оформление);
//              слить две версии одной категории нельзя, поэтому сюда только
//              пишем, а забираем ТОЛЬКО по явной команде человека
// ЖЕЛЕЗНОЕ ПРАВИЛО, как у журнала: синхронизация не имеет права уронить основной
// поток и никогда сама не спрашивает токен — пользуется уже сохранённым.
// ══════════════════════════════════════════

const SYNC_URL       = 'https://api.poigraem.shop/api/avito-sync/';
const SYNC_OFF_KEY   = 'avito_sync_off';
const SYNC_TOMB_KEY  = 'avito_deleted';
const SYNC_META_KEY  = 'avito_sync_meta';
const SYNC_DEBOUNCE  = 5000;   // отправка не чаще раза в 5с после последней правки
const SYNC_TOMB_MAX  = 2000;

function syncEnabled() { try { return lsRaw(SYNC_OFF_KEY) !== '1'; } catch(e) { return false; } }
function syncMeta() { try { return JSON.parse(lsRaw(SYNC_META_KEY) || '{}') || {}; } catch(e) { return {}; } }
function syncSetMeta(patch) {
  try { localStorage.setItem(SYNC_META_KEY, JSON.stringify({ ...syncMeta(), ...patch })); } catch(e) {}
}

// Ключи — по содержимому, не по id (id это Date.now() того устройства, где запись
// создали). `source` эталона в ключ НЕ входит: это изменяемая метка голоса, которую
// человек переключает нажатием, а не личность записи — иначе переключение на одном
// устройстве плодило бы на остальных вторую копию того же объявления.
const syncRefKey = r => ['ref', r.category || '', (r.title || '').trim(), (r.desc || '').trim()].join('|');
const syncFavKey = f => ['fav', (f.title || '').trim(), (f.description || '').trim()].join('|');
// У записи Истории ключ по содержимому ломался на правке: ✎ меняет товар или
// регион — меняется и ключ, то есть личность записи, и прежняя версия возвращалась
// с сервера ОТДЕЛЬНОЙ строкой. Поэтому новые записи несут неизменный _uid, а
// старые (заведённые до этой правки) продолжают дедуплицироваться по содержимому.
const dbContentKey = r => ['db', r?.product || '', r?.region || '', (r?.title || '').trim(), r?.date || ''].join('|');
const syncDbKey  = r => r && r._uid ? 'db#' + r._uid : dbContentKey(r);

// У записи ДВА РАЗНЫХ СОРТА ключей, и смешивать их нельзя.
//   id — личность: постоянный _uid. Он уникален даже у записей-близнецов.
//   fb — запасной, по содержимому. Им опознаётся ТА ЖЕ запись в копии, снятой до
//        появления _uid (на сервере или в соседней вкладке). `_ck0` — снимок этого
//        ключа на момент миграции: без него правка ✎ уводила текущий ключ в
//        сторону, и прежняя копия возвращалась отдельной строкой-двойником.
// Почему разделение принципиально: «одно объявление в нескольких регионах» —
// штатный сценарий, и повторное «✓ Размещено» сознательно создаёт вторую запись
// (у неё свой _uid, но товар, регион, название и дата могут совпасть до знака —
// дата хранится с точностью до дня). Если считать такие записи одной, слияние
// молча выбросит вторую, а её финал припишет первой. Поэтому запасной ключ
// работает только там, где сильного нет: запись С _uid сопоставляется по _uid, и
// лишь если такой не нашёлся — с записями БЕЗ _uid, которые ещё не мигрировали.
const SYNC_KIND = {
  ref: { id: () => [],  fb: r => [syncRefKey(r)] },
  fav: { id: () => [],  fb: f => [syncFavKey(f)] },
  db:  {
    id: r => (r && r._uid) ? ['db#' + r._uid] : [],
    fb: r => {
      const ks = [];
      if (r && r._ck0) ks.push(r._ck0);
      const ck = dbContentKey(r);
      if (!ks.includes(ck)) ks.push(ck);
      return ks;
    },
  },
};

// Сопоставитель: find(x) отдаёт «ту же самую» запись из набора или null.
function syncMatcher(list, k) {
  const byId = new Map(), byFb = new Map(), byFbWeak = new Map();
  const add = x => {
    const id = k.id(x);
    for (const q of id) if (!byId.has(q)) byId.set(q, x);
    for (const q of k.fb(x)) {
      if (!byFb.has(q)) byFb.set(q, x);
      if (!id.length && !byFbWeak.has(q)) byFbWeak.set(q, x);
    }
  };
  for (const x of list || []) add(x);
  const find = x => {
    const id = k.id(x);
    if (id.length) {
      return id.map(q => byId.get(q)).find(Boolean)
          || k.fb(x).map(q => byFbWeak.get(q)).find(Boolean) || null;
    }
    return k.fb(x).map(q => byFb.get(q)).find(Boolean) || null;
  };
  return { find, add };
}

// Надгробия записи, разложенные по сорту ключа: по личности и по содержимому.
function syncTombHit(x, k, tombAt) {
  let idAt = -1, fbAt = -1;
  const keys = [];
  for (const q of k.id(x)) { const v = tombAt.get(q); if (v != null) { keys.push(q); if (v > idAt) idAt = v; } }
  for (const q of k.fb(x)) { const v = tombAt.get(q); if (v != null) { keys.push(q); if (v > fbAt) fbAt = v; } }
  return { idAt, fbAt, keys };
}

// Выбрасывать ли запись как удалённую. `revived` (необязателен) собирает ключи,
// с которых метка снимается: запись, заведённая ПОЗЖЕ удаления, воскрешает ключ.
function syncKilled(x, k, tombAt, revived) {
  const { idAt, fbAt, keys } = syncTombHit(x, k, tombAt);
  if (idAt < 0 && fbAt < 0) return false;
  const born = syncBornAt(x);
  const revive = () => { if (revived) for (const q of keys) revived.add(q); return false; };
  // Удалили именно ЭТУ запись — уважаем всегда, иначе строку нельзя было бы убрать.
  if (idAt >= 0) return born > idAt ? revive() : true;
  // Осталось только надгробие по содержимому. Такие метки — наследие прежней схемы,
  // где близнецы делили один ключ на всех: именно по ним 12.09.2026 удаление пустого
  // дубля унесло полноценную запись с финалом. ПРЕДОХРАНИТЕЛЬ НА СЫРЬЁ: донесённый
  // финал по слабому ключу не выбрасываем — цена ошибки несимметрична, лишняя строка
  // видна и удаляется вручную, а стёртый финал не восстановить ничем.
  if (x && x.finalDesc) return false;
  return born > fbAt ? revive() : true;
}
// Личность записи, не зависящая от её полей. Случайный хвост — потому что две
// записи, созданные в одну миллисекунду на двух устройствах, получили бы один id.
function newUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
// Момент создания записи — по нему решается, что новее: удаление или повторное
// добавление той же записи.
const syncBornAt = x => Number(x && (x._fid || x.id)) || 0;

// Кладбище удалённого: {k: ключ, at: когда удалили}. Без него удалённый на телефоне
// эталон возвращался бы с сервера при каждом старте. Со временем удаления — потому
// что запись с тем же содержимым можно завести заново, и тогда метка удаления
// должна перестать действовать (иначе восстановленный эталон молча исчезал бы при
// следующем запуске). Содержимое удалённого лежит в корзине, см. syncTrash.
function syncTombs() {
  try {
    const v = JSON.parse(lsRaw(SYNC_TOMB_KEY) || '[]');
    if (!Array.isArray(v)) return [];
    // Терпим и старый формат (голые строки) — он прожил ровно одну сессию
    return v.map(x => typeof x === 'string' ? { k: x, at: 0 } : x).filter(x => x && x.k);
  } catch(e) { return []; }
}
function syncTombSave(list) {
  try {
    const byKey = new Map();
    for (const t of list) {
      if (!t || !t.k) continue;
      const prev = byKey.get(t.k);
      if (!prev || (t.at || 0) > (prev.at || 0)) byKey.set(t.k, { k: t.k, at: t.at || 0 });
    }
    const t = [...byKey.values()];
    while (t.length > SYNC_TOMB_MAX) t.shift();
    localStorage.setItem(SYNC_TOMB_KEY, JSON.stringify(t));
  } catch(e) {}
}
// Вызывается из мест удаления. `rec` кладётся в корзину — сырьё не должно
// пропадать даже от ошибочного нажатия, и вернуть его можно из ⚙ Настроек.
function syncTomb(key, rec, kind) {
  try {
    syncTombSave([...syncTombs(), { k: key, at: Date.now() }]);
    if (rec) syncTrashSave([...syncTrash(), { key, kind: kind || '', at: new Date().toISOString(), rec }]);
    syncPushSoon();
  } catch(e) {}
}
function syncTrash() {
  try { const v = JSON.parse(lsRaw('avito_trash') || '[]'); return Array.isArray(v) ? v : []; }
  catch(e) { return []; }
}
// Корзина ограничена БАЙТАМИ, а не числом записей: она уезжает в каждой отправке и
// делит квоту localStorage с живыми данными продавца, а эталон бывает под 2 КБ.
const SYNC_TRASH_MAX_BYTES = 200000;
function syncTrashSave(list) {
  try {
    const t = [...list];
    while (t.length > 1 && JSON.stringify(t).length > SYNC_TRASH_MAX_BYTES) t.shift();
    localStorage.setItem('avito_trash', JSON.stringify(t));
  } catch(e) {}
}

function syncVoiceDoc() {
  return {
    refs: state.refs || [],
    favorites: state.favorites || [],
    db: state.db || [],
    deleted: syncTombs(),
    trash: syncTrash(),   // содержимое удалённого: вернуть можно, потерять нельзя
  };
}
function syncSettingsDoc() {
  let cvCfg = null;
  try { cvCfg = JSON.parse(lsRaw('avito_cv') || 'null'); } catch(e) {}
  return {
    cats: state.catsCfg || null, scenes: state.scenesCfg || null,
    catalogs: state.catalogs || null,
    settings: state.settings || null, presets: state.presets || [],
    queue: state.postQueue || [], cv: cvCfg,
  };
}

// Подпись документа: слать 260КБ при каждом клике незачем. Длины мало — правка
// опечатки в товаре или замена региона на равный по длине не меняют ни размер, ни
// число записей, и такое изменение никогда не уехало бы с устройства. Поэтому
// дешёвая контрольная сумма по всему тексту.
function syncStamp(doc) {
  try {
    const s = JSON.stringify(doc);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return s.length + ':' + (h >>> 0).toString(36);
  }
  catch(e) { return String(Date.now()); }
}

async function syncFetch(doc, body) {
  const token = lsRaw('avito_admin_token');
  if (!token || !syncEnabled()) return null;
  const opts = body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(body) }
    : { headers: { 'Authorization': 'Bearer ' + token } };
  // Недоступная сеть и нераскатанный эндпоинт — штатные состояния фоновой
  // синхронизации, а не дефекты: они возвращают null молча. console.error остаётся
  // только для настоящих неожиданностей — иначе он засорял бы консоль на каждом
  // старте офлайн и прятал бы в шуме реальные ошибки.
  let r;
  try { r = await fetch(SYNC_URL + doc, opts); } catch(e) { return null; }
  // 401 токен НЕ чистим: в отличие от генерации, синхронизация фоновая, и
  // выкидывать человека из работы из-за неё нельзя.
  if (!r.ok) return null;
  try { return await r.json(); } catch(e) { return null; }
}

let _syncT = null, _syncBusy = false;
function syncPushSoon() {
  try { clearTimeout(_syncT); _syncT = setTimeout(syncPush, SYNC_DEBOUNCE); } catch(e) {}
}

// Настройки по умолчанию отправлять незачем, а вот навредить ими можно: браузер с
// очищенными данными держит пустые категории и пустые пресеты, и его отправка стёрла
// бы на сервере копию настоящих — до того, как человек успеет нажать «↓ Забрать».
// Поэтому отправляем настройки, только когда в них есть что-то своё.
function syncSettingsWorth(d) {
  try {
    const cats = d.cats || {};
    if (Object.keys(cats.builtin || {}).length || (cats.custom || []).length) return true;
    const scenes = d.scenes || {};
    if (Object.keys(scenes.builtin || {}).length || (scenes.custom || []).length) return true;
    if ((d.presets || []).length || (d.queue || []).length) return true;
    if (Object.keys(d.catalogs || {}).length || d.cv) return true;
    // Сами настройки считаем своими, если хоть одно поле отличается от заводского:
    // имя страницы, модель, список регионов и свой системный промпт — всё это
    // правки человека, и терять их на сервере незачем.
    return JSON.stringify({ ...DEF_SETTINGS, ...(d.settings || {}) }) !== JSON.stringify(DEF_SETTINGS);
  } catch(e) { return false; }
}

// Возвращает true, если отправка реально состоялась (по ней кнопка «↑ Отправить
// сейчас» говорит правду, а не рапортует об успехе, когда запроса не было вовсе).
async function syncPush(force) {
  if (!syncEnabled() || !lsRaw('avito_admin_token')) return false;
  // Правка, сделанная во время отправки, не должна потеряться: перезапускаем
  // таймер вместо молчаливого выхода.
  if (_syncBusy) { syncPushSoon(); return false; }
  let sent = false;
  try {
    _syncBusy = true;
    const meta = syncMeta();
    const voice = syncVoiceDoc();
    // Пустой клиент не имеет права стереть сырьё на сервере: так выглядит первый
    // запуск в новом браузере ДО того, как он успел забрать данные.
    const voiceEmpty = !voice.refs.length && !voice.favorites.length && !voice.db.length;
    const vStamp = syncStamp(voice);
    if (!voiceEmpty && (force || vStamp !== meta.voiceStamp)) {
      if (await syncFetch('voice', { data: voice, device: _jDevice() })) {
        syncSetMeta({ voiceStamp: vStamp, voiceAt: new Date().toISOString() });
        sent = true;
      }
    }
    const settings = syncSettingsDoc();
    const sStamp = syncStamp(settings);
    if (syncSettingsWorth(settings) && (force || sStamp !== meta.settingsStamp)) {
      if (await syncFetch('settings', { data: settings, device: _jDevice() })) {
        syncSetMeta({ settingsStamp: sStamp, settingsAt: new Date().toISOString() });
        sent = true;
      }
    }
  } catch(e) { console.error('sync push:', e); }
  finally { _syncBusy = false; }
  return sent;
}

// Забрать сырьё и слить с локальным. Вызывается при старте. Ничего не удаляет
// молча, кроме того, что помечено удалённым (кладбище) — это выбор владельца.
async function syncPullVoice() {
  try {
    const got = await syncFetch('voice');
    if (!got || got.empty || !got.data) return null;
    const d = got.data;
    const arr = v => Array.isArray(v) ? v : [];
    // Кладбища объединяем: удалённое на другом устройстве должно уйти и здесь.
    // Храним для каждого ключа САМОЕ ПОЗДНЕЕ время удаления.
    const tombAt = new Map();
    for (const t of [...syncTombs(), ...arr(d.deleted).map(x => typeof x === 'string' ? { k: x, at: 0 } : x)]) {
      if (!t || !t.k) continue;
      tombAt.set(t.k, Math.max(tombAt.get(t.k) || 0, t.at || 0));
    }
    // Запись, заведённая ПОЗЖЕ удаления, метку снимает: иначе заново добавленный
    // эталон (или восстановленный из корзины) молча исчезал бы при каждом запуске.
    const revived = new Set();
    const killed = (x, kind) => syncKilled(x, kind, tombAt, revived);
    // Корзину сливаем — из неё возвращают ошибочно удалённое
    const trashHave = new Set(syncTrash().map(x => x.key + '|' + x.at));
    const trashAdd = arr(d.trash).filter(x => x && !trashHave.has(x.key + '|' + x.at));
    if (trashAdd.length) syncTrashSave([...syncTrash(), ...trashAdd]);

    const before = JSON.stringify([(state.refs || []).length, (state.favorites || []).length, (state.db || []).length]);
    // Сначала выбрасываем удалённое где-то ещё, потом добавляем недостающее
    state.refs      = (state.refs || []).filter(x => !killed(x, SYNC_KIND.ref));
    state.favorites = (state.favorites || []).filter(x => !killed(x, SYNC_KIND.fav));
    state.db        = (state.db || []).filter(x => !killed(x, SYNC_KIND.db));

    const addRefs = mergeNewOnes(arr(d.refs).filter(x => !killed(x, SYNC_KIND.ref)), state.refs, SYNC_KIND.ref);
    const addFavs = mergeNewOnes(arr(d.favorites).filter(x => !killed(x, SYNC_KIND.fav)), state.favorites, SYNC_KIND.fav);
    const addDb   = mergeNewOnes(arr(d.db).filter(x => !killed(x, SYNC_KIND.db)), state.db, SYNC_KIND.db);
    // Переименовываем только совпавшие id. Ссылки очереди тут НЕ чиним: входящих
    // позиций очереди в этом документе нет, а локальные указывают на локальное же
    // избранное — правка увела бы их на чужой текст.
    restampIds(addFavs, state.favorites, '_fid');
    restampIds(addRefs, state.refs);
    restampIds(addDb, state.db);

    state.refs = [...state.refs, ...addRefs];
    state.favorites = [...state.favorites, ...addFavs];
    state.db = [...state.db, ...addDb];

    // Слияние по ключу добавляет только НОВЫЕ записи, а финальный текст приходит в
    // уже известную: ключ записи Истории от финала не меняется. Без этого финал,
    // донесённый на телефоне, не доезжал бы до компьютера — а это самое ценное сырьё.
    let finalsMerged = 0;
    // Ищем «ту же самую» запись теми же правилами, что и при слиянии: по личности,
    // а к содержимому сводим только копию, снятую до появления _uid. Иначе финал
    // второй публикации того же объявления приписался бы первой.
    const localDb = syncMatcher(state.db, SYNC_KIND.db);
    for (const inc of arr(d.db)) {
      const local = localDb.find(inc);
      if (!local) continue;
      // Поля учёта (аккаунт, дата публикации, свой срок ротации) подтягиваем в
      // уже известную запись, если локально их ещё нет: устройство, где запись
      // завели раньше этой версии, иначе навсегда осталось бы без них.
      // У аккаунта «нет» значит «не выбирали руками» (метка _accAuto от миграции):
      // после неё поле заполнено у всех записей, и проверка на пустоту не сработала
      // бы никогда — публикация со второго профиля осталась бы на первом навсегда.
      if (inc.account && !inc._accAuto && (!local.account || local._accAuto) && local.account !== inc.account) {
        local.account = inc.account; delete local._accAuto; finalsMerged++;
      }
      if (!local.postedAt && inc.postedAt) { local.postedAt = inc.postedAt; finalsMerged++; }
      // «Своего срока нет» и «срок сняли» — разные вещи: снятие пишет 0/false, и
      // тогда входящее старое значение уже не воскресит выключенную ротацию.
      if (local.rotDays == null && inc.rotDays != null) { local.rotDays = inc.rotDays; finalsMerged++; }
      if (local.rotOff == null && inc.rotOff != null) { local.rotOff = inc.rotOff; finalsMerged++; }
      if (!inc.finalDesc || local.finalDesc) continue;
      local.finalTitle = inc.finalTitle; local.finalDesc = inc.finalDesc;
      local.editShare = inc.editShare;
      if (!local._category && inc._category) local._category = inc._category;
      finalsMerged++;
    }

    // Снятые метки убираем, остальные сохраняем
    syncTombSave([...tombAt].filter(([k]) => !revived.has(k)).map(([k, at]) => ({ k, at })));

    const added = addRefs.length + addFavs.length + addDb.length;
    const changed = added || finalsMerged
      || before !== JSON.stringify([state.refs.length, state.favorites.length, state.db.length]);
    syncSetMeta({ pulledAt: new Date().toISOString() });
    if (changed) {
      save(); render();
      // После слияния локальный набор БОГАЧЕ серверного (наши записи там ещё не
      // лежат). Отправляем объединение сразу и принудительно: иначе подпись,
      // посчитанная от уже слитого документа, сделала бы отправку ненужной, и
      // записи, заведённые только здесь, остались бы на одном устройстве.
      syncPush(true).catch(() => {});
    }
    return { added, finals: finalsMerged, at: got.updated, device: got.device };
  } catch(e) { console.error('sync pull:', e); return null; }
}

// Корзина: удалённое сырьё, которое можно вернуть. Без этого списка обещание
// «останется в корзине — вернуть можно» в подтверждении удаления было бы пустым:
// записи копились бы, но достать их изнутри инструмента было бы нечем.
const TRASH_KIND_LABEL = { ref: '📥 эталон', fav: '☆ избранное', db: '🗂 запись Истории' };
function syncTrashHTML() {
  const trash = syncTrash();
  if (!trash.length) return '';
  const rows = [...trash].reverse().slice(0, 20).map((x, i) => {
    const r = x.rec || {};
    const name = r.title || r.product || (r.desc || r.description || '').slice(0, 60) || '(без названия)';
    return `<div class="preset-item">
      <span class="preset-item-meta" style="flex-shrink:0">${esc(TRASH_KIND_LABEL[x.kind] || '')}</span>
      <span class="preset-item-name" title="${esc((r.desc || r.description || r.finalDesc || ''))}" style="cursor:help">${esc(name)}</span>
      <span class="preset-item-meta">${esc((x.at || '').slice(0, 10))}</span>
      <button class="btn-sm" data-act="trash-restore" data-key="${esc(x.key)}" data-at="${esc(x.at || '')}" style="padding:2px 7px;font-size:11px">↩ вернуть</button>
    </div>`;
  }).join('');
  return `<details style="margin-top:4px">
    <summary style="cursor:pointer;font-size:12px;color:var(--muted)">🗑 Корзина — ${trash.length}, можно вернуть</summary>
    <div style="display:flex;flex-direction:column;gap:7px;margin-top:10px">${rows}</div>
  </details>`;
}

function syncStatusText() {
  try {
    if (!lsRaw('avito_admin_token')) return 'Токен не задан — синхронизация не работает, данные только в этом браузере';
    if (!syncEnabled()) return 'Выключена — данные живут только в этом браузере';
    const m = syncMeta();
    const when = t => t ? new Date(t).toLocaleString('ru') : '—';
    const trash = syncTrash().length;
    return `Отправлено: ${when(m.voiceAt)} · получено: ${when(m.pulledAt)}${trash ? ` · в корзине: ${trash}` : ''}`;
  } catch(e) { return ''; }
}

// Настройки забираются только по явной команде: слить две версии одной категории
// нельзя, и молчаливая замена стёрла бы правки, сделанные на другом устройстве.
async function syncPullSettings() {
  try {
    const got = await syncFetch('settings');
    if (!got || got.empty || !got.data) { toast('На сервере настроек пока нет'); return; }
    const d = got.data;
    const when = got.updated ? new Date(got.updated).toLocaleString('ru') : 'неизвестно когда';
    if (!confirm(`На сервере версия от ${when}${got.device ? ` (устройство ${got.device})` : ''}.\n\nЗаменить ТЕКУЩИЕ настройки — категории, каталоги, пресеты, очередь и оформление — на серверные?\n\nСырьё (эталоны, избранное, История) это не затронет.`)) return;
    if (d.cats && typeof d.cats === 'object') {
      state.catsCfg = { builtin: d.cats.builtin || {}, custom: Array.isArray(d.cats.custom) ? d.cats.custom : [] };
      rebuildCats();
    }
    if (d.scenes && typeof d.scenes === 'object') {
      state.scenesCfg = { builtin: d.scenes.builtin || {}, custom: Array.isArray(d.scenes.custom) ? d.scenes.custom : [] };
      rebuildScenes();
    }
    if (d.catalogs && typeof d.catalogs === 'object') state.catalogs = d.catalogs;
    if (d.settings && typeof d.settings === 'object') {
      state.settings = { ...DEF_SETTINGS, ...d.settings };
      if (MODEL_MIGRATION[state.settings.model]) state.settings.model = MODEL_MIGRATION[state.settings.model];
    }
    if (Array.isArray(d.presets)) state.presets = d.presets;
    if (Array.isArray(d.queue)) state.postQueue = d.queue;
    if (d.cv && typeof d.cv === 'object') {
      cvApplyCfg(d.cv);
      cvSave();
    }
    save(); render();
    toast('Настройки восстановлены с сервера');
  } catch(e) { toast('Не удалось забрать настройки: ' + e.message); }
}

// ══════════════════════════════════════════
// ЖУРНАЛ САМООБУЧЕНИЯ (методика bot-selflearn-log)
// Сырьё — в журнал, смысл — постфактум. Каждое событие: что инструмент
// сгенерировал, что Денис выбрал/скопировал/перегенерил/скачал/донёс с Авито.
// События уходят батчами на VPS (/api/journal, тот же админ-токен) — журналы
// телефона и ПК стекаются в один. Пока сети/токена/эндпоинта нет — копятся
// в локальном буфере (localStorage) и уходят при первой возможности.
// ЖЕЛЕЗНОЕ ПРАВИЛО: журнал не имеет права уронить основной поток — всё в try/catch,
// и токен журнал НИКОГДА не запрашивает сам (только пользуется уже сохранённым).
// ══════════════════════════════════════════

const J_BUF_KEY   = 'avito_journal_buf';
const J_OFF_KEY   = 'avito_journal_off';
// Кап буфера сознательно небольшой: localStorage делится с реальными данными
// продавца (результаты, избранное, очередь, история). Журнал ОБЯЗАН уступать им
// место — при рабочем эндпоинте буфер живёт секунды, большой запас нужен только
// на офлайн/до-деплойный период, и ~0.8МБ (400k символов UTF-16) его закрывают.
const J_MAX_BYTES   = 400000;
const J_BATCH_MAX   = 40;     // событий в одном POST
const J_BATCH_BYTES = 300000; // и не больше ~0.6МБ телом — иначе упрёмся в лимит body на прокси
const J_FORCE_MS    = 30000;  // старейшее неотправленное ждёт не дольше этого, даже если клики идут потоком
const J_FORCE_COUNT = 25;

// Пауза после неудач: без неё отправка «голодает» наоборот — _jOldestAt сбрасывается
// только когда буфер опустел, поэтому при постоянных ошибках (протухший токен, лежащий
// сервер) условие «старейшее ждёт дольше 30с» становится вечным, дебаунс обходится, и
// POST уходит на КАЖДЫЙ клик. На телефоне это лишняя сеть и батарея на ровном месте.
const J_FAIL_BASE_MS = 5000;
const J_FAIL_MAX_MS  = 300000; // 5 минут — дальше растить бессмысленно

let _jBuf = (() => { try { const v = JSON.parse(localStorage.getItem(J_BUF_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } })();
let _jBufBytes = _jBuf.reduce((s, e) => s + JSON.stringify(e).length, 0);
let _jDropped = 0;
let _jOldestAt = _jBuf.length ? Date.now() : 0;
let _jFails = 0, _jQuietUntil = 0;

// Ид устройства — различает телефон/ПК в общем журнале на сервере
function _jDevice() {
  try {
    let d = localStorage.getItem('avito_journal_device');
    if (!d) { d = Math.random().toString(16).slice(2, 8); localStorage.setItem('avito_journal_device', d); }
    return d;
  } catch(e) { return '?'; }
}

function jEnabled() { try { return localStorage.getItem(J_OFF_KEY) !== '1'; } catch(e) { return false; } }

// Ключ идемпотентности события. Если сервер записал батч, а ответ не дошёл (обрыв,
// таймаут), клиент отправит его повторно — и в журнале появятся дубли. Дедуп по
// ts+device+event их ловит, но грубо: два одинаковых клика в одну миллисекунду он
// схлопнет в один. Собственный id снимает эту неоднозначность при разборе.
function _jEid() {
  try {
    if (crypto && crypto.randomUUID) return crypto.randomUUID().slice(0, 13).replace('-', '');
  } catch(e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function _jRecount() { _jBufBytes = _jBuf.reduce((s, ev) => s + JSON.stringify(ev).length, 0); }

function _jSaveBuf() {
  try { clearTimeout(_jSaveT); } catch(e) {}
  try { localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf)); }
  catch(e) {
    // Квота localStorage: жертвуем старой половиной буфера, но не роняем ничего
    try {
      const drop = Math.ceil(_jBuf.length / 2);
      _jDropped += drop;
      _jBuf.splice(0, drop);
      _jRecount();
      localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf));
    } catch(e2) {}
  }
}

// Запись буфера — отложенная: сериализовать весь буфер на КАЖДЫЙ клик заметно
// подтормаживает телефон (основное устройство). Синхронно пишем только там, где
// страницу могут закрыть (visibilitychange/pagehide) и перед отправкой.
let _jSaveT = null;
function _jSaveBufSoon() { try { clearTimeout(_jSaveT); _jSaveT = setTimeout(_jSaveBuf, 800); } catch(e) { _jSaveBuf(); } }

// Аварийный сброс буфера, если в квоту localStorage упёрлись реальные данные
// продавца: журнал всегда уступает место результатам/избранному/очереди/истории.
function jPurgeBuffer() {
  try {
    _jDropped += _jBuf.length;
    _jBuf.length = 0; _jBufBytes = 0; _jOldestAt = 0;
    localStorage.removeItem(J_BUF_KEY);
  } catch(e) {}
}

function jlog(event, chainId, fields) {
  try {
    if (!jEnabled()) return;
    const e = {
      ts: new Date().toISOString(), eid: _jEid(), event, chainId: chainId || null,
      device: _jDevice(), build: document.lastModified || '',
      ...(fields || {}),
    };
    if (_jDropped) { e._dropped = _jDropped; _jDropped = 0; }
    const sz = JSON.stringify(e).length;
    if (!_jBuf.length) _jOldestAt = Date.now();
    _jBuf.push(e); _jBufBytes += sz;
    while (_jBufBytes > J_MAX_BYTES && _jBuf.length > 1) {
      _jBufBytes -= JSON.stringify(_jBuf[0]).length;
      _jBuf.shift(); _jDropped++;
    }
    _jSaveBufSoon();
    _jScheduleFlush();
  } catch(err) { console.error('journal:', err); }
}

let _jFlushT = null, _jFlushing = false;
// Обычно — дебаунс 4с (склеиваем серию кликов в один POST). Но дебаунс без потолка
// голодает: во время активной работы клики идут чаще, чем раз в 4с, и отправка
// откладывалась бы бесконечно — поэтому по возрасту/количеству шлём немедленно.
function _jScheduleFlush() {
  try {
    // Пауза после неудач старше любых «пора слать»: сервер не станет доступнее
    // оттого, что человек кликает чаще
    const quiet = _jQuietUntil - Date.now();
    if (quiet > 0) { clearTimeout(_jFlushT); _jFlushT = setTimeout(jFlush, quiet); return; }
    const overdue = _jBuf.length >= J_FORCE_COUNT || (_jOldestAt && Date.now() - _jOldestAt > J_FORCE_MS);
    if (overdue) { clearTimeout(_jFlushT); jFlush(); return; }
    clearTimeout(_jFlushT); _jFlushT = setTimeout(jFlush, 4000);
  } catch(e) {}
}

// Неудача доставки — растим паузу вдвое от 5с до 5 минут. force-отправки
// (закрытие страницы, выключение журнала) паузу игнорируют: там важнее отдать.
function _jFail() {
  _jFails++;
  _jQuietUntil = Date.now() + Math.min(J_FAIL_BASE_MS * Math.pow(2, _jFails - 1), J_FAIL_MAX_MS);
}
function _jOk() { _jFails = 0; _jQuietUntil = 0; }

// force=true — отправить, даже если журнал только что выключили (иначе уже собранные
// события навсегда осели бы в localStorage и занимали место)
async function jFlush(force) {
  try {
    if (_jFlushing || !_jBuf.length || (!force && !jEnabled())) return;
    if (!force && Date.now() < _jQuietUntil) return; // ждём после неудач, см. _jFail
    const token = localStorage.getItem('avito_admin_token'); // не спрашиваем — только берём готовый
    if (!token) return;
    _jFlushing = true;
    try {
      // Батч ограничен и по числу событий, и по размеру тела: одно событие пакета
      // по регионам несёт полные тексты всех объявлений и может весить десятки КБ
      const batch = [];
      let bytes = 0;
      for (const ev of _jBuf) {
        const sz = JSON.stringify(ev).length;
        if (batch.length && (batch.length >= J_BATCH_MAX || bytes + sz > J_BATCH_BYTES)) break;
        batch.push(ev); bytes += sz;
      }
      _jSaveBuf(); // фиксируем состояние до сети
      const r = await fetch(PROXY_JOURNAL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ events: batch }),
      });
      // Удаляем ИМЕННО отправленные события по тождеству объектов: за время await
      // начало буфера могло сдвинуться (вытеснение по капу/квоте), и splice по
      // количеству снёс бы чужие, ещё не отправленные события.
      const drop = () => {
        const sent = new Set(batch);
        _jBuf = _jBuf.filter(ev => !sent.has(ev));
        _jRecount();
        _jOldestAt = _jBuf.length ? _jOldestAt : 0;
        _jSaveBuf();
      };
      if (r.ok) {
        _jOk();
        drop();
        if (_jBuf.length) setTimeout(() => jFlush(force), 400); // дожимаем остаток батчами
      } else if (r.status === 400 || r.status === 413 || r.status === 422) {
        // Невосстановимое: этот батч не примут никогда. Если не выбросить — он
        // навсегда заткнёт голову очереди, а все новые события вытеснит по капу.
        // Связь при этом жива, так что паузу не растим — следующий батч может пройти.
        _jOk();
        drop();
        console.error('journal: батч отвергнут сервером (' + r.status + '), выброшен');
      } else _jFail();
      // 401/404/5xx — молчим и ждём: токен чинит callAI, эндпоинт доедет с деплоем, буфер цел
    } catch(e) { _jFail(); /* офлайн — буфер ждёт следующего повода */ }
    finally { _jFlushing = false; }
  } catch(e) { _jFlushing = false; }
}

// Светофор варианта для журнала — тот же уровень, что показывает бейдж
function jScanLevel(v) {
  const s = v && v._scan;
  if (!s) return null;
  return s.errors.length ? 'error' : s.warnings.length ? 'warn' : 'ok';
}

// Доля изменённого текста (0..1): 1 - 2*LCS/(a+b) по словам. Считается при
// «доносе» финального текста с Авито — что Денис стабильно правит руками.
function jEditShare(a, b) {
  try {
    const wa = String(a || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    const wb = String(b || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    if (!wa.length && !wb.length) return 0;
    if (!wa.length || !wb.length) return 1;
    let prev = new Array(wb.length + 1).fill(0);
    for (let i = 1; i <= wa.length; i++) {
      const cur = [0];
      for (let j = 1; j <= wb.length; j++) {
        cur[j] = wa[i-1] === wb[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]);
      }
      prev = cur;
    }
    const lcs = prev[wb.length];
    return Math.round((1 - (2 * lcs) / (wa.length + wb.length)) * 100) / 100;
  } catch(e) { return null; }
}

// Компактные выжимки вариантов для события generated — полные тексты (правило:
// писать то, что нельзя восстановить), плюс светофор
function jVariants(list) {
  return (list || []).map(v => ({ title: v.title || '', description: v.description || '', scan: jScanLevel(v) }));
}

// Счётчики графических действий за сессию канваса — копятся в памяти,
// уходят одной строкой вместе с cv_download (не событие-на-каждый-drag)
// layers — добавленные элементы оформления, tpls — применённые шаблоны
const _jCv = { drags: 0, layouts: 0, toggles: 0, tz: 0, layers: 0, tpls: 0 };
function jCvBump(k) { try { _jCv[k] = (_jCv[k] || 0) + 1; } catch(e) {} }
function jCvTakeCounters() {
  const out = { ..._jCv };
  for (const k in _jCv) _jCv[k] = 0;
  return out;
}

// Снимок настроек обложки (та же фильтрация, что cvSave: без картинок и _служебных).
// Свои шаблоны не пишем: это библиотека, а не оформление этой обложки, и она раздувала бы
// каждое событие скачивания.
function jCvSnapshot() {
  try {
    const out = {};
    for (const k in cv) { if (k === 'images' || k === 'tpls' || k.startsWith('_')) continue; out[k] = cv[k]; }
    return out;
  } catch(e) { return null; }
}

// Повторный клик по кнопке, чья операция УЖЕ идёт, — это нетерпение, а не
// использование функции: обработчик всё равно выйдет сразу. Такие клики в перепись
// не пускаем, иначе счётчик покажет не спрос на функцию, а нервность ожидания.
// Каждое действие блокируется своим флагом — общего state.loading тут мало.
function jActBusy(act, el) {
  try {
    switch (act) {
      case 'rephrase': {
        // Замок у перефраза — на блок конкретной карточки, поэтому нужен сам элемент
        const fid = el && el.getAttribute('data-fid');
        const vid = el && el.getAttribute('data-vid');
        return state.rephBusy.has(fid ? `reph-f${fid}` : `reph-${vid}`);
      }
      case 'db-rotate': {
        // Замок ротации — по паре «запись + степень»: панель остаётся на экране,
        // и нетерпеливый второй тап иначе оплатился бы дважды.
        const id = el && el.getAttribute('data-id');
        const md = (el && el.getAttribute('data-mode')) === 'mid' ? 'mid' : 'light';
        return state.rotBusy.has(`${id}:${md}`);
      }
      case 'gen': case 'gen-titles': case 'titles-next':  return state.loading;
      case 'gen-more':                                    return state.loading || state.extraLoading;
      case 'regen':                                       return state.regenId !== null;
      case 'alt-titles':                                  return state.altTitlesLoading !== null;
      case 'ref-tricks':                                  return !!state._refTricksLoading;
      case 'vision-recognize':                            return state.vision.loading;
      case 'vision-price':                                return state.vision.priceLoading;
      case 'staged-gen':                                  return state.vision.staged.loading;
      default:                                            return false;
    }
  } catch(e) { return false; }
}

// Копирование = «этот текст пошёл в дело» — главный сигнал выбора в текстовом контуре.
// kind/vid/bi читаются из data-j* атрибутов кнопок копирования.
function jCopied(el) {
  try {
    const kind = el.dataset.j || 'other';
    let v = null, extra = {};
    if (el.dataset.jbi !== undefined) {
      const item = state.batchResults[+el.dataset.jbi];
      v = item && item.variant; extra.region = item && item.region;
      extra.pos = +el.dataset.jbi;
    } else if (el.dataset.jreph !== undefined) {
      // Перефраз живёт только в DOM-боксе, в state его нет
      v = document.getElementById(el.dataset.jreph)?._rephResult || null;
      extra.fromRephrase = true;
    } else if (el.dataset.jrot !== undefined) {
      // Ротация: текста нет ни в results, ни в избранном — он живёт в state.rotResult
      // до размещения. Без этой ветки копия уходила бы в журнал обезличенной
      // (chain/product/category = null), а `copied` — главный сигнал выбора.
      const rec = state.db.find(r => r.id === +el.dataset.jrot);
      const res = state.rotResult;
      if (rec && res && res.recId === rec.id && !res.error) {
        v = { title: res.title, description: res.desc, _chain: rec._chain || null,
              _product: rec.product || null, _category: rec._category || null, _scan: res.scan };
        extra.fromRotate = res.mode;
      }
    } else if (el.dataset.jfid !== undefined) {
      v = state.favorites.find(f => f._fid === +el.dataset.jfid);
      extra.fromFav = true; // копия из избранного — не из свежего набора
    } else if (el.dataset.jvid !== undefined) {
      const vid = +el.dataset.jvid;
      v = findResult(vid);
      const pool = resultsPool();
      const pos = pool.findIndex(x => x.id === vid);
      if (pos !== -1) extra.pos = pos; // индекс варианта в наборе: побеждают первые или поздние?
      if (state.extraResults.some(x => x.id === vid)) extra.fromExtra = true; // из блока «Ещё варианты»
    } else if (el.dataset.jsess !== undefined) {
      const it = state.postSession.items[state.postSession.idx];
      v = it && it.variant; extra.region = it && it.region; extra.session = true;
    }
    jlog('copied', (v && v._chain) || null, {
      kind, category: v && v._category || null, product: v && v._product || null,
      title: v && v.title || null, titleLen: v && v.title ? [...v.title].length : null,
      scan: jScanLevel(v), ...extra,
    });
  } catch(e) { console.error('journal:', e); }
}

// Глобальная сеть безопасности: необработанные исключения тоже в журнал
window.addEventListener('error', e => {

});
document.addEventListener('visibilitychange', () => {
  try { if (document.visibilityState === 'hidden') { _jSaveBuf(); jFlush(); } } catch(e) {}
});
window.addEventListener('pagehide', () => { try { _jSaveBuf(); } catch(e) {} });

// CATALOG HELPERS
// ══════════════════════════════════════════

function getCatalogEntry(sub) {
  const c = (state.catalogs || {})[sub];
  if (!c) return { core: [], masking: [] };
  if (Array.isArray(c)) return { core: [], masking: c }; // старый формат
  return { core: Array.isArray(c.core) ? c.core : [], masking: Array.isArray(c.masking) ? c.masking : [] };
}

// Раньше отдавал один перемешанный список без различия ядро/маскировка —
// модель могла утянуть в крючок названия СЛУЧАЙНУЮ маскирующую игру (аудит Fable 5).
// Теперь ядро и маскировка возвращаются раздельно: ядро идёт в промпт как
// «единственный источник крючка», маскировка — только для тела описания.
function buildGamesLists(subType) {
  const cat = getCatalogEntry(subType);

  // Для каждой ядровой игры — рандомный вариант из списка через |
  const core = cat.core.map(line => {
    const variants = line.split('|').map(s => s.trim()).filter(Boolean);
    return variants[Math.floor(Math.random() * variants.length)] || line.trim();
  });

  // Перемешать порядок ядровых
  for (let i = core.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [core[i], core[j]] = [core[j], core[i]];
  }

  // 2–4 случайных маскирующих
  const maskCount = cat.masking.length
    ? Math.min(cat.masking.length, 2 + Math.floor(Math.random() * 3))
    : 0;
  const masking = [...cat.masking].sort(() => Math.random() - .5).slice(0, maskCount);

  return { core: core.join(', ') || null, masking: masking.join(', ') || null };
}

const SYS_HEAD = `Ты — эксперт по созданию объявлений на Авито для продажи цифровых товаров: игровых подписок (PS Plus, EA Play, Game Pass), AI-подписок (Claude Pro, ChatGPT, Google AI Pro, Cursor, Antigravity) и цифровых игр.

ПРАВИЛА НАЗВАНИЙ (макс. 50 символов с пробелами):

  Пример: "FC 26" / "FC26" / "ФИФА 26" / "фифа26" / "FIFA 26"

- Примеры ниже — только иллюстрация СТРУКТУРЫ и принципа вариации названий. Это не шаблоны и не список обязательных крючков. Для каждой игры крючок берётся из её собственных сильных сторон.
- ХОРОШИЕ примеры структуры (на базе GTA VI / PS5 — только для понимания принципа):
  ✓ "ГТА VI пс5 — самый большой открытый мир" [крючок = масштаб жанра]
  ✓ "гта6 пс5 предзаказ — Вайс-Сити ждёт" [крючок = сеттинг + предзаказ]
  ✓ "GTA VI пс5 — ждали 10 лет" [крючок = эмоция вокруг релиза]
  ✓ "ГТА 6 пс5 — Вайс-Сити, два героя, открытый мир" [крючок = ключевые фичи]
- ПЛОХИЕ примеры (ТАК НЕ ДЕЛАТЬ):
  ✗ "GTA VI пс5 — в цифре оформить" — «в цифре» и «оформить» в названии запрещены
  ✗ "GTA 6 PS5 — Rockstar, открытый мир, цифра" — «Rockstar» и «цифра» лишние слова
  ✗ "ГТА 6 — криминал, Флорида, PS5" — «криминал» отпугивает

ПРАВИЛА ОПИСАНИЙ:
- Эмодзи (⚡️✅💲🎮🚀🧠🔥) — в разных комбинациях
- Цены подавать по-разному: просто цена / цена за месяц / цена-за-месяц-при-годовом-тарифе / экономия-vs-помесячной-оплаты
- ЗАПРЕЩЕНО: сравнивать с ценой в PSN Store, PlayStation Store, официальном магазине — мы сами продаём оттуда, это бессмыслица
- Структуру менять:

  * цена → что получишь → фичи (только для подписок)
