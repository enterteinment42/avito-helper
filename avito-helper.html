  * эмоция/метафора → содержимое

ДЛЯ КАТЕГОРИИ «ИГРА» — особые правила:
- НОЛЬ упоминаний цены в описании — ни суммы, ни ₽, ни «рублей», ни «стоит», ни «за X руб». На Авито есть отдельное поле цены — клиент её видит там. ЗАПРЕЩЕНО: «оформить за 7500», «цена 7500 рублей», «всего 3000₽». РАЗРЕШЕНО (без суммы): «Цена зафиксирована», «стоимость не изменится»
- Минимум 3 живых предложения о сюжете и геймплее — о чём игра, что происходит, что делает игрок. Не тезисы и не буллеты, а связный текст который цепляет
- После этого — короткие практические детали (платформа, «оформляется в цифре»)
- Тон варьировать: дерзкий/молодёжный, деловой, восторженный, минималистичный
- AI-подписки: конкретные инструменты и юзкейсы, не абстрактно
- Пиши грамотно и точно, но без официоза
- Звучи как живой человек, не рекламный робот
- Не копируй структуру эталонных примеров — переосмысли своими словами
- Разговорный язык в меру: «зайдёт», «затянет», «годнота» — нормально, но не перебарщивай
- Градус эмоции под товар: крутая игра — живее, рядовая позиция — спокойнее и по делу, без натянутого восторга
- Длина по смыслу: не растягивай ради объёма

ЗАПРЕЩЁННЫЕ СЛОВА И ФРАЗЫ:
- Штампы: «захватывающее приключение», «невероятный мир», «погрузитесь», «откройте для себя», «must-have», «незабываемые эмоции», «легендарное», «эпическое», «та самая», «тот самый», «то самое»
- Рекламный пафос: «уникальный», «революционный», «невероятный», «потрясающий», «лучший в своём роде»
- Англицизмы-жаргон: «контент», «хайп», «тренд», «виб», «кринж», «скилл», «лор» — заменяй русскими аналогами`;

// Запреты, которыми категория управляет теми же галочками, что и Сканером
// (см. SCAN_RULES). Иначе для физического товара Сканер разрешал бы «купить»,
// а модель всё равно писала бы «оформляешь» — рассинхрон уровня F19.
const SYS_BANS = [
  { rule: 'payment',     text: '- Слова оплаты: «платишь», «оплатишь», «оплата», «стоит», «купишь», «покупаешь» — ЗАПРЕЩЕНО. Вместо этого всегда используй «оформляешь», «оформить», «оформляется» (юридический момент)' },
  // Хвост про «оформляешь» уместен только там, где слова оплаты запрещены.
  // В категории, где «купить» разрешено (физтовар), он бы противоречил её же
  // правилу «НЕ используй „оформляется“» — модель получала бы два указания разом.
  { rule: 'price_label', text: cat => '- Слово «цена» как ценник: «цена — 7500», «цена: 7500 руб» — ЗАПРЕЩЕНО. Допустимо только в контексте фиксации: «цена не изменится», «цена зафиксирована». Для указания суммы пиши '
      + (cat == null || scanRuleOn(cat, 'payment') ? '«оформляешь за X руб» или просто «X руб»' : 'просто «X руб»') },
  { rule: 'gift',        text: '- «В подарок», «подарок», «в качестве подарка» — ЗАПРЕЩЕНО в любом контексте' },
  { rule: 'selling_word', text: '- «Продаю», «продам», «продаётся» — ЗАПРЕЩЕНО и в названии, и в описании. Так начинает половина Авито, объявление сразу теряется. Начинай с самого товара, выгоды или живой детали' },
  { rule: 'account',     text: '- «Аккаунт», «учётная запись», «учетная запись», «профиль» — КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО. Авито банит объявления за продажу аккаунтов — это запрещённая категория товаров. Любое упоминание этих слов может привести к блокировке. Правильная нейтральная формулировка — «оформляется в цифре». НЕ пиши «оформляется в цифре на ваш аккаунт» — только «оформляется в цифре», без уточнений.' },
];

const SYS_TAIL = `

ФОРМАТ ОТВЕТА — строго JSON без markdown-обёртки:
{
  "variants": [
    {
      "id": 1,
      "title": "название до 50 символов",
      "title_length": число,
      "description": "полное описание",
      "style": "дерзкий|деловой|восторженный|минимальный",
      "price_format": "помесячная|общая|цена-за-месяц|экономия-vs-помесячной",
      "hook": "что вынесено в крючок",
      "structure": "боль→решение|цена→фичи|список→преимущества|эмоция→содержимое"
    }
  ]
}

ВАЖНО: только JSON в ответе. Названия строго ≤50 символов. Описания реально разные по структуре.`;

// Системный промпт под конкретную категорию: запреты из SYS_BANS попадают в него
// только там, где включено соответствующее правило. Без категории (или для той,
// где всё включено) получается ровно прежний текст — это проверяется паритетом.
function buildSys(category) {
  // Своё правило категории сюда НЕ дописывается: оно уже уходит в пользовательском
  // сообщении через catInfoBlock (c.extra) — иначе текст задваивался бы.
  const bans = SYS_BANS
    .filter(b => category == null || scanRuleOn(category, b.rule))
    .map(b => typeof b.text === 'function' ? b.text(category) : b.text);
  return SYS_HEAD + (bans.length ? '\n' + bans.join('\n') : '') + SYS_TAIL;
}

// ══════════════════════════════════════════
// AI CALL
// ══════════════════════════════════════════

// Админ-токен для прокси /api/claude и /api/openrouter — бэкенд теперь требует
// Authorization (SEC-1). Спрашивается один раз, хранится в localStorage.
function getProxyToken() {
  let t = localStorage.getItem('avito_admin_token') || '';
  if (!t) {
    t = (prompt('Введите админ-токен (тот же, что в админке магазина Поиграем):') || '').trim();
    if (t) localStorage.setItem('avito_admin_token', t);
  }
  return t;
}

// Обрыв по лимиту достижим не только в генерации объявлений: распознавание по фото
// и поиск цены идут с размышлением, а оно тратится из того же бюджета. Совет
// «уменьшите число вариантов» указывал бы там на органы управления, которых в той
// карточке нет, — конкретную подсказку даёт вызывающий, общий текст по умолчанию.
function truncMsg(opts) {
  return 'Ответ модели не уместился в лимит' + (opts.truncHint ? ` — ${opts.truncHint}` : '. Повторите запрос.');
}

async function callAI(messages, opts = {}) {
  const provider = opts.provider || state.settings.provider;
  const model    = opts.model    || state.settings.model;
  // 0.8 вместо дефолтного 1.0 — для 50-символьного названия высокая температура
  // чаще давала не крючок, а случайный набор слов (аудит Fable 5). 0.8 всё ещё
  // даёт разнообразие, нужное для антидубля между вариантами/регионами.
  const temperature = opts.temperature ?? 0.8;
  // opts.system — задача не про генерацию объявления (напр. распознавание товара по фото):
  // общий SYS с правилами Авито там только мешает, и пользовательский customSys к ней не относится.
  // opts.category — под какую категорию собирать запреты (см. buildSys). Не передали —
  // собирается прежний полный набор, то есть путь без категории деградирует безопасно.
  const sys = buildSys(opts.category);
  const system = opts.system || (state.settings.customSys ? sys + '\n\n' + state.settings.customSys : sys);

  if (provider === 'claude') {
    const caps = modelCaps(model);
    const body = { model, max_tokens: opts.max_tokens || 4000, system, messages };
    // temperature только там, где она вообще принимается: на моделях 5-го поколения
    // её присутствие — это 400, а не «проигнорируют».
    if (caps.sampling) body.temperature = temperature;
    // Размышление просим точечно (сейчас — распознавание по фото и поиск цены):
    // там модель должна подумать, а не выпалить первое впечатление.
    if (opts.thinking && caps.thinking === 'adaptive') body.thinking = { type: 'adaptive' };
    if (opts.webSearch) body.tools = [{ type: caps.webSearch, name: 'web_search' }];
    const r = await fetch(PROXY_CLAUDE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      // F13: неверный токен иначе сохранён навсегда — сбрасываем, чтобы следующий запрос переспросил
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`Claude ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    const out = d.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
    // Обрыв по лимиту приходит как обычный 200 с недописанным текстом. Без этой
    // проверки он всплывал позже загадочной ошибкой разбора JSON, а настоящая
    // причина («не поместилось») нигде не называлась.
    if (d.stop_reason === 'max_tokens') {
      if (!out.trim()) throw new Error(truncMsg(opts));
      opts.onTruncated?.('max_tokens');
    }
    return out;
  }

  if (provider === 'openrouter') {
    if (opts.webSearch) toast('⚠️ OpenRouter не поддерживает веб-поиск бонусов предзаказа — переключитесь на Claude для точных данных');
    const orModel = opts.orModel || state.settings.orModel;
    const r = await fetch(PROXY_OPENROUTER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify({
        model: orModel, max_tokens: opts.max_tokens || 4000, temperature,
        messages: [{ role: 'system', content: system }, ...messages],
      }),
    });
    if (!r.ok) {
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`OpenRouter ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    const out = d.choices?.[0]?.message?.content || '';
    if (d.choices?.[0]?.finish_reason === 'length') { // у OpenRouter обрыв по лимиту зовётся так
      if (!out.trim()) throw new Error(truncMsg(opts));
      opts.onTruncated?.('max_tokens');
    }
    return out;
  }

  throw new Error('Неизвестный провайдер: ' + provider);
}

// Достаёт JSON из ответа модели, даже если он обёрнут пояснительным текстом.
// Веб-поиск бонусов предзаказа часто добавляет прозу до/после JSON — F3.
function extractJSON(text) {
  const raw = (text || '').trim();
  const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) return fence[1].trim();
  const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
  return (first !== -1 && last > first) ? raw.slice(first, last + 1) : raw;
}

// Сколько выхода просить под N вариантов объявления. Фиксированные 4000 обрывали
// генерацию в середине 2-3 варианта: описания выросли после перехода few-shot на
// полные эталоны (до 1720 знаков — модель подражает длине образцов), а extractJSON
// потом срезал недописанный хвост по последней «}», и наружу выходила загадочная
// ошибка JSON вместо честного «не поместилось». Лимит — только верхняя граница,
// платим за фактический выход, поэтому берём с запасом. Потолок 8000 — чтобы
// запрос приняла и модель со скромным пределом выхода.
function genTokens(n) { return Math.min(8000, 1000 + (Number(n) || 3) * 1600); }

// Бюджет шага «сначала заголовки» — своя формула: заголовков просят до 12, каждый
// с крючком, и прежние фиксированные 1400 обрывали ответ на полуслове («Unexpected
// end of JSON input» у игр). При веб-поиске бюджет вдобавок делится с tool-use
// блоками, которые модель генерирует до финального текста (F5).
function titleTokens(n, webSearch) {
  return Math.min(8000, 600 + (Number(n) || 8) * 220 + (webSearch ? 1200 : 0));
}

// Разбор ответа со списком заголовков — терпимый к обрыву, как parseVariants:
// из недописанного JSON берём заголовки, которые модель успела закрыть.
function parseTitles(text) {
  let list = null;
  try {
    list = JSON.parse(extractJSON(text))?.titles;
  } catch(e) {
    list = salvageArray(text, 'titles');
  }
  if (!Array.isArray(list)) return [];
  return list
    .map(t => ({ title: String(t?.title || ''), hook: String(t?.hook || '') }))
    .filter(t => t.title);
}

// Спасение целых вариантов из оборванного ответа. Идём по массиву variants
// вручную, следя за строками и экранированием, и парсим каждый объект отдельно:
// недописанный последний просто не распарсится и будет пропущен. Генерация
// платная — терять весь ответ из-за хвоста, который модель не успела дописать,
// неправильно; заодно страхует от обрыва по любой будущей причине.
function salvageVariants(text) { return salvageArray(text, 'variants'); }

function salvageArray(text, field) {
  const raw = extractJSON(text);
  const key = raw.indexOf(`"${field}"`);
  if (key === -1) return [];
  const start = raw.indexOf('[', key);
  if (start === -1) return [];
  const out = [];
  let depth = 0, from = -1, inStr = false, esc = false;
  for (let i = start + 1; i < raw.length; i++) {
    const ch = raw[i];
    if (inStr) {
      if (esc) esc = false;
      else if (ch === '\\') esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { inStr = true; continue; }
    if (ch === '{') { if (depth === 0) from = i; depth++; continue; }
    if (ch === '}') {
      depth--;
      if (depth <= 0) {
        if (from !== -1) { try { out.push(JSON.parse(raw.slice(from, i + 1))); } catch(e) {} }
        from = -1;
        if (depth < 0) break; // закрылся внешний объект — массив кончился
      }
      continue;
    }
    if (ch === ']' && depth === 0) break;
  }
  return out;
}

function parseVariants(text) {
  let data = null;
  try {
    data = JSON.parse(extractJSON(text));
  } catch(e) {
    // Ответ оборван или испорчен — берём то, что модель успела дописать целиком.
    const saved = salvageVariants(text);
    if (!saved.length) throw new Error('Ответ модели оборван — не удалось разобрать ни одного варианта. Повторите генерацию.');
    // _srcId — номер, который дала сама модель. Дыра в спасённом наборе бывает и
    // в СЕРЕДИНЕ (испорчен второй вариант, третий цел), а воронка заголовков
    // раскладывает выбранные названия по порядку — по индексу она приклеила бы
    // название №2 к описанию №3. Сквозной id перенумеровываем как обычно (на нём
    // держатся действия карточек), исходный сохраняем отдельно.
    const list = saved.map((v, i) => ({ ...v, _srcId: v.id, id: i + 1 }));
    list._salvaged = true; // вызывающий предупредит, что набор неполный
    return list;
  }
  if (!Array.isArray(data?.variants)) throw new Error('Нет поля variants в ответе');
  return data.variants.map((v, i) => ({ ...v, id: i + 1 }));
}

// Данные о товаре без стиля/количества/few-shot — общий блок,
// переиспользуется и полной генерацией, и шагом «сначала заголовки».
function catInfoBlock(f) {
  const c = catDef(f.category);
  const lines = [`Категория: ${c.pName || c.label}`];
  for (const fd of c.fields) {
    if (!FIELD_TYPES.includes(fd.type)) continue; // поля нет в форме — не должно быть и в промпте
    if (fd.pRender) { const s = fd.pRender(f); if (s) lines.push(s); continue; }
    if (!fd.p) continue; // поле не для промпта (цена игры, тумблеры)
    const v = fieldVal(f, fd);
    // Тумблер без своего pRender: «Торг: false» в промпте — мусор, который модель
    // примет за данные. Выключенный тумблер молчит, включённый называет себя.
    if (fd.type === 'toggle') { if (v) lines.push(`${fd.p}: да`); continue; }
    // Значение select, которого больше нет в списке (опцию убрали в редакторе),
    // в промпт не отправляем: форма про него уже сказала «нет в списке», и уходить
    // в модель оно не должно — ровно то, что обещает предупреждение в форме.
    if (fd.type === 'select' && !selectValueOk(fd, v)) {
      if (fd.pEmpty) lines.push(`${fd.p}: ${fd.pEmpty}`);
      continue;
    }
    const txt = fd.type === 'chips' ? v.join(', ') : String(v);
    lines.push(`${fd.p}: ${txt || fd.pEmpty || txt}${fd.pSuffix || ''}`);
  }
  return lines.join('\n') + (c.extra ? c.extra(f) : '');
}

function styleLabel(f) {
  return f.style === 'custom'
    ? (f.customStyle.trim() || 'на своё усмотрение')
    : (STYLES.find(s => s.id === f.style)?.label || f.style);
}

// Пул образцов языка продавца: избранное (★) плюс эталоны, написанные руками
// (карточка «📥 Эталоны», пометка ✍ моё). Чужие удачные объявления (👀) в промпт
// НЕ идут — они собираются для разбора, копировать чужой текст незачем.
function fewShotSamples(category) {
  // Финальные тексты с Авито — самый сильный образец голоса: вариант из избранного
  // написала модель и человек его одобрил, а финал он ДОРАБОТАЛ СВОЕЙ РУКОЙ уже в
  // форме Авито. Берём только реально изменённые: диалог финала подставляет
  // бот-версию, если поле описания оставили пустым (fd = fdRaw || r.description),
  // и такой «финал» ничего нового о голосе не говорит.
  const fromFinal = (state.db || [])
    .filter(r => r.finalDesc && r.finalDesc !== r.description)
    .map(r => ({
      title: r.finalTitle || r.title || '', desc: r.finalDesc, cat: r._category || null,
      final: true, chain: r._chain || null,
    }));
  // Обычный путь такой: ☆ на варианте → «✓ Размещено» → донос финала. Тогда в
  // корпусе лежат ДВА текста одного объявления, отличающиеся на несколько слов, и
  // второй слот доставался бы бот-близнецу финала (у него почти те же слова, значит
  // и близость максимальная). В промпт уходили бы два почти одинаковых примера —
  // ровно подталкивание к самоповтору, против которого весь этот отбор и написан.
  const finalChains = new Set(fromFinal.map(x => x.chain).filter(Boolean));
  const fromFav = (state.favorites || [])
    .filter(v => v.title && v.description && !(v._chain && finalChains.has(v._chain)))
    .map(v => ({ title: v.title, desc: v.description, cat: v._category }));
  const fromRefs = (state.refs || [])
    .filter(r => r.source === 'mine' && (r.title || r.desc))
    .map(r => ({ title: r.title || '', desc: r.desc || '', cat: r.category }));
  const all = [...fromFinal, ...fromFav, ...fromRefs];
  const own = all.filter(x => x.cat === category);
  // Своя категория в приоритете: факты и правила («оформляется в цифре», запрет
  // цены в тексте) у каждой свои, и переносить их нельзя. Своих нет — берём чужие
  // с пометкой. А ГОЛОС категории не принадлежит: он у продавца один на всё, и для
  // него ниже есть отдельный слот (voicePick) — см. fewShotBlock.
  return own.length
    ? { list: own, own: true, all }
    : { list: all.filter(x => x.cat && x.cat !== category), own: false, all };
}

const FEWSHOT_N    = 3;    // примеров описаний своей категории
const FEWSHOT_MAX  = 1800; // потолок длины примера (самый длинный эталон Дениса — 1720)
const TITLES_N     = 12;   // заголовков в блоке названий

// Слова для сравнения. Режем до 6 символов — грубая замена морфологии: «геймпад»
// и «геймпады», «консоль» и «консоли» должны считаться одним словом, иначе
// совпадение теряется на ровном месте.
function fewShotTokens(s) {
  return (String(s || '').toLowerCase().match(/[a-zа-яё0-9]{3,}/g) || []).map(w => w.slice(0, 6));
}

// Вес слова — по его редкости в СОБСТВЕННОМ корпусе эталонов. «ps5» и «пс4» стоят
// почти в каждом объявлении Дениса и потому не отличают одно от другого, а «pro»,
// «слим», «станция», «роутер» отличают. Без весов на «PS5 Pro» побеждал эталон про
// диск с игрой (совпало «ps5»), а четыре объявления про приставки с комплектом —
// Xbox Series X/S и две про Пс4 — получали ноль, хотя это ровно тот же тип
// объявления. Ничего вести руками не нужно: веса пересчитываются по корпусу и
// сами подстраиваются, когда эталонов становится больше.
function fewShotIdf(list) {
  const df = new Map();
  for (const s of list) {
    for (const w of new Set(fewShotTokens((s.title || '') + ' ' + (s.desc || '')))) {
      df.set(w, (df.get(w) || 0) + 1);
    }
  }
  const n = list.length || 1;
  // +0.05 — чтобы совсем всеобщее слово весило мало, но не ноль: иначе запрос из
  // одних частых слов дал бы деление на ноль и «все одинаково близкие».
  return w => Math.log((n + 1) / ((df.get(w) || 0) + 1)) + 0.05;
}

// Запрос для сравнения — не только название товара. «PS5 Pro» это два слова, и
// сигнала в них мало; а в форме уже заполнены состояние и комплектация
// («приставка, два геймпада, коробка»), по которым консоль и находит консоль,
// даже если платформа другая. Цены, сроки и тумблеры не берём: они про сделку,
// а не про то, что за предмет продаётся.
const FEWSHOT_Q_FIELD = 200, FEWSHOT_Q_MAX = 600;
function fewShotQuery(f) {
  const parts = [];
  for (const fd of catDef(f.category).fields) {
    if (!['text', 'area', 'select', 'chips'].includes(fd.type)) continue;
    const v = fieldVal(f, fd);
    const s = (Array.isArray(v) ? v.join(' ') : String(v ?? '')).trim();
    if (s) parts.push(s.slice(0, FEWSHOT_Q_FIELD));
  }
  return parts.join(' ').slice(0, FEWSHOT_Q_MAX);
}

// Доля веса слов запроса, нашедшихся в образце.
function fewShotScore(sample, qTokens, idf) {
  if (!qTokens.length) return 0;
  const hay = new Set(fewShotTokens((sample.title || '') + ' ' + (sample.desc || '')));
  let hit = 0, total = 0;
  for (const w of qTokens) { const wt = idf(w); total += wt; if (hay.has(w)) hit += wt; }
  return total ? hit / total : 0;
}

// Отбор гибридный: один самый близкий к товару + остальные жребием. Чистая
// близость выдавала бы по частому товару вечно одни и те же два эталона, модель
// начала бы их пересказывать — и мы получили бы повтор СВОЕГО текста, то есть
// ровно тот дубль, за который Авито снимает объявления.
function fewShotPicks(list, query, n, idf) {
  const rest = [...list];
  const picks = [];
  const qTokens = [...new Set(fewShotTokens(query))];
  // Ближайший по смыслу среди отобранных фильтром (или среди всех, если фильтр
  // ничего не оставил): вынесено в функцию, потому что нужно дважды — сперва для
  // финала, потом для обычного образца.
  // anyway=true — взять лучшего даже при нулевой близости (жребием среди равных).
  // Для обычных образцов так делать нельзя: при нулевой близости «лучшим» всегда
  // оказывался бы первый по порядку, и выборка перестала бы меняться.
  const takeBest = (pred, anyway) => {
    const idx = [];
    let best = 0;
    rest.forEach((s, i) => {
      if (pred && !pred(s)) return;
      const sc = fewShotScore(s, qTokens, idf);
      if (sc > best) { best = sc; idx.length = 0; idx.push(i); }
      else if (anyway && sc === best) idx.push(i);
    });
    if (!idx.length) return;
    const pick = idx.length > 1 ? idx[Math.floor(Math.random() * idx.length)] : idx[0];
    picks.push(rest.splice(pick, 1)[0]);
  };
  // Финал с Авито — текст, доведённый рукой человека, и слот под него резервируется.
  // Но только начиная с ДВУХ финалов: единственный занимал бы слот в каждой генерации
  // категории — и в том товаре, по которому его правили, и во всех соседних. Модель
  // видела бы один текст десятки раз под шапкой «эталон голоса» и начала бы
  // воспроизводить его обороты, а повтор собственного текста Авито считает дублем.
  // Одиночный финал не пропадает: по близости он почти всегда выигрывает якорный слот
  // там, где уместен, — в генерации того же товара.
  if (rest.filter(s => s.final).length >= 2) takeBest(s => s.final, true);
  takeBest(null, false);
  rest.sort(() => Math.random() - .5);
  while (picks.length < n && rest.length) picks.push(rest.shift());
  return picks;
}

// Слоты голоса. Голос — свойство человека, а не категории: то, как Денис пишет про
// Xbox Series X, узнаётся и в объявлении о подписке. Раньше примеры из другой
// категории подмешивались только когда своих не было совсем — то есть при 68
// эталонах по подпискам голос из физтовара не попадал в промпт никогда.
const sampleKey = x => (x.title || '') + '|' + (x.desc || '');
const freeSamples = (all, taken) => {
  const used = new Set(taken.filter(Boolean).map(sampleKey));
  return all.filter(x => x.cat && !used.has(sampleKey(x)));
};
const rnd = list => list.length ? list[Math.floor(Math.random() * list.length)] : null;

// Слот A — гарантированно из ДРУГОЙ категории: переток голоса не должен зависеть от
// жребия. Категория выбирается равновероятно, а не пропорционально числу объявлений:
// подписки занимают 61% корпуса, и при взвешивании по объявлениям в генерации игры
// они приезжали бы в 8 случаях из 10, таща за собой свой жанр — ценовую лесенку и
// длинные перечни. Голос нужен, жанр — нет.
function voicePickOther(all, category, taken) {
  const other = freeSamples(all, taken).filter(x => x.cat !== category);
  if (!other.length) return null;
  // Категорию тянем ОДИН раз и только потом фильтруем. Вызов жребия прямо в условии
  // filter пересчитывал бы его на каждом объявлении, и отбор снова стал бы
  // пропорциональным размеру категории — ровно то, от чего здесь уходим.
  const cat = rnd([...new Set(other.map(x => x.cat))]);
  return rnd(other.filter(x => x.cat === cat));
}

// Слот B — добор голоса жребием по всему корпусу, включая свою категорию. Ведёт себя
// по-разному сам, без порогов: где своего сырья много (подписки — 68 из 111), чаще
// достаётся свой, и голоса в промпте становится больше; где мало (AI-подписки — 9),
// чаще чужой, и он разбавляет узкую лужу, из которой иначе одни и те же тексты
// уходили бы в каждый запрос.
function voicePickAny(all, taken) {
  return rnd(freeSamples(all, taken));
}

// Цены в примере из другой категории. Подписки у Дениса расписаны лесенкой
// («💲12 месяцев — 3000»), а в играх и физтоваре цена в тексте запрещена (правило
// game_price) — Сканер ловит её как 🔴. Общий запрет лежит в системном промпте, но
// рядом с самим образцом он работает сильнее: модель видит картинку и тут же —
// почему эту её часть копировать нельзя.
const FEWSHOT_PRICE_RE = /\d[\d\s]*₽|\d+\s*руб|\d+\s*рублей/i;
function fewShotPriceWarn(samples, category) {
  if (!scanRuleOn(category, 'game_price')) return '';
  if (!samples.filter(Boolean).some(s => FEWSHOT_PRICE_RE.test(s.desc || ''))) return '';
  return '\n⚠️ В примере выше есть цены — это нормально для ЕГО категории, но в ТВОЁМ объявлении цена в тексте ЗАПРЕЩЕНА. Перенимай манеру, цены не переноси ни в каком виде.';
}

// Чужие удачные объявления (👀) не идут в промпт текстом: у них своя
// комплектация, свой город и свои цены, и модель тащила бы эти факты в наше
// объявление как правду. Вместо текста подмешиваются ПРИЁМЫ — то, что из
// чужого объявления вытащено разбором (кнопка «🔎 Разобрать приёмы»).
function refTricksBlock(category) {
  const withTricks = (state.refs || []).filter(r => r.source === 'other' && Array.isArray(r.tricks) && r.tricks.length);
  if (!withTricks.length) return '';
  const own = withTricks.filter(r => r.category === category);
  const pool = own.length ? own : withTricks;
  const tricks = [...new Set(pool.flatMap(r => r.tricks).map(s => String(s).trim()).filter(Boolean))];
  if (!tricks.length) return '';
  const picks = [...tricks].sort(() => Math.random() - .5).slice(0, 4);
  return `\n\nПриёмы, которые работают у других продавцов (разобраны из удачных чужих объявлений — это ходы, а не текст; ни одной чужой фразы дословно):\n${picks.map(s => `- ${s}`).join('\n')}`;
}

// Few-shot: примеры показываются ЦЕЛИКОМ. Обрезка по 220 знаков давала модели
// только зачин — как продавец подаёт цены и чем закрывает объявление, она не
// видела, хотя это и есть самое ценное в накопленных эталонах. Переносы строк
// тоже сохраняем: оформление списка (запятыми / с новой строки / через тире) —
// одна из осей вариации, схлопывать её в строку значит прятать её от модели.
function fewShotBlock(f) {
  const category = f.category;
  const { list, own, all } = fewShotSamples(category);
  if (!list.length) return '';
  const idf = fewShotIdf(all);
  const picks = fewShotPicks(list, fewShotQuery(f), FEWSHOT_N, idf);
  const render = (v, i) => {
    const d = v.desc.length > FEWSHOT_MAX
      ? v.desc.slice(0, FEWSHOT_MAX).trim() + '\n[…конец объявления обрезан по длине…]'
      : v.desc;
    // Финал помечаем прямо в подписи: это не «одобренный вариант», а текст, который
    // человек довёл своей рукой перед публикацией — самый точный слепок голоса
    const mark = v.final ? ' (ФИНАЛЬНЫЙ текст — так продавец дошлифовал его перед публикацией, это эталон голоса)' : '';
    return `${v.title ? `Пример ${i} — «${v.title}»${mark}:` : `Пример ${i}${mark}:`}\n${d}`;
  };
  // Слоты голоса нужны только когда основные примеры уже свои: в ветке перетока
  // они и так из другой категории, второй такой же блок был бы дублем.
  const voiceOther = own ? voicePickOther(all, category, picks) : null;
  const voiceAny   = own ? voicePickAny(all, [...picks, voiceOther]) : null;
  // Слот B мог достаться своей категории — тогда он не «другой товар», а просто
  // ещё один свой пример, и место ему в основном блоке.
  const mine = [...picks, ...(voiceAny && voiceAny.cat === category ? [voiceAny] : [])];
  const alien = [voiceOther, ...(voiceAny && voiceAny.cat !== category ? [voiceAny] : [])].filter(Boolean);

  let n = 0;
  const lines = mine.map(v => render(v, ++n)).join('\n\n');
  const head = own
    ? `\n\nПримеры твоих же удачных объявлений этой категории (ориентируйся на характер, ритм и структуру, НЕ копируй дословно — повтор собственного текста Авито считает дублем):\n${lines}`
    : `\n\nПримеры твоих объявлений ИЗ ДРУГОЙ КАТЕГОРИИ товара (своих по этой пока нет). Перенимай ТОЛЬКО тон, ритм и структуру. НЕ переноси оттуда формулировки и правила: у каждой категории они свои.\n${lines}`;
  if (!alien.length) return head + fewShotPriceWarn(own ? [] : mine, category);
  const alienLines = alien.map(v => render(v, ++n)).join('\n\n');
  return `${head}\n\nЭто тоже ты, но ДРУГОЙ товар — перенимай голос и манеру, а факты, комплектацию и правила оттуда НЕ переноси:\n${alienLines}${fewShotPriceWarn(alien, category)}`;
}

// Заголовки — отдельная задача: 50 знаков, свой ритм, свои сокращения. На ней
// куски описаний почти бесполезны, а настоящих названий у продавца накоплена
// сотня. Показываем их списком с длиной каждого: модель видит и манеру, и то,
// что лимит принято добирать, а не останавливаться на 30 знаках.
function titleSamplesBlock(f) {
  // Заголовки, поправленные рукой уже в форме Авито, — самый прямой ответ на
  // «модель не добирает лимит и хватается за состояние»: это буквально показ
  // того, как человек переписал сгенерированное название перед публикацией.
  const fromFinal = (state.db || [])
    .filter(r => r.finalTitle && r.finalTitle !== r.title)
    .map(r => ({ t: r.finalTitle, cat: r._category || null }));
  const pool = [
    ...fromFinal,
    ...(state.favorites || []).filter(v => v.title).map(v => ({ t: v.title, cat: v._category })),
    ...(state.refs || []).filter(r => r.source === 'mine' && r.title).map(r => ({ t: r.title, cat: r.category })),
  ];
  const own = pool.filter(x => x.cat === f.category);
  const list = own.length ? own : pool;
  const uniq = [...new Set(list.map(x => String(x.t).trim()).filter(Boolean))];
  if (!uniq.length) return '';
  // Правленые рукой идут первыми и не вытесняются жребием — их единицы против
  // сотни сгенерированных, иначе они тонули бы в выборке.
  const handMade = new Set(fromFinal.filter(x => list.includes(x)).map(x => String(x.t).trim()));
  const hand = uniq.filter(s => handMade.has(s));
  const restPicks = uniq.filter(s => !handMade.has(s)).sort(() => Math.random() - .5);
  const picks = [...hand, ...restPicks].slice(0, TITLES_N);
  return `\n\nТвои НАСТОЯЩИЕ заголовки${own.length ? ' этой категории' : ' (из другой категории товара — перенимай только манеру)'} — так ты пишешь сам (в скобках длина, лимит 50):\n${picks.map(s => `- ${s} (${s.length})`).join('\n')}\nНЕ копируй их дословно: повтор собственного заголовка Авито считает дублем. Перенимай манеру — какие слова сокращаешь, куда ставишь платформу, чем цепляешь.`;
}

// Всё, что подмешивается к промпту из накопленного: свои образцы описаний,
// свои заголовки и приёмы, разобранные из чужих объявлений.
function learnedBlock(f) {
  return fewShotBlock(f) + titleSamplesBlock(f) + refTricksBlock(f.category);
}

function buildMsg(overrideCount, excludeTitles = [], formOverride = null) {
  const f = formOverride || state.form;
  const count = overrideCount ?? f.count;
  const excl = excludeTitles.length ? `\nИсключить названия (уже есть): ${excludeTitles.join('; ')}` : '';
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}
Стиль: ${styleLabel(f)}
Вариантов: ${count}${excl}${notes}${learnedBlock(f)}`;
}

// ══════════════════════════════════════════
// HANDLERS
// ══════════════════════════════════════════

// Проверяет заполненность обязательных полей формы. Возвращает список того, чего не хватает.
function validateForm(f = state.form) {
  const miss = [];
  for (const fd of catDef(f.category).fields) {
    // Поле неизвестного типа форма не рисует — требовать его нельзя, иначе
    // «Заполните: …» указывает на то, чего на экране нет (находка код-ревью этапа 1)
    if (!FIELD_TYPES.includes(fd.type)) continue;
    if (fd.reqCheck) { const s = fd.reqCheck(f); if (s) miss.push(s); continue; }
    if (!fd.req) continue;
    const v = fieldVal(f, fd);
    // Значение select вне списка равносильно незаполненному: в промпт оно не идёт
    // (см. catInfoBlock), поэтому и генерацию с ним запускать нельзя
    const empty = fd.type === 'chips' ? !v.length
      : fd.type === 'select' ? !selectValueOk(fd, v) || !String(v).trim()
      : !String(v).trim();
    if (empty) miss.push(fd.req);
  }
  return miss;
}

// UX-15: «Ещё варианты» живут отдельно от основного набора — эти хелперы
// ищут/мутируют вариант в обоих списках сразу, чтобы карточка вела себя одинаково в обоих местах
function resultsPool() { return [...state.results, ...state.extraResults]; }
function findResult(id) { return state.results.find(r => r.id === id) || state.extraResults.find(r => r.id === id); }
function findResultRef(id) {
  let idx = state.results.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.results, idx };
  idx = state.extraResults.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.extraResults, idx };
  return { arr: null, idx: -1 };
}

// Набор оказался неполным (ответ оборвался, часть вариантов спасена) — говорим
// об этом вслух: молча отдать 2 варианта вместо 3 значит соврать про размер набора.
function warnIfPartial(list, want, truncated) {
  // _salvaged значит лишь «строгий разбор не прошёл» — набор при этом мог прийти
  // целиком (например, модель дописала прозу с «}» после JSON, и extractJSON
  // захватил её). Предупреждаем только когда вариантов реально меньше заказанного.
  if (!want || list.length >= want) return;
  if (!list._salvaged && !truncated) return;
  toast(`⚠️ Ответ модели оборвался — получено ${list.length} из ${want}. Остальные догенерируйте отдельно.`);
}

async function doGenerate() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  if (state.batchMode && !state.batchRegions.length) { toast('Пакетный режим включён — выберите хотя бы один регион'); return; }
  if (state.batchMode && state.batchRegions.length) { doBatchGenerate(); return; }
  state.loading = true; state.error = null; state.loadingKind = null;
  state.batchResults = []; state.titleStep = null; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: одна генерация и вся её судьба — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    let truncated = false;
    // Кнопки количества во время генерации не заблокированы: сколько вариантов
    // заказывали, надо запомнить ДО await, иначе предупреждение сравнит с числом,
    // которое человек переключил уже после отправки запроса.
    const want = state.form.count;
    const text = await callAI([{ role: 'user', content: buildMsg() }], {
      webSearch, category: state.form.category,
      max_tokens: genTokens(want), onTruncated: () => { truncated = true; },
      truncHint: 'уменьшите число вариантов или длину доп. указаний',
    });
    state.results = parseVariants(text);
    warnIfPartial(state.results, want, truncated);
    // F4: снимок формы + штамп товара/категории на каждый вариант — чтобы действия
    // карточки (Размещено/Сканер/Экспорт/↻×5) не читали форму, переключённую позже
    state.resultsForm = JSON.parse(JSON.stringify(state.form));
    state.results.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    save();
    jlog('generated', jChain, {
      path: 'main', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      style: state.form.style, notes: state.form.notes || '', webSearch,
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
      ...(truncated ? { truncated: true } : {}), // обрыв по лимиту — видно при разборе журнала
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_main', message: String(e.message || '').slice(0, 300), latencyMs: Date.now() - jT0 });
  } finally {
    state.loading = false;
    refreshResults();
  }
}

// UX-15: «➕ Ещё варианты» — дописывает в отдельный список, НЕ трогая основной набор
// (в отличие от doGenerate/doRegen, которые заменяют state.results целиком)
async function doGenerateMore() {
  if (state.loading || state.extraLoading || !state.results.length) return;
  state.extraLoading = true;
  refreshResults();
  const jChain = state.results[0]?._chain || ('gen-' + Date.now()); // журнал: «ещё» — та же цепочка, что основной набор
  const jT0 = Date.now();
  try {
    const snapForm = state.resultsForm || state.form; // F4: та же форма, что породила основной набор
    const excl = resultsPool().map(v => v.title);
    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    let truncated = false;
    const want = snapForm.count; // до await: снимка может не быть, и тогда это живая форма
    const text = await callAI([{ role: 'user', content: buildMsg(want, excl, snapForm) }], {
      webSearch, category: snapForm.category,
      max_tokens: genTokens(want), onTruncated: () => { truncated = true; },
    });
    const fresh = parseVariants(text);
    if (!fresh.length) throw new Error('AI не вернул варианты');
    warnIfPartial(fresh, want, truncated);
    const product  = state.results[0]?._product  || currentProductName(snapForm);
    const category = state.results[0]?._category || snapForm.category;
    // Bug #11: parseVariants нумерует ответ заново с 1, поэтому «Ещё варианты»
    // получали те же id, что и основной набор, а findResult()/findResultRef()
    // ищут сначала в state.results — все действия карточки (↻, ☆, 🔎, 🔍, ✓ Размещено)
    // молча применялись к ОДНОИМЁННОЙ карточке основного набора. Нумеруем дальше пула.
    let nextId = resultsPool().reduce((m, v) => Math.max(m, v.id || 0), 0);
    fresh.forEach(v => {
      v.id = ++nextId;
      v._product = product; v._category = category;
      v._scan = checkAds(v.title || '', v.description || '', category);
      v._chain = jChain;
    });
    state.extraResults.push(...fresh);
    save();
    jlog('generated', jChain, {
      path: 'more', category, product, excluded: excl.length,
      latencyMs: Date.now() - jT0, variants: jVariants(fresh),
      ...(truncated ? { truncated: true } : {}),
    });
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', jChain, { stage: 'generate_more', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.extraLoading = false;
    refreshResults();
  }
}

async function doBatchGenerate() {
  const regions = state.batchRegions;
  state.loading = true; state.error = null; state.loadingKind = null; state.batchResults = []; state.titleStep = null; state.extraResults = [];
  // Пакет и обычные варианты взаимоисключающие — чистим обычный набор,
  // чтобы он не всплыл после «✕ Очистить» или перезагрузки (UX-3)
  state.results = []; state.conveyorIdx = 0;
  // F2: один запрос на весь пакет при фиксированном max_tokens обрезал JSON на 7+ регионах
  // (список регионов не ограничен, до 25 по умолчанию) — бьём на чанки, каждый со своим бюджетом
  const CHUNK = 4;
  const chunks = [];
  for (let i = 0; i < regions.length; i += CHUNK) chunks.push(regions.slice(i, i + CHUNK));
  state.batchChunkProgress = chunks.length > 1 ? { done: 0, total: chunks.length } : null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'batch-' + Date.now(); // журнал: пакет по регионам — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const variants = [];
    let chunkFails = 0, truncated = false;
    for (const chunk of chunks) {
      try {
        const msg = buildMsg(chunk.length, variants.map(v => v.title));
        const text = await callAI([{ role: 'user', content: msg }], {
          webSearch, category: state.form.category, max_tokens: genTokens(chunk.length),
          onTruncated: () => { truncated = true; },
          truncHint: 'уменьшите число регионов в пакете',
        });
        variants.push(...parseVariants(text));
      } catch(e) {
        console.error('Пакет: чанк не удался', e);
        chunkFails++;
      }
      if (state.batchChunkProgress) { state.batchChunkProgress.done++; refreshResults(); }
    }
    if (!variants.length) throw new Error('Не удалось сгенерировать ни одного варианта — все запросы завершились ошибкой');
    // F4: штамп товара/категории по форме на момент генерации (регион у пакета свой на каждой позиции)
    variants.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    if (variants.length < regions.length) {
      toast(`⚠️ AI вернул ${variants.length} из ${regions.length} вариантов — ${regions.length - variants.length} регионов без текста${chunkFails ? ` (${chunkFails} запрос(ов) не удалось)` : ''}. Повторите генерацию.`);
    }
    state.batchResults = regions.map((region, i) => ({
      region,
      variant: variants[i] || null,
    }));
    state.batchExpanded = null;
    save();
    jlog('generated', jChain, {
      path: 'batch', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      regions, chunkFails, latencyMs: Date.now() - jT0,
      ...(truncated ? { truncated: true } : {}), // хотя бы один чанк не уместился в лимит
      variants: state.batchResults.map(it => ({ region: it.region, ...(it.variant ? { title: it.variant.title || '', description: it.variant.description || '', scan: jScanLevel(it.variant) } : { empty: true }) })),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_batch', message: String(e.message || '').slice(0, 300), regions: regions.length });
  } finally {
    state.loading = false;
    state.batchChunkProgress = null;
    if (state.batchResults.length) { refreshBatchResults(); }
    else { refreshResults(); }
  }
}

// ══════════════════════════════════════════
// ЗАГОЛОВКИ ПЕРВЫМ ШАГОМ (аудит Fable 5: ↻×5 должен быть первым шагом
// воронки, а не запасным вариантом) — сначала выбор из 8-12 названий,
// только потом AI пишет описания под уже выбранные варианты.
// ══════════════════════════════════════════

function buildTitlesMsg(n) {
  const f = state.form;
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}${notes}

ЗАДАЧА: сгенерируй ${n} вариантов НАЗВАНИЙ (только названия, БЕЗ описаний) для одного и того же объявления. Каждое — из РАЗНОЙ точки пространства вариаций (разный крючок, разное написание/сокращение, разный порядок слов). Строго следуй формуле и правилам названий из системного промпта (лимит 50 символов, запрещённые слова, для игр — без цены).${learnedBlock(f)}

Верни строго JSON без markdown-обёртки:
{"titles":[{"title":"...","hook":"крючок одним-двумя словами"}]}`;
}

async function doGenTitlesOnly() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  state.loading = true; state.error = null; state.loadingKind = 'titles';
  state.titleStep = null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: воронка (заголовки + описания) — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const n = Math.max(8, Math.min(12, (state.form.count || 5) * 2));
    let truncated = false;
    const text = await callAI([{ role: 'user', content: buildTitlesMsg(n) }], {
      webSearch, category: state.form.category,
      max_tokens: titleTokens(n, webSearch), onTruncated: () => { truncated = true; },
    });
    const titles = parseTitles(text)
      .map((t, i) => ({ id: i + 1, title: t.title, hook: t.hook, len: [...t.title].length }));
    if (!titles.length) {
      throw new Error(truncated
        ? 'Ответ модели оборвался — ни одного названия разобрать не удалось. Повторите попытку.'
        : 'AI не вернул названия');
    }
    // Только когда названий реально меньше заказанного: модель могла закрыть JSON
    // и упереться в лимит уже на посторонней прозе (при веб-поиске это штатно —
    // F3), и тогда «пришло 12 из 12» было бы ложной тревогой.
    if (truncated && titles.length < n) toast(`⚠️ Ответ оборвался — названий пришло ${titles.length} из ${n}.`);
    state.titleStep = { titles, selected: {}, form: JSON.parse(JSON.stringify(state.form)), _chain: jChain };
    jlog('generated', jChain, {
      path: 'titles', category: state.form.category, product: currentProductName(state.form),
      latencyMs: Date.now() - jT0, titles: titles.map(t => t.title),
      ...(truncated ? { truncated: true } : {}),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_titles', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

async function doGenDescriptionsForTitles() {
  const step = state.titleStep;
  if (!step) return;
  const chosen = step.titles.filter(t => step.selected[t.id]);
  if (!chosen.length) { toast('Выберите хотя бы одно название'); return; }
  state.loading = true; state.error = null; state.loadingKind = 'descriptions'; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = step._chain || ('gen-' + Date.now()); // журнал: продолжение цепочки шага заголовков
  const jT0 = Date.now();
  try {
    const f = step.form;
    const webSearch = f.isPreorder && f.category === 'game';
    const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
    const list = chosen.map((t, i) => `${i + 1}. "${t.title}" (крючок: ${t.hook || '—'})`).join('\n');
    const msg = `${catInfoBlock(f)}${notes}
Стиль: ${styleLabel(f)}

Названия УЖЕ ВЫБРАНЫ продавцом — менять текст названия НЕЛЬЗЯ, перенеси его в поле title символ-в-символ:
${list}

Для каждого напиши полное описание — разное по структуре и подаче цены между вариантами (см. правила описаний в системном промпте).${learnedBlock(f)}
Верни строго JSON без markdown-обёртки:
{"variants":[{"id":1,"title":"(как в списке, без изменений)","title_length":число,"description":"...","style":"...","price_format":"...","hook":"...","structure":"..."}]}`;
    let truncated = false;
    const text = await callAI([{ role: 'user', content: msg }], {
      webSearch, category: f.category, max_tokens: genTokens(chosen.length),
      onTruncated: () => { truncated = true; },
      truncHint: 'выберите меньше названий за один раз',
    });
    const variants = parseVariants(text);
    if (!variants.length) throw new Error('AI не вернул описания');
    // Название продавцом уже выбрано — принудительно прописываем его поверх ответа AI
    // (промпт просит не менять, но гарантию даёт только клиент). Порядок AI держит,
    // маппим по индексу; если AI вернул меньше описаний, чем выбрано, — берём сколько есть.
    // Исключение — СПАСЁННЫЙ набор: там дыра может быть в середине (испорчен второй
    // вариант, третий цел), и индекс склеил бы название №2 с описанием №3. Берём позицию
    // из номера, который дала сама модель, а вариант с непонятным или повторным номером
    // отбрасываем: лучше меньше карточек, чем карточка с чужим названием.
    const used = new Set();
    const results = [];
    variants.forEach((v, i) => {
      const pos = variants._salvaged ? (Number(v._srcId) || 0) - 1 : i;
      if (!chosen[pos] || used.has(pos)) return;
      used.add(pos);
      results.push({ ...v, title: chosen[pos].title, title_length: chosen[pos].len });
    });
    const n = results.length;
    // Спасённый набор мог целиком не сопоставиться с выбранными названиями (модель
    // не проставила id или пронумеровала с нуля). Раньше пустым результат быть не
    // мог, а теперь может — и дальше идёт `state.titleStep = null`, то есть
    // продавец терял и оплаченную генерацию, и сам список выбранных названий.
    // Ошибка оставляет шаг заголовков на месте, повторить можно той же кнопкой.
    if (!n) throw new Error('Ответ модели не удалось сопоставить с выбранными названиями. Повторите генерацию описаний.');
    if (n < chosen.length) {
      toast(`⚠️ AI описал ${n} из ${chosen.length} названий. Остальные повторите отдельно.`);
    }
    state.results = results;
    state.resultsForm = JSON.parse(JSON.stringify(f));
    state.results.forEach(v => {
      v._product = currentProductName(f); v._category = f.category;
      v._scan = checkAds(v.title || '', v.description || '', f.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    state.titleStep = null;
    save();
    jlog('generated', jChain, {
      path: 'descriptions', category: f.category, product: currentProductName(f),
      offered: step.titles.length, chosen: chosen.map(t => t.title), // выбор Дениса из предложенных заголовков
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
      ...(truncated ? { truncated: true } : {}),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_descriptions', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

ЗАДАЧА: сгенерируй 5 альтернативных названий для этого же объявления. Каждое — в ДРУГОЙ стилистической точке: разный крючок, разные слова, для игры — обязательно разная форма написания названия (рус/англ/аббревиатура, транслит). Строго до 50 символов. ЗАПРЕЩЕНО: для категории «Игра» — любая цена/сумма/₽ в названии; для любой категории — слова «рублей»/«руб», даты/годы/«старт»/«релиз». Верни только JSON:

    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    // F5: при webSearch сама генерация вспомогательных tool-use блоков ест бюджет

async function doRegen(id) {
  if (state.regenId !== null) return;
  state.regenId = id; refreshResults();
  try {
    // F12: перегенерация одного варианта должна опираться на форму НА МОМЕНТ генерации
    // (снимок resultsForm + штампы варианта), а не на живую форму — иначе после переключения
    // формы ↻ выдаёт ДРУГОЙ товар, теряет _product/_category и не ищет бонусы предзаказа (Bug #6).
    const prev = findResult(id) || {};
    const snapForm = state.resultsForm || state.form;
    const category = prev._category || snapForm.category;
    const product  = prev._product  || currentProductName(snapForm);
    const excl = resultsPool().filter(v => v.id !== id).map(v => v.title);
    const webSearch = snapForm.isPreorder && category === 'game';
    let truncated = false;
    const text = await callAI([{ role: 'user', content: buildMsg(1, excl, snapForm) }],
      { webSearch, category, onTruncated: () => { truncated = true; } });
    const [v] = parseVariants(text);
    const { arr, idx } = findResultRef(id);
    if (arr && idx !== -1 && v) {
      // Журнал: перегенерация = «этот вариант не устроил». Старый текст пишем ДО перезаписи —
      // после неё он безвозвратен (правило «логировать до перезаписи»).
      jlog('regen', prev._chain || null, {
        category, product,
        before: { title: prev.title || '', description: prev.description || '', scan: jScanLevel(prev) },
        after:  { title: v.title || '', description: v.description || '' },
        ...(truncated ? { truncated: true } : {}),
      });
      arr[idx] = { ...v, id, _product: product, _category: category, _chain: prev._chain }; // штампы F4 сохраняются
      arr[idx]._scan = checkAds(v.title || '', v.description || '', category); // бейдж под НОВЫЙ текст
      save();
    }
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', null, { stage: 'regen', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.regenId = null; refreshResults();
  }
}

// ══════════════════════════════════════════
// РОТАЦИЯ ОБЪЯВЛЕНИЯ (История)
// Третья, самая слабая степень переписывания — между «ничего» и «↺ Перефраз».
// Объявление работает, просто выдохлось по возрасту: скелет и факты остаются,
// прокручиваются только формы написания, порядок и заголовок. Перефраз (mid)
// наоборот требует СТРУКТУРНО другого текста — поэтому это два разных промпта,
// а не один с процентом.
// ══════════════════════════════════════════

// Названия, которые уже заняты и повториться не должны. Внутри одного аккаунта
// повтор — прямой путь к бану за дубли; между своими профилями владелец
// повторяет сознательно, поэтому по умолчанию чужой аккаунт только помечается
// (см. rotXAcc и dupAcc в doRotate).
function rotUsedTitles(rec, crossAcc = false) {
  const prod = (rec.product || '').trim().toLowerCase();
  const acc  = accOf(rec);
  const out = [];
  for (const r of state.db || []) {
    if ((r.product || '').trim().toLowerCase() !== prod) continue;
    if (!crossAcc && accOf(r) !== acc) continue;
    for (const t of [r.finalTitle, r.title]) if (t && !out.includes(t)) out.push(t);
  }
  return out;
}

function rotPrompt(mode, live, used) {
  const exclude = used.length
    ? `\n\nЭТИ НАЗВАНИЯ УЖЕ ЗАНЯТЫ — повторять их ЗАПРЕЩЕНО (дубль на площадке):\n${used.map(t => `- ${t}`).join('\n')}`
    : '';
  if (mode === 'mid') {
    return `Перепиши это объявление для Авито СТРУКТУРНО ДРУГИМ — как будто писал другой продавец:
- Другой порядок блоков описания
- Другой крючок в названии
- Другая подача цены (была помесячная — сделай общую, и наоборот); для игры цену в описании не упоминать
- Другой тон (деловой ↔ живой)
- Факты (что входит, сроки, состояние, комплектация) НЕ менять и НЕ выдумывать
- Название строго до 50 символов

Исходное название: «${live.title}»
Исходное описание:
${live.desc}${exclude}

Верни ОДИН вариант в JSON:
{"variants": [{"id": 1, "title": "...", "title_length": 0, "description": "...", "style": "...", "price_format": "...", "hook": "...", "structure": "..."}]}`;
  }
  return `Это объявление уже висит на Авито и работает. Его надо ПРОКРУТИТЬ против дублей, а не переписать: тот же текст, но узнаваемо другой для площадки.

ЧТО МЕНЯТЬ (примерно треть слов, не больше):
- Название — новое, по-другому собранное: другой крючок или другая форма написания товара
- Формы написания в теле: «Red Dead Redemption 2» ↔ «RDR 2» ↔ «рдр2», «PS+ Extra» ↔ «ПС Плюс Экстра», «PS4/PS5» ↔ «пс4 пс5»
- Порядок перечислений: список игр, фич, преимуществ — переставить, часть заменить синонимичными формами
- Эмодзи: другой набор и другая плотность
- Две-три фразы сказать другими словами

ЧТО ОСТАВИТЬ КАК ЕСТЬ:
- Структуру: порядок блоков, где что стоит
- Все факты: цены, сроки, состояние, комплектацию, платформы, гарантию
- Тон и длину: не делай текст длиннее или рекламнее исходного
- Обязательные фразы, если они есть в исходнике
- Личные куски продавца (почему обращаться к нему, чем он отличается) — их можно слегка переформулировать, но НЕ выбрасывать и не заменять своими

Название строго до 50 символов.

Исходное название: «${live.title}»
Исходное описание:
${live.desc}${exclude}

Верни ОДИН вариант в JSON:
{"variants": [{"id": 1, "title": "...", "title_length": 0, "description": "...", "style": "...", "price_format": "...", "hook": "...", "structure": "..."}]}`;
}

async function doRotate(recId, mode) {
  const busyKey = `${recId}:${mode}`;
  if (state.rotBusy.has(busyKey)) return;
  const rec = (state.db || []).find(r => r.id === recId);
  if (!rec) return;

  const live = rotLiveText(rec);
  // Запись без текста ротировать нечего — так выглядят строки, заведённые до
  // появления текстовых полей, и ручные записи, внесённые без объявления.
  if (!live.title && !live.desc) {
    toast('В записи нет текста объявления — внесите его кнопкой ✎');
    return;
  }

  state.rotBusy.add(busyKey);
  state.rotResult = null;
  state.rotPanel = recId;
  renderDb();

  try {
    const crossAcc = !!state.settings.rotXAcc;
    const used = rotUsedTitles(rec, crossAcc);
    let truncated = false;
    const text = await callAI([{ role: 'user', content: rotPrompt(mode, live, used) }], {
      category: rec._category || state.form.category,
      max_tokens: genTokens(1), onTruncated: () => { truncated = true; },
    });
    const [nv] = parseVariants(text);
    if (!nv) throw new Error('Пустой ответ от AI');

    // Совпадение с названием на ДРУГОМ аккаунте не запрещено (решение владельца),
    // но показать его надо: два своих профиля площадка может связать.
    const otherAcc = crossAcc ? [] : rotUsedTitles(rec, true).filter(t => !used.includes(t));
    const dupAcc = !!(nv.title && otherAcc.includes(nv.title));

    state.rotResult = {
      recId, mode, title: nv.title || '', desc: nv.description || '', dupAcc,
      scan: checkAds(nv.title || '', nv.description || '', rec._category || state.form.category),
    };
    jlog('generated', rec._chain || null, {
      path: mode === 'mid' ? 'rotate_mid' : 'rotate',
      product: rec.product || null, category: rec._category || null,
      baseTitle: live.title, excluded: used.length,
      variants: [{ title: nv.title || '', description: nv.description || '' }],
      ...(truncated ? { truncated: true } : {}),
    });
    jlog('rotate', rec._chain || null, {
      mode, product: rec.product || null, region: rec.region || null,
      account: accOf(rec), ageDays: rotAgeDays(rec), fromFinal: !!rec.finalDesc,
    });
  } catch(e) {
    state.rotResult = { recId, mode, error: String(e.message || e).slice(0, 300) };
    jlog('error', null, { stage: 'rotate', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.rotBusy.delete(busyKey);
    renderDb();
  }
}

function toggleFav(variant) {
  const key = variant.title + variant.description;
  const idx = state.favorites.findIndex(f => f.title + f.description === key);
  if (idx !== -1) {
    // F15: удаление из избранного = потеря few-shot/источника очереди; если варианта уже нет
    // в результатах — текст безвозвратен. Добавление (else) не подтверждаем — оно не деструктивно.
    if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
    const gone = state.favorites[idx];
    state.favorites.splice(idx, 1);
    jlog('fav_remove', variant._chain || null, { title: variant.title || '' });
    syncTomb(syncFavKey(gone), gone, 'fav');
  } else {
    state.favorites.push({ ...variant, _fid: Date.now() });
    jlog('fav_add', variant._chain || null, { title: variant.title || '', category: variant._category || null, scan: jScanLevel(variant) });
  }
  save(); refreshResults(); refreshFavs();
}

function removeFav(fid) {
  // F15: то же удаление, но из списка избранного (кнопка ★ на карточке избранного)
  if (!confirm('Убрать вариант из избранного? Если его уже нет в результатах — текст будет потерян.')) return;
  const gone = state.favorites.find(f => f._fid === fid);
  state.favorites = state.favorites.filter(f => f._fid !== fid);
  if (gone) { jlog('fav_remove', gone._chain || null, { title: gone.title || '' }); syncTomb(syncFavKey(gone), gone, 'fav'); }
  save(); refreshResults(); refreshFavs();
}

function isFav(v) {
  const key = v.title + v.description;
  return state.favorites.some(f => f.title + f.description === key);
}

function copyBtn(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Скопировано';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('Скопировано!');
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lenClass(n) {
  return n <= 44 ? 'ok' : n <= 50 ? 'warn' : 'over';
}

// UX-13: пороги счётчика длины объяснены в подсказке (раньше «N/50» желтел молча).
// Лимит Авито — 50; жёлтый с 45 (впритык), красный с 51 (лимит превышен).
const LEN_TIP = 'Лимит названия на Авито — 50 символов. Жёлтый с 45 (впритык к лимиту — Авито может обрезать название в списке), красный с 51 (лимит превышен, объявление не примут).';
function tlenHTML(len, cls, style) {
  return `<span class="tlen ${cls ? cls + ' ' : ''}${lenClass(len)}"${style ? ` style="${style}"` : ''} title="${LEN_TIP}">${len}/50</span>`;
}

  <hr class="div">

function conveyorHTML() {
  const variants = state.results;
  if (!variants.length) return '';
  const idx = Math.max(0, Math.min(state.conveyorIdx, variants.length - 1));
  const v = variants[idx];
  const len  = v.title ? [...v.title].length : 0;
  const fav  = isFav(v);
  const tAttr = (v.title || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const dAttr = (v.description || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');

  return `<div class="conv-wrap" id="conv-wrap">
    <div class="conv-nav">
      <button class="conv-nav-btn" data-act="conv-prev" ${idx===0?'disabled':''}>←</button>
      <div class="conv-counter">Вариант ${idx+1} из ${variants.length}</div>
      <button class="conv-nav-btn" data-act="conv-next" ${idx===variants.length-1?'disabled':''}>→</button>
    </div>

    <div>
      <div class="conv-title">${esc(v.title || '')}</div>
      <div class="conv-tlen-row">${tlenHTML(len)}</div>
    </div>

    <button class="conv-btn conv-btn-title" data-act="conv-copy-title" data-text="${tAttr}" data-j="title" data-jvid="${v.id}">
      📋 Копировать название
    </button>

    <hr class="div">

    <div>
      <div class="desc-label">Описание</div>
      <div class="conv-desc">${esc(v.description || '')}</div>
    </div>

    <div class="conv-actions-row">
      <button class="conv-btn conv-btn-desc" data-act="conv-copy-desc" data-text="${dAttr}" data-j="desc" data-jvid="${v.id}">
        📋 Копировать описание
      </button>
      <button class="conv-btn conv-btn-photo" data-act="conv-photo" title="Перейти к обложкам">🖼️</button>
    </div>

    <div class="conv-meta">
      <button class="btn-sm ${fav?'fav-on':''}"
        data-act="fav" data-vid="${v.id}">${fav?'★ Избранное':'☆ В избранное'}</button>
      <button class="btn-sm" data-act="regen" data-vid="${v.id}">↻ Перегенерировать</button>
      <button class="btn-sm" data-act="scan-check" data-vid="${v.id}" title="Проверить на запрещёнку в Сканере">🔍 Проверить</button>
      <button class="btn-sm" data-act="mark-posted" data-vid="${v.id}" title="Отметить как размещено">✓ Размещено</button>
    </div>
  </div>`;
}

let _convTouchX = null;

function bindConveyorSwipe() {
  const wrap = document.getElementById('conv-wrap');
  if (!wrap) return;
  wrap.addEventListener('touchstart', e => { _convTouchX = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => {
    if (_convTouchX === null) return;
    const dx = e.changedTouches[0].clientX - _convTouchX;
    _convTouchX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && state.conveyorIdx < state.results.length - 1) { state.conveyorIdx++; refreshResults(); }
    if (dx > 0 && state.conveyorIdx > 0)                        { state.conveyorIdx--; refreshResults(); }
  }, { passive: true });
}

function scrollToResults() {
  if (window.innerWidth > 780) return;
  const el = document.getElementById('results-box');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function refreshResults() {
  const el = document.getElementById('results-box');
  if (!el) return;

  if (state.batchResults.length) { refreshBatchResults(); return; }

  if (state.loading) {
    const chunkInfo = state.batchChunkProgress ? ` (чанк ${state.batchChunkProgress.done}/${state.batchChunkProgress.total})` : '';
    const loadingText = state.loadingKind === 'titles' ? 'Подбираю заголовки…'
      : state.loadingKind === 'descriptions' ? 'Пишу описания для выбранных названий…'
      : (state.batchMode && state.batchRegions.length ? `Генерирую пакет для ${state.batchRegions.length} регионов…${chunkInfo}` : 'Генерирую варианты…');
    el.innerHTML = `<div class="loading-box">
      <div class="spinner"></div>
      <div>${loadingText}</div>
      <div style="font-size:12px;color:var(--muted)">Обычно 5–15 секунд</div>
    </div>`;
    return;
  }
  if (state.error) {
    el.innerHTML = `<div class="err-box"><b>Ошибка:</b> ${esc(state.error)}</div>`;
    return;
  }
  if (state.titleStep) {
    el.innerHTML = titleStepHTML();
    return;
  }
  if (!state.results.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="ico">✨</div>
      <div>Заполните форму и сгенерируйте объявление</div>
    </div>`;
    return;
  }

  const toggleBtn = `<button class="conv-mode-toggle ${state.conveyorMode?'active':''}" data-act="toggle-conveyor">
    ${state.conveyorMode ? '☰ Список' : '▶ Конвейер'}
  </button>${(state.results.length || state.favorites.length) ? `<button class="conv-mode-toggle" data-act="export-pkg" style="margin-right:6px" title="Скачать варианты + избранное как .txt">📦 Экспорт</button>` : ''}
  <button class="conv-mode-toggle" data-act="gen-more" ${state.extraLoading?'disabled':''} title="Догенерировать ещё варианты, не заменяя текущие">${state.extraLoading?'⏳':'➕'} Ещё варианты</button>`;

  // F16: подпись «какой товар · когда» над вариантами — вернулся через неделю (персона 2),
  // форма уже переключена, а тут варианты старого товара; данные берём из штампа/снимка, не из живой формы.
  const _rp = state.results[0];
  const _prodName = _rp?._product || (state.resultsForm ? currentProductName(state.resultsForm) : '');
  const _genDate  = _rp?.id ? new Date(_rp.id).toLocaleDateString('ru') : '';
  const productBadge = _prodName
    ? `<div class="results-product-badge">📦 ${esc(_prodName)}${_genDate ? ` · ${_genDate}` : ''}</div>` : '';

  // UX-15: «Ещё варианты» — отдельный блок под основным набором, не смешивается со списком/конвейером
  const extraSection = (state.extraResults.length || state.extraLoading) ? `
    <div class="extra-results-sep">
      <div class="card-title" style="font-size:13px">➕ Ещё варианты${state.extraResults.length ? ` (${state.extraResults.length})` : ''}</div>
      ${state.extraLoading ? `<div class="loading-box" style="padding:14px 0"><div class="spinner"></div><div style="font-size:12px;color:var(--muted)">Генерирую ещё варианты…</div></div>` : ''}
      <div class="results-list" style="margin-top:10px;">${state.extraResults.map(v => vcardHTML(v, false)).join('')}</div>
    </div>` : '';

  if (state.conveyorMode) {
    el.innerHTML = toggleBtn + productBadge + conveyorHTML() + extraSection;
    bindConveyorSwipe();
  } else {
    el.innerHTML = toggleBtn + productBadge + `<div class="results-list" style="margin-top:10px;">${state.results.map(v => vcardHTML(v, false)).join('')}</div>` + extraSection;
  }
}
