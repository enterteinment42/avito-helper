document.addEventListener('click', e => {
  // Covers module — data-cv-* attributes
  const cvEl = e.target.closest('[data-cv-mode],[data-cv-layout],[data-cv-ratio],[data-cv-bg],[data-cv-bg-style],[data-cv-toggle],[data-cv-grade],[data-cv-plat-sel],[data-cv-plat-pos],[data-cv-del],[data-cv-ms-shape],[data-cv-ms-pos],[data-cv-ms-bg],[data-cv-ms-tc],[data-cv-tz],[data-cv-to-color],[data-cv-to-bg],[data-cv-src],[data-cv-ig-align],[data-cv-ig-bg],[data-cv-ig-tc]');
  if (cvEl) {
    if (cvEl.dataset.cvSrc) {
      cv.coverSource = cvEl.dataset.cvSrc;
      document.querySelectorAll('[data-cv-src]').forEach(b => b.classList.toggle('active', b.dataset.cvSrc === cv.coverSource));
      return;
    }
    if (cvEl.dataset.cvMode) {
      if (cvEl.dataset.cvMode === cv.mode) return;
      if (cv.images.length && !confirm('Сменить режим? Загруженные картинки и их настройки кадра будут очищены.')) return;
      cv.mode = cvEl.dataset.cvMode; cv.images = []; cv._selCell = null; render(); return;
    }
    if (cvEl.dataset.cvLayout) {
      if (cvEl.classList.contains('dimmed')) return;
      jCvBump('layouts');
      cv.layout = cvEl.dataset.cvLayout; cv._selCell = null;
      const lb = document.getElementById('cv-layouts-box');
      if (lb) lb.innerHTML = cvLayoutButtonsHTML(cv.layout, cv.images.length);
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvRatio) {
      cv.ratio = cvEl.dataset.cvRatio; cv._selCell = null;
      document.querySelectorAll('[data-cv-ratio]').forEach(b => b.classList.toggle('active', b.dataset.cvRatio === cv.ratio));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvBg) {
      cv.bg = cvEl.dataset.cvBg;
      document.querySelectorAll('[data-cv-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvBg === cv.bg));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvBgStyle) {
      cv.bgStyle = cvEl.dataset.cvBgStyle;
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvToggle) {
      const key = cvEl.dataset.cvToggle;
      jCvBump('toggles');
      cv[key] = !cv[key];
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvGrade) {
      cv.grade = cvEl.dataset.cvGrade;
      document.querySelectorAll('[data-cv-grade]').forEach(b => b.classList.toggle('active', b.dataset.cvGrade === cv.grade));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvPlatSel) {
      const id = cvEl.dataset.cvPlatSel;
      cv.platSel = (cv.platSel||[]).includes(id) ? cv.platSel.filter(x=>x!==id) : [...(cv.platSel||[]), id];
      render(); cvReDraw(); return;
    }
    if (cvEl.dataset.cvPlatPos) {
      cv.platBadgePos = cvEl.dataset.cvPlatPos;
      document.querySelectorAll('[data-cv-plat-pos]').forEach(b => b.classList.toggle('active', b.dataset.cvPlatPos === cv.platBadgePos));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvMsShape) {
      cv.maskStickerShape = cvEl.dataset.cvMsShape;
      document.querySelectorAll('[data-cv-ms-shape]').forEach(b => b.classList.toggle('active', b.dataset.cvMsShape === cv.maskStickerShape));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsPos) {
      cv.maskStickerPos = cvEl.dataset.cvMsPos;
      cv.maskStickerX = null; cv.maskStickerY = null; // сброс drag-позиции
      document.querySelectorAll('[data-cv-ms-pos]').forEach(b => b.classList.toggle('active', b.dataset.cvMsPos === cv.maskStickerPos));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsBg) {
      cv.maskStickerBg = cvEl.dataset.cvMsBg;
      document.querySelectorAll('[data-cv-ms-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvMsBg === cv.maskStickerBg));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvMsTc) {
      cv.maskStickerColor = cvEl.dataset.cvMsTc;
      document.querySelectorAll('[data-cv-ms-tc]').forEach(b => b.classList.toggle('active', b.dataset.cvMsTc === cv.maskStickerColor));
      const c = document.getElementById('cv-canvas');
      if (c && cv.images.length) cvDrawCollage(c); return;
    }
    if (cvEl.dataset.cvToColor) {
      cv.textOverlayColor = cvEl.dataset.cvToColor;
      document.querySelectorAll('[data-cv-to-color]').forEach(b => b.classList.toggle('active', b.dataset.cvToColor === cv.textOverlayColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvToBg) {
      cv.textOverlayBgColor = cvEl.dataset.cvToBg;
      document.querySelectorAll('[data-cv-to-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvToBg === cv.textOverlayBgColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgAlign) {
      cv.infogAlign = cvEl.dataset.cvIgAlign;
      cv.infogX = null; cv.infogY = null; // сброс drag-позиции, как у стикера
      document.querySelectorAll('[data-cv-ig-align]').forEach(b => b.classList.toggle('active', b.dataset.cvIgAlign === cv.infogAlign));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgBg) {
      cv.infogBg = cvEl.dataset.cvIgBg;
      document.querySelectorAll('[data-cv-ig-bg]').forEach(b => b.classList.toggle('active', b.dataset.cvIgBg === cv.infogBg));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvIgTc) {
      cv.infogColor = cvEl.dataset.cvIgTc;
      document.querySelectorAll('[data-cv-ig-tc]').forEach(b => b.classList.toggle('active', b.dataset.cvIgTc === cv.infogColor));
      cvReDraw(); return;
    }
    if (cvEl.dataset.cvDel !== undefined) { cvRemoveImage(+cvEl.dataset.cvDel); return; }
    if (cvEl.dataset.cvTz !== undefined) {
      let img;
      if (cv.mode === 'game' && cv.images.length) img = cv.images[0];
      else if (cv._selCell !== null && cv._selCell !== undefined && cv.images[cv._selCell]) img = cv.images[cv._selCell];
      if (!img) return;
      if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
      jCvBump('tz');
      const t = img.transform, PAN = 0.05;
      switch(cvEl.dataset.cvTz) {
        case 'zoom-in':  t.scale = Math.min(4, (t.scale||1)+0.15); break;
        case 'zoom-out': t.scale = Math.max(1, (t.scale||1)-0.15); break;
        case 'left':  t.ox = (t.ox||0) - PAN; break;
        case 'right': t.ox = (t.ox||0) + PAN; break;
        case 'up':    t.oy = (t.oy||0) - PAN; break;
        case 'down':  t.oy = (t.oy||0) + PAN; break;
        case 'reset': t.scale=1; t.ox=0; t.oy=0; break;
      }
      const scaleVal = Math.round((t.scale||1)*100);
      const slider = document.getElementById('cv-tz-scale');
      if (slider) slider.value = scaleVal;
      const valEl = document.getElementById('cv-tz-scale-val');
      if (valEl) valEl.textContent = scaleVal + '%';
      const c = document.getElementById('cv-canvas');
      if (c) { cv.mode === 'game' ? cvDrawGame(c, img, {}) : cvDrawCollage(c); }
      return;
    }
  }

  const el = e.target.closest('[data-act],[data-tab]');
  if (!el) return;

  const act = el.dataset.act;
  const tab = el.dataset.tab;

  // Табы
  if (tab) {
    if (el.classList.contains('dimmed')) return;
    if (tab !== state.tab) jlog('tab_open', null, { tab }); // журнал: перепись использования вкладок
    state.tab = tab; render(); return;
  }

  // Журнал: перепись кликов по крупным функциям — мёртвые видны нулями при разборе
  if (J_UI_ACTS.has(act)) jlog('ui', null, { act });

  switch (act) {
    case 'toggle-ai':
      state.aiOpen = !state.aiOpen; render(); break;

    case 'gen': doGenerate(); break;
    case 'gen-titles': doGenTitlesOnly(); break;

    case 'title-pick': {
      const id = +el.dataset.id;
      if (state.titleStep) {
        state.titleStep.selected[id] = !state.titleStep.selected[id];
        refreshResults();
      }
      break;
    }
    case 'titles-next': doGenDescriptionsForTitles(); break;
    case 'titles-regen': doGenTitlesOnly(); break;
    case 'titles-cancel': state.titleStep = null; refreshResults(); break;

    case 'alt-titles': doGenAltTitles(+el.dataset.vid); break;
    case 'apply-title': {
      const vid = +el.dataset.vid, tidx = +el.dataset.tidx;
      const alts = state.altTitles[vid];
      const v = findResult(vid);
      if (v && alts?.[tidx]) {
        // Журнал: выбор из ↻×5 — какое название победило и что оно заменило (старое — до перезаписи)
        jlog('applied_title', v._chain || null, { before: v.title || '', after: alts[tidx].title, pickedIdx: tidx });
        v.title = alts[tidx].title; delete state.altTitles[vid]; save(); refreshResults();
      }
      break;
    }

    case 'regen': doRegen(+el.dataset.vid); break;

    case 'fav': {
      const vid = +el.dataset.vid;
      const v = findResult(vid);
      if (v) toggleFav(v);
      break;
    }

    case 'gen-more': doGenerateMore(); break;

    case 'unfav': {
      const fid = +el.dataset.fid;
      if (fid) removeFav(fid);
      else {
        // Fallback: найти по заголовку
        const vid = +el.dataset.vid;
        const v = state.favorites.find(f => f.id === vid);
        if (v) toggleFav(v);
      }
      break;
    }

    case 'copy': copyBtn(el.dataset.text, el); if (el.dataset.j) jCopied(el); break;

    case 'copy-both': copyBtn(el.dataset.t + '\n\n' + el.dataset.d, el); if (el.dataset.j) jCopied(el); break;

    case 'preset-save': {
      const name = prompt('Название пресета:', state.form.subType || state.form.aiService || state.form.digitalName || state.form.gameName || 'Новый пресет');
      if (!name || !name.trim()) break;
      state.presets.push({ id: Date.now(), name: name.trim(), form: JSON.parse(JSON.stringify(state.form)), date: new Date().toLocaleDateString('ru') });
      save();
      toast(`Пресет «${name.trim()}» сохранён`);
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      break;
    }

    case 'preset-load': {
      const sel = document.getElementById('preset-sel');
      const id = sel ? +sel.value : 0;
      if (!id) { toast('Выберите пресет из списка'); break; }
      const p = state.presets.find(x => x.id === id);
      if (!p) break;
      state.form = { ...DEF_FORM, ...p.form };
      save();
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      toast(`Загружен: ${p.name}`);
      break;
    }

    case 'toggle-batch': {
      state.batchMode = el.checked;
      if (!state.batchMode) state.batchRegions = [];
      else if (state.titleStep) { state.titleStep = null; refreshResults(); } // шаг «заголовки» не совместим с пакетным режимом
      const fb = document.getElementById('form-box');
      if (fb) fb.innerHTML = formHTML();
      break;
    }

    case 'batch-region': {
      const val = el.dataset.val;
      const i = state.batchRegions.indexOf(val);
      if (i !== -1) state.batchRegions.splice(i, 1); else state.batchRegions.push(val);
      el.classList.toggle('on', state.batchRegions.includes(val));
      const btn = document.querySelector('[data-act="gen"]');
      if (btn) {
        btn.disabled = !state.batchRegions.length;
        btn.textContent = state.batchRegions.length
          ? `📦 Сгенерировать пакет (${state.batchRegions.length} регионов)`
          : '⚠ Выберите регионы для пакета';
      }
      const info = document.querySelector('.batch-regions + div');
      if (info) {
        info.textContent = state.batchRegions.length ? `Выбрано: ${state.batchRegions.length} регионов` : '⚠ Выберите хотя бы 1 регион';
        info.style.color = state.batchRegions.length ? 'var(--teal-h)' : 'var(--warn)';
      }
      break;
    }

    case 'batch-expand': {
      const idx = +el.dataset.i;
      state.batchExpanded = state.batchExpanded === idx ? null : idx;
      refreshBatchResults(); break;
    }

    case 'batch-clear':
      // UX-10: пакет = сожжённые токены на N регионов, не стираем молча
      if (state.batchResults.length && !confirm(`Очистить весь пакет (${state.batchResults.length} объявлений)? Восстановить нельзя.`)) break;
      state.batchResults = []; state.batchExpanded = null; save(); refreshResults(); break;

    case 'queue-add': {
      const qf = state.queueForm;
      if (!qf.region.trim()) { toast('Укажите регион'); break; }
      if (qf.source === 'auto') {
        const miss = validateForm();
        if (miss.length) { toast('Форма генератора не заполнена для «авто»: ' + miss.join(', ')); break; }
      }
      const product = qf.product.trim() || (qf.source === 'auto' ? currentProductName(state.form) : '');
      if (!product) { toast('Укажите товар'); break; }
      state.postQueue.push({
        id: Date.now(), product, region: qf.region.trim(),
        source: qf.source,
        favId: qf.source === 'fav' ? (qf.favId ?? state.favorites[0]?._fid ?? null) : null,
        // «авто» снимает снимок текущей формы — каждая позиция генерируется из своего товара (UX-1)
        form: qf.source === 'auto' ? JSON.parse(JSON.stringify(state.form)) : null,
      });
      save(); render();
      jlog('queue_add', null, { source: qf.source, product, region: qf.region.trim() });
      break;
    }

    case 'queue-add-batch':
      state.batchResults.forEach(item => {
        state.postQueue.push({ id: Date.now() + Math.random(), product: currentProductName(state.form), region: item.region, source: 'batch', favId: null, variant: item.variant });
      });
      save(); render();
      jlog('queue_add', state.batchResults[0]?.variant?._chain || null, { source: 'batch', count: state.batchResults.length });
      break;

    case 'queue-del':
      state.postQueue.splice(+el.dataset.i, 1);
      save(); render(); break;

    case 'queue-clear':
      // UX-10: вся очередь постинга — не стираем молча
      if (state.postQueue.length && !confirm(`Очистить всю очередь (${state.postQueue.length} позиций)?`)) break;
      state.postQueue = []; save(); render(); break;

    case 'queue-start':
      doStartSession(); break;

    case 'session-done': {
      const si = state.postSession;
      const item = si.items[si.idx];
      if (item) {
        state.db.push({
          id: Date.now(), product: item.product, region: item.region,
          title: item.variant?.title || '', description: item.variant?.description || '',
          status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
          _chain: item.variant?._chain || null,
        });
        save();
        // Журнал: в сессии постинга диалог финала не показываем (не рвём конвейерный темп) —
        // финал доносится кнопкой «📥 финал» в Истории
        jlog('posted', item.variant?._chain || null, {
          product: item.product, region: item.region, title: item.variant?.title || '',
          scan: jScanLevel(item.variant), session: true,
        });
      }
      si.idx++;
      renderSession();
      break;
    }

    case 'session-skip':
      state.postSession.idx++;
      renderSession(); break;

    case 'session-close':
      state.postSession.active = false;
      document.getElementById('session-overlay')?.remove();
      break;

    case 'toggle-conveyor':
      state.conveyorMode = !state.conveyorMode;
      if (state.conveyorMode) state.conveyorIdx = 0;
      refreshResults(); break;

    case 'conv-prev':
      if (state.conveyorIdx > 0) { state.conveyorIdx--; refreshResults(); } break;

    case 'conv-next':
      if (state.conveyorIdx < state.results.length - 1) { state.conveyorIdx++; refreshResults(); } break;

    case 'conv-copy-title':
      copyBtn(el.dataset.text, el);
      if (el.dataset.j) jCopied(el);
      el.textContent = '✓ Скопировано';
      el.classList.add('copied');
      setTimeout(() => { el.textContent = '📋 Копировать название'; el.classList.remove('copied'); }, 1800);
      break;

    case 'conv-copy-desc':
      copyBtn(el.dataset.text, el);
      if (el.dataset.j) jCopied(el);
      el.innerHTML = '✓ Скопировано';
      el.classList.add('copied');
      setTimeout(() => { el.innerHTML = '📋 Копировать описание'; el.classList.remove('copied'); }, 1800);
      break;

    case 'conv-photo': {
      // UX-8: раньше только переключало вкладку, теперь переносит название игры и ищет обложку
      const f = state.form;
      if (f.category === 'game' && (f.gameName || '').trim()) {
        goToCoverSearch(f.gameName.trim());
      } else {
        state.tab = 'covers'; render();
      }
      break;
    }

    case 'style':
      state.form.style = el.dataset.val; save(); reForm();
      break;

    case 'count':
      state.form.count = +el.dataset.val; save();
      document.querySelectorAll('[data-act="count"]').forEach(b =>
        b.classList.toggle('on', +b.dataset.val === state.form.count));
      break;

    case 'plat': {
      const val = el.dataset.val;
      const arr = state.form.platforms;
      const i = arr.indexOf(val);
      if (i !== -1) arr.splice(i, 1); else arr.push(val);
      el.classList.toggle('on', arr.includes(val));
      save(); break;
    }

    case 'gplat': {
      const val = el.dataset.val;
      const arr = state.form.gamePlatforms;
      const i = arr.indexOf(val);
      if (i !== -1) arr.splice(i, 1); else arr.push(val);
      el.classList.toggle('on', arr.includes(val));
      save(); break;
    }

    case 'preorder': {
      state.form.isPreorder = !state.form.isPreorder;
      save(); reForm(); break;
    }

    case 'dur-del': {
      state.form.durations.splice(+el.dataset.i, 1);
      save(); reDurs(); break;
    }

    case 'dur-add':
      state.form.durations.push({ period: '1 месяц', price: '' });
      save(); reDurs(); break;

    case 'cv-download': {
      if (!cv.images.length) break;
      cv._selCell = null;
      const tmp = document.createElement('canvas');
      // F11: в режиме «Игра» скачиваем основное превью с текущими настройками (рамка/скругление/
      // обводка/тень/стикер/текст), а не через «4 варианта», которые перетирают их пресетами.
      if (cv.mode === 'game') { cvDrawGame(tmp, cv.images[0], {}); cvDownload(tmp, 'game.jpg'); }
      else { cvDrawCollage(tmp); cvDownload(tmp, 'collage.jpg'); }
      break;
    }
    case 'cv-mask-toggle':
      cv.maskSticker = !cv.maskSticker; render(); break;

    case 'cv-to-toggle':
      cv.textOverlay = !cv.textOverlay; render(); break;
    case 'cv-to-bold':
      cv.textOverlayBold = !cv.textOverlayBold; render(); break;
    case 'cv-to-bg-toggle':
      cv.textOverlayBg = !cv.textOverlayBg; render(); break;

    case 'cv-ig-toggle':
      cv.infog = !cv.infog; render(); break;
    case 'cv-ig-fill':
      cvInfogFillFromForm(); break;

    case 'cv-gen-vars':
      cvGenerateVariations(); break;

    case 'cv-gen-collage-vars':
      cvGenerateCollageVars(); break;

    case 'cv-dl-all-collage': {
      const grid = document.getElementById('cv-collage-vars-grid');
      const vars = grid?._vars;
      if (!vars) break;
      vars.forEach((v,i) => setTimeout(() => {
        const tmp = document.createElement('canvas');
        cvDrawCollage(tmp, { bg: v.bg, padding: v.padding, infog: v.infog });
        cvDownload(tmp, `collage-var-${i+1}.jpg`);
      }, i * 350));
      break;
    }

    case 'cv-dl-all-game': {
      const vars = cv._gameVars;
      if (!vars || !cv.images.length) break;
      const img = cv.images[0];
      vars.forEach((v,i) => setTimeout(() => {
        const tmp = document.createElement('canvas');
        cvDrawGame(tmp, img, v);
        cvDownload(tmp, `game-var-${i+1}.jpg`);
      }, i * 350));
      break;
    }

    case 'cv-igdb-fetch':
      if (cv.coverSource === 'ps') cvFetchFromPS(); else cvFetchFromIGDB(); break;

    case 'cv-igdb-game-fetch': {
      const inp = document.getElementById('cv-igdb-game');
      const prog = document.getElementById('cv-igdb-game-prog');
      if (!inp) break;
      const name = inp.value.trim();
      if (!name) break;
      el.disabled = true;
      if (cv.coverSource === 'ps') {
        if (prog) prog.textContent = `⏳ PS Store: «${name}»...`;
        fetch('https://api.poigraem.shop/price-lookup/api/price-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gameName: name, source: 'avito_helper' })
        })
          .then(r => r.json())
          .then(data => {
            if (!data.coverUrl) { if (prog) prog.textContent = '❌ Не найдено'; return; }
            const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.coverUrl);
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              cvRevokeGameBlobs();
              cv.images = [{ id: ++_cvId, url: img.src, el: img, transform:{scale:1,ox:0,oy:0} }];
              if (prog) prog.textContent = '✓ Загружено';
              jlog('cv_images', null, { source: cv.coverSource === 'ps' ? 'ps' : 'igdb', mode: 'game', added: 1, names: [name] });
              cvRenderState();
            };
            img.onerror = () => { if (prog) prog.textContent = '❌ Ошибка загрузки'; };
            img.src = url;
          })
          .catch(() => { if (prog) prog.textContent = '❌ Ошибка запроса'; })
          .finally(() => { el.disabled = false; });
      } else {
        if (prog) prog.textContent = `⏳ Ищем «${name}»...`;
        fetch(`https://api.poigraem.shop/igdb/cover?name=${encodeURIComponent(name)}&type=game`)
          .then(r => r.json())
          .then(data => {
            if (!data.cover) { if (prog) prog.textContent = '❌ Не найдено'; return; }
            const url = 'https://api.poigraem.shop/igdb/img?url=' + encodeURIComponent(data.cover.replace(/\/t_[a-z0-9_]+\//, '/t_1080p/'));
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              cvRevokeGameBlobs();
              cv.images = [{ id: ++_cvId, url: img.src, el: img, transform:{scale:1,ox:0,oy:0} }];
              if (prog) prog.textContent = '✓ Загружено';
              jlog('cv_images', null, { source: cv.coverSource === 'ps' ? 'ps' : 'igdb', mode: 'game', added: 1, names: [name] });
              cvRenderState();
            };
            img.onerror = () => { if (prog) prog.textContent = '❌ Ошибка загрузки'; };
            img.src = url;
          })
          .catch(() => { if (prog) prog.textContent = '❌ Ошибка запроса'; })
          .finally(() => { el.disabled = false; });
      }
      break;
    }

    case 'db-add': {
      const f = state.dbForm;
      if (!f.product.trim() || !f.region.trim()) { toast('Укажите товар и регион'); break; }
      state.db.push({ id: Date.now(), product: f.product.trim(), region: f.region.trim(), status: f.status || 'active', note: f.note.trim() });
      state.dbForm = { product: f.product.trim(), region: f.region.trim(), status: 'active', note: '' };
      save(); renderDb(); break;
    }
    case 'db-edit': {
      const rec = state.db.find(r => r.id === +el.dataset.id);
      if (!rec) break;
      state.dbEditId = rec.id;
      state.dbForm = { product: rec.product, region: rec.region, status: rec.status, note: rec.note || '' };
      renderDb(); break;
    }
    case 'db-save': {
      if (state.dbEditId === null) break;
      const f2 = state.dbForm;
      if (!f2.product.trim() || !f2.region.trim()) { toast('Укажите товар и регион'); break; }
      const idx = state.db.findIndex(r => r.id === state.dbEditId);
      if (idx !== -1) state.db[idx] = { ...state.db[idx], product: f2.product.trim(), region: f2.region.trim(), status: f2.status, note: f2.note.trim() };
      state.dbEditId = null;
      save(); renderDb(); break;
    }
    case 'db-cancel':
      state.dbEditId = null;
      state.dbForm = { product: '', region: 'Москва', status: 'active', note: '' };
      renderDb(); break;
    case 'db-del': {
      if (!confirm('Удалить запись?')) break;
      const delId = +el.dataset.id;
      state.db = state.db.filter(r => r.id !== delId);
      if (state.dbEditId === delId) { state.dbEditId = null; state.dbForm = { product: '', region: 'Москва', status: 'active', note: '' }; }
      save(); renderDb(); break;
    }
    case 'region-del': {
      const val = el.dataset.val;
      if (!state.settings.regions) state.settings.regions = [...REGIONS];
      state.settings.regions = state.settings.regions.filter(r => r !== val);
      save(); render(); break;
    }
    case 'export-pkg':
      exportPackage(); break;

    case 'rephrase': {
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      doRephrase(+el.dataset.vid, fid); break;
    }

    case 'reph-fav': {
      const vid = +el.dataset.vid;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const boxId = fid ? `reph-f${fid}` : `reph-${vid}`;
      const box = document.getElementById(boxId);
      const v = box?._rephResult;
      if (v) {
        state.favorites.push({ ...v, _fid: v._fid || Date.now() });
        save();
        refreshFavs();
        const cnt = document.getElementById('fav-cnt');
        if (cnt) cnt.textContent = state.favorites.length;
        el.textContent = '★ В избранном';
        el.style.color = 'var(--warn)';
        el.disabled = true;
      }
      break;
    }

    case 'dup-check': {
      const vid = +el.dataset.vid;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const hits = dupCheck(vid, fid);
      const boxId = fid ? `dup-f${fid}` : `dup-${vid}`;
      const box = document.getElementById(boxId);
      if (!box) break;
      if (!hits.length) {
        box.innerHTML = `<div style="padding:6px 12px 10px;font-size:12px;color:var(--ok)">✓ Дублей не найдено среди вариантов, избранного и истории размещений</div>`;
      } else {
        box.innerHTML = `<div style="padding:8px 12px 12px">
          <div style="font-size:12px;color:var(--warn);font-weight:600;margin-bottom:6px">⚠ Похожие объявления</div>
          ${hits.map(h => {
            const pct = Math.round(h.score * 100);
            const col = pct >= 60 ? 'var(--err)' : pct >= 40 ? 'var(--warn)' : 'var(--muted)';
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
              <span style="color:${col};font-weight:700;min-width:34px">${pct}%</span>
              <div style="flex:1;height:4px;background:var(--card3);border-radius:2px">
                <div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div>
              </div>
              <span style="color:var(--text2)">${esc(h.label)}</span>
            </div>`;
          }).join('')}
        </div>`;
      }
      break;
    }

    case 'scan-check': {
      // UX-7: карточка → Сканер, без ручного копирования названия/описания/категории
      let v, i = el.dataset.i !== undefined ? +el.dataset.i : null;
      if (i !== null) {
        v = state.batchResults[i]?.variant;
      } else {
        const vid = el.dataset.vid ? +el.dataset.vid : null;
        const fid = el.dataset.fid ? +el.dataset.fid : null;
        v = fid ? state.favorites.find(f => f._fid === fid) : findResult(vid);
      }
      if (!v) break;
      goToScanner(v.title, v.description, v._category || state.form.category);  // F4: категория из варианта
      break;
    }

    case 'mark-posted': {
      // UX-4: обычный поток (список/конвейер) раньше нигде не фиксировал факт постинга
      const vid = el.dataset.vid ? +el.dataset.vid : null;
      const fid = el.dataset.fid ? +el.dataset.fid : null;
      const v = fid ? state.favorites.find(f => f._fid === fid) : findResult(vid);
      if (!v) break;
      const region = prompt('Регион размещения?', (state.settings.regions || REGIONS)[0] || 'Москва');
      if (!region || !region.trim()) break;
      const recId = Date.now();
      state.db.push({
        id: recId, product: v._product || currentProductName(state.form), region: region.trim(),  // F4: товар из варианта
        title: v.title || '', description: v.description || '',
        status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
        _chain: v._chain || null, // журнал: чтобы «донос финала» лёг в ту же цепочку
      });
      save();
      jlog('posted', v._chain || null, {
        product: v._product || null, category: v._category || null, region: region.trim(),
        title: v.title || '', scan: jScanLevel(v),
      });
      toast('Отмечено как размещено: ' + region.trim());
      showFinalDialog(recId); // необязательная вставка финального текста с Авито (выбор Дениса: вариант А)
      break;
    }

    case 'batch-fav': {
      // F17: сохранить региональный вариант из пакета в избранное (попадает в few-shot-пул).
      const i = +el.dataset.i;
      const v = state.batchResults[i]?.variant;
      if (!v) break;
      const key = (v.title || '') + (v.description || '');
      if (state.favorites.some(f => (f.title || '') + (f.description || '') === key)) { toast('Уже в избранном'); break; }
      state.favorites.push({ ...v, _fid: Date.now() });
      save(); refreshFavs();
      toast('Сохранено в избранное');
      break;
    }

    case 'batch-mark-posted': {
      const i = +el.dataset.i;
      const item = state.batchResults[i];
      if (!item?.variant) break;
      const recId = Date.now();
      state.db.push({
        id: recId, product: item.variant._product || currentProductName(state.form), region: item.region,  // F4: товар из варианта
        title: item.variant.title || '', description: item.variant.description || '',
        status: 'active', note: '', date: new Date().toLocaleDateString('ru'),
        _chain: item.variant._chain || null,
      });
      save();
      jlog('posted', item.variant._chain || null, {
        product: item.variant._product || null, category: item.variant._category || null, region: item.region,
        title: item.variant.title || '', scan: jScanLevel(item.variant),
      });
      toast('Отмечено как размещено: ' + item.region);
      showFinalDialog(recId);
      break;
    }

    case 'db-final':
      showFinalDialog(+el.dataset.id); break;

    case 'ref-add': {
      const title = (document.getElementById('ref-title')?.value || '').trim();
      const desc  = (document.getElementById('ref-desc')?.value || '').trim();
      if (!title && !desc) { toast('Вставьте название и/или описание эталона'); break; }
      const source = document.getElementById('ref-source')?.value || 'mine';
      const category = document.getElementById('ref-cat')?.value || 'other';
      state.refs.push({ id: Date.now(), source, category, title, desc, date: new Date().toLocaleDateString('ru') });
      save();
      jlog('reference_added', null, { source, category, title, description: desc });
      toast('Эталон сохранён');
      renderDb();
      break;
    }

    case 'ref-del': {
      const rid = +el.dataset.id;
      const ref = state.refs.find(r => r.id === rid);
      if (!ref) break;
      if (!confirm('Удалить эталон? Текст уже в журнале, но из этого списка пропадёт.')) break;
      state.refs = state.refs.filter(r => r.id !== rid);
      save(); renderDb();
      break;
    }

    case 'db-export': {
      const blob = new Blob([JSON.stringify(state.db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (state.settings.pageName || 'page').replace(/[^a-zа-яё0-9]/gi, '_').toLowerCase();
      a.download = `avito-db-${slug}-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const act = el.dataset.act;
  if (!act) return;

  if (act === 'cat') {
    state.form.category = el.value; save(); reForm(); return;
  }
  if (act === 'field') {
    state.form[el.dataset.k] = el.value;
    if (el.dataset.k === 'subType') {
      const t = el.value;
      if (t.startsWith('PS Plus')) state.form.platforms = ['PS4', 'PS5'];
      else if (t === 'Game Pass Ultimate') state.form.platforms = ['Xbox'];
      else if (t === 'EA Play') state.form.platforms = ['PS4', 'PS5', 'Xbox'];
      save(); reForm(); return;
    }
    save(); return;
  }
  if (act === 'dur-period') {
    state.form.durations[+el.dataset.i].period = el.value; save(); return;
  }
  if (act === 'dur-price') {
    state.form.durations[+el.dataset.i].price = el.value; save(); return;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  const act = el.dataset.act;
  if (act === 'field') {
    state.form[el.dataset.k] = el.value;
    clearTimeout(el._t); el._t = setTimeout(save, 400);
  }
  if (act === 'dur-price') {
    state.form.durations[+el.dataset.i].price = el.value;
    clearTimeout(el._t); el._t = setTimeout(save, 400);
  }
  if (el.id === 'cv-tz-scale') {
    let img;
    if (cv.mode === 'game' && cv.images.length) img = cv.images[0];
    else if (cv._selCell !== null && cv._selCell !== undefined) img = cv.images[cv._selCell];
    if (!img) return;
    if (!img.transform) img.transform = {scale:1,ox:0,oy:0};
    img.transform.scale = Math.max(1, Math.min(4, +el.value / 100));
    const valEl = document.getElementById('cv-tz-scale-val');
    if (valEl) valEl.textContent = el.value + '%';
    const c = document.getElementById('cv-canvas');
    if (c) { cv.mode === 'game' ? cvDrawGame(c, img, {}) : cvDrawCollage(c); }
    return;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════

render();

// Журнал: маркер запуска (по нему при разборе режутся «рабочие заходы») + отправка накопленного буфера
jlog('app_start', null, {
  w: window.innerWidth, results: state.results.length, queue: state.postQueue.length,
  favs: state.favorites.length, db: state.db.length,
});
jFlush();

// GFX-13: шрифты грузятся асинхронно — если канвас с текстом успел отрисоваться
// на системном fallback раньше, чем догрузился self-host шрифт, перерисовать заново
document.fonts?.ready.then(() => {
  const c = document.getElementById('cv-canvas');
  if (c && cv.images.length) cv.mode === 'game' ? cvDrawGame(c, cv.images[0], {}) : cvDrawCollage(c);
});
</script>
</body>
</html>
