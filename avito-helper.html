  <title>Авито-помощник</title>

    :root {
      --bg:       #1a1a2e;
      --card:     #16213e;
      --card2:    #1e293b;
      --card3:    #0f172a;
      --accent:   #B45309;
      --accent-h: #d97706;
      --accent-d: rgba(180,83,9,.15);
      --teal:     #0F766E;
      --teal-h:   #0d9488;
      --teal-d:   rgba(15,118,110,.15);
      --text:     #e2e8f0;
      --text2:    #cbd5e1;
      --muted:    #64748b;
      --border:   #1e293b;
      --border2:  #334155;
      --ok:       #10b981;
      --warn:     #f59e0b;
      --err:      #ef4444;
      --r:  12px;
      --rs: 8px;
      --ft: 'Literata', Georgia, serif;
      --fm: 'JetBrains Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ft);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 1140px; margin: 0 auto;
      display: flex; align-items: center; gap: 16px; height: 54px;
    }
    .logo {
      font-family: var(--fm); font-size: 13px; font-weight: 500;
      color: var(--accent-h); white-space: nowrap; letter-spacing: -.3px;
    }
    .logo span { color: var(--muted); }

    nav { display: flex; gap: 2px; flex: 1; }
    .tab-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: var(--ft); font-size: 14px;
      padding: 6px 14px; border-radius: var(--rs);
      transition: all .15s; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: var(--card2); }
    .tab-btn.active { color: var(--accent-h); background: var(--accent-d); font-weight: 600; }
    .tab-btn.dimmed { opacity: .45; cursor: default; }

    .ai-btn {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; padding: 4px 10px; border-radius: var(--rs);
      font-family: var(--fm); font-size: 12px; transition: all .15s; white-space: nowrap;
    }
    .ai-btn:hover { color: var(--text); border-color: var(--accent); }
    .ai-btn.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }

    main {
      flex: 1; max-width: 1140px; margin: 0 auto;
      width: 100%; padding: 20px;
    }

    /* ── Settings Panel ── */
    .settings-panel {
      background: var(--card); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 16px 20px; margin-bottom: 18px;
      display: none;
    }
    .settings-panel.open { display: block; }
    /* UX-14: та же панель провайдера/модели, но всегда открыта прямо в форме генератора */
    .ai-inline-panel {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px;
    }
    .settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    /* UX-15: «Ещё варианты» — визуально отделённый блок под основным набором */
    .extra-results-sep { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--border2); }
    .s-group { display: flex; flex-direction: column; gap: 5px; }
    .s-note { font-size: 12px; color: var(--muted); max-width: 280px; padding-top: 18px; }

    /* ── Forms ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .3px; }
    input, select, textarea {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text);
      font-family: var(--ft); font-size: 14px;
      padding: 8px 12px; outline: none; transition: border-color .15s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 76px; font-family: var(--fm); font-size: 13px; }

    .check-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 5px; cursor: pointer;
      font-size: 13px; color: var(--text2);
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; padding: 3px 11px;
      transition: all .15s; user-select: none;
    }
    .chip:hover { border-color: var(--teal); }
    .chip input[type="checkbox"] { display: none; }
    .chip.on { border-color: var(--teal); background: var(--teal-d); color: var(--text); }

    .dur-rows { display: flex; flex-direction: column; gap: 7px; }
    .dur-row { display: flex; align-items: center; gap: 7px; }
    .dur-row select { width: 140px; flex-shrink: 0; }
    .dur-row input  { width: 110px; flex-shrink: 0; }
    .btn-icon {
      background: none; border: 1px solid var(--border2); color: var(--muted);
      cursor: pointer; width: 28px; height: 28px; border-radius: var(--rs);
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .btn-icon:hover { color: var(--err); border-color: var(--err); }
    .btn-add {
      background: none; border: 1px dashed var(--border2); color: var(--muted);
      cursor: pointer; padding: 5px 11px; border-radius: var(--rs);
      font-size: 12px; transition: all .15s; width: fit-content; margin-top: 4px;
    }
    .btn-add:hover { border-color: var(--teal); color: var(--teal); }

    /* Style pills & count */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: 20px; color: var(--muted); cursor: pointer;
      font-size: 13px; padding: 3px 12px; transition: all .15s; user-select: none;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .count-btns { display: flex; gap: 4px; }
    .cnt-btn {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-family: var(--fm); font-size: 14px;
      padding: 4px 14px; transition: all .15s;
    }
    .cnt-btn:hover { border-color: var(--accent); color: var(--text); }
    .cnt-btn.on { border-color: var(--accent); background: var(--accent-d); color: var(--accent-h); }

    .btn-gen {
      background: var(--accent); border: none; border-radius: var(--rs);
      color: #fff; cursor: pointer; font-family: var(--ft);
      font-size: 15px; font-weight: 600; padding: 11px 24px;
      width: 100%; transition: all .15s; margin-top: 2px;
    }
    .btn-gen:hover { background: var(--accent-h); transform: translateY(-1px); }
    .btn-gen:active { transform: none; }
    .btn-gen:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .btn-gen-secondary {
      background: transparent; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-family: var(--ft);
      font-size: 12.5px; padding: 7px 14px; width: 100%; margin-top: 6px; transition: all .15s;
    }
    .btn-gen-secondary:hover { border-color: var(--accent); color: var(--text); }
    .btn-gen-secondary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Title-first step (шаг 1 из 2) ── */
    .title-step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .title-step-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card3); border: 1px solid var(--border2); border-radius: var(--rs);
      padding: 10px 12px; cursor: pointer; transition: all .15s;
    }
    .title-step-item:hover { border-color: var(--accent); }
    .title-step-item.on { border-color: var(--accent); background: var(--accent-d); }
    .title-step-text { flex: 1; font-size: 14px; }

    /* ── Generator layout ── */
    .gen-wrap {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px; align-items: start;
    }
    @media (max-width: 780px) { .gen-wrap { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 18px;
    }
    .card + .card { margin-top: 16px; }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text2);
      margin-bottom: 14px; letter-spacing: .3px;
    }
    .form-body { display: flex; flex-direction: column; gap: 13px; }

    /* ── Results ── */
    .results-list { display: flex; flex-direction: column; gap: 14px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px;
      color: var(--muted); gap: 8px; font-size: 14px;
    }
    .empty-state .ico { font-size: 36px; opacity: .3; }

    .loading-box {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 180px; gap: 12px;
      color: var(--muted); font-size: 14px;
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-box {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3);
      border-radius: var(--rs); color: var(--err); font-size: 13px; padding: 12px 15px;
    }

    /* ── Variant card ── */
    .vcard {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; transition: border-color .15s;
    }
    .vcard:hover { border-color: var(--border2); }
    .vcard.is-fav { border-color: rgba(180,83,9,.4); }

    .vcard-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .vnum {
      font-family: var(--fm); font-size: 10px; color: var(--muted);
      background: var(--card3); padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    }
    .scan-badge { font-size: 12px; cursor: help; flex-shrink: 0; }
    .results-product-badge {
      display: inline-block; margin: 8px 0 2px; padding: 4px 11px; border-radius: 8px;
      background: var(--card3); border: 1px solid var(--border2);
      font-size: 12px; color: var(--text2); font-weight: 600; letter-spacing: .2px;
    }
    .vtags { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .vtag {
      font-size: 10px; padding: 1px 6px; border-radius: 3px;
      background: var(--card3); color: var(--muted); border: 1px solid var(--border2);
    }
    .vcard-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .btn-sm {
      background: none; border: 1px solid var(--border2); border-radius: var(--rs);
      color: var(--muted); cursor: pointer; font-size: 11px;
      padding: 3px 8px; transition: all .15s; white-space: nowrap;
    }
    .btn-sm:hover { color: var(--text); }
    .btn-sm.fav-on { border-color: var(--accent); color: var(--accent-h); }
    .btn-sm:disabled { opacity: .5; cursor: not-allowed; }

    /* Title */
    .title-row { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 4px; }
    .title-val {
      font-family: var(--fm); font-size: 14px; font-weight: 500;
      color: var(--text); flex: 1; line-height: 1.4; word-break: break-word;
    }
    .tlen {
      font-family: var(--fm); font-size: 10px; padding: 2px 6px;
      border-radius: 3px; flex-shrink: 0; margin-top: 2px;
    }
    .tlen.ok   { background: rgba(16,185,129,.12); color: var(--ok); }
    .tlen.warn { background: rgba(245,158,11,.12);  color: var(--warn); }
    .tlen.over { background: rgba(239,68,68,.12);   color: var(--err); }

    hr.div { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    .desc-label {
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
    }
    .desc-val {
      font-size: 13px; color: var(--text2);
      white-space: pre-wrap; word-break: break-word; line-height: 1.7;
    }

    .copy-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .btn-copy {
      background: var(--card3); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 4px 10px; transition: all .18s;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-copy:hover { border-color: var(--teal); color: var(--teal); }
    .btn-copy.copied {
      border-color: var(--ok); color: var(--ok); background: rgba(16,185,129,.1);
    }

    /* Favorites */
    .sec-title {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .7px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
    }
    .sec-badge {
      background: var(--accent-d); color: var(--accent-h);
      border-radius: 10px; font-size: 10px; padding: 1px 7px;
    }
    .fav-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

    /* Conveyor mode */
    .conv-mode-toggle {
      float: right; background: none; border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 3px 9px; transition: all .15s;
    }
    .conv-mode-toggle:hover { color: var(--text); border-color: var(--accent); }
    .conv-mode-toggle.active { color: var(--accent-h); border-color: var(--accent); background: var(--accent-d); }
    .conv-wrap { display: flex; flex-direction: column; gap: 14px; }
    .conv-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .conv-nav-btn {
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text2); cursor: pointer;
      font-size: 20px; line-height: 1; padding: 8px 20px; transition: all .15s; flex-shrink: 0;
    }
    .conv-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-h); }
    .conv-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
    .conv-counter { font-family: var(--fm); font-size: 13px; color: var(--muted); text-align: center; }
    .conv-title {
      font-family: var(--fm); font-size: 17px; font-weight: 600;
      color: var(--text); line-height: 1.4; word-break: break-word;
    }
    .conv-tlen-row { display: flex; justify-content: flex-end; margin-top: 5px; }
    .conv-desc {
      font-size: 13px; color: var(--text2); white-space: pre-wrap;
      word-break: break-word; line-height: 1.7; max-height: 260px; overflow-y: auto;
      background: var(--card3); border-radius: var(--rs); padding: 12px;
    }
    .conv-btn {
      width: 100%; padding: 13px; border-radius: var(--rs); cursor: pointer;
      font-family: var(--ft); font-size: 15px; font-weight: 600; border: none;
      transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .conv-btn-title { background: var(--teal); color: #fff; }
    .conv-btn-title:hover { background: var(--teal-h); }
    .conv-btn-title.copied { background: var(--ok); }
    .conv-btn-desc { background: var(--accent); color: #fff; }
    .conv-btn-desc:hover { background: var(--accent-h); }
    .conv-btn-desc.copied { background: var(--ok); }
    .conv-btn-photo {
      background: var(--card2); border: 1px solid var(--border2); color: var(--text2);
      flex: 0 0 auto; width: auto; padding: 13px 18px;
    }
    .conv-btn-photo:hover { border-color: var(--border2); color: var(--text); }
    .conv-actions-row { display: flex; gap: 8px; }
    .conv-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Batch mode */
    .preset-bar { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .preset-bar select { flex: 1; min-width: 0; }
    .btn-preset-save { padding: 7px 13px; font-size: 12px; background: var(--card3); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text2); cursor: pointer; white-space: nowrap; }
    .btn-preset-save:hover { border-color: var(--accent); color: var(--accent-h); }
    .preset-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r); background: var(--card2); border: 1px solid var(--border); }
    .preset-item-name { flex: 1; font-size: 13px; color: var(--text); }
    .preset-item-meta { font-size: 11px; color: var(--muted); }
    /* ── Редактор категорий (конструктор, направление 1) ── */
    .cat-ed-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cat-ed-bar select { width: auto; min-width: 190px; }
    .cat-ed-note { font-size: 11.5px; color: var(--muted); background: var(--card2); border: 1px dashed var(--border2); border-radius: var(--r); padding: 7px 10px; }
    .cat-ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cat-ed-fields-title { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 4px; }
    .cat-ed-fields { display: flex; flex-direction: column; gap: 7px; }
    .cat-ed-soon { font-size: 10.5px; color: var(--teal-h); font-weight: 400; margin-left: 5px; }
    .cat-fld { background: var(--card2); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
    .cat-fld.off { opacity: .55; }
    .cat-fld-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .cat-fld-num { font-size: 11px; color: var(--muted); min-width: 14px; }
    .cat-fld-type { font-size: 11.5px; color: var(--teal-h); background: var(--card3); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
    .cat-fld-type-sel { width: auto; font-size: 12px; padding: 4px 7px; }
    .cat-fld-label { flex: 1; min-width: 130px; font-size: 13px; }
    .cat-fld-key { font-family: var(--mono, monospace); font-size: 10.5px; color: var(--muted); }
    .cat-fld-body { display: flex; flex-direction: column; gap: 7px; padding-left: 21px; }
    .cat-fld-sub { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text2); }
    .cat-fld-note { font-size: 11.5px; color: var(--muted); }
    .cat-fld-flags { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .cat-rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 5px 14px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r); padding: 9px 11px; }
    .cat-fld-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; }
    .cat-fld-chk input { accent-color: var(--teal); width: 14px; height: 14px; }
    .cat-fld-chk input:disabled { cursor: not-allowed; }
    .cat-fld-p { max-width: 230px; font-size: 12px; }
    .cat-dirty { box-shadow: 0 0 0 2px var(--accent); }
    @media (max-width: 720px) { .cat-ed-grid { grid-template-columns: 1fr; } .cat-fld-body { padding-left: 0; } }
    /* ── Vision: распознавание товара по фото (направление 2а, план сближения с Айдентикой) ── */
    .vision-card { background: var(--card2); border: 1px solid var(--border2); border-radius: var(--r); padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
    .vision-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .vision-head b { font-size: 13.5px; color: var(--text); }
    .vision-hint { font-size: 11px; color: var(--muted); }
    .vision-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .vision-pick { display: flex; align-items: center; justify-content: center; width: 74px; height: 74px; flex: none; border-radius: var(--rs); border: 2px dashed var(--border2); background: var(--card3); color: var(--muted); font-size: 20px; cursor: pointer; overflow: hidden; transition: all .15s; }
    .vision-pick:hover { border-color: var(--teal); color: var(--teal); }
    .vision-pick.busy { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .vision-pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vision-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .vision-btn { padding: 6px 12px; font-size: 12px; border-radius: var(--rs); background: var(--card3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; font-family: var(--ft); white-space: nowrap; transition: all .15s; }
    .vision-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal-h); }
    .vision-btn:disabled { opacity: .45; cursor: not-allowed; }
    .vision-btn-main { background: var(--teal-d); border-color: var(--teal); color: var(--teal-h); }
    .vision-res { background: var(--card3); border: 1px solid var(--border); border-radius: var(--rs); padding: 9px 11px; display: flex; flex-direction: column; gap: 7px; }
    .vision-res-top { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .vision-conf { font-size: 10.5px; font-family: var(--fm); border-radius: 10px; padding: 1px 7px; border: 1px solid; }
    .vision-res-sub { font-size: 11.5px; color: var(--muted); }
    .vision-price-box { border-top: 1px dashed var(--border2); padding-top: 7px; font-size: 12.5px; color: var(--text2); display: flex; flex-direction: column; gap: 5px; }
    .vision-err { font-size: 12px; color: var(--err); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); border-radius: var(--rs); padding: 7px 10px; }

    .batch-toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .batch-toggle-label { font-size: 13px; color: var(--text2); cursor: pointer; user-select: none; }
    .batch-regions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .batch-reg-chip {
      font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border2); background: var(--card2); color: var(--text2);
      transition: all .15s;
    }
    .batch-reg-chip.on { background: var(--teal-d); border-color: var(--teal); color: var(--teal-h); }
    .batch-reg-chip:hover:not(.on) { border-color: var(--border2); color: var(--text); }
    .batch-header {
      font-size: 12px; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .batch-table { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .batch-row {
      border-bottom: 1px solid var(--border); background: var(--card2);
    }
    .batch-row:last-child { border-bottom: none; }
    .batch-row-head {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
      transition: background .12s;
    }
    .batch-row-head:hover { background: var(--card3); }
    .batch-row.expanded .batch-row-head { background: var(--card3); }
    .batch-region-badge {
      font-family: var(--fm); font-size: 11px; color: var(--teal-h);
      background: var(--teal-d); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; min-width: 80px; text-align: center;
    }
    .batch-title-preview {
      font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .batch-tlen { font-family: var(--fm); font-size: 10px; flex-shrink: 0; }
    .batch-row-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .batch-row-body {
      display: none; padding: 0 12px 12px; flex-direction: column; gap: 8px;
    }
    .batch-row.expanded .batch-row-body { display: flex; }
    .batch-desc-box {
      font-size: 12px; color: var(--text2); white-space: pre-wrap; word-break: break-word;
      line-height: 1.65; max-height: 200px; overflow-y: auto;
      background: var(--card3); border-radius: var(--rs); padding: 10px;
    }
    .batch-copy-row { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Queue tab */
    .queue-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 700px; margin: 0 auto; }
    .queue-form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .queue-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media(max-width:560px) { .queue-form-grid { grid-template-columns: 1fr; } }
    .queue-source-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .queue-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .queue-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-item-num { font-family: var(--fm); font-size: 11px; color: var(--muted); min-width: 22px; }
    .queue-item-product { font-size: 13px; color: var(--text); flex: 1; }
    .queue-item-region { font-family: var(--fm); font-size: 11px; color: var(--teal-h); background: var(--teal-d); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
    .queue-item-source { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .queue-empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 16px; text-align: center; }

    /* Session wizard */
    #session-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 500;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .session-header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .session-progress-wrap { flex: 1; }
    .session-progress-bar {
      height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; margin-top: 5px;
    }
    .session-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
    .session-counter { font-family: var(--fm); font-size: 12px; color: var(--muted); }
    .session-body { flex: 1; padding: 24px 20px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .session-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .session-region-badge { display: inline-block; font-family: var(--fm); font-size: 13px; color: var(--teal-h); background: var(--teal-d); padding: 3px 10px; border-radius: 6px; margin-bottom: 6px; }
    .session-product { font-size: 15px; color: var(--text2); }
    .session-title-val { font-family: var(--fm); font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.4; word-break: break-word; margin-bottom: 6px; }
    .session-desc-val { font-size: 13px; color: var(--text2); white-space: pre-wrap; word-break: break-word; line-height: 1.7; max-height: 240px; overflow-y: auto; background: var(--card3); border-radius: var(--rs); padding: 12px; }
    .session-actions { display: flex; flex-direction: column; gap: 8px; }
    .session-btn-done { background: var(--ok); color: #fff; border: none; border-radius: var(--rs); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .session-btn-done:hover { opacity: .88; }
    .session-btn-skip { background: var(--card2); border: 1px solid var(--border2); color: var(--text2); border-radius: var(--rs); padding: 11px; font-size: 14px; cursor: pointer; transition: all .15s; }
    .session-btn-skip:hover { color: var(--text); }
    .session-done-screen { text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .session-done-ico { font-size: 52px; }

    /* Coming soon */
    .soon {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 300px; gap: 10px; color: var(--muted);
    }
    .soon .ico { font-size: 44px; opacity: .25; }
    .soon h2 { font-size: 18px; color: var(--text2); }
    .soon p { font-size: 14px; max-width: 280px; text-align: center; }

    /* Toast */
    #toast {
      position: fixed; bottom: 22px; right: 22px;
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--rs); color: var(--text);
      font-size: 13px; padding: 9px 15px;
      opacity: 0; transform: translateY(6px);
      transition: all .2s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Covers Module ── */
    .cv-wrap { display: grid; grid-template-columns: 310px 1fr; gap: 18px; max-width: 1140px; margin: 0 auto; padding: 24px 20px; align-items: start; }
    @media (max-width: 720px) {
      .cv-wrap { grid-template-columns: 1fr; }
      /* GFX-9: превью — первым, липнет сверху во время прокрутки настроек, а не прячется внизу */
      .cv-preview-wrap { order: -1; top: 8px; }
    }
    .cv-mode-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
    .tab-pill { flex: 1; padding: 8px 0; border-radius: var(--rs); background: var(--card2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; font-family: var(--ft); font-size: 13px; font-weight: 500; transition: all .15s; text-align: center; }
    .tab-pill.active { background: var(--accent-d); color: var(--accent-h); border-color: var(--accent); }
    .tab-pill:not(.active):hover { border-color: var(--teal); color: var(--teal-h); }
    .cv-controls { display: flex; flex-direction: column; gap: 12px; }
    .cv-drop { border: 2px dashed var(--border2); border-radius: var(--r); min-height: 96px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s; }
    .cv-drop:hover { border-color: var(--teal); }
    .cv-drop-hint { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; pointer-events: none; }
    .cv-drop-hint small { font-size: 11px; }
    .cv-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .cv-thumb { position: relative; width: 64px; height: 64px; border-radius: var(--rs); overflow: hidden; border: 1px solid var(--border2); }
    .cv-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cv-thumb-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.75); color: #fff; border: none; border-radius: 50%; width: 17px; height: 17px; cursor: pointer; font-size: 11px; line-height: 17px; text-align: center; padding: 0; }
    .cv-thumb-add { display: flex; align-items: center; justify-content: center; background: var(--card2); color: var(--muted); font-size: 20px; cursor: pointer; border: 2px dashed var(--border2); transition: all .15s; }
    .cv-thumb-add:hover { border-color: var(--teal); color: var(--teal); }
    .cv-layouts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cv-layout-btn { padding: 5px 11px; border-radius: var(--rs); background: var(--card2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; font-size: 12px; font-family: var(--fm); transition: all .15s; }
    .cv-layout-btn:hover { border-color: var(--teal); color: var(--teal-h); }
    .cv-layout-btn.active { background: var(--teal-d); color: var(--teal-h); border-color: var(--teal); }
    .cv-layout-thumb { padding: 5px 6px 4px; display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
    .cv-layout-btn.dimmed { opacity: .3; cursor: default; }
    .cv-layout-thumb svg { display: block; }
    .cv-layout-thumb .cv-layout-label { font-size: 9px; font-family: var(--fm); color: var(--muted); white-space: nowrap; line-height: 1; }
    .cv-layout-thumb.active .cv-layout-label { color: var(--teal-h); }
    .cv-layout-thumb.active svg rect, .cv-layout-thumb.active svg circle { fill: var(--teal-d); stroke: var(--teal); }
    .cv-bg-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .cv-color { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; transition: all .12s; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .cv-color:hover { transform: scale(1.18); }
    .cv-color.active { outline: 2px solid var(--accent-h); outline-offset: 2px; }
    .cv-color-pick { background: var(--card2); border: 1px dashed var(--border2); position: relative; overflow: hidden; }
    .cv-color-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .cv-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .cv-row label { min-width: 76px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
    .cv-row input[type=range] { flex: 1; accent-color: var(--teal); }
    .cv-val { font-family: var(--fm); font-size: 12px; color: var(--muted); min-width: 34px; }
    .cv-preview-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: sticky; top: 58px; align-self: start; }
    .cv-empty { color: var(--muted); font-size: 13px; font-style: italic; text-align: center; padding: 52px 0; }
    .cv-no-image { color: var(--muted); font-size: 13px; font-style: italic; text-align: center; padding: 32px; grid-column: 1/-1; }
    .cv-vars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cv-var { display: flex; flex-direction: column; gap: 6px; }
    .cv-var canvas { max-width: 100%; height: auto; border-radius: var(--rs); display: block; }
    .cv-var-label { font-size: 12px; color: var(--text2); font-family: var(--fm); }
    .cv-layout-sep { width: 100%; font-size: 10px; color: var(--muted); padding: 6px 2px 0; font-family: var(--fm); letter-spacing: .4px; text-transform: uppercase; border-top: 1px solid var(--border); margin-top: 4px; }
    .cv-swap-hint { font-size: 11px; color: var(--muted); font-style: italic; text-align: center; padding: 4px 0; }
    #cv-canvas { max-width: 100%; max-height: calc(100vh - 120px); height: auto; width: auto; border-radius: var(--r); display: block; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .cv-transform-bar { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 6px 8px; background: var(--card2); border-radius: var(--rs); border: 1px solid var(--border2); }
    .cv-tz-label { font-family: var(--fm); font-size: 11px; color: var(--accent-h); white-space: nowrap; }
    .cv-tz-sep { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .cv-tz-btn { padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border2); background: var(--card3); color: var(--text); cursor: pointer; font-size: 14px; line-height: 1.5; transition: all .12s; }
    .cv-tz-btn:hover { border-color: var(--teal); color: var(--teal-h); }
    .cv-tz-range { flex: 1; min-width: 70px; accent-color: var(--teal); cursor: pointer; }
    .cv-tz-val { font-family: var(--fm); font-size: 10px; color: var(--muted); min-width: 30px; text-align: right; }
    .toggle-btn { padding: 4px 14px; border-radius: var(--rs); cursor: pointer; font-size: 13px; border: 1px solid var(--border2); font-family: var(--ft); background: var(--card2); color: var(--muted); transition: all .15s; }
    .toggle-btn.on { background: var(--teal-d); color: var(--teal-h); border-color: var(--teal); }

    /* ── Database Module ── */
    .db-wrap { max-width: 1140px; }
    .db-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .db-page-name { font-family: var(--fm); font-size: 13px; color: var(--muted); }
    .db-table-wrap { overflow-x: auto; }
    table.db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .db-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border2); text-align: left; white-space: nowrap; font-weight: 600; }
    .db-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .db-table tr:last-child td { border-bottom: none; }
    .db-table tr:hover td { background: var(--card2); }
    .db-table tr.db-row-edit td { background: rgba(180,83,9,.08); }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .status-badge.ok   { background: rgba(16,185,129,.12); color: var(--ok); }
    .status-badge.warn { background: rgba(245,158,11,.12);  color: var(--warn); }
    .status-badge.muted { background: var(--card3); color: var(--muted); }
    .db-product { font-weight: 500; }
    .db-note { color: var(--text2); font-size: 12px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .db-hint { font-size: 12px; padding: 4px 0 0; min-height: 18px; }
    .db-hint .used { color: var(--warn); }
    .db-hint .free { color: var(--ok); }

// Типы полей, которые форма умеет рисовать. Всё, чего здесь нет (например,

// значит и требовать его в валидации нельзя, иначе человек увидит «не хватает…»
// про поле, которого на экране нет.
const FIELD_TYPES = ['text', 'num', 'area', 'select', 'chips', 'toggle', 'durations', 'subGames'];
// Типы, доступные в конструкторе категорий. durations/subGames — кодовые:

  { id: 'area',   label: 'Многострочное' },

];
const CODE_FIELD_TYPES = ['durations', 'subGames'];

// Список опций поля: у встроенных это функция (список живёт в коде и может
// меняться), у собранных в конструкторе — обычный массив из localStorage.
function fdOptions(fd) {
  const o = fd.options;
  if (typeof o === 'function') { try { return o() || []; } catch(e) { return []; } }
  return Array.isArray(o) ? o : [];
}

// CATS пересобирается из встроенных + пользовательских: категория — это данные,
// новая заводится в Настройках без правок кода. Потребители (селект формы,
// catDef, Сканер, эталоны) читают CATS как раньше и о слоях не знают.
let CATS = BUILTIN_CATS.slice();

// Категория по id. Неизвестная (например, удалённая пользовательская, оставшаяся
// в сохранённой форме) не должна ронять рендер — отдаём первую. Дескриптор без
// fields (битый импорт JSON) тоже не должен ронять: подставляем пустой список.
function catDef(id) {
  const c = CATS.find(x => x.id === id) || CATS[0] || {};
  return Array.isArray(c.fields) ? c : { ...c, fields: [] };
}

// Значение поля с безопасным дефолтом по типу: у пользовательской категории
// ключа может ещё не быть в сохранённой форме.
function fieldVal(f, fd) {
  const v = f[fd.key];
  if (fd.type === 'chips') return Array.isArray(v) ? v : [];
  if (fd.type === 'toggle') return !!v;
  return v == null ? '' : v;
}

// ── Конструктор категорий (этап 2) ────────────────────────────────
// Встроенные категории правятся ОВЕРЛЕЕМ (патчем), а не копией: заводской
// дескриптор остаётся источником правды, патч хранит только отличия — поэтому
// «сбросить к заводской» это просто удалить патч, а будущие правки заводских
// категорий в коде доезжают до Дениса, а не замораживаются его копией.

// Поле из data-вида (localStorage / импорт JSON) в дескриптор движка.
function fieldFromData(d) {
  const fd = { key: d.key, type: d.type, label: d.label || d.key };
  if (d.ph) fd.ph = d.ph;
  if (d.rows) fd.rows = d.rows;
  if (Array.isArray(d.options)) fd.options = d.options;
  if (d.hint) fd.hint = d.hint;
  if (d.isName) fd.isName = true;
  if (d.isPrice) fd.isPrice = true;
  // p — подпись в промпте. Пустая (снят флаг «в промпт») означает: поле в промпт
  // не идёт. Так живёт цена игры — по правилам площадки её нет в тексте объявления.
  if (d.p) { fd.p = d.p; if (d.pSuffix) fd.pSuffix = d.pSuffix; if (d.pEmpty) fd.pEmpty = d.pEmpty; }
  if (d.req) fd.req = d.reqText || (d.label || d.key).toLowerCase();
  return fd;
}

// Применение патча к встроенной категории. Без патча — возвращаем заводской
// объект как есть (ссылкой), чтобы поведение осталось байт-в-байт прежним.
function applyCatPatch(base, p) {
  if (!p || typeof p !== 'object') return base;
  const c = { ...base };
  if (p.label) c.label = p.label;
  if (p.pName) c.pName = p.pName;

  const fp = p.fields || {};
  let fields = base.fields
    .filter(fd => !fp[fd.key]?.hidden)
    .map(fd => {
      const patch = fp[fd.key];
      if (!patch) return fd;
      const out = { ...fd };
      if (patch.label) out.label = patch.label;
      if (patch.ph != null) out.ph = patch.ph;
      if (patch.isPrice) out.isPrice = true;
      // Снять обязательность можно только у поля с простым req: за reqCheck
      // (сроки и цены, каталог игр) стоит логика, а не галочка.
      if (patch.req === false && out.req) delete out.req;
      if (patch.isName) out.isName = true;
      return out;
    });
  // Свои поля, дописанные к встроенной категории
  if (Array.isArray(p.add)) fields = fields.concat(p.add.map(fieldFromData));
  // Порядок: ключи из order идут первыми в заданном порядке, остальные — следом
  if (Array.isArray(p.order) && p.order.length) {
    const pos = k => { const i = p.order.indexOf(k); return i === -1 ? 1e6 : i; };
    fields = fields.slice().sort((a, b) => pos(a.key) - pos(b.key));
  }
  c.fields = fields;

  // Своё правило промпта дописывается ПОСЛЕ заводского (у игры это блок предзаказа)
  if (p.extraText) {
    const baseExtra = base.extra;
    c.extra = f => (baseExtra ? baseExtra(f) : '') + '\n' + p.extraText;
  }
  if (Array.isArray(p.scanRequire) && p.scanRequire.length) c.scanRequire = p.scanRequire;
  if (Array.isArray(p.scanForbid)  && p.scanForbid.length)  c.scanForbid  = p.scanForbid;
  // Патч правил — поверх заводского набора категории, а не вместо него:
  // иначе снятая одна галочка обнулила бы остальные заводские значения
  if (p.scanRules && Object.keys(p.scanRules).length) c.scanRules = { ...(base.scanRules || {}), ...p.scanRules };
  if (p.visionHint) c.visionHint = p.visionHint;
  return c;
}

// Пользовательская категория целиком из данных.
function catFromData(d) {
  const c = {
    id: d.id, label: d.label || d.id, pName: d.pName || d.label || d.id,
    fields: Array.isArray(d.fields) ? d.fields.map(fieldFromData) : [],
  };
  if (d.extraText) c.extra = () => '\n' + d.extraText;
  if (Array.isArray(d.scanRequire) && d.scanRequire.length) c.scanRequire = d.scanRequire;
  if (Array.isArray(d.scanForbid)  && d.scanForbid.length)  c.scanForbid  = d.scanForbid;
  if (d.scanRules && typeof d.scanRules === 'object') c.scanRules = d.scanRules;
  if (d.visionHint) c.visionHint = d.visionHint;
  return c;
}

// Пересобрать CATS из заводских + оверлея. Зовётся при старте и после каждой
// правки в редакторе категорий.
function rebuildCats() {
  const cfg = (typeof state !== 'undefined' && state.catsCfg) || {};
  const builtin = cfg.builtin || {};
  const custom  = Array.isArray(cfg.custom) ? cfg.custom : [];
  const seen = new Set(BUILTIN_CATS.map(c => c.id));
  CATS = BUILTIN_CATS.map(c => applyCatPatch(c, builtin[c.id]))
    .concat(custom
      // id пользовательской категории не должен затенять встроенную — иначе
      // catDef отдал бы её вместо заводской, а форма молча лишилась бы полей
      .filter(d => d && d.id && !seen.has(d.id) && (seen.add(d.id), true))
      .map(catFromData));
}

function ls(key, def) {
  try {
    const v = localStorage.getItem(key);
    if (v) {
      const parsed = JSON.parse(v);
      // Merge arrays carefully: if def is array, use parsed if array, else def
      if (Array.isArray(def)) return Array.isArray(parsed) ? parsed : def;
      return typeof parsed === 'object' ? { ...def, ...parsed } : def;
    }
  } catch(e) {}
  return typeof def === 'object' && !Array.isArray(def) ? { ...def } : def;
}

function save() {
  try {
    _saveAll();
  } catch(e) {
    // Упёрлись в квоту localStorage: часть ключей записана, часть нет — на F5 это

    // всегда уступает: сбрасываем его буфер и повторяем запись целиком.
    try { jPurgeBuffer(); _saveAll(); } catch(e2) {}

}

// ══════════════════════════════════════════
// ЖУРНАЛ САМООБУЧЕНИЯ (методика bot-selflearn-log)
// Сырьё — в журнал, смысл — постфактум. Каждое событие: что инструмент
// сгенерировал, что Денис выбрал/скопировал/перегенерил/скачал/донёс с Авито.
// События уходят батчами на VPS (/api/journal, тот же админ-токен) — журналы
// телефона и ПК стекаются в один. Пока сети/токена/эндпоинта нет — копятся
// в локальном буфере (localStorage) и уходят при первой возможности.
// ЖЕЛЕЗНОЕ ПРАВИЛО: журнал не имеет права уронить основной поток — всё в try/catch,
// и токен журнал НИКОГДА не запрашивает сам (только пользуется уже сохранённым).
// ══════════════════════════════════════════

const J_BUF_KEY   = 'avito_journal_buf';
const J_OFF_KEY   = 'avito_journal_off';
// Кап буфера сознательно небольшой: localStorage делится с реальными данными
// продавца (результаты, избранное, очередь, история). Журнал ОБЯЗАН уступать им
// место — при рабочем эндпоинте буфер живёт секунды, большой запас нужен только
// на офлайн/до-деплойный период, и ~0.8МБ (400k символов UTF-16) его закрывают.
const J_MAX_BYTES   = 400000;
const J_BATCH_MAX   = 40;     // событий в одном POST
const J_BATCH_BYTES = 300000; // и не больше ~0.6МБ телом — иначе упрёмся в лимит body на прокси
const J_FORCE_MS    = 30000;  // старейшее неотправленное ждёт не дольше этого, даже если клики идут потоком
const J_FORCE_COUNT = 25;

let _jBuf = (() => { try { const v = JSON.parse(localStorage.getItem(J_BUF_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } })();
let _jBufBytes = _jBuf.reduce((s, e) => s + JSON.stringify(e).length, 0);
let _jDropped = 0;
let _jOldestAt = _jBuf.length ? Date.now() : 0;

// Ид устройства — различает телефон/ПК в общем журнале на сервере
function _jDevice() {
  try {
    let d = localStorage.getItem('avito_journal_device');
    if (!d) { d = Math.random().toString(16).slice(2, 8); localStorage.setItem('avito_journal_device', d); }
    return d;
  } catch(e) { return '?'; }
}

function jEnabled() { try { return localStorage.getItem(J_OFF_KEY) !== '1'; } catch(e) { return false; } }

function _jRecount() { _jBufBytes = _jBuf.reduce((s, ev) => s + JSON.stringify(ev).length, 0); }

function _jSaveBuf() {
  try { clearTimeout(_jSaveT); } catch(e) {}
  try { localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf)); }
  catch(e) {
    // Квота localStorage: жертвуем старой половиной буфера, но не роняем ничего
    try {
      const drop = Math.ceil(_jBuf.length / 2);
      _jDropped += drop;
      _jBuf.splice(0, drop);
      _jRecount();
      localStorage.setItem(J_BUF_KEY, JSON.stringify(_jBuf));
    } catch(e2) {}
  }
}

// Запись буфера — отложенная: сериализовать весь буфер на КАЖДЫЙ клик заметно
// подтормаживает телефон (основное устройство). Синхронно пишем только там, где
// страницу могут закрыть (visibilitychange/pagehide) и перед отправкой.
let _jSaveT = null;
function _jSaveBufSoon() { try { clearTimeout(_jSaveT); _jSaveT = setTimeout(_jSaveBuf, 800); } catch(e) { _jSaveBuf(); } }

// Аварийный сброс буфера, если в квоту localStorage упёрлись реальные данные
// продавца: журнал всегда уступает место результатам/избранному/очереди/истории.
function jPurgeBuffer() {
  try {
    _jDropped += _jBuf.length;
    _jBuf.length = 0; _jBufBytes = 0; _jOldestAt = 0;
    localStorage.removeItem(J_BUF_KEY);
  } catch(e) {}
}

function jlog(event, chainId, fields) {
  try {
    if (!jEnabled()) return;
    const e = {
      ts: new Date().toISOString(), event, chainId: chainId || null,
      device: _jDevice(), build: document.lastModified || '',
      ...(fields || {}),
    };
    if (_jDropped) { e._dropped = _jDropped; _jDropped = 0; }
    const sz = JSON.stringify(e).length;
    if (!_jBuf.length) _jOldestAt = Date.now();
    _jBuf.push(e); _jBufBytes += sz;
    while (_jBufBytes > J_MAX_BYTES && _jBuf.length > 1) {
      _jBufBytes -= JSON.stringify(_jBuf[0]).length;
      _jBuf.shift(); _jDropped++;
    }
    _jSaveBufSoon();
    _jScheduleFlush();
  } catch(err) { console.error('journal:', err); }
}

let _jFlushT = null, _jFlushing = false;
// Обычно — дебаунс 4с (склеиваем серию кликов в один POST). Но дебаунс без потолка
// голодает: во время активной работы клики идут чаще, чем раз в 4с, и отправка
// откладывалась бы бесконечно — поэтому по возрасту/количеству шлём немедленно.
function _jScheduleFlush() {
  try {
    const overdue = _jBuf.length >= J_FORCE_COUNT || (_jOldestAt && Date.now() - _jOldestAt > J_FORCE_MS);
    if (overdue) { clearTimeout(_jFlushT); jFlush(); return; }
    clearTimeout(_jFlushT); _jFlushT = setTimeout(jFlush, 4000);
  } catch(e) {}
}

// force=true — отправить, даже если журнал только что выключили (иначе уже собранные
// события навсегда осели бы в localStorage и занимали место)
async function jFlush(force) {
  try {
    if (_jFlushing || !_jBuf.length || (!force && !jEnabled())) return;
    const token = localStorage.getItem('avito_admin_token'); // не спрашиваем — только берём готовый
    if (!token) return;
    _jFlushing = true;
    try {
      // Батч ограничен и по числу событий, и по размеру тела: одно событие пакета
      // по регионам несёт полные тексты всех объявлений и может весить десятки КБ
      const batch = [];
      let bytes = 0;
      for (const ev of _jBuf) {
        const sz = JSON.stringify(ev).length;
        if (batch.length && (batch.length >= J_BATCH_MAX || bytes + sz > J_BATCH_BYTES)) break;
        batch.push(ev); bytes += sz;
      }
      _jSaveBuf(); // фиксируем состояние до сети
      const r = await fetch(PROXY_JOURNAL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ events: batch }),
      });
      // Удаляем ИМЕННО отправленные события по тождеству объектов: за время await
      // начало буфера могло сдвинуться (вытеснение по капу/квоте), и splice по
      // количеству снёс бы чужие, ещё не отправленные события.
      const drop = () => {
        const sent = new Set(batch);
        _jBuf = _jBuf.filter(ev => !sent.has(ev));
        _jRecount();
        _jOldestAt = _jBuf.length ? _jOldestAt : 0;
        _jSaveBuf();
      };
      if (r.ok) {
        drop();
        if (_jBuf.length) setTimeout(() => jFlush(force), 400); // дожимаем остаток батчами
      } else if (r.status === 400 || r.status === 413 || r.status === 422) {
        // Невосстановимое: этот батч не примут никогда. Если не выбросить — он
        // навсегда заткнёт голову очереди, а все новые события вытеснит по капу.
        drop();
        console.error('journal: батч отвергнут сервером (' + r.status + '), выброшен');
      }
      // 401/404/5xx — молчим и ждём: токен чинит callAI, эндпоинт доедет с деплоем, буфер цел
    } catch(e) { /* офлайн — буфер ждёт следующего повода */ }
    finally { _jFlushing = false; }
  } catch(e) { _jFlushing = false; }
}

// Светофор варианта для журнала — тот же уровень, что показывает бейдж
function jScanLevel(v) {
  const s = v && v._scan;
  if (!s) return null;
  return s.errors.length ? 'error' : s.warnings.length ? 'warn' : 'ok';
}

// Доля изменённого текста (0..1): 1 - 2*LCS/(a+b) по словам. Считается при
// «доносе» финального текста с Авито — что Денис стабильно правит руками.
function jEditShare(a, b) {
  try {
    const wa = String(a || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    const wb = String(b || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 800);
    if (!wa.length && !wb.length) return 0;
    if (!wa.length || !wb.length) return 1;
    let prev = new Array(wb.length + 1).fill(0);
    for (let i = 1; i <= wa.length; i++) {
      const cur = [0];
      for (let j = 1; j <= wb.length; j++) {
        cur[j] = wa[i-1] === wb[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]);
      }
      prev = cur;
    }
    const lcs = prev[wb.length];
    return Math.round((1 - (2 * lcs) / (wa.length + wb.length)) * 100) / 100;
  } catch(e) { return null; }
}

// Компактные выжимки вариантов для события generated — полные тексты (правило:
// писать то, что нельзя восстановить), плюс светофор
function jVariants(list) {
  return (list || []).map(v => ({ title: v.title || '', description: v.description || '', scan: jScanLevel(v) }));
}

// Счётчики графических действий за сессию канваса — копятся в памяти,
// уходят одной строкой вместе с cv_download (не событие-на-каждый-drag)
const _jCv = { drags: 0, layouts: 0, toggles: 0, tz: 0 };
function jCvBump(k) { try { _jCv[k] = (_jCv[k] || 0) + 1; } catch(e) {} }
function jCvTakeCounters() {
  const out = { drags: _jCv.drags, layouts: _jCv.layouts, toggles: _jCv.toggles, tz: _jCv.tz };
  _jCv.drags = 0; _jCv.layouts = 0; _jCv.toggles = 0; _jCv.tz = 0;
  return out;
}

// Снимок настроек обложки (та же фильтрация, что cvSave: без картинок и _служебных)
function jCvSnapshot() {
  try {
    const out = {};

// kind/vid/bi читаются из data-j* атрибутов кнопок копирования.
function jCopied(el) {
  try {
    const kind = el.dataset.j || 'other';
    let v = null, extra = {};
    if (el.dataset.jbi !== undefined) {
      const item = state.batchResults[+el.dataset.jbi];
      v = item && item.variant; extra.region = item && item.region;
      extra.pos = +el.dataset.jbi;
    } else if (el.dataset.jreph !== undefined) {
      // Перефраз живёт только в DOM-боксе, в state его нет
      v = document.getElementById(el.dataset.jreph)?._rephResult || null;
      extra.fromRephrase = true;
    } else if (el.dataset.jfid !== undefined) {
      v = state.favorites.find(f => f._fid === +el.dataset.jfid);
      extra.fromFav = true; // копия из избранного — не из свежего набора
    } else if (el.dataset.jvid !== undefined) {
      const vid = +el.dataset.jvid;
      v = findResult(vid);
      const pool = resultsPool();
      const pos = pool.findIndex(x => x.id === vid);
      if (pos !== -1) extra.pos = pos; // индекс варианта в наборе: побеждают первые или поздние?
      if (state.extraResults.some(x => x.id === vid)) extra.fromExtra = true; // из блока «Ещё варианты»
    } else if (el.dataset.jsess !== undefined) {
      const it = state.postSession.items[state.postSession.idx];
      v = it && it.variant; extra.region = it && it.region; extra.session = true;
    }
    jlog('copied', (v && v._chain) || null, {
      kind, category: v && v._category || null, product: v && v._product || null,
      title: v && v.title || null, titleLen: v && v.title ? [...v.title].length : null,
      scan: jScanLevel(v), ...extra,
    });
  } catch(e) { console.error('journal:', e); }
}

function getCatalogEntry(sub) {
  const c = (state.catalogs || {})[sub];
  if (!c) return { core: [], masking: [] };
  if (Array.isArray(c)) return { core: [], masking: c }; // старый формат
  return { core: Array.isArray(c.core) ? c.core : [], masking: Array.isArray(c.masking) ? c.masking : [] };
}

// Раньше отдавал один перемешанный список без различия ядро/маскировка —
// модель могла утянуть в крючок названия СЛУЧАЙНУЮ маскирующую игру (аудит Fable 5).
// Теперь ядро и маскировка возвращаются раздельно: ядро идёт в промпт как
// «единственный источник крючка», маскировка — только для тела описания.
function buildGamesLists(subType) {
  const cat = getCatalogEntry(subType);

  // Для каждой ядровой игры — рандомный вариант из списка через |
  const core = cat.core.map(line => {
    const variants = line.split('|').map(s => s.trim()).filter(Boolean);
    return variants[Math.floor(Math.random() * variants.length)] || line.trim();
  });

  // Перемешать порядок ядровых
  for (let i = core.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [core[i], core[j]] = [core[j], core[i]];
  }

  // 2–4 случайных маскирующих
  const maskCount = cat.masking.length
    ? Math.min(cat.masking.length, 2 + Math.floor(Math.random() * 3))
    : 0;
  const masking = [...cat.masking].sort(() => Math.random() - .5).slice(0, maskCount);

  return { core: core.join(', ') || null, masking: masking.join(', ') || null };
}

function buildSys(category) {
  // Своё правило категории сюда НЕ дописывается: оно уже уходит в пользовательском

// Админ-токен для прокси /api/claude и /api/openrouter — бэкенд теперь требует
// Authorization (SEC-1). Спрашивается один раз, хранится в localStorage.
function getProxyToken() {
  let t = localStorage.getItem('avito_admin_token') || '';
  if (!t) {
    t = (prompt('Введите админ-токен (тот же, что в админке магазина Поиграем):') || '').trim();
    if (t) localStorage.setItem('avito_admin_token', t);
  }
  return t;
}

async function callAI(messages, opts = {}) {
  const provider = opts.provider || state.settings.provider;
  const model    = opts.model    || state.settings.model;
  // 0.8 вместо дефолтного 1.0 — для 50-символьного названия высокая температура
  // чаще давала не крючок, а случайный набор слов (аудит Fable 5). 0.8 всё ещё
  // даёт разнообразие, нужное для антидубля между вариантами/регионами.
  const temperature = opts.temperature ?? 0.8;
  // opts.system — задача не про генерацию объявления (напр. распознавание товара по фото):
  // общий SYS с правилами Авито там только мешает, и пользовательский customSys к ней не относится.
  // opts.category — под какую категорию собирать запреты (см. buildSys). Не передали —
  // собирается прежний полный набор, то есть путь без категории деградирует безопасно.
  const sys = buildSys(opts.category);
  const system = opts.system || (state.settings.customSys ? sys + '\n\n' + state.settings.customSys : sys);

  if (provider === 'claude') {
    const caps = modelCaps(model);
    const body = { model, max_tokens: opts.max_tokens || 4000, system, messages };
    // temperature только там, где она вообще принимается: на моделях 5-го поколения
    // её присутствие — это 400, а не «проигнорируют».
    if (caps.sampling) body.temperature = temperature;
    // Размышление просим точечно (сейчас — распознавание по фото и поиск цены):
    // там модель должна подумать, а не выпалить первое впечатление.
    if (opts.thinking && caps.thinking === 'adaptive') body.thinking = { type: 'adaptive' };
    if (opts.webSearch) body.tools = [{ type: caps.webSearch, name: 'web_search' }];
    const r = await fetch(PROXY_CLAUDE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      // F13: неверный токен иначе сохранён навсегда — сбрасываем, чтобы следующий запрос переспросил
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`Claude ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    return d.content?.filter(b => b.type === 'text').map(b => b.text).join('\n') || '';
  }

  if (provider === 'openrouter') {
    if (opts.webSearch) toast('⚠️ OpenRouter не поддерживает веб-поиск бонусов предзаказа — переключитесь на Claude для точных данных');
    const orModel = opts.orModel || state.settings.orModel;
    const r = await fetch(PROXY_OPENROUTER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getProxyToken() },
      body: JSON.stringify({
        model: orModel, max_tokens: opts.max_tokens || 4000, temperature,
        messages: [{ role: 'system', content: system }, ...messages],
      }),
    });
    if (!r.ok) {
      if (r.status === 401) localStorage.removeItem('avito_admin_token');
      throw new Error(`OpenRouter ${r.status}: ${await r.text()}`);
    }
    const d = await r.json();
    return d.choices?.[0]?.message?.content || '';
  }

  throw new Error('Неизвестный провайдер: ' + provider);
}

// Достаёт JSON из ответа модели, даже если он обёрнут пояснительным текстом.
// Веб-поиск бонусов предзаказа часто добавляет прозу до/после JSON — F3.
function extractJSON(text) {
  const raw = (text || '').trim();
  const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) return fence[1].trim();
  const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
  return (first !== -1 && last > first) ? raw.slice(first, last + 1) : raw;
}

function parseVariants(text) {
  const data = JSON.parse(extractJSON(text));
  if (!Array.isArray(data?.variants)) throw new Error('Нет поля variants в ответе');
  return data.variants.map((v, i) => ({ ...v, id: i + 1 }));
}

// Данные о товаре без стиля/количества/few-shot — общий блок,
// переиспользуется и полной генерацией, и шагом «сначала заголовки».
function catInfoBlock(f) {
  const c = catDef(f.category);
  const lines = [`Категория: ${c.pName || c.label}`];
  for (const fd of c.fields) {
    if (!FIELD_TYPES.includes(fd.type)) continue; // поля нет в форме — не должно быть и в промпте
    if (fd.pRender) { const s = fd.pRender(f); if (s) lines.push(s); continue; }
    if (!fd.p) continue; // поле не для промпта (цена игры, тумблеры)
    const v = fieldVal(f, fd);
    const txt = fd.type === 'chips' ? v.join(', ') : String(v);
    lines.push(`${fd.p}: ${txt || fd.pEmpty || txt}${fd.pSuffix || ''}`);
  }
  return lines.join('\n') + (c.extra ? c.extra(f) : '');
}

function styleLabel(f) {
  return f.style === 'custom'
    ? (f.customStyle.trim() || 'на своё усмотрение')
    : (STYLES.find(s => s.id === f.style)?.label || f.style);
}

// Few-shot: 1-2 примера собственных сохранённых удачных объявлений той же
// категории — модель ориентируется на характер продавца, а не только на правила.
function fewShotBlock(category) {
  const pool = state.favorites.filter(v => v._category === category && v.title && v.description);
  if (!pool.length) return '';
  const picks = [...pool].sort(() => Math.random() - .5).slice(0, 2);
  const lines = picks.map((v, i) => {
    const d = v.description.length > 220 ? v.description.slice(0, 220).trim() + '…' : v.description;
    return `${i + 1}. «${v.title}» — ${d.replace(/\n+/g, ' ')}`;
  }).join('\n');
  return `\n\nПримеры твоих же удачных объявлений этой категории (ориентируйся на характер и энергию, НЕ копируй дословно):\n${lines}`;
}

function buildMsg(overrideCount, excludeTitles = [], formOverride = null) {
  const f = formOverride || state.form;
  const count = overrideCount ?? f.count;
  const excl = excludeTitles.length ? `\nИсключить названия (уже есть): ${excludeTitles.join('; ')}` : '';
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}
Стиль: ${styleLabel(f)}
Вариантов: ${count}${excl}${notes}${fewShotBlock(f.category)}`;
}

// Проверяет заполненность обязательных полей формы. Возвращает список того, чего не хватает.
function validateForm(f = state.form) {
  const miss = [];
  for (const fd of catDef(f.category).fields) {
    // Поле неизвестного типа форма не рисует — требовать его нельзя, иначе
    // «Заполните: …» указывает на то, чего на экране нет (находка код-ревью этапа 1)
    if (!FIELD_TYPES.includes(fd.type)) continue;
    if (fd.reqCheck) { const s = fd.reqCheck(f); if (s) miss.push(s); continue; }
    if (!fd.req) continue;
    const v = fieldVal(f, fd);
    const empty = fd.type === 'chips' ? !v.length : !String(v).trim();
    if (empty) miss.push(fd.req);
  }
  return miss;
}

// UX-15: «Ещё варианты» живут отдельно от основного набора — эти хелперы
// ищут/мутируют вариант в обоих списках сразу, чтобы карточка вела себя одинаково в обоих местах
function resultsPool() { return [...state.results, ...state.extraResults]; }
function findResult(id) { return state.results.find(r => r.id === id) || state.extraResults.find(r => r.id === id); }
function findResultRef(id) {
  let idx = state.results.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.results, idx };
  idx = state.extraResults.findIndex(r => r.id === id);
  if (idx !== -1) return { arr: state.extraResults, idx };
  return { arr: null, idx: -1 };
}

async function doGenerate() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  if (state.batchMode && !state.batchRegions.length) { toast('Пакетный режим включён — выберите хотя бы один регион'); return; }
  if (state.batchMode && state.batchRegions.length) { doBatchGenerate(); return; }
  state.loading = true; state.error = null; state.loadingKind = null;
  state.batchResults = []; state.titleStep = null; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: одна генерация и вся её судьба — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg() }], { webSearch, category: state.form.category });
    state.results = parseVariants(text);
    // F4: снимок формы + штамп товара/категории на каждый вариант — чтобы действия
    // карточки (Размещено/Сканер/Экспорт/↻×5) не читали форму, переключённую позже
    state.resultsForm = JSON.parse(JSON.stringify(state.form));
    state.results.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    save();
    jlog('generated', jChain, {
      path: 'main', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      style: state.form.style, notes: state.form.notes || '', webSearch,
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_main', message: String(e.message || '').slice(0, 300), latencyMs: Date.now() - jT0 });
  } finally {
    state.loading = false;
    refreshResults();
  }
}

// UX-15: «➕ Ещё варианты» — дописывает в отдельный список, НЕ трогая основной набор
// (в отличие от doGenerate/doRegen, которые заменяют state.results целиком)
async function doGenerateMore() {
  if (state.loading || state.extraLoading || !state.results.length) return;
  state.extraLoading = true;
  refreshResults();
  const jChain = state.results[0]?._chain || ('gen-' + Date.now()); // журнал: «ещё» — та же цепочка, что основной набор
  const jT0 = Date.now();
  try {
    const snapForm = state.resultsForm || state.form; // F4: та же форма, что породила основной набор
    const excl = resultsPool().map(v => v.title);
    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    const text = await callAI([{ role: 'user', content: buildMsg(snapForm.count, excl, snapForm) }], { webSearch, category: snapForm.category });
    const fresh = parseVariants(text);
    if (!fresh.length) throw new Error('AI не вернул варианты');
    const product  = state.results[0]?._product  || currentProductName(snapForm);
    const category = state.results[0]?._category || snapForm.category;
    // Bug #11: parseVariants нумерует ответ заново с 1, поэтому «Ещё варианты»
    // получали те же id, что и основной набор, а findResult()/findResultRef()
    // ищут сначала в state.results — все действия карточки (↻, ☆, 🔎, 🔍, ✓ Размещено)
    // молча применялись к ОДНОИМЁННОЙ карточке основного набора. Нумеруем дальше пула.
    let nextId = resultsPool().reduce((m, v) => Math.max(m, v.id || 0), 0);
    fresh.forEach(v => {
      v.id = ++nextId;
      v._product = product; v._category = category;
      v._scan = checkAds(v.title || '', v.description || '', category);
      v._chain = jChain;
    });
    state.extraResults.push(...fresh);
    save();
    jlog('generated', jChain, {
      path: 'more', category, product, excluded: excl.length,
      latencyMs: Date.now() - jT0, variants: jVariants(fresh),
    });
  } catch(e) {
    toast('Ошибка: ' + e.message);
    jlog('error', jChain, { stage: 'generate_more', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.extraLoading = false;
    refreshResults();
  }
}

async function doBatchGenerate() {
  const regions = state.batchRegions;
  state.loading = true; state.error = null; state.loadingKind = null; state.batchResults = []; state.titleStep = null; state.extraResults = [];
  // Пакет и обычные варианты взаимоисключающие — чистим обычный набор,
  // чтобы он не всплыл после «✕ Очистить» или перезагрузки (UX-3)
  state.results = []; state.conveyorIdx = 0;
  // F2: один запрос на весь пакет при фиксированном max_tokens обрезал JSON на 7+ регионах
  // (список регионов не ограничен, до 25 по умолчанию) — бьём на чанки, каждый со своим бюджетом
  const CHUNK = 4;
  const chunks = [];
  for (let i = 0; i < regions.length; i += CHUNK) chunks.push(regions.slice(i, i + CHUNK));
  state.batchChunkProgress = chunks.length > 1 ? { done: 0, total: chunks.length } : null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'batch-' + Date.now(); // журнал: пакет по регионам — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const variants = [];
    let chunkFails = 0;
    for (const chunk of chunks) {
      try {
        const msg = buildMsg(chunk.length, variants.map(v => v.title));
        const text = await callAI([{ role: 'user', content: msg }],
          { webSearch, category: state.form.category, max_tokens: Math.min(8000, 800 + chunk.length * 1200) });
        variants.push(...parseVariants(text));
      } catch(e) {
        console.error('Пакет: чанк не удался', e);
        chunkFails++;
      }
      if (state.batchChunkProgress) { state.batchChunkProgress.done++; refreshResults(); }
    }
    if (!variants.length) throw new Error('Не удалось сгенерировать ни одного варианта — все запросы завершились ошибкой');
    // F4: штамп товара/категории по форме на момент генерации (регион у пакета свой на каждой позиции)
    variants.forEach(v => {
      v._product = currentProductName(state.form); v._category = state.form.category;
      v._scan = checkAds(v.title || '', v.description || '', state.form.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    if (variants.length < regions.length) {
      toast(`⚠️ AI вернул ${variants.length} из ${regions.length} вариантов — ${regions.length - variants.length} регионов без текста${chunkFails ? ` (${chunkFails} запрос(ов) не удалось)` : ''}. Повторите генерацию.`);
    }
    state.batchResults = regions.map((region, i) => ({
      region,
      variant: variants[i] || null,
    }));
    state.batchExpanded = null;
    save();
    jlog('generated', jChain, {
      path: 'batch', category: state.form.category, product: currentProductName(state.form),
      provider: state.settings.provider, model: state.settings.provider === 'claude' ? state.settings.model : state.settings.orModel,
      regions, chunkFails, latencyMs: Date.now() - jT0,
      variants: state.batchResults.map(it => ({ region: it.region, ...(it.variant ? { title: it.variant.title || '', description: it.variant.description || '', scan: jScanLevel(it.variant) } : { empty: true }) })),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_batch', message: String(e.message || '').slice(0, 300), regions: regions.length });
  } finally {
    state.loading = false;
    state.batchChunkProgress = null;
    if (state.batchResults.length) { refreshBatchResults(); }
    else { refreshResults(); }
  }
}

function buildTitlesMsg(n) {
  const f = state.form;
  const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
  return `${catInfoBlock(f)}${notes}

ЗАДАЧА: сгенерируй ${n} вариантов НАЗВАНИЙ (только названия, БЕЗ описаний) для одного и того же объявления. Каждое — из РАЗНОЙ точки пространства вариаций (разный крючок, разное написание/сокращение, разный порядок слов). Строго следуй формуле и правилам названий из системного промпта (лимит 50 символов, запрещённые слова, для игр — без цены).${fewShotBlock(f.category)}

Верни строго JSON без markdown-обёртки:
{"titles":[{"title":"...","hook":"крючок одним-двумя словами"}]}`;
}

async function doGenTitlesOnly() {
  if (state.loading) return;
  const miss = validateForm();
  if (miss.length) { toast('Заполните: ' + miss.join(', ')); return; }
  state.loading = true; state.error = null; state.loadingKind = 'titles';
  state.titleStep = null;
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = 'gen-' + Date.now(); // журнал: воронка (заголовки + описания) — одна цепочка
  const jT0 = Date.now();
  try {
    const webSearch = state.form.isPreorder && state.form.category === 'game';
    const n = Math.max(8, Math.min(12, (state.form.count || 5) * 2));
    const text = await callAI([{ role: 'user', content: buildTitlesMsg(n) }], { webSearch, category: state.form.category, max_tokens: webSearch ? 2200 : 1400 });
    const data = JSON.parse(extractJSON(text));
    const titles = (data.titles || [])
      .map((t, i) => ({ id: i + 1, title: t.title || '', hook: t.hook || '', len: [...(t.title || '')].length }))
      .filter(t => t.title);
    if (!titles.length) throw new Error('AI не вернул названия');
    state.titleStep = { titles, selected: {}, form: JSON.parse(JSON.stringify(state.form)), _chain: jChain };
    jlog('generated', jChain, {
      path: 'titles', category: state.form.category, product: currentProductName(state.form),
      latencyMs: Date.now() - jT0, titles: titles.map(t => t.title),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_titles', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

async function doGenDescriptionsForTitles() {
  const step = state.titleStep;
  if (!step) return;
  const chosen = step.titles.filter(t => step.selected[t.id]);
  if (!chosen.length) { toast('Выберите хотя бы одно название'); return; }
  state.loading = true; state.error = null; state.loadingKind = 'descriptions'; state.extraResults = [];
  refreshResults();
  scrollToResults(); // UX-11
  const jChain = step._chain || ('gen-' + Date.now()); // журнал: продолжение цепочки шага заголовков
  const jT0 = Date.now();
  try {
    const f = step.form;
    const webSearch = f.isPreorder && f.category === 'game';
    const notes = f.notes ? `\nДополнительно: ${f.notes}` : '';
    const list = chosen.map((t, i) => `${i + 1}. "${t.title}" (крючок: ${t.hook || '—'})`).join('\n');
    const msg = `${catInfoBlock(f)}${notes}
Стиль: ${styleLabel(f)}

Названия УЖЕ ВЫБРАНЫ продавцом — менять текст названия НЕЛЬЗЯ, перенеси его в поле title символ-в-символ:
${list}

Для каждого напиши полное описание — разное по структуре и подаче цены между вариантами (см. правила описаний в системном промпте).${fewShotBlock(f.category)}
Верни строго JSON без markdown-обёртки:
{"variants":[{"id":1,"title":"(как в списке, без изменений)","title_length":число,"description":"...","style":"...","price_format":"...","hook":"...","structure":"..."}]}`;
    const text = await callAI([{ role: 'user', content: msg }], { webSearch, category: f.category, max_tokens: Math.min(8000, 800 + chosen.length * 1200) });
    const variants = parseVariants(text);
    if (!variants.length) throw new Error('AI не вернул описания');
    // Название продавцом уже выбрано — принудительно прописываем его поверх ответа AI
    // (промпт просит не менять, но гарантию даёт только клиент). Порядок AI держит,
    // маппим по индексу; если AI вернул меньше описаний, чем выбрано, — берём сколько есть.
    const n = Math.min(variants.length, chosen.length);
    const results = variants.slice(0, n).map((v, i) => ({
      ...v,
      title: chosen[i].title,
      title_length: chosen[i].len,
    }));
    if (n < chosen.length) {
      toast(`⚠️ AI описал ${n} из ${chosen.length} названий. Остальные повторите отдельно.`);
    }
    state.results = results;
    state.resultsForm = JSON.parse(JSON.stringify(f));
    state.results.forEach(v => {
      v._product = currentProductName(f); v._category = f.category;
      v._scan = checkAds(v.title || '', v.description || '', f.category); // автопроверка сразу после генерации
      v._chain = jChain;
    });
    state.conveyorIdx = 0;
    state.titleStep = null;
    save();
    jlog('generated', jChain, {
      path: 'descriptions', category: f.category, product: currentProductName(f),
      offered: step.titles.length, chosen: chosen.map(t => t.title), // выбор Дениса из предложенных заголовков
      latencyMs: Date.now() - jT0, variants: jVariants(state.results),
    });
  } catch(e) {
    state.error = e.message;
    console.error(e);
    jlog('error', jChain, { stage: 'generate_descriptions', message: String(e.message || '').slice(0, 300) });
  } finally {
    state.loading = false; state.loadingKind = null;
    refreshResults();
  }
}

async function doGenAltTitles(id) {
  if (state.altTitlesLoading !== null) return;
  state.altTitlesLoading = id;
  delete state.altTitles[id];
  refreshResults();
  try {
    const v = findResult(id);
    const base = buildMsg(1, [], state.resultsForm);  // F4: промпт из формы на момент генерации, не из живой
    const msg = `${base}
Текущее название: ${v?.title || ''}

ЗАДАЧА: сгенерируй 5 альтернативных названий для этого же объявления. Каждое — в ДРУГОЙ стилистической точке: разный крючок, разные слова, для игры — обязательно разная форма написания названия (рус/англ/аббревиатура, транслит). Строго до 50 символов. ЗАПРЕЩЕНО: для категории «Игра» — любая цена/сумма/₽ в названии; для любой категории — слова «рублей»/«руб», даты/годы/«старт»/«релиз». Верни только JSON:
{"titles":[{"title":"...","hook":"крючок одним словом"},{"title":"...","hook":"..."},{"title":"...","hook":"..."},{"title":"...","hook":"..."},{"title":"...","hook":"..."}]}`;
    const snapForm = state.resultsForm || state.form; // F12: webSearch из того же снимка, что и промпт (buildMsg выше)
    const webSearch = snapForm.isPreorder && snapForm.category === 'game';
    // F5: при webSearch сама генерация вспомогательных tool-use блоков ест бюджет
    // до финального текста — 600 обрезало 5 заголовков; 2000 — тот же запас, что в doRephrase
    const text = await callAI([{ role: 'user', content: msg }], { webSearch, category: snapForm.category, max_tokens: webSearch ? 2000 : 600 });
    const data = JSON.parse(extractJSON(text));
    state.altTitles[id] = (data.titles || []).map(t => ({ ...t, len: [...(t.title||'')].length }));

      path: 'alt_titles', baseTitle: v?.title || '', titles: state.altTitles[id].map(t => t.title),
    });
